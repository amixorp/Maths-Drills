<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1sf Multiplication — Practice</title>
<link rel="stylesheet" href="core/drill.css">
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     NUMBER FORMATTING (plain strings — no LaTeX, no KaTeX)
     ============================================================ */

  /* A 1-sf number is d × 10^e with d in 1..9.
     e >= 0 → d followed by e zeros.
     e < 0 → "0." then (-e - 1) zeros then d. */
  function format1sf(d, e) {
    if (e >= 0) return String(d) + '0'.repeat(e);
    return '0.' + '0'.repeat(-e - 1) + d;
  }

  /* A product is p × 10^e where p = d1 × d2 (an integer 1..81).
     Formats preserving all significant digits of p. */
  function formatProduct(p, e) {
    if (e >= 0) return String(p) + '0'.repeat(e);
    const s = String(p);
    const places = -e;
    if (places >= s.length) {
      return '0.' + '0'.repeat(places - s.length) + s;
    }
    return s.slice(0, s.length - places) + '.' + s.slice(s.length - places);
  }

    /* Insert thin-space grouping into a numeric string.
     "54600"    -> "54<gap>600"
     "1234567"  -> "1<gap>234<gap>567"
     "0.000083" -> "0.000<gap>083"
     Groups the integer part from the right in threes, and the
     fractional part from the left in threes.  Groups of exactly
     three digits are left ungrouped, as is conventional. */
  function groupDigits(s) {
    const GAP = '<span class="gap">\u00A0</span>';
    const parts = s.split('.');
    let intPart = parts[0];
    const fracPart = parts.length > 1 ? parts[1] : '';

    /* Integer part: group from the right in threes. */
    if (intPart.length > 3) {
      let out = '';
      for (let i = 0; i < intPart.length; i++) {
        const posFromRight = intPart.length - i;
        if (i > 0 && posFromRight % 3 === 0) out += GAP;
        out += intPart[i];
      }
      intPart = out;
    }

    /* Fractional part: group from the left in threes. */
    let fracOut = '';
    if (fracPart.length > 3) {
      for (let i = 0; i < fracPart.length; i++) {
        if (i > 0 && i % 3 === 0) fracOut += GAP;
        fracOut += fracPart[i];
      }
    } else {
      fracOut = fracPart;
    }

    return fracOut ? intPart + '.' + fracOut : intPart;
  }

  /* The Unicode multiplication sign, surrounded by spaced thin gaps. */
  const TIMES = '\u00D7';   /* × */

  /* ============================================================
     DIFFICULTY MODEL
     ============================================================ */

  /* All exponent values a 1-sf number can carry.
       4  →  tens of thousands  (10000 .. 90000)
       3  →  thousands          (1000 .. 9000)
       2  →  hundreds           (100 .. 900)
       1  →  tens               (10 .. 90)
       0  →  units              (1 .. 9)
      -1  →  tenths             (0.1 .. 0.9)
      -2  →  hundredths         (0.01 .. 0.09)
      -3  →  thousandths        (0.001 .. 0.009)                       */
  const EXPS = [-3, -2, -1, 0, 1, 2, 3, 4];

  function difficultyOf(e1, e2) {
    const absSum = Math.abs(e1) + Math.abs(e2);
    const decPenalty = (e1 < 0 || e2 < 0) ? 2 : 0;
    return absSum + decPenalty;
  }

  /* ============================================================
     EXPONENT SELECTION  (position-weighted)
     ============================================================ */
  function chooseExponents(pos, allowDecimals, isLast) {
    let exps = EXPS.slice();
    if (!allowDecimals) exps = exps.filter(e => e >= 0);

    /* --- special case: 5% extreme on the final question -------- */
    if (isLast && rng() < 0.05) {
      const extremePool = allowDecimals ? [-3, 4] : [4];
      const validExtremes = extremePool.filter(e => exps.includes(e));
      if (validExtremes.length > 0) {
        const extremeE = pick(validExtremes);
        const otherE = pick(exps);
        return rng() < 0.5
          ? { e1: extremeE, e2: otherE }
          : { e1: otherE, e2: extremeE };
      }
    }

    /* --- normal case: weight by closeness to target difficulty -- */
    const pairs = [];
    for (const e1 of exps) for (const e2 of exps) pairs.push({ e1, e2 });

    const target = pos * 6;   /* pos 0 → 0, pos 1 → 6 */
    const sigma  = 1.8;

    const weights = pairs.map(p => {
      const d = difficultyOf(p.e1, p.e2);
      const z = (d - target) / sigma;
      return Math.exp(-0.5 * z * z);
    });

    const total = weights.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < pairs.length; i++) {
      r -= weights[i];
      if (r <= 0) return pairs[i];
    }
    return pairs[pairs.length - 1];
  }

  /* ============================================================
     DIGIT SELECTION
     ============================================================ */
  function randomDigit() {
    /* Digits 2-9 uniform; digit 1 appears 5% of the time. */
    if (rng() < 0.05) return 1;
    return 2 + Math.floor(rng() * 8);
  }

  /* ============================================================
     QUESTION GENERATOR
     ============================================================ */
  function generateQuestion(pos, allowDecimals, isLast) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const { e1, e2 } = chooseExponents(pos, allowDecimals, isLast);
      const d1 = randomDigit();
      const d2 = randomDigit();

      const p = d1 * d2;          /* 1..81 */
      const e = e1 + e2;          /* -6..8 */
      const correctStr = formatProduct(p, e);

      /* ---- distractor pool ------------------------------------ */
      const pool = [];
      const seen = new Set([correctStr]);
      const add = (s) => {
        if (seen.has(s)) return;
        seen.add(s);
        pool.push(s);
      };

      /* Off by one place value */
      add(formatProduct(p, e + 1));
      add(formatProduct(p, e - 1));

      /* Times-table near-misses */
      if (d1 > 2) add(formatProduct((d1 - 1) * d2, e));
      if (d1 < 9) add(formatProduct((d1 + 1) * d2, e));
      if (d2 > 2) add(formatProduct(d1 * (d2 - 1), e));
      if (d2 < 9) add(formatProduct(d1 * (d2 + 1), e));

      /* Second-order fallbacks if we're still short */
      if (pool.length < 3) {
        add(formatProduct(p + 1, e));
        add(formatProduct(p + 2, e));
        if (p > 2) add(formatProduct(p - 1, e));
        if (p > 3) add(formatProduct(p - 2, e));
        add(formatProduct(p, e + 2));
        add(formatProduct(p, e - 2));
      }

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);

      const opts = shuffle([
        { text: groupDigits(correctStr), ok: true },
        ...distractors.map(t => ({ text: groupDigits(t), ok: false }))
      ]);

      /* ---- assemble the question ------------------------------ */
      const num1 = format1sf(d1, e1);
      const num2 = format1sf(d2, e2);

      /* Canonical signature — treats a×b and b×a as the same. */
      const sig = 'M|' + [d1 + '^' + e1, d2 + '^' + e2].sort().join('|');

      return {
        sig,
        lhs: groupDigits(num1) + ' ' + TIMES + ' ' + groupDigits(num2),
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS — with position-based difficulty gradient
     ============================================================ */
  function buildQuestions(n, allowDecimals) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const isLast = (out.length === n - 1);
      let q = null;
      try {
        q = generateQuestion(pos, allowDecimals, isLast);
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow repeats rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = generateQuestion(pos, allowDecimals, false);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'multiplication-1sf',
    title: 'Multiplication (1 s.f.)',
    toolbarTitle: '✖️ 1sf Multiplication',
    instructions: 'Multiply the two numbers. Both are given to <b>one significant figure</b>. ' +
                  'Watch the place value carefully.',
    settings: [
      { key: 'decimals', label: 'Include decimals', type: 'checkbox', default: true }
    ],
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n, s.decimals);
    },
    renderPrompt: () => 'Multiply.'
  });
})();
</script>
</body>
</html>
