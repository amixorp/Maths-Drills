<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>A2 Implicit Differentiation Worksheet Generator</title>

<style>
  :root{ --ink:#0f172a; --muted:#64748b; --accent:#2563eb; --accent-dark:#1d4ed8; --page-bg:#eef2f7; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--page-bg); color:var(--ink); font-size:16px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .toolbar{position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap;
    align-items:center; gap:12px; padding:12px 20px;
    background:#0f172a; color:#f8fafc; box-shadow:0 2px 10px rgba(15,23,42,.25);
    font-size:14px;}
  .tb-title{font-weight:800; font-size:15px; letter-spacing:.3px; white-space:nowrap}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e2e8f0; white-space:nowrap}
  .toolbar input[type=number],.toolbar input[type=text]{padding:7px 9px; border-radius:8px;
    border:1px solid #334155; background:#1e293b; color:#f8fafc; font:inherit;}
  .toolbar input[type=number]{width:118px}
  .toolbar input[type=text]{width:240px}
  .toolbar button{padding:8px 15px; border-radius:9px; border:1px solid #334155;
    background:#1e293b; color:#f8fafc; font:inherit; font-weight:700; cursor:pointer; white-space:nowrap;}
  .toolbar button:hover{background:#334155}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}

  .toolbar button.reveal-on:hover{background:#166534}
  .viewport{padding:28px 0 6px;}
  .pages{display:flex; flex-direction:column; align-items:center; gap:24px;}
  .page-wrap{position:relative; overflow:hidden;}
  .page{position:absolute; top:0; left:0; width:210mm; height:297mm;
    background:#fff; box-shadow:0 6px 26px rgba(15,23,42,.16);
    transform-origin:top left; font-family:Helvetica,Arial,sans-serif; color:#000;}
  .page .tx{position:absolute; white-space:pre; line-height:1; font-family:Helvetica,Arial,sans-serif;}
  .page .ans{visibility:hidden; color:#2563eb;}
  .pages.revealed .ans{visibility:visible;}
  .hint{text-align:center; color:var(--muted); font-size:13px; line-height:1.5; padding:4px 16px 34px;}
  .hint kbd{background:#e2e8f0; border-radius:5px; padding:1px 6px; font-family:inherit; font-size:12px;}
  .topics-panel{position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw;
    background:#fff; color:var(--ink); box-shadow:-4px 0 24px rgba(15,23,42,.25);
    transform:translateX(100%); transition:transform .22s ease; z-index:100;
    display:flex; flex-direction:column; font-size:14px;}
  .topics-panel.open{transform:translateX(0);}
  .tp-head{padding:14px 18px; border-bottom:1px solid #e2e8f0; display:flex;
    align-items:center; justify-content:space-between; gap:12px;}
  .tp-head h2{margin:0; font-size:15px;}
  .tp-head .count{color:var(--muted); font-size:13px; margin-top:2px;}
  .tp-head button{background:none; border:none; font-size:22px; line-height:1;
    cursor:pointer; color:var(--muted); padding:0 4px;}
  .tp-body{overflow-y:auto; padding:4px 0 24px; flex:1;}
  .tp-strand{padding:12px 18px 4px; font-weight:700; font-size:12px;
    letter-spacing:.6px; text-transform:uppercase; color:var(--muted);}
  .tp-item{display:flex; align-items:center; gap:10px; padding:7px 18px;
    cursor:pointer; user-select:none;}
  .tp-item:hover{background:#f1f5f9;}
  .tp-item input{flex:none; margin:0; width:16px; height:16px; cursor:pointer;}
  .tp-item .name{flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;}
  .tp-foot{padding:12px 18px; border-top:1px solid #e2e8f0; display:flex;
    gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .tp-foot button{padding:7px 12px; border-radius:8px; border:1px solid #cbd5e1;
    background:#f8fafc; color:var(--ink); font:inherit; font-weight:600; cursor:pointer;}
  .tp-foot button:hover{background:#e2e8f0;}
  .backdrop{position:fixed; inset:0; background:rgba(15,23,42,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:99;}

  @media print{
    body{background:#fff}

    .pages{display:block;}
    .page-wrap{width:auto !important; height:auto !important; overflow:visible !important;
      page-break-after:always; break-after:page;}
    .page-wrap:last-child{page-break-after:auto; break-after:auto;}
    .page{position:relative !important; transform:none !important;
      width:210mm !important; height:296.9mm !important; box-shadow:none !important;}
    .pages .ans { visibility: hidden !important; }
  }
</style>

<p class="hint no-print">
  Generates a <b>two-page</b> worksheet drawn from the implicit differentiation topic bank.
  Answers appear on the right when you click <b>Reveal answers</b>.
  Add <kbd>?seed=12345</kbd> to the URL to reproduce a sheet.
</p>

<script>
(function(){
'use strict';

/* ============================================================
   RNG + helpers
   ============================================================ */
let rng = Math.random;
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
const pick = a => a[Math.floor(rng()*a.length)];
const ri   = (a,b) => a + Math.floor(rng()*(b-a+1));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1));
  const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b);
  while(b){ const t=a%b; a=b; b=t; } return a; }
const MINUS = '\u2212';
function nStr(x){ return x<0 ? MINUS + Math.abs(x) : String(x); }
function T(text){ return { type:'text', text: text }; }
function Q(key, blocks, answers, solution, opts){
  const q = { key, blocks, answers: answers||[], solution: solution||null };
  if (opts) for (const k in opts) if (opts[k]!==undefined) q[k]=opts[k];
  return q;
}

/* ============================================================
   Coordinate-geometry formatting helpers
   ============================================================ */
function ptStr(x, y){ return '(' + nStr(x) + ', ' + nStr(y) + ')'; }

function gradientFracStr(num, den){
  if (den < 0){ num = -num; den = -den; }
  if (num === 0) return '0';
  if (den === 1) return nStr(num);
  return (num < 0 ? MINUS : '') + '\\frac{' + Math.abs(num) + '}{' + den + '}';
}

function gradientStr(m){
  if (Number.isInteger(m)) return nStr(m);
  for (let q = 2; q <= 1000; q++){
    const p = m * q;
    if (Math.abs(p - Math.round(p)) < 1e-9){
      const rp = Math.round(p);
      const g = gcd(Math.abs(rp), q) || 1;
      return gradientFracStr(rp/g, q/g);
    }
  }
  return nStr(Math.round(m*100)/100);
}

function fracOrIntStr(x){
  if (Number.isInteger(x)) return nStr(x);
  for (let q = 2; q <= 1000; q++){
    const p = x * q;
    if (Math.abs(p - Math.round(p)) < 1e-9){
      const rp = Math.round(p);
      const g = gcd(Math.abs(rp), q) || 1;
      return gradientFracStr(rp/g, q/g);
    }
  }
  return nStr(Math.round(x*100)/100);
}

function lineEqStr(m, c){
  if (m === 0){
    return 'y = ' + fracOrIntStr(c);
  }
  let mStr = gradientStr(m);
  if (mStr === '1') mStr = '';
  else if (mStr === MINUS + '1') mStr = MINUS;
  
  let s = 'y = ' + mStr + 'x';
  if (c !== 0){
    const cStr = fracOrIntStr(Math.abs(c));
    s += (c > 0 ? ' + ' : ' ' + MINUS + ' ') + cStr;
  }
  return s;
}

function lineEqFracStr(num, den, c){
  if (den < 0){ num = -num; den = -den; }
  let mPart;
  if (den === 1){
    if (num === 1) mPart = 'x';
    else if (num === -1) mPart = MINUS + 'x';
    else mPart = nStr(num) + 'x';
  } else {
    if (num === 1) mPart = '\\frac{1}{' + den + '}x';
    else if (num === -1) mPart = MINUS + '\\frac{1}{' + den + '}x';
    else mPart = '\\frac{' + nStr(num) + '}{' + den + '}x';
  }
  let s = 'y = ' + mPart;
  if (c > 0) s += ' + ' + nStr(c);
  else if (c < 0) s += ' ' + MINUS + ' ' + Math.abs(c);
  return s;
}

function lineGeneralStr(a, b, c){
  let s = '';
  if (a !== 0){
    if (a === 1) s += 'x';
    else if (a === -1) s += MINUS + 'x';
    else s += nStr(a) + 'x';
  }
  if (b !== 0){
    if (s !== '') s += ' ';
    if (b === 1) s += '+ y';
    else if (b === -1) s += MINUS + ' y';
    else s += (b > 0 ? '+ ' : MINUS + ' ') + Math.abs(b) + 'y';
  }
  if (c !== 0){
    if (s !== '') s += ' ';
    s += (c > 0 ? '+ ' : MINUS + ' ') + Math.abs(c);
  }
  s += ' = 0';
  return s;
}

function lineStandardStr(a, b, c){
  let s = '';
  if (a !== 0){
    if (a === 1) s += 'x';
    else if (a === -1) s += MINUS + 'x';
    else s += nStr(a) + 'x';
  }
  if (b !== 0){
    if (s !== '') s += ' ';
    if (b === 1) s += '+ y';
    else if (b === -1) s += MINUS + ' y';
    else s += (b > 0 ? '+ ' : MINUS + ' ') + Math.abs(b) + 'y';
  }
  s += ' = ' + nStr(c);
  return s;
}

function ptFracStr(x, y){
  return '(' + fracOrIntStr(x) + ', ' + fracOrIntStr(y) + ')';
}

/* ============================================================
   Text measurement (Helvetica widths × 1000)
   ============================================================ */
const W_REG = [
  278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584
];
const W_BOLD = [
  278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  333,333,584,584,584,611,975,
  722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  333,278,333,584,556,333,
  556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
  389,280,389,584
];
function textWidth(str, size, bold){
  const t = bold ? W_BOLD : W_REG;
  let w=0;
  for (let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if (c===96) continue;
    if (c===0xE000){ w += t[0]*0.55; continue; }
    w += (c>=32 && c<=126) ? t[c-32] : 556;
  }
  return w * size / 1000;
}

/* ============================================================
   Run parsing + emission
   ============================================================ */
function parseRuns(text){
  const runs=[]; let i=0;
  while(i<text.length){
    const tick = text.indexOf('`', i);
    const frac = text.indexOf('\\frac{', i);
    const sqrt = text.indexOf('\\sqrt{', i);
    const dollar = text.indexOf('$', i);

    let next = -1, kind = null;
    if (dollar !== -1 && (next===-1 || dollar<next)) { next=dollar; kind='math'; }
    if (tick !== -1 && (next===-1 || tick<next)) { next=tick; kind='tick'; }
    if (frac !== -1 && (next===-1 || frac<next)) { next=frac; kind='frac'; }
    if (sqrt !== -1 && (next===-1 || sqrt<next)) { next=sqrt; kind='sqrt'; }

    if (next === -1){ if (i<text.length) runs.push({kind:'text',text:text.slice(i),italic:false}); break; }
    if (next > i) runs.push({kind:'text', text:text.slice(i,next), italic:false});

    if (kind==='math'){
      const close = text.indexOf('$', next+1);
      if (close !== -1) {
        let inner = text.slice(next+1, close);
        inner = inner.replace(/\u2212/g, '-');
        runs.push({kind:'math', text: '$'+inner+'$', inner: inner});
        i = close+1;
      } else {
        runs.push({kind:'text', text: text.slice(next), italic:false});
        break;
      }
    } else if (kind==='tick'){
      const close = text.indexOf('`', next+1);
      if (close===-1){ runs.push({kind:'text',text:text.slice(next),italic:false}); break; }
      runs.push({kind:'text', text:text.slice(next+1,close), italic:true});
      i = close+1;
    } else if (kind==='sqrt'){
      const open = text.indexOf('{', next);
      let close = open + 1, depth = 1;
      while (close < text.length && depth > 0) {
          if (text[close] === '{') depth++;
          else if (text[close] === '}') depth--;
          close++;
      }
      runs.push({kind:'sqrt', inner: text.slice(open+1, close-1)});
      i = close;
    } else {
      const o1=text.indexOf('{',next); const c1=o1===-1?-1:text.indexOf('}',o1);
      const o2=c1===-1?-1:text.indexOf('{',c1); const c2=o2===-1?-1:text.indexOf('}',o2);
      if (o1===-1||c1===-1||o2===-1||c2===-1){
        runs.push({kind:'text',text:text.slice(next),italic:false}); break;
      }
      runs.push({kind:'frac', num:text.slice(o1+1,c1), den:text.slice(o2+1,c2)});
      i = c2+1;
    }
  }
  const merged=[];
  for (const r of runs){
    const last = merged[merged.length-1];
    if (r.kind==='text' && last && last.kind==='text' && last.italic===r.italic){
      last.text += r.text;
    } else merged.push(r);
  }
  return merged.filter(r => r.kind!=='text' || r.text.length>0);
}

function textToTokens(text){
  const runs = parseRuns(text);
  const tokens=[]; let pendingSpace=false;
  for (const r of runs){
    if (r.kind==='math'){ tokens.push({kind:'math', text:r.text, inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='frac'){ tokens.push({kind:'frac', num:r.num, den:r.den, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='sqrt'){ tokens.push({kind:'sqrt', inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    const parts = r.text.split(/(\s+)/);
    for (const p of parts){
      if (p==='') continue;
      if (/^\s+$/.test(p)){ pendingSpace=true; continue; }
      tokens.push({kind:'word', word:p, italic:r.italic, space:pendingSpace});
      pendingSpace=false;
    }
  }
  return tokens;
}

function approxMathWidth(inner, size, bold){
  let approx = inner
    .replace(/\\[a-zA-Z]+/g, 'xxxx')
    .replace(/[\{\}]/g, '')
    .replace(/\s+/g, '');
  let baseW = textWidth(approx, size, bold);
  let supCount = (inner.match(/\^|_/g) || []).length;
  let opCount = (inner.match(/[+\-=<>]/g) || []).length;
  return Math.max(25, baseW * 1.3 + supCount * size * 0.3 + opCount * size * 0.3 + 20);
}

function tokenWidth(tok, size, bold){
  if (tok.kind==='math') return approxMathWidth(tok.inner, size, bold);
  if (tok.kind==='frac'){
    const sub=size*0.7;
    const nw=textWidth(tok.num,sub,bold);
    const dw=textWidth(tok.den,sub,bold);
    return Math.max(nw,dw)+0.20*size;
  }
  if (tok.kind==='sqrt') return textWidth(tok.inner, size, bold) + 0.4*size;
  return textWidth(tok.word,size,bold);
}

function wrapTokens(tokens, size, bold, maxW){
  const lines=[]; let cur=[]; let curW=0;
  for (const tok of tokens){
    const spaceW = (tok.space && cur.length) ? textWidth(' ',size,bold) : 0;
    const w = spaceW + tokenWidth(tok,size,bold);
    if (cur.length && curW + w > maxW){
      lines.push(cur);
      cur = [{ kind:tok.kind, num:tok.num, den:tok.den, inner:tok.inner,
               text:tok.text, word:tok.word, italic:tok.italic, space:false }];
      curW = tokenWidth(tok,size,bold);
    } else { cur.push(tok); curW += w; }
  }
  if (cur.length) lines.push(cur);
  return lines;
}

function lineToRuns(lineTokens){
  const runs=[];
  for (let i=0;i<lineTokens.length;i++){
    const tok = lineTokens[i];
    const prefix = (i===0) ? '' : (tok.space ? ' ' : '');
    if (tok.kind==='math') runs.push({kind:'math', text:tok.text, inner:tok.inner, prefix});
    else if (tok.kind==='frac') runs.push({kind:'frac', num:tok.num, den:tok.den, prefix});
    else if (tok.kind==='sqrt') runs.push({kind:'sqrt', inner:tok.inner, prefix});
    else {
      const last = runs[runs.length-1];
      if (last && last.kind==='text' && last.italic===tok.italic) last.text += prefix + tok.word;
      else runs.push({kind:'text', text:prefix + tok.word, italic:tok.italic});
    }
  }
  return runs;
}

function emitRuns(runs, x0, y, size, items, variant){
  let textType, barType;
  if (variant==='answer'){ textType='answer'; barType='answer-line'; }
  else { textType='run'; barType='line'; }
  let rx = x0;
  for (let i = 0; i < runs.length; i++){
    const run = runs[i];
    let prefix = '';
    if (i > 0 && run.prefix) {
      prefix = ' ';
      rx += textWidth(' ', size, false);
    }
    
    if (run.kind==='math'){
      items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix + run.text });
      rx += approxMathWidth(run.inner, size, false);
    } else if (run.kind==='frac'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const sub = size*0.7;
      const nw = textWidth(run.num, sub, false);
      const dw = textWidth(run.den, sub, false);
      const innerW = Math.max(nw, dw);
      const totalW = innerW + 0.20*size;
      const barW = innerW + 0.08*size;
      items.push({ t: textType, x: rx + (totalW-nw)/2, y: y - 0.32*size,
        size: sub, bold:false, italic:false, s: run.num });
      items.push({ t: barType,
        x1: rx + (totalW-barW)/2, y1: y - 0.12*size,
        x2: rx + (totalW+barW)/2, y2: y - 0.12*size, w: 0.5 });
      items.push({ t: textType, x: rx + (totalW-dw)/2, y: y + 0.44*size,
        size: sub, bold:false, italic:false, s: run.den });
      rx += totalW;
    } else if (run.kind==='sqrt'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const innerW = textWidth(run.inner, size, false);
      const totalW = innerW + size * 0.4;
      items.push({ t: barType, x1: rx, y1: y, x2: rx + size*0.15, y2: y - size*0.5, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.15, y1: y - size*0.5, x2: rx + size*0.3, y2: y + size*0.1, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.3, y1: y + size*0.1, x2: rx + totalW, y2: y + size*0.1, w: 0.7 });
      items.push({ t: textType, x: rx + size*0.35, y: y, size: size, bold: false, italic: false, s: run.inner });
      rx += totalW;
    } else {
      items.push({ t: textType, x: rx, y, size, bold:false, italic:run.italic, s: prefix + run.text });
      rx += textWidth(run.text, size, false);
    }
  }
  return rx;
}

/* ============================================================
   LAYOUT — question layout
   ============================================================ */
const PW = 595.276, PH = 841.890, MG = 42.52, FIXED_FS = 11;
const HEADER_H = 19*0.78 + 19*0.32 + 6 + 17 + 10.5*0.78 + 26;
const CONT_HEADER_H = 9*1.4 + 8 + 14;
const QUESTION_GAP = 14;

function columnRuleX(){ return MG + (PW - 2*MG) * 0.60; }
function promptWidth(fs){ return columnRuleX() - (MG + fs*1.6) - 10; }

function drawQuestionBlocks(blocks, x, y, fs, maxW, items, baselines){
  const lineH = fs*1.42;
  let cursor = y;
  for (const block of blocks){
    if (baselines) baselines.push(cursor);
    if (block.type === 'text'){
      const lines = wrapTokens(textToTokens(block.text), fs, false, maxW);
      for (let j=0;j<lines.length;j++)
        emitRuns(lineToRuns(lines[j]), x, cursor + j*lineH, fs, items, 'normal');
      cursor += lines.length * lineH;
        } else if (block.type === 'plot'){
      cursor += drawPlotBlock(block, x, cursor, fs, maxW, items) + fs * 3.0;
    }
  }
  return cursor;
}

function drawQuestion(q, index, fs, qTop, items, revealState){
  const lineH = fs*1.42;
  const numColW = fs*1.6;
  const textX = MG + numColW;
  const ruleX = columnRuleX();
  const maxW = ruleX - textX - 10; 

  let contentY = qTop + fs*0.78;

  if (q.difficulty >= 5) {
    const badgeText = 'CHALLENGING';
    const badgeFs = fs * 0.55; 
    const badgeW = textWidth(badgeText, badgeFs, true) + 8;
    const boxH = fs * 1.1;
    const badgeX = ruleX - badgeW - 2; 
    const badgeY = qTop - 6; 

    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX+badgeW, y2:badgeY, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY+boxH, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX+badgeW, y1:badgeY, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'text', x: badgeX + 4, y: badgeY + boxH*0.72, size: badgeFs, bold: true, s: badgeText});

    contentY += fs * 1.1 + 4; 
  }

  items.push({t:'text', x:MG, y:contentY, size:fs, bold:true, s:(index+1)+'.'});
  drawQuestionBlocks(q.blocks, textX, contentY, fs, maxW, items, null);

  const qH = measureQuestion(q, fs);
  items.push({t:'line', x1:ruleX, y1:qTop+2, x2:ruleX, y2:qTop+qH-2, w:0.4, grey:true});

  /* WS badge — small red marker for questions with a worked solution */
  if (SOLUTION_TOPICS.includes(q.topicId)) {
    items.push({
      t: 'text',
      x: MG,
      y: qTop + qH - 3,
      size: 5,
      bold: true,
      s: 'WS',
      color: [200, 30, 30]
    });
  }

  if (revealState && q.answers && q.answers.length) {
      const rightX = ruleX + 8;
      const rightW = PW - MG - rightX - 4;
      const ansStr = q.answers.map(a => a.text).join('   ');
      const lines = wrapTokens(textToTokens(ansStr), fs, false, rightW);
      for (let j=0; j<lines.length; j++) {
          emitRuns(lineToRuns(lines[j]), rightX, contentY + j*lineH, fs, items, 'answer');
      }
  }
  return qTop + qH;
}
function measureQuestion(q, fs){
  const maxW = promptWidth(fs);
  const lineH = fs*1.42;
  let h = 0;
  if (q.difficulty >= 5) {
    h += fs * 1.1 + 8;
  }
  for (const b of q.blocks){
    if (b.type === 'text'){
      const lines = wrapTokens(textToTokens(b.text), fs, false, maxW);
      h += lines.length * lineH;
        } else if (b.type === 'plot'){
      h += measurePlotBlockHeight(b, fs, maxW) + fs * 3.0;
    }
  }
  return h;
}

function drawHeader(items, title){
  const innerW = PW - 2*MG;
  const ts = 19;
  const tw = textWidth(title, ts, true);
  let bl = MG + ts*0.78;
  items.push({t:'text', x: MG + Math.max(0, (innerW-tw)/2), y: bl, size: ts, bold: true, s: title});
  let top = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:top, x2:PW-MG, y2:top, w:1.1});
  top += 17;
  const ns = 10.5;
  bl = top + ns*0.78;
  items.push({t:'text', x:MG, y:bl, size:ns, bold:false, s:'Name:'});
  const nlw = textWidth('Name:', ns, false);
  items.push({t:'line', x1:MG+nlw+6, y1:bl+2.2, x2:MG+innerW*0.46, y2:bl+2.2, w:0.6});
  items.push({t:'text', x:MG+innerW*0.60, y:bl, size:ns, bold:false, s:'Date:'});
  const dlw = textWidth('Date:', ns, false);
  items.push({t:'line', x1:MG+innerW*0.60+dlw+6, y1:bl+2.2, x2:PW-MG, y2:bl+2.2, w:0.6});
}
function drawContinuationHeader(items, title){
  items.push({t:'text', x:MG, y:MG+9*0.78, size:9, bold:false, s:title+' (continued)'});
  const ruleY = MG + 9*1.4 + 8;
  items.push({t:'line', x1:MG, y1:ruleY, x2:PW-MG, y2:ruleY, w:0.4, grey:true});
}

function layoutSheet(opts){
  const title = opts.title, questions = opts.questions, revealState = opts.revealState;
  const fs = FIXED_FS;
  const pages = []; let items = []; let y = MG;
  drawHeader(items, title);
  y = MG + HEADER_H;
  let onPage = 0;
  for (let i = 0; i < questions.length; i++){
    const q = questions[i];
    const qH = measureQuestion(q, fs);
    if (onPage > 0 && y + qH > PH - MG){
      pages.push(items); items = []; y = MG + CONT_HEADER_H;
      drawContinuationHeader(items, title); onPage = 0;
    }
    if (onPage > 0){
      items.push({t:'line', x1:MG, y1:y-7, x2:PW-MG, y2:y-7, w:0.4, grey:true});
    }
    drawQuestion(q, i, fs, y, items, revealState);
    y += qH + QUESTION_GAP;
    onPage++;
  }
  if (items.length) pages.push(items);
  if (pages.length > 1){
    for (let i = 0; i < pages.length; i++){
      const s = 'Page ' + (i+1) + ' of ' + pages.length;
      const w = textWidth(s, 8, false);
      pages[i].push({t:'text', x:PW-MG-w, y:PH-MG+12, size:8, bold:false, s:s});
    }
  }
  return pages;
}

function layoutCompactAnswers(opts){
  const title = opts.title, questions = opts.questions, seed = opts.seed;
  const pages = [];
  let items = [];
  const innerW = PW - 2*MG;
  const fs = 11;
  const lineH = fs * 1.42;

  /* ---------- header ---------- */
  const ts = 17;
  const heading = title + ' — Answers';
  const tw = textWidth(heading, ts, true);
  let bl = MG + ts*0.78;
  items.push({t:'text', x:MG + Math.max(0,(innerW-tw)/2), y:bl, size:ts, bold:true, s:heading});
  const ruleY = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:ruleY, x2:PW-MG, y2:ruleY, w:1.1});
  let y = ruleY + 22;

  /* ---------- one entry per question ---------- */
  for (let i = 0; i < questions.length; i++){
    const q = questions[i];
    const showSolution =
      SOLUTION_TOPICS.includes(q.topicId) &&
      Array.isArray(q.solution) && q.solution.length > 0;

    /* measure ------------------------------------------------------ */
    const ansJoined = (q.answers||[]).map(a => a.text).join('   ');
    const ansLines  = wrapTokens(textToTokens(ansJoined), fs, false, innerW - 25);
    let entryH = ansLines.length * lineH;

    const solLineSets = [];
    if (showSolution){
      entryH += 4 + lineH;                          // gap + "Solution:" label
      for (const b of q.solution){
        if (b.type === 'text'){
          const lines = wrapTokens(textToTokens(b.text), fs, false, innerW - 25);
          solLineSets.push(lines);
          entryH += lines.length * lineH;
        }
      }
    }
    entryH += 12;                                   // gap after the entry

    /* page break --------------------------------------------------- */
    if (y + entryH > PH - MG - 18 && y > MG + 80){
      pages.push(items);
      items = [];
      items.push({t:'text', x:MG, y:MG+9*0.78, size:9, bold:false, s:heading + ' (continued)'});
      const chY = MG + 9*1.4 + 8;
      items.push({t:'line', x1:MG, y1:chY, x2:PW-MG, y2:chY, w:0.4, grey:true});
      y = chY + 18;
    }

    /* number + answer --------------------------------------------- */
    items.push({t:'text', x:MG, y:y + fs*0.78, size:fs, bold:true, s:(i+1) + '.'});
    for (let j = 0; j < ansLines.length; j++){
      emitRuns(lineToRuns(ansLines[j]), MG+20, y + fs*0.78 + j*lineH, fs, items, 'normal');
    }
    y += ansLines.length * lineH;

    /* worked solution --------------------------------------------- */
    if (showSolution){
      y += 4;
      items.push({t:'text', x:MG+20, y:y + fs*0.78, size:fs*0.9, bold:true, s:'Solution:'});
      y += lineH;
      for (const lines of solLineSets){
        for (const line of lines){
          emitRuns(lineToRuns(line), MG+20, y + fs*0.78, fs, items, 'normal');
          y += lineH;
        }
      }
    }
    y += 12;
  }

  if (items.length) pages.push(items);

  /* ---------- footers ---------- */
  if (pages.length > 0){
    for (let i = 0; i < pages.length; i++){
      const s = 'Page ' + (i+1) + ' of ' + pages.length;
      const w = textWidth(s, 8, false);
      pages[i].push({t:'text', x:PW-MG-w, y:PH-MG+12, size:8, bold:false, s:s});
    }
    const note = 'Seed: ' + seed;
    const noteSize = 8.5;
    const noteW = textWidth(note, noteSize, false);
    pages[pages.length-1].push({t:'text', x:PW-MG-noteW, y:PH-MG+22, size:noteSize, bold:false, s:note});
  }

  return pages;
}
/* ============================================================
   PDF writer
   ============================================================ */
const WINANSI = {
  0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84,
  0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88,
  0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C,
  0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93,
  0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
  0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B,
  0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F
};
function cleanLatexForPdf(text){
  if (!text.includes('$')) return text;
  return text.replace(/\$([^$]*)\$/g, function(match, inner) {
    let s = inner;
    let prev;

    /* Strip \left / \right prefixes, keeping the delimiter */
    s = s.replace(/\\left\s*\(/g, '(');
    s = s.replace(/\\right\s*\)/g, ')');
    s = s.replace(/\\left\s*\[/g, '[');
    s = s.replace(/\\right\s*\]/g, ']');
    s = s.replace(/\\left\s*\|/g, '|');
    s = s.replace(/\\right\s*\|/g, '|');
    s = s.replace(/\\left\s*\\\{/g, '{');
    s = s.replace(/\\right\s*\\\}/g, '}');
    s = s.replace(/\\left\./g, '');
    s = s.replace(/\\right\./g, '');

    /* \frac and \sqrt — repeat so nested braces resolve */
    do {
      prev = s;
      s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
    } while (s !== prev);
    do {
      prev = s;
      s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√($1)');
    } while (s !== prev);

    /* Greek letters (WinAnsi has no Greek; spell them out) */
    s = s.replace(/\\theta/g, 'theta');
    s = s.replace(/\\alpha/g, 'alpha');
    s = s.replace(/\\beta/g,  'beta');
    s = s.replace(/\\pi/g,    'pi');
    s = s.replace(/\\Delta/g, 'Delta');

    /* Symbols */
    s = s.replace(/\\pm/g, '±');
    s = s.replace(/\\cdot/g, '·');
    s = s.replace(/\\div/g, '÷');
    s = s.replace(/\\times/g, '×');
    s = s.replace(/\\le/g, '≤').replace(/\\ge/g, '≥');
    s = s.replace(/\\ne/g, '≠');
    s = s.replace(/\\Rightarrow/g, '=>');
    s = s.replace(/\\rightarrow/g, '->');
    s = s.replace(/\\circ/g, '°');
    s = s.replace(/\\infty/g, '∞');

    /* Functions — \log_2 BEFORE \log */
    s = s.replace(/\\log_2/g, 'log_2');
    s = s.replace(/\\log/g, 'log');
    s = s.replace(/\\ln/g, 'ln');
    s = s.replace(/\\cos/g, 'cos');
    s = s.replace(/\\sin/g, 'sin');
    s = s.replace(/\\tan/g, 'tan');

    /* Powers */
    s = s.replace(/\^2/g, '²');
    s = s.replace(/\^3/g, '³');

    /* \text{...} — repeat for nesting */
    do {
      prev = s;
      s = s.replace(/\\text\{([^{}]*)\}/g, '$1');
    } while (s !== prev);

    s = s.replace(/\u2212/g, '-');
    return s;
  });
}function pdfEsc(s){
  s = cleanLatexForPdf(s);
  let out='';
  for (let i=0;i<s.length;i++){
    const ch = s[i]; const code = ch.charCodeAt(0);
    if (ch==='\\') out += '\\\\';
    else if (ch==='(') out += '\\(';
    else if (ch===')') out += '\\)';
    else if (code >= 32 && code <= 126) out += ch;
    else if (code >= 0xA0 && code <= 0xFF) out += '\\' + code.toString(8).padStart(3,'0');
    else if (WINANSI[code] !== undefined) out += '\\' + WINANSI[code].toString(8).padStart(3,'0');
    else out += '?';
  }
  return out;
}
function pdfStrokeColourOp(it){
  if (it.color) {
      return (it.color[0]/255).toFixed(3) + ' ' + (it.color[1]/255).toFixed(3) + ' ' + (it.color[2]/255).toFixed(3) + ' RG';
  }
  return (it.grey ? '0.58' : '0') + ' G';
}
function contentStream(items){
  const ops=[];
  for (const it of items){
    if (it.t === 'text' || it.t === 'run'){
      let font = 'F1';
      if (it.bold && it.italic) font='F4';
      else if (it.bold) font='F2';
      else if (it.italic) font='F3';
      if (it.color) {
        const r = (it.color[0]/255).toFixed(3);
        const g = (it.color[1]/255).toFixed(3);
        const b = (it.color[2]/255).toFixed(3);
        ops.push(r + ' ' + g + ' ' + b + ' rg');
      } else {
        ops.push('0 g');
      }
      ops.push('BT /' + font + ' ' + it.size.toFixed(2) + ' Tf ' +
        it.x.toFixed(2) + ' ' + (PH-it.y).toFixed(2) + ' Td (' + pdfEsc(it.s) + ') Tj ET');
    } else if (it.t === 'line'){
      ops.push(pdfStrokeColourOp(it) + ' ' + it.w.toFixed(2) + ' w ' +
        it.x1.toFixed(2) + ' ' + (PH-it.y1).toFixed(2) + ' m ' +
        it.x2.toFixed(2) + ' ' + (PH-it.y2).toFixed(2) + ' l S');
    } else if (it.t === 'polyline') {
      if (!it.points || it.points.length < 2) continue;
      ops.push('0 G ' + it.w.toFixed(2) + ' w');
      const [x0, y0] = it.points[0];
      ops.push(x0.toFixed(2) + ' ' + (PH - y0).toFixed(2) + ' m');
      for (let i = 1; i < it.points.length; i++) {
        const [px, py] = it.points[i];
        ops.push(px.toFixed(2) + ' ' + (PH - py).toFixed(2) + ' l');
      }
      ops.push('S');
    }
  }
  return ops.join('\n');
}

function assemblePDF(pagesItems){
  const N = pagesItems.length;
  const maxObj = 6 + 2*N;
  const objects = []; const kidRefs = [];
  for (let i = 0; i < N; i++) kidRefs.push((8 + 2*i) + ' 0 R');
  objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objects[2] = '<< /Type /Pages /Kids [' + kidRefs.join(' ') + '] /Count ' + N + ' >>';
  objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objects[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
  objects[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>';
  for (let i = 0; i < N; i++){
    const stream = contentStream(pagesItems[i]);
    const streamObj = 7 + 2*i;
    const pageObj = 8 + 2*i;
    objects[streamObj] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
    objects[pageObj] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ' +
      '/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> ' +
      '/Contents ' + streamObj + ' 0 R >>';
  }
  let out = '%PDF-1.4\n';
  const offsets = [];
  for (let i = 1; i <= maxObj; i++){ offsets[i] = out.length;
    out += i + ' 0 obj\n' + objects[i] + '\nendobj\n'; }
  const xrefPos = out.length;
  out += 'xref\n0 ' + (maxObj+1) + '\n0000000000 65535 f \n';
  for (let i = 1; i <= maxObj; i++)
    out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + (maxObj+1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n';
  return out;
}
function downloadPDF(pagesItems, filename){
  const pdfStr = assemblePDF(pagesItems);
  const bytes = new Uint8Array(pdfStr.length);
  for (let i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

const tImplicitProduct = {
  id: 'implicit-product', strand: 'S18', difficulty: 3,
  gen(){
    const k = pick([2, 3]);
    const a = pick([1, 2]);
    const b = pick([4, 5, 6]);
    
    // Equation: y sin(kx) + a/x + y^2 = b
    const eqStr = 'y \\sin ' + k + 'x + \\frac{' + a + '}{x} + y^2 = ' + b;
    
    // Derivatives
    const d1 = '\\sin ' + k + 'x \\frac{dy}{dx} + ' + k + 'y \\cos ' + k + 'x';
    const d2 = '-\\frac{' + a + '}{x^2}';
    const d3 = '2y \\frac{dy}{dx}';
    
    // Numerator and Denominator for final answer
    const numStr = a + ' - ' + k + 'x^2 y \\cos ' + k + 'x';
    const denStr = 'x^2(\\sin ' + k + 'x + 2y)';
    const finalAns = '\\frac{dy}{dx} = \\frac{' + numStr + '}{' + denStr + '}';

    return Q('imp1|' + k + '|' + a + '|' + b,
      [ T('Given that $' + eqStr + '$, find an expression for $\\frac{dy}{dx}$ in terms of $x$ and $y$.') ],
      [{ text: '$' + finalAns + '$' }],
      [ T('Differentiate each term with respect to $x$:'),
        T('**Term 1 ($y \\sin ' + k + 'x$)**: Use the product rule $\\frac{d}{dx}(uv) = u\'v + uv\'$.'),
        T('$\\frac{d}{dx}(y \\sin ' + k + 'x) = \\frac{dy}{dx} \\sin ' + k + 'x + y \\cdot ' + k + '\\cos ' + k + 'x = \\sin ' + k + 'x \\frac{dy}{dx} + ' + k + 'y \\cos ' + k + 'x$ **[M1]**'),
        T('**Term 2 ($\\frac{' + a + '}{x}$)**: Rewrite as $' + mono(a, 'x^{-1}', true) + '$ and differentiate.'),
        T('$\\frac{d}{dx}(' + mono(a, 'x^{-1}', true) + ') = ' + mono(-a, 'x^{-2}', true) + ' = -\\frac{' + a + '}{x^2}$ **[B1]**'),
        T('**Term 3 ($y^2$)**: Use the chain rule.'),
        T('$\\frac{d}{dx}(y^2) = 2y \\frac{dy}{dx}$ **[B1]**'),
        T('**RHS ($' + b + '$)**: The derivative of a constant is 0.'),
        T('Equating the sum of derivatives to 0:'),
        T('$\\sin ' + k + 'x \\frac{dy}{dx} + ' + k + 'y \\cos ' + k + 'x - \\frac{' + a + '}{x^2} + 2y \\frac{dy}{dx} = 0$ **[A1]**'),
        T('Collect the $\\frac{dy}{dx}$ terms on the left and move the others to the right:'),
        T('$\\frac{dy}{dx}(\\sin ' + k + 'x + 2y) = \\frac{' + a + '}{x^2} - ' + k + 'y \\cos ' + k + 'x$ **[M1]**'),
        T('Multiply the numerator and denominator by $x^2$ to simplify:'),
        T('$' + finalAns + '$ **[A1]**') ]);
  }
};

const tImplicitMixedRules = {
  id: 'implicit-mixed-rules', strand: 'S18', difficulty: 3,
  gen(){
    const a = pick([1, 2]);
    const k = pick([2, 3]);
    
    // Equation: e^{ay} + x ln y = cos(kx)
    const eqStr = 'e^{' + (a === 1 ? '' : a) + 'y} + x \\ln y = \\cos ' + k + 'x';
    
    // Derivatives
    const d1 = a === 1 ? 'e^y \\frac{dy}{dx}' : a + 'e^{' + a + 'y} \\frac{dy}{dx}';
    const d2 = '\\ln y + \\frac{x}{y} \\frac{dy}{dx}';
    const d3 = '-' + k + '\\sin ' + k + 'x';

    return Q('imp2|' + a + '|' + k,
      [ T('A curve has equation $' + eqStr + '$. Find $\\frac{dy}{dx}$ in terms of $x$ and $y$.') ],
      [{ text: '$\\frac{dy}{dx} = \\frac{-' + k + 'y\\sin ' + k + 'x - y\\ln y}{' + (a === 1 ? 'y' : a + 'y') + 'e^{' + (a === 1 ? '' : a) + 'y} + x}$' }],
      [ T('Differentiate each term implicitly with respect to $x$:'),
        T('**Term 1 ($e^{' + (a === 1 ? '' : a) + 'y}$)**: Use the chain rule.'),
        T('$\\frac{d}{dx}(e^{' + (a === 1 ? '' : a) + 'y}) = ' + d1 + '$ **[M1]**'),
        T('**Term 2 ($x \\ln y$)**: Use the product rule.'),
        T('$\\frac{d}{dx}(x \\ln y) = 1 \\cdot \\ln y + x \\cdot \\frac{1}{y} \\frac{dy}{dx} = ' + d2 + '$ **[M1]**'),
        T('**RHS ($\\cos ' + k + 'x$)**: Differentiate using the chain rule.'),
        T('$\\frac{d}{dx}(\\cos ' + k + 'x) = ' + d3 + '$ **[B1]**'),

        T('$' + d1 + ' + ' + d2 + ' = ' + d3 + '$ **[A1]**'),
        T('Collect the $\\frac{dy}{dx}$ terms on the left:'),
        T('$\\frac{dy}{dx}\\left(' + (a === 1 ? 'e^y' : a + 'e^{' + a + 'y}') + ' + \\frac{x}{y}\\right) = -' + k + '\\sin ' + k + 'x - \\ln y$ **[M1]**'),
        T('Multiply the numerator and denominator by $y$ to clear the fraction:'),
        T('$\\frac{dy}{dx} = \\frac{-' + k + 'y\\sin ' + k + 'x - y\\ln y}{' + (a === 1 ? 'y' : a + 'y') + 'e^{' + (a === 1 ? '' : a) + 'y} + x}$ **[A1]**') ]);
  }
};

const tImplicitTangent = {
  id: 'implicit-tangent', strand: 'S18', difficulty: 3,
  gen(){
    let a, b, c, x0, y0, mDen;
    do {
      a = pick([2, 3, 4]); b = pick([1, 2]); c = pick([2, 3]);
      x0 = pick([-2, -1, 1, 2]); y0 = pick([-2, -1, 1, 2]);
      mDen = b*x0 + 2*c*y0;
    } while (mDen === 0);              // tangent at P would be vertical: no gradient
    const d = a*x0*x0 + b*x0*y0 + c*y0*y0;
    const eqStr = polyTex([[a,'x^2'],[b,'xy'],[c,'y^2']]) + ' = ' + d;
    const mNum = -(2*a*x0 + b*y0);
    const m = fr(mNum, mDen);
    const cInt = fr(y0*mDen - mNum*x0, mDen);          // c = y0 - m·x0
    const tangentEq = 'y = ' + polyTex([[m,'x'],[cInt,'']]);
    const shift = (v, name) => name + (v < 0 ? ' + ' + (-v) : ' - ' + v);

    return Q('imp3|' + a + '|' + b + '|' + c + '|' + x0 + '|' + y0,
      [ T('The curve $C$ has equation $' + eqStr + '$.'),
        T('The point $P' + ptTex(x0, y0) + '$ lies on $C$.'),
        T('Find an equation of the tangent to $C$ at $P$, giving your answer in the form $y = mx + c$.') ],
      [{ text: '$' + tangentEq + '$' }],
      [ T('Differentiate the equation implicitly with respect to $x$:'),
        T('$\\frac{d}{dx}(' + mono(a,'x^2',true) + ') + \\frac{d}{dx}(' + mono(b,'xy',true) + ') + \\frac{d}{dx}(' + mono(c,'y^2',true) + ') = 0$ **[M1]**'),
        T('$' + polyTex([[2*a,'x'],[b,'\\left(y + x' + DYDX + '\\right)'],[2*c,'y' + DYDX]]) + ' = 0$ **[A1]**'),
        T('Substitute the coordinates of $P' + ptTex(x0, y0) + '$ to find the gradient at $P$:'),
        T('$' + polyTex([[2*a*x0,''],[b,'\\left(' + y0 + mono(x0, DYDX, false) + '\\right)'],[2*c*y0, DYDX]]) + ' = 0$ **[M1]**'),
        T('Expand and collect the $' + DYDX + '$ terms:  $' + mono(mDen, DYDX, true) + ' = ' + mNum + '$'),
        T('$' + DYDX + ' = ' + fTex(m) + '$ **[A1]**'),
        T('The equation of the tangent is $y - y_1 = m(x - x_1)$:'),
        T('$' + shift(y0, 'y') + ' = ' + fTex(m) + '\\left(' + shift(x0, 'x') + '\\right)$ **[M1]**'),
        T('Rearranging gives $' + tangentEq + '$. **[A1]**') ]);
  }
};

/* ============================================================
   S18 — Stationary points & tangent directions on conics
   Ax^2 + Bxy + Cy^2 (+ Dx + Ey) = R
   All pools are built once by deterministic enumeration, so a
   seed always reproduces the same sheet.
   ============================================================ */

/* ---- exact rationals ---- */
function fr(n, d){
  if (d === undefined) d = 1;
  if (d < 0){ n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return { n: n/g, d: d/g };
}
const fAdd = (a, b) => fr(a.n*b.d + b.n*a.d, a.d*b.d);
const fMul = (a, b) => fr(a.n*b.n, a.d*b.d);
const fDiv = (a, b) => fr(a.n*b.d, a.d*b.n);
function fTex(a){
  if (a.d === 1) return String(a.n);
  return (a.n < 0 ? '-' : '') + '\\frac{' + Math.abs(a.n) + '}{' + a.d + '}';
}
/* One signed term: coefficient (int or fraction) times body. */
function mono(a, body, first){
  if (typeof a === 'number') a = fr(a);
  if (a.n === 0) return '';
  const neg = a.n < 0;
  const absA = fr(Math.abs(a.n), a.d);
  const c = (absA.n === 1 && absA.d === 1 && body) ? '' : fTex(absA);
  if (first) return (neg ? '-' : '') + c + body;
  return (neg ? ' - ' : ' + ') + c + body;
}
/* Signed sum of terms [[coef, body], ...]; zero terms are skipped. */
function polyTex(terms){
  let s = '';
  for (const t of terms) s += mono(t[0], t[1], s === '');
  return s === '' ? '0' : s;
}
function ptTex(x, y){ return '(' + x + ', ' + y + ')'; }
function isqrt(n){ if (n < 0) return -1; const r = Math.round(Math.sqrt(n)); return r*r === n ? r : -1; }
const DYDX = '\\frac{dy}{dx}';

/* The curve as typeset: "... + K = 0" (form 'zero') or "... = R" (form 'eq'). */
function conicTex(A, B, C, D, E, R, form){
  const terms = [[A,'x^2'],[B,'xy'],[C,'y^2'],[D||0,'x'],[E||0,'y']];
  if (form === 'zero') return polyTex(terms.concat([[-R, '']])) + ' = 0';
  return polyTex(terms) + ' = ' + R;
}
function constTail(R, form){ return form === 'zero' ? mono(-R, '', false) + ' = 0' : ' = ' + R; }

/* Implicit derivative of Ax^2+Bxy+Cy^2+Dx+Ey, typeset. */
function conicDerivTex(A, B, C, D, E){
  return polyTex([[2*A,'x'], [B,'\\left(x' + DYDX + ' + y\\right)'], [2*C,'y' + DYDX],
                  [D||0,''], [E||0, DYDX]]) + ' = 0';
}
function differentiateSteps(A, B, C, D, E){
  return [
    T('Differentiate implicitly with respect to $x$. Product rule on the $xy$ term: $\\frac{d}{dx}(xy) = x' + DYDX + ' + y$ **[B1]**; chain rule on the $y^2$ term: $\\frac{d}{dx}(y^2) = 2y' + DYDX + '$ **[B1]**'),
    T('$' + conicDerivTex(A, B, C, D, E) + '$ **[M1]**')
  ];
}

/* Discriminant-style check that Ax^2+Bxy+Cy^2+Dx+Ey-R is a genuine conic. */
function conicNonDegenerate(A, B, C, D, E, R){
  // 4 × det [[A, B/2, D/2], [B/2, C, E/2], [D/2, E/2, -R]]
  const det4 = 4*A*C*(-R) + B*E*D - A*E*E - C*D*D - (-R)*B*B;
  return det4 !== 0 && (4*A*C - B*B) !== 0;
}

/* Solve the curve Ax^2+Bxy+Cy^2 = R together with the line px + qy = 0.
   Returns { lines, pts, rel } — the working, both points, and the line as typeset. */
function elimHom(A, B, C, R, form, p, q){
  const L = [];
  const elimY = (p % q === 0) || (q % p !== 0);       // y = mx  unless  x = my is cleaner
  const m = elimY ? fr(-p, q) : fr(-q, p);
  const u = elimY ? 'x' : 'y', w = elimY ? 'y' : 'x';
  const rel = w + ' = ' + mono(m, u, true);
  const sub = '\\left(' + mono(m, u, true) + '\\right)';
  const subTerms = elimY
    ? [[A,'x^2'], [B,'x' + sub], [C, sub + '^2']]
    : [[A, sub + '^2'], [B, sub + 'y'], [C,'y^2']];
  const cs = elimY ? [fr(A), fMul(fr(B), m), fMul(fr(C), fMul(m, m))]
                   : [fMul(fr(A), fMul(m, m)), fMul(fr(B), m), fr(C)];
  const s = fAdd(fAdd(cs[0], cs[1]), cs[2]);
  const X = fDiv(fr(R), s);
  const v = isqrt(X.d === 1 ? X.n : -1);
  const other = fMul(m, fr(v));
  L.push(T('Substitute $' + rel + '$ into the equation of the curve to eliminate $' + w + '$:'));
  L.push(T('$' + polyTex(subTerms) + constTail(R, form) + '$ **[M1]**'));
  L.push(T('$' + polyTex(cs.map(c => [c, u + '^2'])) + constTail(R, form) + '$'));
  L.push(T('$' + mono(s, u + '^2', true) + ' = ' + R + ' \\Rightarrow ' + u + '^2 = ' + fTex(X) + '$ **[A1]**'));
  L.push(T('So $' + u + ' = ' + v + '$ or $' + u + ' = ' + (-v) + '$. Using $' + rel + '$: when $' + u + ' = ' + v +
           '$, $' + w + ' = ' + fTex(other) + '$; when $' + u + ' = ' + (-v) + '$, $' + w + ' = ' + fTex(fr(-other.n, other.d)) + '$.'));
  let pts = elimY ? [[v, other.n], [-v, -other.n]] : [[other.n, v], [-other.n, -v]];
  pts.sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  return { lines: L, pts, rel, ok: v > 0 && other.d === 1 };
}

/* Integer points t·d on the line px + qy = 0, with d the primitive direction. */
function primitiveDir(p, q){ const g = gcd(p, q) || 1; return [q/g, -p/g]; }
function quadForm(A, B, C, x, y){ return A*x*x + B*x*y + C*y*y; }
function bothPts(pts){ return '$' + ptTex(pts[0][0], pts[0][1]) + '$ and $' + ptTex(pts[1][0], pts[1][1]) + '$'; }

/* ---------- pools (built lazily, deterministic) ---------- */
const STAT_POOLS = {};
function statPool(name, build){ if (!STAT_POOLS[name]) STAT_POOLS[name] = build(); return STAT_POOLS[name]; }

/* A1 — exam form: hyperbola, constant on the left, "+ K = 0" */
function poolExamHyperbola(){
  const out = [];
  for (const A of [1, 2, 3]) for (let B = -8; B <= 8; B++) for (const C of [-3, -2, -1, 1, 2, 3]){
    if (B === 0 || 4*A*C - B*B >= 0) continue;
    if ((2*A) % B !== 0 && B % (2*A) !== 0) continue;   // exam-style: integer elimination (e.g. x = -2y)
    const d = primitiveDir(2*A, B);
    for (let t = 1; t <= 4; t++){
      const x = t*d[0], y = t*d[1];
      if (Math.abs(x) > 12 || Math.abs(y) > 12) continue;
      const R = quadForm(A, B, C, x, y);
      if (R >= 0 || -R > 200) continue;
      if (B*x + 2*C*y === 0) continue;
      out.push({ A, B, C, R });
    }
  }
  return out;
}

/* A2 — ellipse: greatest / least value of y (or of x) */
function poolEllipseExtreme(){
  const out = [];
  for (const A of [1, 2, 3, 4]) for (let B = -6; B <= 6; B++) for (const C of [1, 2, 3, 4]){
    if (B === 0 || 4*A*C - B*B <= 0) continue;
    for (const mode of ['y', 'x']){
      const p = mode === 'y' ? 2*A : B, q = mode === 'y' ? B : 2*C;
      const d = primitiveDir(p, q);
      for (let t = 1; t <= 3; t++){
        const x = t*d[0], y = t*d[1];
        if (Math.abs(x) > 10 || Math.abs(y) > 10) continue;
        const R = quadForm(A, B, C, x, y);
        if (R > 150) continue;
        out.push({ A, B, C, R, mode, p, q });
      }
    }
  }
  return out;
}

/* A3 — a linear term breaks the ± symmetry */
function poolLinearTerm(){
  const out = [];
  for (const A of [1, 2, 3]) for (const B of [-2, -1, 1, 2]) for (const C of [-2, -1, 1, 2, 3])
  for (const [D, E] of [[-6,0],[-4,0],[-2,0],[2,0],[4,0],[6,0],[0,-6],[0,-4],[0,-3],[0,-2],[0,2],[0,3],[0,4],[0,6]]){
    if (D % B !== 0) continue;
    const m = -2*A/B, n = -D/B;
    const s = A + B*m + C*m*m;
    if (s === 0) continue;
    const lin = 2*C*m*n + E*m;
    if (lin % s !== 0) continue;
    const sum = -lin/s;
    for (let x1 = -6; x1 <= 6; x1++){
      const x2 = sum - x1;
      if (x2 <= x1 || Math.abs(x2) > 6) continue;
      const y1 = m*x1 + n, y2 = m*x2 + n;
      if (Math.abs(y1) > 12 || Math.abs(y2) > 12) continue;
      if (x1 === -x2 && y1 === -y2) continue;
      const R = C*n*n + E*n - s*x1*x2;
      if (Math.abs(R) > 120) continue;
      if (!conicNonDegenerate(A, B, C, D, E, R)) continue;
      if (B*x1 + 2*C*y1 + E === 0 || B*x2 + 2*C*y2 + E === 0) continue;
      out.push({ A, B, C, D, E, R, m, n, s, lin, x1, x2, y1, y2 });
    }
  }
  return out;
}

/* B1 — unknown coefficient k found from one stationary point */
function poolUnknownK(){
  const out = [];
  for (const A of [1, 2, 3]) for (const C of [1, 2, 3, 4])
  for (let x0 = -6; x0 <= 6; x0++) for (let y0 = -6; y0 <= 6; y0++){
    if (x0 === 0 || y0 === 0 || x0*y0 > 0) continue;
    if ((-2*A*x0) % y0 !== 0) continue;
    const k = -2*A*x0/y0;
    if (k < 2 || k > 12 || k*k === 4*A*C) continue;
    const K = A*x0*x0 - C*y0*y0;              // curve: Ax^2 + kxy + Cy^2 + K = 0
    if (K === 0 || Math.abs(K) > 150) continue;
    if (k*x0 + 2*C*y0 === 0) continue;
    out.push({ A, C, k, x0, y0, R: -K });
  }
  return out;
}

/* B2 — for which c are there stationary points? (hyperbolas) */
function poolSetOfC(){
  return poolExamHyperbola().filter(o => Math.abs(o.R) <= 120);
}

/* C1 — tangents parallel to both axes on one ellipse */
function poolBothAxes(){
  const out = [];
  for (const A of [1, 2, 3, 4, 5]) for (let B = -6; B <= 6; B++) for (const C of [1, 2, 3, 4, 5]){
    if (B === 0 || 4*A*C - B*B <= 0) continue;
    const d1 = primitiveDir(2*A, B), d2 = primitiveDir(B, 2*C);
    const Q1 = quadForm(A, B, C, d1[0], d1[1]), Q2 = quadForm(A, B, C, d2[0], d2[1]);
    for (let t = 1; t <= 4; t++) for (let u = 1; u <= 4; u++){
      if (t*t*Q1 !== u*u*Q2) continue;
      const R = t*t*Q1;
      if (R > 200) continue;
      const big = Math.max(Math.abs(t*d1[0]), Math.abs(t*d1[1]), Math.abs(u*d2[0]), Math.abs(u*d2[1]));
      if (big > 10) continue;
      out.push({ A, B, C, R });
    }
  }
  return out;
}

/* C2 — tangent parallel to a given line */
function poolParallelLine(){
  const out = [];
  for (const A of [1, 2, 3]) for (let B = -4; B <= 4; B++) for (const C of [-2, -1, 1, 2, 3])
  for (const g of [-3, -2, -1, 1, 2, 3]){
    if (B === 0 || 4*A*C - B*B === 0) continue;
    const p = 2*A + g*B, q = B + 2*g*C;
    if (p === 0 || q === 0) continue;
    const d = primitiveDir(p, q);
    const Qd = quadForm(A, B, C, d[0], d[1]);
    if (Qd === 0) continue;
    for (let t = 1; t <= 3; t++){
      const x = t*d[0], y = t*d[1];
      if (Math.abs(x) > 9 || Math.abs(y) > 9) continue;
      const R = t*t*Qd;
      if (Math.abs(R) > 150) continue;
      if (B*x + 2*C*y === 0) continue;
      out.push({ A, B, C, R, g, p, q });
    }
  }
  return out;
}

/* ---------- ellipse diagram (closed polyline) ---------- */
function ellipsePlotBlock(A, B, C, R){
  const D = 4*A*C - B*B;
  const xe = Math.sqrt(4*C*R/D), ye = Math.sqrt(4*A*R/D);
  const upper = [], lower = [];
  for (let i = 0; i <= 120; i++){
    const x = -xe * Math.cos(Math.PI * i / 120);
    const disc = Math.max(0, B*B*x*x - 4*C*(A*x*x - R));
    const r = Math.sqrt(disc);
    upper.push([x, (-B*x + r) / (2*C)]);
    lower.push([x, (-B*x - r) / (2*C)]);
  }
  const loop = upper.concat(lower.reverse());
  const xm = Math.ceil(xe * 1.35), ym = Math.ceil(ye * 1.35);
  return { type: 'plot', polylines: [loop], xRange: [-xm, xm], yRange: [-ym, ym], maxH: 11, keepAspect: true };
}

/* ---------- generators ---------- */

function genStatExam(){
  const o = pick(statPool('examHyp', poolExamHyperbola));
  const { A, B, C, R } = o;
  const e = elimHom(A, B, C, R, 'zero', 2*A, B);
  const ans = bothPts(e.pts);
  return Q('st-exam|' + A + '|' + B + '|' + C + '|' + R,
    [ T('Find the coordinates of the two stationary points on the curve with equation'),
      T('$' + conicTex(A, B, C, 0, 0, R, 'zero') + '$.') ],
    [{ text: ans }],
    differentiateSteps(A, B, C).concat([
      T('At a stationary point $' + DYDX + ' = 0$, so the $' + DYDX + '$ terms vanish, leaving'),
      T('$' + polyTex([[2*A,'x'],[B,'y']]) + ' = 0$ **[A1]**')
    ], e.lines, [
      T('The stationary points are ' + ans + '. **[A1]**'),
      T('(Check: the curve is unchanged when $(x, y) \\to (-x, -y)$, so the two points must be reflections of each other in $O$.)')
    ]));
}

function genStatEllipseExtreme(){
  const o = pick(statPool('ellExt', poolEllipseExtreme));
  const { A, B, C, R, mode, p, q } = o;
  const e = elimHom(A, B, C, R, 'eq', p, q);
  const idx = mode === 'y' ? 1 : 0;
  const hi = e.pts[0][idx] >= e.pts[1][idx] ? e.pts[0] : e.pts[1];
  const lo = hi === e.pts[0] ? e.pts[1] : e.pts[0];
  const v = mode;
  const ans = 'Greatest $' + v + ' = ' + hi[idx] + '$ at $' + ptTex(hi[0], hi[1]) + '$; least $' + v + ' = ' + lo[idx] + '$ at $' + ptTex(lo[0], lo[1]) + '$';
  const num = polyTex([[2*A,'x'],[B,'y']]), den = polyTex([[B,'x'],[2*C,'y']]);
  const why = mode === 'y'
    ? [ T('The greatest and least values of $y$ on a closed curve occur where the tangent is horizontal, i.e. where $' + DYDX + ' = 0$.'),
        T('Setting $' + DYDX + ' = 0$ gives $' + num + ' = 0$ **[A1]**') ]
    : [ T('Collect the $' + DYDX + '$ terms: $(' + den + ')' + DYDX + ' = -(' + num + ')$, so $' + DYDX + ' = -\\frac{' + num + '}{' + den + '}$.'),
        T('The greatest and least values of $x$ occur where the tangent is vertical, i.e. where $' + DYDX + '$ is undefined: the denominator is zero.'),
        T('$' + den + ' = 0$ **[A1]**'),
        T('(Equivalently, differentiate with respect to $y$ and set $\\frac{dx}{dy} = 0$.)') ];
  return Q('st-ext|' + A + '|' + B + '|' + C + '|' + R + '|' + mode,
    [ ellipsePlotBlock(A, B, C, R),
      T('The diagram shows the closed curve $C$ with equation $' + conicTex(A, B, C, 0, 0, R, 'eq') + '$.'),
      T('Find the greatest and least values of $' + v + '$ on $C$, and the coordinates of the points where they occur.') ],
    [{ text: ans }],
    differentiateSteps(A, B, C).concat(why, e.lines, [
      T('So the greatest value of $' + v + '$ is $' + hi[idx] + '$, at $' + ptTex(hi[0], hi[1]) + '$, and the least is $' + lo[idx] + '$, at $' + ptTex(lo[0], lo[1]) + '$. **[A1]**'),
      T('(Because of the $xy$ term the curve is tilted, so these extreme points are not where $C$ crosses the ' + (v === 'y' ? '$y$' : '$x$') + '-axis.)')
    ]));
}

function genStatLinearTerm(){
  const o = pick(statPool('linTerm', poolLinearTerm));
  const { A, B, C, D, E, R, m, n, s, lin, x1, x2, y1, y2 } = o;
  const rel = 'y = ' + polyTex([[m,'x'],[n,'']]);
  const sub = '\\left(' + polyTex([[m,'x'],[n,'']]) + '\\right)';
  const c0 = C*n*n + E*n;
  const sum = x1 + x2, prod = x1*x2;
  const factor = (r) => r === 0 ? 'x' : '(x ' + (r > 0 ? '- ' + r : '+ ' + (-r)) + ')';
  const ans = '$' + ptTex(x1, y1) + '$ and $' + ptTex(x2, y2) + '$';
  const steps = differentiateSteps(A, B, C, D, E).concat([
    T('At a stationary point $' + DYDX + ' = 0$, so every $' + DYDX + '$ term vanishes:'),
    T('$' + polyTex([[2*A,'x'],[B,'y'],[D,'']]) + ' = 0 \\Rightarrow ' + rel + '$ **[A1]**'),
    T('Substitute into the equation of the curve:'),
    T('$' + polyTex([[A,'x^2'],[B,'x' + sub],[C, sub + '^2'],[D,'x'],[E, sub]]) + ' = ' + R + '$ **[M1]**'),
    T('Expanding and collecting terms:  $' + polyTex([[s,'x^2'],[lin,'x'],[c0,'']]) + ' = ' + R + '$'),
    T('$' + polyTex([[s,'x^2'],[lin,'x'],[c0 - R,'']]) + ' = 0$' + (s !== 1 ? '  $\\Rightarrow$  $' + polyTex([[1,'x^2'],[-sum,'x'],[prod,'']]) + ' = 0$' : '')),
    T('$' + factor(x1) + factor(x2) + ' = 0 \\Rightarrow x = ' + x1 + '$ or $x = ' + x2 + '$ **[A1]**'),
    T('Using $' + rel + '$: when $x = ' + x1 + '$, $y = ' + y1 + '$; when $x = ' + x2 + '$, $y = ' + y2 + '$.'),
    T('The stationary points are ' + ans + '. **[A1]**'),
    T('(The linear term means the curve is no longer symmetric about $O$, so the two points are not of the form $\\pm(a, b)$.)')
  ]);
  return Q('st-lin|' + [A,B,C,D,E,R].join('|'),
    [ T('Find the coordinates of the stationary points on the curve with equation'),
      T('$' + conicTex(A, B, C, D, E, R, 'eq') + '$.') ],
    [{ text: ans }],
    steps);
}

function genStatUnknownK(){
  const o = pick(statPool('unkK', poolUnknownK));
  const { A, C, k, x0, y0, R } = o;
  const form = R < 0 ? 'zero' : 'eq';
  const curveK = polyTex([[A,'x^2'],[1,'kxy'],[C,'y^2']]) + constTail(R, form);
  const Y = (R + A*x0*x0) / C;
  const v = Math.abs(y0);
  const ans = '(a) $k = ' + k + '$, $y = ' + y0 + '$   (b) $' + ptTex(-x0, -y0) + '$';
  return Q('st-k|' + [A,C,k,x0,y0].join('|'),
    [ T('A curve has equation'),
      T('$' + curveK + '$,'),
      T('where $k$ is a positive constant. The curve has a stationary point $P$ at which $x = ' + x0 + '$.'),
      T('(a) Find $k$ and the $y$-coordinate of $P$.'),
      T('(b) Find the coordinates of the other stationary point on the curve.') ],
    [{ text: ans }],
    [
      T('(a) Differentiate implicitly with respect to $x$ (product rule on $kxy$, chain rule on $' + mono(C,'y^2',true) + '$):'),
      T('$' + polyTex([[2*A,'x'],[1,'k\\left(x' + DYDX + ' + y\\right)'],[2*C,'y' + DYDX]]) + ' = 0$ **[B1 B1]**'),
      T('At a stationary point $' + DYDX + ' = 0$:  $' + mono(2*A,'x',true) + ' + ky = 0$ **[M1 A1]**'),
      T('Multiplying by $x$ gives $kxy = ' + mono(-2*A,'x^2',true) + '$. At $P$, $x = ' + x0 + '$, so $kxy = ' + (-2*A*x0*x0) + '$ — this removes $k$ from the curve equation. **[M1]**'),
      T('$' + polyTex([[A*x0*x0,''],[-2*A*x0*x0,''],[C,'y^2']]) + constTail(R, form) + '$'),
      T('$' + mono(C,'y^2',true) + ' = ' + (C*Y) + ' \\Rightarrow y^2 = ' + Y + ' \\Rightarrow y = \\pm ' + v + '$ **[A1]**'),
      T('From $' + mono(2*A,'x',true) + ' + ky = 0$:  $k = -\\frac{' + 2*A + 'x}{y}$, so at $P$, $k = ' + (-2*A*x0 < 0 ? '-' : '') + '\\frac{' + Math.abs(2*A*x0) + '}{y}$.'),
      T('For $k > 0$ we need $y = ' + y0 + '$, giving $k = ' + k + '$. (The other root, $y = ' + (-y0) + '$, gives $k = ' + (-k) + '$, which is rejected.) **[A1]**'),
      T('(b) With $k = ' + k + '$, the stationary condition is $' + polyTex([[2*A,'x'],[k,'y']]) + ' = 0$, i.e. the stationary points lie on the line through $O$ and $P$.'),
      T('The curve equation is unchanged when $(x, y) \\to (-x, -y)$, so the other stationary point is $' + ptTex(-x0, -y0) + '$. **[B1]**'),
      T('(Check: $' + ptTex(-x0, -y0) + '$ satisfies $' + polyTex([[2*A,'x'],[k,'y']]) + ' = ' + (-2*A*x0 - k*y0) + '$.)')
    ]);
}

function genStatSetOfC(){
  const o = pick(statPool('setC', poolSetOfC));
  const { A, B, C, R } = o;
  const e = elimHom(A, B, C, R, 'eq', 2*A, B);
  // Sign of the x^2 (or y^2) coefficient after substitution
  const elimY = ((2*A) % B === 0) || (B % (2*A) !== 0);
  const m = elimY ? fr(-2*A, B) : fr(-B, 2*A);
  const s = elimY ? fAdd(fAdd(fr(A), fMul(fr(B), m)), fMul(fr(C), fMul(m, m)))
                  : fAdd(fAdd(fMul(fr(A), fMul(m, m)), fMul(fr(B), m)), fr(C));
  const u = elimY ? 'x' : 'y';
  const cond = s.n > 0 ? 'c > 0' : 'c < 0';
  const ans = '(a) $' + e.rel + '$   (b) $' + cond + '$   (c) ' + bothPts(e.pts);
  const sub = '\\left(' + mono(m, u, true) + '\\right)';
  const subTerms = elimY ? [[A,'x^2'],[B,'x' + sub],[C, sub + '^2']] : [[A, sub + '^2'],[B, sub + 'y'],[C,'y^2']];
  return Q('st-c|' + [A,B,C,R].join('|'),
    [ T('The curve $C$ has equation $' + polyTex([[A,'x^2'],[B,'xy'],[C,'y^2']]) + ' = c$, where $c$ is a non-zero constant.'),
      T('(a) Show that at any stationary point on $C$, $' + e.rel + '$.'),
      T('(b) Find the set of values of $c$ for which $C$ has stationary points.'),
      T('(c) Given that $c = ' + R + '$, find the coordinates of the stationary points.') ],
    [{ text: ans }],
    [T('(a)')].concat(differentiateSteps(A, B, C), [
      T('Setting $' + DYDX + ' = 0$:  $' + polyTex([[2*A,'x'],[B,'y']]) + ' = 0 \\Rightarrow ' + e.rel + '$, as required. **[A1]**'),
      T('(b) Substitute into the curve:  $' + polyTex(subTerms) + ' = c$ **[M1]**'),
      T('$' + mono(s, u + '^2', true) + ' = c \\Rightarrow ' + u + '^2 = ' + mono(fr(s.d, s.n), 'c', true) + '$ **[A1]**'),
      T('A real solution needs $' + u + '^2 > 0$ (it cannot be $0$, since then $x = y = 0$, which is not on $C$ for $c \\neq 0$). So we need $' + cond + '$. **[A1]**'),
      T('(For ' + (s.n > 0 ? '$c < 0$' : '$c > 0$') + ' the curve still exists — it is a hyperbola — but it has no stationary points.)'),
      T('(c) With $c = ' + R + '$:')
    ], e.lines.slice(1), [
      T('The stationary points are ' + bothPts(e.pts) + '. **[A1]**')
    ]));
}

      T('(a) Tangent parallel to the $x$-axis: $' + DYDX + ' = 0$, so the numerator is zero:  $' + num + ' = 0$ **[M1]**')
    ], h.lines, [
      T('Points: ' + bothPts(h.pts) + '. **[A1]**'),
      T('(b) Tangent parallel to the $y$-axis: $' + DYDX + '$ is undefined, so the denominator is zero:  $' + den + ' = 0$ **[M1]**')

    ]));

function genTangentParallelLine(){
  const o = pick(statPool('parLine', poolParallelLine));
  const { A, B, C, R, g, p, q } = o;
  const form = R < 0 ? 'zero' : 'eq';
  const e = elimHom(A, B, C, R, form, p, q);
  // Line a x + b y = c with gradient g = -a/b; pick a constant that is not one of the tangents
  const bL = pick([1, 2]), aL = -g*bL;
  const tangentConsts = e.pts.map(([x, y]) => bL*y + aL*x);       // a x + b y at the points
  let cL = pick([3, 5, 7, -3, -5, -7]);
  for (const alt of [3, 5, 7, -3, -5, -7, 11]) { if (!tangentConsts.includes(cL)) break; cL = alt; }
  const lineTex = polyTex([[aL,'x'],[bL,'y']]) + ' = ' + cL;
  const num = polyTex([[2*A,'x'],[B,'y']]), den = polyTex([[B,'x'],[2*C,'y']]);
  const relTex = polyTex([[p,'x'],[q,'y']]) + ' = 0';
  const ans = bothPts(e.pts);
  return Q('tan-par|' + [A,B,C,R,g,bL].join('|'),
    [ T('A curve has equation $' + conicTex(A, B, C, 0, 0, R, form) + '$.'),
      T('Find the coordinates of the points on the curve at which the tangent is parallel to the line $' + lineTex + '$.') ],
    [{ text: ans }],
    [ T('The line $' + lineTex + '$ can be written $y = ' + polyTex([[g,'x'],[fr(cL, bL),'']]) + '$, so its gradient is $' + g + '$. **[B1]**') ]
    .concat(differentiateSteps(A, B, C), [
      T('So $' + DYDX + ' = -\\frac{' + num + '}{' + den + '}$.'),
      T('Set $' + DYDX + ' = ' + g + '$:  $-(' + num + ') = ' + (g === 1 ? '' : g === -1 ? '-' : g) + '(' + den + ')$ **[M1]**'),
      T('$' + relTex + '$ **[A1]**')
    ], e.lines, [
      T('The tangent is parallel to the line at ' + ans + '. **[A1]**'),
      T('(Check: at each point, $' + den + ' \\neq 0$, so the gradient really is defined there.)')
    ]));
}

/* -------- S18: Implicit Differentiation — find gradient at a point --------
   Five structurally distinct variants:
     V1  (x+y)^2 = xy^2,  x=1          — the classic exam form
     V2  (x+y)^2 = x^2 y + c,  x=1      — two branches, find y first
     V3  xy^2 + x^2 y = c,  y=1         — product rule on both terms, find x first
     V4  sin(x+y) = ax - y,  x=0        — trig chain rule
     V5  e^{kxy} = x^2 + y,  x=0        — exp + product rule
-------------------------------------------------------------------------- */

function genImplicitFindPointV1(){
  return Q('imp5-v1',
    [ T('A curve has equation $(x+y)^2 = xy^2$.'),
      T('Find the gradient of the curve at the point where $x = 1$.') ],
    [{ text: '$\\frac{dy}{dx} = -\\frac{3}{8}$' }],
    [
      T('Step 1 — Differentiate implicitly with respect to $x$.'),
      T('LHS: by the chain rule on $(x+y)^2$,  $\\frac{d}{dx}(x+y)^2 = 2(x+y)\\left(1 + \\frac{dy}{dx}\\right)$ **[M1]**'),
      T('The coefficient is $k = 2$ **[A1]**'),
      T('RHS: by the product rule on $x \\cdot y^2$ (with the chain rule on $y^2$),  $\\frac{d}{dx}(xy^2) = y^2 + x \\cdot 2y\\frac{dy}{dx} = y^2 + 2xy\\frac{dy}{dx}$ **[B1 — the $2y\\frac{dy}{dx}$ term from differentiating $y^2$; M1 — the $2xy\\frac{dy}{dx}$ product-rule term]**'),
      T('Equating the two sides:  $2(x+y)\\left(1 + \\frac{dy}{dx}\\right) = y^2 + 2xy\\frac{dy}{dx}$.'),
      T('Step 2 — Find the $y$-coordinate when $x = 1$.'),
      T('Substitute $x = 1$ into the curve equation:  $(1 + y)^2 = 1^2 \\cdot y^2 = y^2$. **[M1]**'),
      T('$1 + 2y + y^2 = y^2 \\Rightarrow 1 + 2y = 0 \\Rightarrow y = -\\frac{1}{2}$.'),
      T('So the point of interest is $\\left(1, -\\frac{1}{2}\\right)$.'),
      T('Step 3 — Substitute $\\left(1, -\\frac{1}{2}\\right)$ into the differentiated equation.'),
      T('$2\\left(1 - \\frac{1}{2}\\right)\\left(1 + \\frac{dy}{dx}\\right) = \\left(-\\frac{1}{2}\\right)^2 + 2(1)\\left(-\\frac{1}{2}\\right)\\frac{dy}{dx}$ **[M1]**'),
      T('$2 \\cdot \\frac{1}{2}\\left(1 + \\frac{dy}{dx}\\right) = \\frac{1}{4} - \\frac{dy}{dx}$'),
      T('$1 + \\frac{dy}{dx} = \\frac{1}{4} - \\frac{dy}{dx}$'),
      T('Step 4 — Solve for $\\frac{dy}{dx}$.'),
      T('$2\\frac{dy}{dx} = \\frac{1}{4} - 1 = -\\frac{3}{4}$'),
      T('$\\frac{dy}{dx} = -\\frac{3}{8}$ **[A1]**'),
      T(''),
      T('(Decimal check: $\\frac{dy}{dx} = -0.375$, matching the mark scheme.)')
    ]);
}

function genImplicitFindPointV2(){
  const c = pick([1, 3, 7]);
  // (1+y)^2 = y + c  =>  y^2 + y + (1-c) = 0
  // Roots y1 + y2 = -1,  y1·y2 = 1-c
  // Solution y' satisfies y' = -2/(1+2y).
  const data = {
    1: { y1: 0,  y2: -1, g1: '-2',              g2: '2'              },
    3: { y1: 1,  y2: -2, g1: '-\\frac{2}{3}',   g2: '\\frac{2}{3}'   },
    7: { y1: 2,  y2: -3, g1: '-\\frac{2}{5}',   g2: '\\frac{2}{5}'   }
  }[c];
  const { y1, y2, g1, g2 } = data;

  const eqStr = '(x+y)^2 = x^2 y + ' + c;
  const y1Str = nStr(y1);
  const y2Str = nStr(y2);

  return Q('imp5-v2|' + c,
    [ T('A curve has equation $' + eqStr + '$.'),
      T('Find the gradients of the curve at the points where $x = 1$.') ],
    [{ text: 'At $y = ' + y1Str + '$: $\\frac{dy}{dx} = ' + g1 + '$;   at $y = ' + y2Str + '$: $\\frac{dy}{dx} = ' + g2 + '$' }],
    [
      T('Step 1 — Differentiate implicitly with respect to $x$.'),
      T('LHS: by the chain rule on $(x+y)^2$,  $\\frac{d}{dx}(x+y)^2 = 2(x+y)\\left(1 + \\frac{dy}{dx}\\right)$ **[M1]**'),
      T('RHS: by the product rule on $x^2 y$,  $\\frac{d}{dx}(x^2 y) = 2xy + x^2 \\frac{dy}{dx}$ **[B1 for $2xy$; M1 for $x^2\\frac{dy}{dx}$]**'),
      T('Equating:  $2(x+y)\\left(1 + \\frac{dy}{dx}\\right) = 2xy + x^2\\frac{dy}{dx}$ **[A1 — the coefficient 2 is correct]**'),
      T('Step 2 — Find the $y$-coordinates when $x = 1$.'),
      T('Substitute $x = 1$ into the curve equation:  $(1 + y)^2 = 1^2 \\cdot y + ' + c + ' = y + ' + c + '$. **[M1]**'),
      T('$1 + 2y + y^2 = y + ' + c + '$'),
      T('$' + polyTex([[1,'y^2'],[1,'y'],[1 - c,'']]) + ' = 0$'),
      T('Factoring or solving the quadratic gives $y = ' + y1Str + '$ or $y = ' + y2Str + '$.'),
      T('Step 3 — Substitute $x = 1$ and each value of $y$ into the derivative, and solve for $\\frac{dy}{dx}$.'),
      T('Branch $y = ' + y1Str + '$.  $2(1' + mono(y1, '', false) + ')\\left(1 + \\frac{dy}{dx}\\right) = 2(1)(' + y1Str + ') + 1^2 \\frac{dy}{dx}$ **[M1]**'),
      T('$' + (2*(1+y1)) + '\\left(1 + \\frac{dy}{dx}\\right) = ' + (2*y1) + ' + \\frac{dy}{dx}$'),
      T('Collect $\\frac{dy}{dx}$ terms:  $(1 + 2(' + y1Str + ')) \\frac{dy}{dx} = -2$'),
      T('$\\frac{dy}{dx} = ' + g1 + '$'),
      T('Branch $y = ' + y2Str + '$.  $2(1' + mono(y2, '', false) + ')\\left(1 + \\frac{dy}{dx}\\right) = 2(1)(' + y2Str + ') + 1^2 \\frac{dy}{dx}$ **[M1]**'),
      T('Collect $\\frac{dy}{dx}$ terms:  $(1 + 2(' + y2Str + ')) \\frac{dy}{dx} = -2$'),
      T('$\\frac{dy}{dx} = ' + g2 + '$ **[A1]**')
    ]);
}

function genImplicitFindPointV3(){
  const c = pick([6, 12]);
  // x y^2 + x^2 y = c, at y=1: x^2 + x - c = 0
  // c=6 : x = 2 or -3;  y'(at y=1) = -(1+2x) / (x(2+x))
  // c=12: x = 3 or -4;  y'(at y=1) = -(1+2x) / (x(2+x))
  const data = {
    6:  { x1: 2,  x2: -3, g1: '-\\frac{5}{8}',  g2: '\\frac{5}{3}'  },
    12: { x1: 3,  x2: -4, g1: '-\\frac{7}{15}', g2: '\\frac{7}{8}'  }
  }[c];
  const { x1, x2, g1, g2 } = data;

  const eqStr = 'xy^2 + x^2 y = ' + c;
  const x1Str = nStr(x1);
  const x2Str = nStr(x2);

  return Q('imp5-v3|' + c,
    [ T('A curve has equation $' + eqStr + '$.'),
      T('Find the gradients of the curve at the points where $y = 1$.') ],
    [{ text: 'At $x = ' + x1Str + '$: $\\frac{dy}{dx} = ' + g1 + '$;   at $x = ' + x2Str + '$: $\\frac{dy}{dx} = ' + g2 + '$' }],
    [
      T('Step 1 — Differentiate implicitly with respect to $x$.'),
      T('Product rule on $xy^2$:  $\\frac{d}{dx}(xy^2) = y^2 + x \\cdot 2y\\frac{dy}{dx}$ **[M1]**'),
      T('Product rule on $x^2 y$:  $\\frac{d}{dx}(x^2 y) = 2xy + x^2\\frac{dy}{dx}$ **[M1]**'),
      T('So the differentiated equation is  $y^2 + 2xy\\frac{dy}{dx} + 2xy + x^2\\frac{dy}{dx} = 0$ **[A1 — fully correct]**'),
      T('Step 2 — Find the $x$-coordinates when $y = 1$.'),
      T('Substitute $y = 1$ into the curve equation:  $x \\cdot 1^2 + x^2 \\cdot 1 = ' + c + '$. **[M1]**'),
      T('$x^2 + x - ' + c + ' = 0$'),
      T('Factorising gives $x = ' + x1Str + '$ or $x = ' + x2Str + '$.'),
      T('Step 3 — Substitute each point into the derivative and solve for $\\frac{dy}{dx}$.'),
      T('Branch $x = ' + x1Str + '$.  At $(' + x1Str + ', 1)$:  $1 + 2(' + x1Str + ')y\' + 2(' + x1Str + ') + (' + x1Str + ')^2 y\' = 0$ **[M1]**'),
      T('$1 + ' + (2*x1) + ' + ' + (2*x1 + x1*x1) + ' \\frac{dy}{dx} = 0$'),
      T('$\\frac{dy}{dx} = ' + g1 + '$'),
      T('Branch $x = ' + x2Str + '$.  At $(' + x2Str + ', 1)$:  $1 + 2(' + x2Str + ')y\' + 2(' + x2Str + ') + (' + x2Str + ')^2 y\' = 0$ **[M1]**'),
      T('$\\frac{dy}{dx} = ' + g2 + '$ **[A1]**')
    ]);
}

function genImplicitFindPointV4(){
  const a = pick([2, 3, 4]);
  // sin(x+y) = a x - y, at x=0: sin(y) = -y, so y = 0 (unique).
  // Diff: cos(x+y)(1+y') = a - y'. At (0,0): 1+y' = a - y' => y' = (a-1)/2.
  const grad = (a - 1) / 2;
  const gradStr = gradientStr(grad);
  const eqStr = '\\sin(x+y) = ' + (a === 1 ? '' : a) + 'x - y';

  return Q('imp5-v4|' + a,
    [ T('A curve has equation $' + eqStr + '$.'),
      T('Find the gradient of the curve at the point where $x = 0$.') ],
    [{ text: '$\\frac{dy}{dx} = ' + gradStr + '$' }],
    [
      T('Step 1 — Differentiate implicitly with respect to $x$.'),
      T('LHS: by the chain rule on $\\sin(x+y)$:  $\\frac{d}{dx}\\sin(x+y) = \\cos(x+y)\\left(1 + \\frac{dy}{dx}\\right)$ **[M1]**'),
      T('RHS: $\\frac{d}{dx}(' + (a === 1 ? '' : a) + 'x - y) = ' + a + ' - \\frac{dy}{dx}$ **[B1]**'),
      T('Equating:  $\\cos(x+y)\\left(1 + \\frac{dy}{dx}\\right) = ' + a + ' - \\frac{dy}{dx}$ **[A1]**'),
      T('Step 2 — Find the $y$-coordinate when $x = 0$.'),
      T('Substitute $x = 0$ into the curve equation:  $\\sin(y) = ' + (a === 1 ? '' : a) + '(0) - y = -y$. **[M1]**'),
      T('Since $\\sin y = -y$ forces $\\sin y = y = 0$ (as $|\\sin y| \\leq |y|$ with equality only at $y = 0$),  $y = 0$.'),
      T('So the point of interest is $(0, 0)$.'),
      T('Step 3 — Substitute $(0, 0)$ into the differentiated equation.'),
      T('$\\cos(0)\\left(1 + \\frac{dy}{dx}\\right) = ' + a + ' - \\frac{dy}{dx}$ **[M1]**'),
      T('$1 + \\frac{dy}{dx} = ' + a + ' - \\frac{dy}{dx}$'),
      T('Step 4 — Solve for $\\frac{dy}{dx}$.'),
      T('$2\\frac{dy}{dx} = ' + a + ' - 1 \\Rightarrow \\frac{dy}{dx} = ' + gradStr + '$. **[A1]**')
    ]);
}

function genImplicitFindPointV5(){
  const k = pick([1, 2, 3]);
  // e^{kxy} = x^2 + y, at x=0: y=1.
  // Diff: e^{kxy} k (y + x y') = 2x + y'. At (0,1): k = y'.
  const eqStr = 'e^{' + (k === 1 ? 'xy' : k + 'xy') + '} = x^2 + y';

  return Q('imp5-v5|' + k,
    [ T('A curve has equation $' + eqStr + '$.'),
      T('Find the gradient of the curve at the point where $x = 0$.') ],
    [{ text: '$\\frac{dy}{dx} = ' + k + '$' }],
    [

      T('$\\frac{d^2y}{dx^2} = -\\frac{\\frac{d}{dx}(x) \\cdot y - x \\cdot \\frac{d}{dx}(y)}{y^2} = -\\frac{y - x\\frac{dy}{dx}}{y^2}$ **[M1 — quotient rule]**'),
      T('Step 2 — Substitute $\\frac{dy}{dx} = -\\frac{x}{y}$.'),

function genSecondDerivativeHyperbola(){

  const twoA = 2 * a;
  const threeB = 3 * b;
  const bSqrt = Math.sqrt(b);                    // 2 or 3
  const bSqrtCubed = b * bSqrt;
  const constTerm = bSqrtCubed - threeB * bSqrt - c;
  const rhsSquared = a * a - constTerm;
  const sqrtRhs = Math.sqrt(rhsSquared);

    const eqStr = 'x^2 + y^3 - ' + twoA + 'x - ' + threeB + 'y = ' + c;

    // Exact parametrisation: x = a ± sqrt(a² − y³ + 3b·y + c).
  // The square-root branch passes smoothly through every vertical tangent.
  const leftPts = [], rightPts = [];
  const yStep = (yRange[1] - yRange[0]) / 400;
  let yLast = null;
  for (let y = yRange[0]; y <= yRange[1]; y += yStep){
    const disc = a*a - y*y*y + threeB*y + c;
    if (disc < 0) break;
    yLast = y;
    const sq = Math.sqrt(disc);
    const xL = a - sq, xR = a + sq;
    if (xL >= xRange[0] && xL <= xRange[1]) leftPts.push([xL, y]);
    if (xR >= xRange[0] && xR <= xRange[1]) rightPts.push([xR, y]);
  }
  // The curve crests where the discriminant hits zero. If that crest lies
  // inside the plot area, bisect to find its exact y and append the point
  // (a, yTop) to both polylines — otherwise the top arc shows a visible gap.
  if (yLast !== null && yLast + yStep <= yRange[1]){
    let yLo = yLast, yHi = yLast + yStep;
    for (let i = 0; i < 60; i++){
      const yMid = (yLo + yHi) / 2;
      const dMid = a*a - yMid*yMid*yMid + threeB*yMid + c;
      if (dMid >= 0) yLo = yMid; else yHi = yMid;
    }
    const yTop = yLo;
    if (leftPts.length  >= 2) leftPts.push([a, yTop]);
    if (rightPts.length >= 2) rightPts.push([a, yTop]);
  }
  const polylines = [leftPts, rightPts].filter(p => p.length >= 2);

  return Q('vt|' + variant,
      [ { type: 'plot', polylines: polylines, xRange: xRange, yRange: yRange,
        annotations: [
          { x: xLeft,  y: bSqrt, label: 'P', dx: -10 },
          { x: xRight, y: bSqrt, label: 'Q', dx:   5 }
        ] },
      T('The diagram shows the curve with equation $' + eqStr + '$. At each of the points $P$ and $Q$ the tangent to the curve is parallel to the $y$-axis.'),
      T('Find the coordinates of $P$ and $Q$.') ],
    [{ text: '$P(' + xLeft + ', ' + bSqrt + ')$,  $Q(' + xRight + ', ' + bSqrt + ')$' }],
    [
      T('Step 1 — Differentiate implicitly with respect to $x$.'),
      T('$2x + 3y^2 \\cdot \\frac{dy}{dx} - ' + twoA + ' - ' + threeB + '\\cdot\\frac{dy}{dx} = 0$ **[B1 for $3y^2\\frac{dy}{dx}$; B1 for the remaining terms]**'),
      T('Collect the $\\frac{dy}{dx}$ terms: $(3y^2 - ' + threeB + ')\\frac{dy}{dx} = ' + twoA + ' - 2x$ **[M1]**'),
      T('So $\\frac{dy}{dx} = \\dfrac{' + twoA + ' - 2x}{3y^2 - ' + threeB + '}$ **[A1]**'),
      T('Step 2 — At $P$ and $Q$ the tangent is parallel to the $y$-axis, which means $\\frac{dy}{dx}$ is undefined. This happens when the denominator is zero.'),
      T('$3y^2 - ' + threeB + ' = 0$ **[M1*]**'),
      T('$y^2 = ' + b + ' \\Rightarrow y = ' + bSqrt + '$ or $y = -' + bSqrt + '$ **[A1]**'),
      T('Step 3 — Both $P$ and $Q$ lie on the upper lobe of the curve, so substitute $y = ' + bSqrt + '$ into the original equation.'),
      T('$x^2 + (' + bSqrt + ')^3 - ' + twoA + 'x - ' + threeB + '(' + bSqrt + ') = ' + c + '$ **[M1, dep*]**'),
      T('$' + polyTex([[1,'x^2'],[-twoA,'x'],[constTerm,'']]) + ' = 0$'),
      T('$x^2 - ' + twoA + 'x + ' + (a*a) + ' = ' + rhsSquared + '$'),
      T('$(x - ' + a + ')^2 = ' + rhsSquared + '$'),
      T('$x - ' + a + ' = \\pm ' + sqrtRhs + '$'),
      T('$x = ' + xLeft + '$ or $x = ' + xRight + '$ **[A1]**'),
      T('Step 4 — So $P(' + xLeft + ', ' + bSqrt + ')$ and $Q(' + xRight + ', ' + bSqrt + ')$ (in either order).')
    ]);
}
