/* ============================================================
   Plot block support — implicit curve tracer
   ============================================================ */

function traceImplicitCurve(F, xmin, xmax, ymin, ymax, numCols, numRows) {
  // Small offset converts double roots (at vertical tangents) into sign changes.
  // For our curves the shift is ~0.002 in y — invisible.
  const eps = 0.008;
  const Feff = (x, y) => F(x, y) - eps;

  const segments = [];
  let branches = [];
  const dx = (xmax - xmin) / numCols;
  const dy = (ymax - ymin) / numRows;
  const matchTol = dy * 20;   // was dy * 3 — more forgiving for steep curves

  for (let i = 0; i <= numCols; i++) {
    const x = xmin + i * dx;

    // Find all roots of Feff(x, ·) = 0 in [ymin, ymax]
    const roots = [];
    let prevY = ymin;
    let prevF = Feff(x, prevY);
    if (Math.abs(prevF) < 1e-10) roots.push(prevY);
    for (let j = 1; j <= numRows; j++) {
      const y = ymin + j * dy;
      const currF = Feff(x, y);
      if (Math.abs(currF) < 1e-10) {
        roots.push(y);
      } else if (prevF * currF < 0) {
        let a = prevY, b = y;
        for (let it = 0; it < 30; it++) {
          const m = (a + b) / 2;
          const fm = Feff(x, m);
          if (fm === 0) { a = m; b = m; break; }
          if (prevF * fm <= 0) b = m; else a = m;
        }
        roots.push((a + b) / 2);
      }
      prevY = y;
      prevF = currF;
    }

    // Dedupe + sort
    const uniq = [];
    for (const r of roots) {
      if (!uniq.some(u => Math.abs(u - r) < dy * 0.5)) uniq.push(r);
    }
    uniq.sort((a, b) => a - b);

    // Nearest-neighbour branch matching (closest, not first)
    const used = new Set();
    const newBranches = [];
    for (const y of uniq) {
      let bestK = -1, bestDist = matchTol;
      for (let k = 0; k < branches.length; k++) {
        if (used.has(k)) continue;
        const d = Math.abs(branches[k].lastY - y);
        if (d < bestDist) { bestDist = d; bestK = k; }
      }
      if (bestK >= 0) {
        branches[bestK].points.push([x, y]);
        branches[bestK].lastY = y;
        used.add(bestK);
        newBranches.push(branches[bestK]);
      } else {
        newBranches.push({ lastY: y, points: [[x, y]] });
      }
    }
    // Close unmatched branches
    for (let k = 0; k < branches.length; k++) {
      if (!used.has(k) && branches[k].points.length >= 2) {
        segments.push(branches[k].points);
      }
    }
    branches = newBranches;
  }
    for (const b of branches) {
    if (b.points.length >= 2) segments.push(b.points);
  }

  // ---- Post-pass: stitch segments whose endpoints meet ----
  // At a vertical tangent the tracer produces two separate polylines whose
  // start (or end) points are within ~2·eps in y. Merge those into one
  // polyline so the curve renders continuously through the tip.
  const tolX = dx * 3;
  const tolY = dy * 5;
  let merged = true;
  while (merged) {
    merged = false;
    outer: for (let i = 0; i < segments.length; i++) {
      for (let j = i + 1; j < segments.length; j++) {
        const A = segments[i], B = segments[j];
        if (!A || !B || A.length < 2 || B.length < 2) continue;
        const aS = A[0], aE = A[A.length-1];
        const bS = B[0], bE = B[B.length-1];
        const cl = (p, q) => Math.abs(p[0]-q[0]) <= tolX && Math.abs(p[1]-q[1]) <= tolY;
        if (cl(aE, bS)) { segments[i] = A.concat(B.slice(1));                segments.splice(j,1); merged = true; break outer; }
        if (cl(aE, bE)) { segments[i] = A.concat(B.slice(0,-1).reverse());   segments.splice(j,1); merged = true; break outer; }
        if (cl(aS, bS)) { segments[i] = B.slice().reverse().concat(A.slice(1)); segments.splice(j,1); merged = true; break outer; }
        if (cl(aS, bE)) { segments[i] = B.concat(A.slice(1));                segments.splice(j,1); merged = true; break outer; }
      }
    }
  }
  return segments;
}

function measurePlotBlockHeight(block, fs, maxW){
  const xSpan = block.xRange[1] - block.xRange[0];
  const ySpan = block.yRange[1] - block.yRange[0];
  return Math.min(maxW * ySpan / xSpan, fs * (block.maxH || 16));
}

function drawPlotBlock(block, x, y, fs, maxW, items){
  const [xmin, xmax] = block.xRange;
  const [ymin, ymax] = block.yRange;
  const xSpan = xmax - xmin;
  const ySpan = ymax - ymin;
  const plotH = measurePlotBlockHeight(block, fs, maxW);
  // keepAspect: equal x/y scales, centred in the column (so ellipses are not stretched)
  const plotW = block.keepAspect ? Math.min(maxW, plotH * xSpan / ySpan) : maxW;
  x += (maxW - plotW) / 2;

  const toScreen = (mx, my) => [
    x + (mx - xmin) / xSpan * plotW,
    y + plotH - (my - ymin) / ySpan * plotH
  ];

  // y-axis (at x = 0)
  if (xmin < 0 && xmax > 0) {
    const [sx, syB] = toScreen(0, ymin);
    const [sx2, syT] = toScreen(0, ymax);
    items.push({ t: 'line', x1: sx, y1: syB, x2: sx2, y2: syT, w: 0.7 });
    items.push({ t: 'line', x1: sx - 2.5, y1: syT + 4, x2: sx, y2: syT, w: 0.6 });
    items.push({ t: 'line', x1: sx + 2.5, y1: syT + 4, x2: sx, y2: syT, w: 0.6 });
   items.push({ t: 'text', x: sx - 11, y: syT + 2, size: fs * 1.0, italic: true, s: 'y', noMerge: true });
  }
  // x-axis (at y = 0)
  if (ymin < 0 && ymax > 0) {
    const [sxL, sy] = toScreen(xmin, 0);
    const [sxR, sy2] = toScreen(xmax, 0);
    items.push({ t: 'line', x1: sxL, y1: sy, x2: sxR, y2: sy2, w: 0.7 });
    items.push({ t: 'line', x1: sxR - 4, y1: sy - 2.5, x2: sxR, y2: sy, w: 0.6 });
    items.push({ t: 'line', x1: sxR - 4, y1: sy + 2.5, x2: sxR, y2: sy, w: 0.6 });
    items.push({ t: 'text', x: sxR - 8, y: sy + 7, size: fs * 1.0, italic: true, s: 'x', noMerge: true });
  }

  // Curve as polyline segments
  // Curve as polyline segments — use pre-built polylines if the block
  // supplies them, otherwise fall back to the implicit tracer.
  let segs;
  if (block.polylines) {
    segs = block.polylines;
  } else {
    segs = traceImplicitCurve(block.curve, xmin, xmax, ymin, ymax, 250, 250);
  }
  for (const seg of segs) {
    items.push({ t: 'polyline', points: seg.map(([mx, my]) => toScreen(mx, my)), w: 1.0 });
  }

  // Annotations (P, Q, …)
  if (block.annotations) {
    for (const ann of block.annotations) {
      const [sx, sy] = toScreen(ann.x, ann.y);
      items.push({ t: 'text', x: sx + (ann.dx || 0), y: sy - 2,
                   size: fs * 1.0, italic: true, s: ann.label, noMerge: true });
    }
  }

  return plotH;
}

const DISABLED_KEY = 'a2-implicit-diff-disabled-v1';
const DEFAULT_DISABLED = [];

function loadDisabled(){
  try {
    const raw = localStorage.getItem(DISABLED_KEY);
    if (!raw) return new Set(DEFAULT_DISABLED);
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return new Set(DEFAULT_DISABLED);
    const known = new Set(TOPICS.map(t=>t.id));
    return new Set(arr.filter(id => known.has(id)));
  } catch(e) { return new Set(DEFAULT_DISABLED); }
}
function saveDisabled(s){ try { localStorage.setItem(DISABLED_KEY, JSON.stringify(Array.from(s))); } catch(e){} }

function activeTopics(){
  const off = loadDisabled();
  return TOPICS.filter(t => !off.has(t.id));
}

function strandOrder(topics){
  const byStrand = {};
  for (const t of shuffle(topics.slice())) (byStrand[t.strand]=byStrand[t.strand]||[]).push(t);
  const strands = Object.keys(byStrand).filter(s => byStrand[s].length > 0);
  const order = [];
  while (order.length < topics.length){
    for (const s of strands){
      if (byStrand[s].length > 0) order.push(byStrand[s].shift());
    }
  }
  return order;
}

function generateSheet(){
  const usedKeys = new Set();
  const usedTopics = new Set();
  const out = [];
  const order = strandOrder(activeTopics());
  for (const topic of order){
    if (usedTopics.has(topic.id)) continue;
    let cand = null;
    for (let t = 0; t < 20; t++){
      let c;
      try {
        c = topic.gen();
      } catch (err) {
        console.error('Generator failed: ' + topic.id, err);
        c = null;
        break;
      }
      if (c && !usedKeys.has(c.key) && c.blocks.length > 0){ cand = c; break; }
    }
    if (!cand) continue;

    cand.difficulty = topic.difficulty || 1;
    cand.topicId   = topic.id;      // <— add this line

    const trial = out.concat([cand]).sort((a, b) => a.difficulty - b.difficulty);
    const testPages = layoutSheet({ title:'Test', questions: trial, revealState: false });
    if (testPages.length > 2) continue;   // would spill onto page 3 — try a shorter topic
    out.push(cand);
    usedTopics.add(topic.id);
    usedKeys.add(cand.key);
    if (out.length >= 20) break;
  }

  out.sort((a, b) => a.difficulty - b.difficulty);

  if (out.length === 0){
    out.push(Q('fallback', [T('No questions could be generated. Try clicking "Generate New" or check the Topics panel.')],
      [{ text: 'N/A' }], null));
  }

  return out;
}

/* ============================================================
   HTML renderer (with KaTeX)
   ============================================================ */
function esc(s){
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
  return String(s).replace(/[&<>"]/g, function(c){ return map[c]; });
}
function renderMath(text) {
  if (!text.includes('$')) return esc(text);
  if (typeof katex === 'undefined') return esc(text);
  const parts = text.split(/(\$[^$]*\$)/);
  let html = '';
  for (let p of parts) {
    if (p.length >= 2 && p.startsWith('$') && p.endsWith('$')) {
      try {
        html += katex.renderToString(p.slice(1, -1), { throwOnError: false, displayMode: false });
      } catch(e) {
        html += esc(p);
      }
    } else {
      html += esc(p);
    }
  }
  return html;
}

/* Like renderMath, but **...** becomes bold (used for mark annotations in solutions). */
function renderRich(text){
  const parts = String(text).split(/(\$[^$]*\$)/);
  let html = '', bold = false;
  for (const p of parts){
    if (p.length >= 2 && p[0] === '$' && p[p.length-1] === '$'){ html += renderMath(p); continue; }
    const segs = p.split('**');
    for (let i = 0; i < segs.length; i++){
      if (i > 0){ html += bold ? '</strong>' : '<strong>'; bold = !bold; }
      html += esc(segs[i]);
    }
  }
  if (bold) html += '</strong>';
  return html;
}

function drawHTML(pagesItems){
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = '';
  for (const items of pagesItems){
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    const pg = document.createElement('div');
    pg.className = 'page';
    const parts = [];

    const grouped = [];
    let currentGroup = null;
    for (const it of items) {
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer') {
                if (currentGroup
    		&& currentGroup.t === it.t
    		&& Math.abs(currentGroup.y - it.y) < 1
    		&& !it.noMerge && !currentGroup.noMerge
   		&& currentGroup.size === it.size
    		&& JSON.stringify(currentGroup.color || null) === JSON.stringify(it.color || null)) {
  		currentGroup.s += it.s;
        } else {
          if (currentGroup) grouped.push(currentGroup);
          currentGroup = { t: it.t, x: it.x, y: it.y, size: it.size, s: it.s, color: it.color, noMerge: it.noMerge };
          }
      } else {
        if (currentGroup) { grouped.push(currentGroup); currentGroup = null; }
        grouped.push(it);
      }
    }
    if (currentGroup) grouped.push(currentGroup);

    for (const it of grouped){
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer'){
        const top = it.y - it.size * 0.755;
        const cls = it.t === 'answer' ? 'tx ans' : 'tx';
        let style = 'left:' + it.x.toFixed(2) + 'pt;top:' + top.toFixed(2) +
                    'pt;font-size:' + it.size.toFixed(2) + 'pt;';
        if (it.bold)   style += 'font-weight:700;';
        if (it.italic) style += 'font-style:italic;';
        if (it.color)  style += 'color:rgb(' + it.color[0] + ',' + it.color[1] + ',' + it.color[2] + ');';
        parts.push('<span class="' + cls + '" style="' + style + '">' + renderMath(it.s) + '</span>');
      } else if (it.t === 'line' || it.t === 'answer-line') {
        let color = it.grey ? '#94a3b8' : '#000';
        if (it.color) color = `rgb(${it.color[0]}, ${it.color[1]}, ${it.color[2]})`;
        const cls = it.t === 'answer-line' ? 'ans' : '';
        parts.push(
          '<svg class="' + cls + '" ' +
          'style="position:absolute;left:0;top:0;width:595.28pt;height:841.89pt;overflow:visible;pointer-events:none;" ' +
          'viewBox="0 0 595.28 841.89" xmlns="http://www.w3.org/2000/svg">' +
          '<line x1="'+it.x1.toFixed(2)+'" y1="'+it.y1.toFixed(2)+
          '" x2="'+it.x2.toFixed(2)+'" y2="'+it.y2.toFixed(2)+
          '" stroke="'+color+'" stroke-width="'+it.w.toFixed(2)+'"/></svg>');
            } else if (it.t === 'polyline') {
        const pts = it.points.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
        parts.push(
          '<svg style="position:absolute;left:0;top:0;width:595.28pt;height:841.89pt;overflow:visible;pointer-events:none;" ' +
          'viewBox="0 0 595.28 841.89" xmlns="http://www.w3.org/2000/svg">' +
          '<polyline points="' + pts + '" fill="none" stroke="#000" stroke-width="' + it.w.toFixed(2) + '"/></svg>');
      }
    }
    pg.innerHTML = parts.join('');
    wrap.appendChild(pg);
    pagesEl.appendChild(wrap);
  }
}

function fitPage(){
  const vp = document.getElementById('viewport');
  const pw = 210 * 96 / 25.4;
  const ph = 297 * 96 / 25.4;
  const avail = vp.clientWidth - 40;
  const z = Math.max(0.22, Math.min(1, avail / pw));
  document.querySelectorAll('.page-wrap').forEach(w => {
    w.style.width = (pw*z)+'px'; w.style.height = (ph*z)+'px';
  });
  document.querySelectorAll('.page').forEach(p => {
    p.style.transform = 'scale('+z+')';
  });

  downloadPDF(lastSheetPages, 'implicit-diff-'+safeFilename(sheetTitle())+'-'+seedInput.value+'.pdf');
});
document.getElementById('dlAnsBtn').addEventListener('click', () => {
  printAnswersHTML();
});
document.getElementById('printBtn').addEventListener('click', () => window.print());
seedInput.addEventListener('change', () => { applySeed(); regenerate(); setSeedInURL(seedInput.value); });
titleInput.addEventListener('input', renderSheet);
window.addEventListener('resize', fitPage);

/* Topics panel */
function buildTopicsPanel(){
  const body = document.getElementById('tpBody');
  body.innerHTML = '';
  const off = loadDisabled();
  const byStrand = {};
  for (const t of TOPICS) (byStrand[t.strand]=byStrand[t.strand]||[]).push(t);
  Object.keys(byStrand).sort().forEach(s => {
    const head = document.createElement('div');
    head.className = 'tp-strand';
    head.textContent = (STRAND_LABEL[s]||s) + ' ('+byStrand[s].length+')';
    body.appendChild(head);
    byStrand[s].forEach(t => {
      const row = document.createElement('label');
      row.className = 'tp-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !off.has(t.id);
      cb.addEventListener('change', () => {
        const cur = loadDisabled();
        if (cb.checked) cur.delete(t.id); else cur.add(t.id);
        saveDisabled(cur); refreshCount(); scheduleRegen();
      });
      const name = document.createElement('span');
      name.className = 'name'; name.textContent = t.id;
      row.appendChild(cb); row.appendChild(name); body.appendChild(row);
    });
  });
  refreshCount();
}
function refreshCount(){
  const off = loadDisabled();
  document.getElementById('tpCount').textContent =
    (TOPICS.length - off.size) + ' of ' + TOPICS.length + ' topics enabled';
}
let regenTimer = null;
function scheduleRegen(){ if (regenTimer) clearTimeout(regenTimer);
  regenTimer = setTimeout(regenerate, 120); }

function openTopicsPanel(){
  buildTopicsPanel();
  document.getElementById('topicsPanel').classList.add('open');
  document.getElementById('topicsPanel').setAttribute('aria-hidden','false');
  document.getElementById('backdrop').classList.add('open');
}
function closeTopicsPanel(){
  document.getElementById('topicsPanel').classList.remove('open');
  document.getElementById('topicsPanel').setAttribute('aria-hidden','true');
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('topicsBtn').addEventListener('click', openTopicsPanel);
document.getElementById('tpClose').addEventListener('click', closeTopicsPanel);
document.getElementById('backdrop').addEventListener('click', closeTopicsPanel);
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopicsPanel(); });
document.getElementById('tpAll').addEventListener('click', () => {
  saveDisabled(new Set()); buildTopicsPanel(); scheduleRegen();
});
document.getElementById('tpNone').addEventListener('click', () => {
  saveDisabled(new Set(TOPICS.map(t => t.id))); buildTopicsPanel(); scheduleRegen();
});
document.getElementById('tpReset').addEventListener('click', () => {
  try { localStorage.removeItem(DISABLED_KEY); } catch(e){}
  buildTopicsPanel(); scheduleRegen();
});

function printAnswersHTML(){
  if (!currentQuestions || currentQuestions.length === 0) return;

  /* Absolute URLs so KaTeX loads even when the parent page is file:// */
  const katexCssURL = new URL('katex/katex.min.css', document.baseURI).href;
  const katexJsURL  = new URL('katex/katex.min.js',  document.baseURI).href;

  const escHtml = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* Build one entry per question, with KaTeX-rendered answer + solution */
  let entriesHTML = '';
  for (let i = 0; i < currentQuestions.length; i++){
    const q = currentQuestions[i];
    const showSolution =
      SOLUTION_TOPICS.includes(q.topicId) &&
      Array.isArray(q.solution) && q.solution.length > 0;

    const answerHTML = (q.answers || []).map(a => renderRich(a.text)).join('&emsp;&emsp;');

    let entry = '<div class="qa-entry">';
    entry += '<span class="qa-num">' + (i+1) + '.</span>';
    entry += '<div class="qa-body">';
    if (answerHTML) entry += '<div class="qa-answer">' + answerHTML + '</div>';

    if (showSolution){
      entry += '<div class="qa-sol-label">Solution:</div>';
      for (const b of q.solution){
        if (b.type === 'text'){
          entry += '<div class="qa-sol-step">' + renderRich(b.text) + '</div>';
        }
      }
    }
    entry += '</div></div>';
    entriesHTML += entry;
  }

  const html = '<!DOCTYPE html>\n' +
    '<html lang="en">\n' +
    '<head>\n' +
    '<meta charset="utf-8">\n' +
    '<title>' + escHtml(sheetTitle()) + ' — Answers</title>\n' +
    '<link rel="stylesheet" href="' + katexCssURL + '">\n' +
    '<script defer src="' + katexJsURL + '"><\/script>\n' +
    '<style>\n' +
    '  @page { size: A4; margin: 15mm; }\n' +
    '  html, body { margin: 0; padding: 0; }\n' +
    '  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11pt; line-height: 1.55; color: #000; }\n' +
    '  h1 { font-size: 16pt; text-align: center; margin: 0 0 6mm 0; font-weight: 700; }\n' +
    '  .qa-entry { display: flex; gap: 6pt; margin-bottom: 10pt; page-break-inside: avoid; break-inside: avoid; }\n' +
    '  .qa-num { font-weight: 700; flex: 0 0 24pt; text-align: right; }\n' +
    '  .qa-body { flex: 1; min-width: 0; }\n' +
    '  .qa-answer { font-weight: 600; margin-bottom: 2pt; }\n' +
    '  .qa-sol-label { font-weight: 700; font-size: 0.92em; color: #444; margin-top: 4pt; }\n' +
    '  .qa-sol-step { margin: 1pt 0; }\n' +
    '  .katex { font-size: 1.03em; }\n' +
    '  @media screen {\n' +
    '    body { background: #eef2f7; }\n' +
    '    .print-bar { position: sticky; top: 0; z-index: 10; padding: 12px 16px; background: #0f172a; color: #fff; display: flex; justify-content: center; gap: 12px; }\n' +
    '    .print-bar button { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; }\n' +
    '    .print-bar button:hover { background: #1d4ed8; }\n' +
    '    .qa-container { max-width: 180mm; margin: 20px auto; background: #fff; padding: 15mm; box-shadow: 0 4px 20px rgba(15,23,42,.15); border-radius: 4px; }\n' +
    '  }\n' +
    '  @media print {\n' +
    '    .print-bar { display: none !important; }\n' +
    '    body { background: #fff; }\n' +
    '    .qa-container { max-width: none; margin: 0; padding: 0; box-shadow: none; border-radius: 0; }\n' +
    '  }\n' +
    '</style>\n' +
    '</head>\n' +
    '<body>\n' +
    '<div class="print-bar"><button onclick="window.print()">🖨️ Print / Save as PDF</button></div>\n' +
    '<div class="qa-container">\n' +
    '<h1>' + escHtml(sheetTitle()) + ' — Answers</h1>\n' +
    entriesHTML +
    '</div>\n' +
    '</body>\n' +
    '</html>';

  const w = window.open('', '_blank');
  if (!w){
    /* Popup blocked — fall back to a blob URL */
    const blob = new Blob([html], { type: 'text/html' });
    const url  = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* Boot */
function boot(){
  const urlSeed = getSeedFromURL();
  seedInput.value = (urlSeed !== null) ? urlSeed : Date.now() % 100000;
  applySeed();
  regenerate();
  setSeedInURL(seedInput.value);
  fitPage();
}
if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot, { once: true });

})();
</script>
