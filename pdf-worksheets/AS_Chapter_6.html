  :root{ --ink:#0f172a; --muted:#64748b; --accent:#2563eb; --accent-dark:#1d4ed8; --page-bg:#eef2f7; }

    font-size:14px;}t
  .tb-title{font-weight:800; font-size:15px; letter-spacing:.3px; white-space:nowrap}

<script>
(function(){
'use strict';

/* ============================================================
   RNG + helpers
   ============================================================ */
let rng = Math.random;
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
const pick = a => a[Math.floor(rng()*a.length)];
const ri   = (a,b) => a + Math.floor(rng()*(b-a+1));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1));
  const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b);
  while(b){ const t=a%b; a=b; b=t; } return a; }
const MINUS = '\u2212';
function nStr(x){ return x<0 ? MINUS + Math.abs(x) : String(x); }
function T(text){ return { type:'text', text: text }; }
function Q(key, blocks, answers, solution, opts){
  const q = { key, blocks, answers: answers||[], solution: solution||null };
  if (opts) for (const k in opts) if (opts[k]!==undefined) q[k]=opts[k];
  return q;
}

/* ============================================================
   Coordinate-geometry formatting helpers
   ============================================================ */
function ptStr(x, y){ return '(' + nStr(x) + ', ' + nStr(y) + ')'; }

function gradientFracStr(num, den){
  if (den < 0){ num = -num; den = -den; }
  if (num === 0) return '0';
  if (den === 1) return nStr(num);
  return (num < 0 ? MINUS : '') + '\\frac{' + Math.abs(num) + '}{' + den + '}';
}

function gradientStr(m){
  if (Number.isInteger(m)) return nStr(m);
  for (let q = 2; q <= 1000; q++){
    const p = m * q;
    if (Math.abs(p - Math.round(p)) < 1e-9){
      const rp = Math.round(p);
      const g = gcd(Math.abs(rp), q) || 1;
      return gradientFracStr(rp/g, q/g);
    }
  }
  return nStr(Math.round(m*100)/100);
}

function fracOrIntStr(x){
  if (Number.isInteger(x)) return nStr(x);
  for (let q = 2; q <= 1000; q++){
    const p = x * q;
    if (Math.abs(p - Math.round(p)) < 1e-9){
      const rp = Math.round(p);
      const g = gcd(Math.abs(rp), q) || 1;
      return gradientFracStr(rp/g, q/g);
    }
  }
  return nStr(Math.round(x*100)/100);
}

function lineEqStr(m, c){
  if (m === 0){
    return 'y = ' + fracOrIntStr(c);
  }
  let mStr = gradientStr(m);
  if (mStr === '1') mStr = '';
  else if (mStr === MINUS + '1') mStr = MINUS;
  
  let s = 'y = ' + mStr + 'x';
  if (c !== 0){
    const cStr = fracOrIntStr(Math.abs(c));
    s += (c > 0 ? ' + ' : ' ' + MINUS + ' ') + cStr;
  }
  return s;
}

function lineEqFracStr(num, den, c){
  if (den < 0){ num = -num; den = -den; }
  let mPart;
  if (den === 1){
    if (num === 1) mPart = 'x';
    else if (num === -1) mPart = MINUS + 'x';
    else mPart = nStr(num) + 'x';
  } else {
    if (num === 1) mPart = '\\frac{1}{' + den + '}x';
    else if (num === -1) mPart = MINUS + '\\frac{1}{' + den + '}x';
    else mPart = '\\frac{' + nStr(num) + '}{' + den + '}x';
  }
  let s = 'y = ' + mPart;
  if (c > 0) s += ' + ' + nStr(c);
  else if (c < 0) s += ' ' + MINUS + ' ' + Math.abs(c);
  return s;
}

function lineGeneralStr(a, b, c){
  let s = '';
  if (a !== 0){
    if (a === 1) s += 'x';
    else if (a === -1) s += MINUS + 'x';
    else s += nStr(a) + 'x';
  }
  if (b !== 0){
    if (s !== '') s += ' ';
    if (b === 1) s += '+ y';
    else if (b === -1) s += MINUS + ' y';
    else s += (b > 0 ? '+ ' : MINUS + ' ') + Math.abs(b) + 'y';
  }
  if (c !== 0){
    if (s !== '') s += ' ';
    s += (c > 0 ? '+ ' : MINUS + ' ') + Math.abs(c);
  }
  s += ' = 0';
  return s;
}

function lineStandardStr(a, b, c){
  let s = '';
  if (a !== 0){
    if (a === 1) s += 'x';
    else if (a === -1) s += MINUS + 'x';
    else s += nStr(a) + 'x';
  }
  if (b !== 0){
    if (s !== '') s += ' ';
    if (b === 1) s += '+ y';
    else if (b === -1) s += MINUS + ' y';
    else s += (b > 0 ? '+ ' : MINUS + ' ') + Math.abs(b) + 'y';
  }
  s += ' = ' + nStr(c);
  return s;
}

function ptFracStr(x, y){
  return '(' + fracOrIntStr(x) + ', ' + fracOrIntStr(y) + ')';
}

/* ============================================================
   Text measurement (Helvetica widths × 1000)
   ============================================================ */
const W_REG = [
  278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584
];
const W_BOLD = [
  278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  333,333,584,584,584,611,975,
  722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  333,278,333,584,556,333,
  556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
  389,280,389,584
];
function textWidth(str, size, bold){
  const t = bold ? W_BOLD : W_REG;
  let w=0;
  for (let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if (c===96) continue;
    if (c===0xE000){ w += t[0]*0.55; continue; }
    w += (c>=32 && c<=126) ? t[c-32] : 556;
  }
  return w * size / 1000;
}

/* ============================================================
   Run parsing + emission
   ============================================================ */
function parseRuns(text){
  const runs=[]; let i=0;
  while(i<text.length){
    const tick = text.indexOf('`', i);
    const frac = text.indexOf('\\frac{', i);
    const sqrt = text.indexOf('\\sqrt{', i);
    const dollar = text.indexOf('$', i);

    let next = -1, kind = null;
    if (dollar !== -1 && (next===-1 || dollar<next)) { next=dollar; kind='math'; }
    if (tick !== -1 && (next===-1 || tick<next)) { next=tick; kind='tick'; }
    if (frac !== -1 && (next===-1 || frac<next)) { next=frac; kind='frac'; }
    if (sqrt !== -1 && (next===-1 || sqrt<next)) { next=sqrt; kind='sqrt'; }

    if (next === -1){ if (i<text.length) runs.push({kind:'text',text:text.slice(i),italic:false}); break; }
    if (next > i) runs.push({kind:'text', text:text.slice(i,next), italic:false});

    if (kind==='math'){
      const close = text.indexOf('$', next+1);
      if (close !== -1) {
        let inner = text.slice(next+1, close);
        inner = inner.replace(/\u2212/g, '-');
        runs.push({kind:'math', text: '$'+inner+'$', inner: inner});
        i = close+1;
      } else {
        runs.push({kind:'text', text: text.slice(next), italic:false});
        break;
      }
    } else if (kind==='tick'){
      const close = text.indexOf('`', next+1);
      if (close===-1){ runs.push({kind:'text',text:text.slice(next),italic:false}); break; }
      runs.push({kind:'text', text:text.slice(next+1,close), italic:true});
      i = close+1;
    } else if (kind==='sqrt'){
      const open = text.indexOf('{', next);
      let close = open + 1, depth = 1;
      while (close < text.length && depth > 0) {
          if (text[close] === '{') depth++;
          else if (text[close] === '}') depth--;
          close++;
      }
      runs.push({kind:'sqrt', inner: text.slice(open+1, close-1)});
      i = close;
    } else {
      const o1=text.indexOf('{',next); const c1=o1===-1?-1:text.indexOf('}',o1);
      const o2=c1===-1?-1:text.indexOf('{',c1); const c2=o2===-1?-1:text.indexOf('}',o2);
      if (o1===-1||c1===-1||o2===-1||c2===-1){
        runs.push({kind:'text',text:text.slice(next),italic:false}); break;
      }
      runs.push({kind:'frac', num:text.slice(o1+1,c1), den:text.slice(o2+1,c2)});
      i = c2+1;
    }
  }
  const merged=[];
  for (const r of runs){
    const last = merged[merged.length-1];
    if (r.kind==='text' && last && last.kind==='text' && last.italic===r.italic){
      last.text += r.text;
    } else merged.push(r);
  }
  return merged.filter(r => r.kind!=='text' || r.text.length>0);
}

function textToTokens(text){
  const runs = parseRuns(text);
  const tokens=[]; let pendingSpace=false;
  for (const r of runs){
    if (r.kind==='math'){ tokens.push({kind:'math', text:r.text, inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='frac'){ tokens.push({kind:'frac', num:r.num, den:r.den, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='sqrt'){ tokens.push({kind:'sqrt', inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    const parts = r.text.split(/(\s+)/);
    for (const p of parts){
      if (p==='') continue;
      if (/^\s+$/.test(p)){ pendingSpace=true; continue; }
      tokens.push({kind:'word', word:p, italic:r.italic, space:pendingSpace});
      pendingSpace=false;
    }
  }
  return tokens;
}

function approxMathWidth(inner, size, bold){
  let approx = inner
    .replace(/\\[a-zA-Z]+/g, 'xxxx')
    .replace(/[\{\}]/g, '')
    .replace(/\s+/g, '');
  let baseW = textWidth(approx, size, bold);
  let supCount = (inner.match(/\^|_/g) || []).length;
  let opCount = (inner.match(/[+\-=<>]/g) || []).length;
  return Math.max(25, baseW * 1.3 + supCount * size * 0.3 + opCount * size * 0.3 + 20);
}

function tokenWidth(tok, size, bold){
  if (tok.kind==='math') return approxMathWidth(tok.inner, size, bold);
  if (tok.kind==='frac'){
    const sub=size*0.7;
    const nw=textWidth(tok.num,sub,bold);
    const dw=textWidth(tok.den,sub,bold);
    return Math.max(nw,dw)+0.20*size;
  }
  if (tok.kind==='sqrt') return textWidth(tok.inner, size, bold) + 0.4*size;
  return textWidth(tok.word,size,bold);
}

function wrapTokens(tokens, size, bold, maxW){
  const lines=[]; let cur=[]; let curW=0;
  for (const tok of tokens){
    const spaceW = (tok.space && cur.length) ? textWidth(' ',size,bold) : 0;
    const w = spaceW + tokenWidth(tok,size,bold);
    if (cur.length && curW + w > maxW){
      lines.push(cur);
      cur = [{ kind:tok.kind, num:tok.num, den:tok.den, inner:tok.inner,
               text:tok.text, word:tok.word, italic:tok.italic, space:false }];
      curW = tokenWidth(tok,size,bold);
    } else { cur.push(tok); curW += w; }
  }
  if (cur.length) lines.push(cur);
  return lines;
}

function lineToRuns(lineTokens){
  const runs=[];
  for (let i=0;i<lineTokens.length;i++){
    const tok = lineTokens[i];
    const prefix = (i===0) ? '' : (tok.space ? ' ' : '');
    if (tok.kind==='math') runs.push({kind:'math', text:tok.text, inner:tok.inner, prefix});
    else if (tok.kind==='frac') runs.push({kind:'frac', num:tok.num, den:tok.den, prefix});
    else if (tok.kind==='sqrt') runs.push({kind:'sqrt', inner:tok.inner, prefix});
    else {
      const last = runs[runs.length-1];
      if (last && last.kind==='text' && last.italic===tok.italic) last.text += prefix + tok.word;
      else runs.push({kind:'text', text:prefix + tok.word, italic:tok.italic});
    }
  }
  return runs;
}

function emitRuns(runs, x0, y, size, items, variant){
  let textType, barType;
  if (variant==='answer'){ textType='answer'; barType='answer-line'; }
  else { textType='run'; barType='line'; }
  let rx = x0;
  for (let i = 0; i < runs.length; i++){
    const run = runs[i];
    let prefix = '';
    if (i > 0 && run.prefix) {
      prefix = ' ';
      rx += textWidth(' ', size, false);
    }
    
    if (run.kind==='math'){
      items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix + run.text });
      rx += approxMathWidth(run.inner, size, false);
    } else if (run.kind==='frac'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const sub = size*0.7;
      const nw = textWidth(run.num, sub, false);
      const dw = textWidth(run.den, sub, false);
      const innerW = Math.max(nw, dw);
      const totalW = innerW + 0.20*size;
      const barW = innerW + 0.08*size;
      items.push({ t: textType, x: rx + (totalW-nw)/2, y: y - 0.32*size,
        size: sub, bold:false, italic:false, s: run.num });
      items.push({ t: barType,
        x1: rx + (totalW-barW)/2, y1: y - 0.12*size,
        x2: rx + (totalW+barW)/2, y2: y - 0.12*size, w: 0.5 });
      items.push({ t: textType, x: rx + (totalW-dw)/2, y: y + 0.44*size,
        size: sub, bold:false, italic:false, s: run.den });
      rx += totalW;
    } else if (run.kind==='sqrt'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const innerW = textWidth(run.inner, size, false);
      const totalW = innerW + size * 0.4;
      items.push({ t: barType, x1: rx, y1: y, x2: rx + size*0.15, y2: y - size*0.5, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.15, y1: y - size*0.5, x2: rx + size*0.3, y2: y + size*0.1, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.3, y1: y + size*0.1, x2: rx + totalW, y2: y + size*0.1, w: 0.7 });
      items.push({ t: textType, x: rx + size*0.35, y: y, size: size, bold: false, italic: false, s: run.inner });
      rx += totalW;
    } else {
      items.push({ t: textType, x: rx, y, size, bold:false, italic:run.italic, s: prefix + run.text });
      rx += textWidth(run.text, size, false);
    }
  }
  return rx;
}

/* ============================================================
   LAYOUT — question layout
   ============================================================ */
const PW = 595.276, PH = 841.890, MG = 42.52, FIXED_FS = 11;
const HEADER_H = 19*0.78 + 19*0.32 + 6 + 17 + 10.5*0.78 + 26;
const CONT_HEADER_H = 9*1.4 + 8 + 14;
const QUESTION_GAP = 14;

function columnRuleX(){ return MG + (PW - 2*MG) * 0.60; }
function promptWidth(fs){ return columnRuleX() - (MG + fs*1.6) - 10; }

function drawQuestionBlocks(blocks, x, y, fs, maxW, items, baselines){
  const lineH = fs*1.42;
  let cursor = y;
  for (const block of blocks){
    if (baselines) baselines.push(cursor);
    if (block.type === 'text'){
      const lines = wrapTokens(textToTokens(block.text), fs, false, maxW);
      for (let j=0;j<lines.length;j++)
        emitRuns(lineToRuns(lines[j]), x, cursor + j*lineH, fs, items, 'normal');
      cursor += lines.length * lineH;
    }
  }
  return cursor;
}

function drawQuestion(q, index, fs, qTop, items, revealState){
  const lineH = fs*1.42;
  const numColW = fs*1.6;
  const textX = MG + numColW;
  const ruleX = columnRuleX();
  const maxW = ruleX - textX - 10; 

  let contentY = qTop + fs*0.78;

  if (q.difficulty >= 4) {
    const badgeText = 'CHALLENGING';
    const badgeFs = fs * 0.55; 
    const badgeW = textWidth(badgeText, badgeFs, true) + 8;
    const boxH = fs * 1.1;
    const badgeX = ruleX - badgeW - 2; 
    const badgeY = qTop - 6; 

    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX+badgeW, y2:badgeY, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY+boxH, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX+badgeW, y1:badgeY, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'text', x: badgeX + 4, y: badgeY + boxH*0.72, size: badgeFs, bold: true, s: badgeText});

    contentY += fs * 1.1 + 4; 
  }

  items.push({t:'text', x:MG, y:contentY, size:fs, bold:true, s:(index+1)+'.'});
  drawQuestionBlocks(q.blocks, textX, contentY, fs, maxW, items, null);

  const qH = measureQuestion(q, fs);
  items.push({t:'line', x1:ruleX, y1:qTop+2, x2:ruleX, y2:qTop+qH-2, w:0.4, grey:true});

  /* WS badge — small red marker for questions with a worked solution */
  if (SOLUTION_TOPICS.includes(q.topicId)) {
    items.push({
      t: 'text',
      x: MG,
      y: qTop + qH - 3,
      size: 5,
      bold: true,
      s: 'WS',
      color: [200, 30, 30]
    });
  }

  if (revealState && q.answers && q.answers.length) {
      const rightX = ruleX + 8;
      const rightW = PW - MG - rightX - 4;
      const ansStr = q.answers.map(a => a.text).join('   ');
      const lines = wrapTokens(textToTokens(ansStr), fs, false, rightW);
      for (let j=0; j<lines.length; j++) {
          emitRuns(lineToRuns(lines[j]), rightX, contentY + j*lineH, fs, items, 'answer');
      }
  }
  return qTop + qH;
}
function measureQuestion(q, fs){
  const maxW = promptWidth(fs);
  const lineH = fs*1.42;
  let h = 0;
  if (q.difficulty >= 4) {
    h += fs * 1.1 + 8;
  }
  for (const b of q.blocks){
    if (b.type === 'text'){
      const lines = wrapTokens(textToTokens(b.text), fs, false, maxW);
      h += lines.length * lineH;
    }
  }
  return h;
}

function drawHeader(items, title){
  const innerW = PW - 2*MG;
  const ts = 19;
  const tw = textWidth(title, ts, true);
  let bl = MG + ts*0.78;
  items.push({t:'text', x: MG + Math.max(0, (innerW-tw)/2), y: bl, size: ts, bold: true, s: title});
  let top = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:top, x2:PW-MG, y2:top, w:1.1});
  top += 17;
  const ns = 10.5;
  bl = top + ns*0.78;
  items.push({t:'text', x:MG, y:bl, size:ns, bold:false, s:'Name:'});
  const nlw = textWidth('Name:', ns, false);
  items.push({t:'line', x1:MG+nlw+6, y1:bl+2.2, x2:MG+innerW*0.46, y2:bl+2.2, w:0.6});
  items.push({t:'text', x:MG+innerW*0.60, y:bl, size:ns, bold:false, s:'Date:'});
  const dlw = textWidth('Date:', ns, false);
  items.push({t:'line', x1:MG+innerW*0.60+dlw+6, y1:bl+2.2, x2:PW-MG, y2:bl+2.2, w:0.6});
}
function drawContinuationHeader(items, title){
  items.push({t:'text', x:MG, y:MG+9*0.78, size:9, bold:false, s:title+' (continued)'});
  const ruleY = MG + 9*1.4 + 8;
  items.push({t:'line', x1:MG, y1:ruleY, x2:PW-MG, y2:ruleY, w:0.4, grey:true});
}

function layoutSheet(opts){
  const title = opts.title, questions = opts.questions, revealState = opts.revealState;
  const fs = FIXED_FS;
  const pages = []; let items = []; let y = MG;
  drawHeader(items, title);
  y = MG + HEADER_H;
  let onPage = 0;
  for (let i = 0; i < questions.length; i++){
    const q = questions[i];
    const qH = measureQuestion(q, fs);
    if (onPage > 0 && y + qH > PH - MG){
      pages.push(items); items = []; y = MG + CONT_HEADER_H;
      drawContinuationHeader(items, title); onPage = 0;
    }
    if (onPage > 0){
      items.push({t:'line', x1:MG, y1:y-7, x2:PW-MG, y2:y-7, w:0.4, grey:true});
    }
    drawQuestion(q, i, fs, y, items, revealState);
    y += qH + QUESTION_GAP;
    onPage++;
  }
  if (items.length) pages.push(items);
  if (pages.length > 1){
    for (let i = 0; i < pages.length; i++){
      const s = 'Page ' + (i+1) + ' of ' + pages.length;
      const w = textWidth(s, 8, false);
      pages[i].push({t:'text', x:PW-MG-w, y:PH-MG+12, size:8, bold:false, s:s});
    }
  }
  return pages;
}

function layoutCompactAnswers(opts){
  const title = opts.title, questions = opts.questions, seed = opts.seed;
  const pages = [];
  let items = [];
  const innerW = PW - 2*MG;
  const fs = 11;
  const lineH = fs * 1.42;

  /* ---------- header ---------- */
  const ts = 17;
  const heading = title + ' — Answers';
  const tw = textWidth(heading, ts, true);
  let bl = MG + ts*0.78;
  items.push({t:'text', x:MG + Math.max(0,(innerW-tw)/2), y:bl, size:ts, bold:true, s:heading});
  const ruleY = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:ruleY, x2:PW-MG, y2:ruleY, w:1.1});
  let y = ruleY + 22;

  /* ---------- one entry per question ---------- */
  for (let i = 0; i < questions.length; i++){
    const q = questions[i];
    const showSolution =
      SOLUTION_TOPICS.includes(q.topicId) &&
      Array.isArray(q.solution) && q.solution.length > 0;

    /* measure ------------------------------------------------------ */
    const ansJoined = (q.answers||[]).map(a => a.text).join('   ');
    const ansLines  = wrapTokens(textToTokens(ansJoined), fs, false, innerW - 25);
    let entryH = ansLines.length * lineH;

    const solLineSets = [];
    if (showSolution){
      entryH += 4 + lineH;                          // gap + "Solution:" label
      for (const b of q.solution){
        if (b.type === 'text'){
          const lines = wrapTokens(textToTokens(b.text), fs, false, innerW - 25);
          solLineSets.push(lines);
          entryH += lines.length * lineH;
        }
      }
    }
    entryH += 12;                                   // gap after the entry

    /* page break --------------------------------------------------- */
    if (y + entryH > PH - MG - 18 && y > MG + 80){
      pages.push(items);
      items = [];
      items.push({t:'text', x:MG, y:MG+9*0.78, size:9, bold:false, s:heading + ' (continued)'});
      const chY = MG + 9*1.4 + 8;
      items.push({t:'line', x1:MG, y1:chY, x2:PW-MG, y2:chY, w:0.4, grey:true});
      y = chY + 18;
    }

    /* number + answer --------------------------------------------- */
    items.push({t:'text', x:MG, y:y + fs*0.78, size:fs, bold:true, s:(i+1) + '.'});
    for (let j = 0; j < ansLines.length; j++){
      emitRuns(lineToRuns(ansLines[j]), MG+20, y + fs*0.78 + j*lineH, fs, items, 'normal');
    }
    y += ansLines.length * lineH;

    /* worked solution --------------------------------------------- */
    if (showSolution){
      y += 4;
      items.push({t:'text', x:MG+20, y:y + fs*0.78, size:fs*0.9, bold:true, s:'Solution:'});
      y += lineH;
      for (const lines of solLineSets){
        for (const line of lines){
          emitRuns(lineToRuns(line), MG+20, y + fs*0.78, fs, items, 'normal');
          y += lineH;
        }
      }
    }
    y += 12;
  }

  if (items.length) pages.push(items);

  /* ---------- footers ---------- */
  if (pages.length > 0){
    for (let i = 0; i < pages.length; i++){
      const s = 'Page ' + (i+1) + ' of ' + pages.length;
      const w = textWidth(s, 8, false);
      pages[i].push({t:'text', x:PW-MG-w, y:PH-MG+12, size:8, bold:false, s:s});
    }
    const note = 'Seed: ' + seed;
    const noteSize = 8.5;
    const noteW = textWidth(note, noteSize, false);
    pages[pages.length-1].push({t:'text', x:PW-MG-noteW, y:PH-MG+22, size:noteSize, bold:false, s:note});
  }

  return pages;
}

   PDF writer
   ============================================================ */
const WINANSI = {
  0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84,
  0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88,
  0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C,
  0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93,
  0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
  0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B,
  0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F
};
function cleanLatexForPdf(text){
  if (!text.includes('$')) return text;
  return text.replace(/\$([^$]*)\$/g, function(match, inner) {
    let s = inner;
    let prev;

    /* Strip \left / \right prefixes, keeping the delimiter */
    s = s.replace(/\\left\s*\(/g, '(');
    s = s.replace(/\\right\s*\)/g, ')');
    s = s.replace(/\\left\s*\[/g, '[');
    s = s.replace(/\\right\s*\]/g, ']');
    s = s.replace(/\\left\s*\|/g, '|');
    s = s.replace(/\\right\s*\|/g, '|');
    s = s.replace(/\\left\s*\\\{/g, '{');
    s = s.replace(/\\right\s*\\\}/g, '}');
    s = s.replace(/\\left\./g, '');
    s = s.replace(/\\right\./g, '');

    /* \frac and \sqrt — repeat so nested braces resolve */
    do {
      prev = s;
      s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
    } while (s !== prev);
    do {
      prev = s;
      s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√($1)');
    } while (s !== prev);

    /* Greek letters (WinAnsi has no Greek; spell them out) */
    s = s.replace(/\\theta/g, 'theta');
    s = s.replace(/\\alpha/g, 'alpha');
    s = s.replace(/\\beta/g,  'beta');
    s = s.replace(/\\pi/g,    'pi');
    s = s.replace(/\\Delta/g, 'Delta');

    /* Symbols */
    s = s.replace(/\\pm/g, '±');
    s = s.replace(/\\cdot/g, '·');
    s = s.replace(/\\div/g, '÷');
    s = s.replace(/\\times/g, '×');
    s = s.replace(/\\le/g, '≤').replace(/\\ge/g, '≥');
    s = s.replace(/\\ne/g, '≠');
    s = s.replace(/\\Rightarrow/g, '=>');
    s = s.replace(/\\rightarrow/g, '->');
    s = s.replace(/\\circ/g, '°');
    s = s.replace(/\\infty/g, '∞');

    /* Functions — \log_2 BEFORE \log */
    s = s.replace(/\\log_2/g, 'log_2');
    s = s.replace(/\\log/g, 'log');
    s = s.replace(/\\ln/g, 'ln');
    s = s.replace(/\\cos/g, 'cos');
    s = s.replace(/\\sin/g, 'sin');
    s = s.replace(/\\tan/g, 'tan');

    /* Powers */
    s = s.replace(/\^2/g, '²');
    s = s.replace(/\^3/g, '³');

    /* \text{...} — repeat for nesting */
    do {
      prev = s;
      s = s.replace(/\\text\{([^{}]*)\}/g, '$1');
    } while (s !== prev);

    s = s.replace(/\u2212/g, '-');
    return s;
  });
}function pdfEsc(s){
  s = cleanLatexForPdf(s);
  let out='';
  for (let i=0;i<s.length;i++){
    const ch = s[i]; const code = ch.charCodeAt(0);
    if (ch==='\\') out += '\\\\';
    else if (ch==='(') out += '\\(';
    else if (ch===')') out += '\\)';
    else if (code >= 32 && code <= 126) out += ch;
    else if (code >= 0xA0 && code <= 0xFF) out += '\\' + code.toString(8).padStart(3,'0');
    else if (WINANSI[code] !== undefined) out += '\\' + WINANSI[code].toString(8).padStart(3,'0');
    else out += '?';
  }
  return out;
}
function pdfStrokeColourOp(it){
  if (it.color) {
      return (it.color[0]/255).toFixed(3) + ' ' + (it.color[1]/255).toFixed(3) + ' ' + (it.color[2]/255).toFixed(3) + ' RG';
  }
  return (it.grey ? '0.58' : '0') + ' G';
}
function contentStream(items){
  const ops=[];
  for (const it of items){
    if (it.t === 'text' || it.t === 'run'){
      let font = 'F1';
      if (it.bold && it.italic) font='F4';
      else if (it.bold) font='F2';
      else if (it.italic) font='F3';
      if (it.color) {
        const r = (it.color[0]/255).toFixed(3);
        const g = (it.color[1]/255).toFixed(3);
        const b = (it.color[2]/255).toFixed(3);
        ops.push(r + ' ' + g + ' ' + b + ' rg');
      } else {
        ops.push('0 g');
      }
      ops.push('BT /' + font + ' ' + it.size.toFixed(2) + ' Tf ' +
        it.x.toFixed(2) + ' ' + (PH-it.y).toFixed(2) + ' Td (' + pdfEsc(it.s) + ') Tj ET');
    } else if (it.t === 'line'){
      ops.push(pdfStrokeColourOp(it) + ' ' + it.w.toFixed(2) + ' w ' +
        it.x1.toFixed(2) + ' ' + (PH-it.y1).toFixed(2) + ' m ' +
        it.x2.toFixed(2) + ' ' + (PH-it.y2).toFixed(2) + ' l S');
    }
  }
  return ops.join('\n');
}
function assemblePDF(pagesItems){
  const N = pagesItems.length;
  const maxObj = 6 + 2*N;
  const objects = []; const kidRefs = [];
  for (let i = 0; i < N; i++) kidRefs.push((8 + 2*i) + ' 0 R');
  objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objects[2] = '<< /Type /Pages /Kids [' + kidRefs.join(' ') + '] /Count ' + N + ' >>';
  objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objects[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
  objects[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>';
  for (let i = 0; i < N; i++){
    const stream = contentStream(pagesItems[i]);
    const streamObj = 7 + 2*i;
    const pageObj = 8 + 2*i;
    objects[streamObj] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
    objects[pageObj] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ' +
      '/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> ' +
      '/Contents ' + streamObj + ' 0 R >>';
  }
  let out = '%PDF-1.4\n';
  const offsets = [];
  for (let i = 1; i <= maxObj; i++){ offsets[i] = out.length;
    out += i + ' 0 obj\n' + objects[i] + '\nendobj\n'; }
  const xrefPos = out.length;
  out += 'xref\n0 ' + (maxObj+1) + '\n0000000000 65535 f \n';
  for (let i = 1; i <= maxObj; i++)
    out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + (maxObj+1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n';
  return out;
}
function downloadPDF(pagesItems, filename){
  const pdfStr = assemblePDF(pagesItems);
  const bytes = new Uint8Array(pdfStr.length);
  for (let i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* -------- S1: Distance, midpoint, gradient -------- */

const tDistance = {
  id: 'dist-basic', strand: 'S1', difficulty: 1,
  gen(){
    const x1 = ri(-6, 6), y1 = ri(-6, 6);
    let x2, y2;
    do { x2 = ri(-6, 6); y2 = ri(-6, 6); }
    while (x1 === x2 && y1 === y2);
    const dx = x2 - x1, dy = y2 - y1;
    const sq = dx * dx + dy * dy;
    const root = Math.sqrt(sq);
    const exact = Number.isInteger(root) ? String(root) : '\\sqrt{' + sq + '}';
    return Q('dist|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('The points $A$ and $B$ have coordinates $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$ respectively.'),
        T('Find the exact length of $AB$.') ],
      [{ text: '$AB = ' + exact + '$' }],
      [ T('$AB = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$'),
        T('$= \\sqrt{(' + x2 + ' - ' + x1 + ')^2 + (' + y2 + ' - ' + y1 + ')^2} = ' + exact + '$.') ]);
  }
};

const tMidpoint = {
  id: 'mid-basic', strand: 'S1', difficulty: 1,
  gen(){
    const x1 = ri(-6, 6), y1 = ri(-6, 6);
    let x2, y2;
    do { x2 = ri(-6, 6); y2 = ri(-6, 6); }
    while (x1 === x2 && y1 === y2);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const mxStr = Number.isInteger(mx) ? nStr(mx) : mx.toFixed(1);
    const myStr = Number.isInteger(my) ? nStr(my) : my.toFixed(1);
    return Q('mid|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('Find the coordinates of the midpoint of the line segment joining $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$.') ],
      [{ text: '$(' + mxStr + ', ' + myStr + ')$' }],
      [ T('Midpoint $= \\left(\\frac{x_1 + x_2}{2}, \\frac{y_1 + y_2}{2}\\right)$'),
        T('$= \\left(\\frac{' + x1 + ' + ' + x2 + '}{2}, \\frac{' + y1 + ' + ' + y2 + '}{2}\\right) = (' + mxStr + ', ' + myStr + ')$.') ]);
  }
};

const tGradient = {
  id: 'grad-basic', strand: 'S1', difficulty: 1,
  gen(){
    let x1, y1, x2, y2;
    do {
      x1 = ri(-6, 6); y1 = ri(-6, 6); x2 = ri(-6, 6); y2 = ri(-6, 6);
    } while (x1 === x2 || y1 === y2);
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }
    const mStr = gradientFracStr(num, den);
    return Q('grad|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('Find the gradient of the line passing through $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$.') ],
      [{ text: '$m = ' + mStr + '$' }],
      [ T('$m = \\frac{y_2 - y_1}{x_2 - x_1} = \\frac{' + y2 + ' - ' + y1 + '}{' + x2 + ' - ' + x1 + '} = ' + mStr + '$.') ]);
  }
};

/* -------- S2: Equation of a straight line -------- */

const tLinePointGrad = {
  id: 'line-pt-grad', strand: 'S2', difficulty: 1,
  gen(){
    const m = pick([-3, -2, -1, 1, 2, 3, 0.5, -0.5]);
    const x1 = ri(-4, 4), y1 = ri(-4, 4);
    const c = y1 - m * x1;
    const eq = lineEqStr(m, c);
    const mStr = gradientStr(m);
    return Q('lpg|' + m + '|' + x1 + '|' + y1,
      [ T('Find the equation of the straight line with gradient $' + mStr + '$ that passes through $' + ptStr(x1, y1) + '$.'),
        T('Give your answer in the form $y = mx + c$.') ],
      [{ text: '$' + eq + '$' }],
      [ T('Use the point-slope form $y - y_1 = m(x - x_1)$, where $m = ' + mStr + '$ is the gradient and $(x_1, y_1) = ' + ptStr(x1, y1) + '$ is the given point:'),
        T('$y - (' + nStr(y1) + ') = ' + mStr + '(x - (' + nStr(x1) + '))$'),

  }
};

const tLineTwoPoints = {
  id: 'line-two-points', strand: 'S2', difficulty: 2,
  gen(){
    const mChoices = [

const tLineMultiPartParam = {
  id: 'line-multipart-param', strand: 'S2', difficulty: 2,
  gen(){
    let A, B;
    do {
      A = ri(1, 6);
      B = ri(1, 6);
    } while (gcd(A, B) !== 1);
    
    let D, E;
    do {
      D = ri(1, 6);
      E = ri(1, 6);
    } while (gcd(D, E) !== 1 || A * E === B * D);
    
    const xB = ri(-5, 5);
    const yB = ri(-5, 5);
    if (A*xB + B*yB === 0) return tLineMultiPartParam.gen();
    
    const C = -(A * xB + B * yB);
    const F = -(D * xB + E * yB);
    
    if (pick([true, false])) { A = -A; B = -B; C = -C; }
    if (A < 0) { A = -A; B = -B; C = -C; }
    if (D < 0) { D = -D; E = -E; F = -F; }

    const eq1 = lineGeneralStr(A, B, C);
    const eq2 = lineGeneralStr(D, E, F);

    const gradient1 = -A / B;
    const ansA = gradientStr(gradient1);

    const kval = pick([-3, -2, -1, 1, 2, 3]);
    const p = pick([-4, -3, -2, -1, 1, 2, 3, 4]);
    const r = pick([-4, -3, -2, -1, 1, 2, 3, 4]);
    const q = xB + B * kval - p * kval;
    const s = yB - A * kval - r * kval;

    function formatLinear(kCoeff, constTerm, varName) {
      let str = '';
      if (kCoeff === 1) str += varName;
      else if (kCoeff === -1) str += MINUS + varName;
      else str += nStr(kCoeff) + varName;
      if (constTerm > 0) str += ' + ' + constTerm;
      else if (constTerm < 0) str += ' ' + MINUS + ' ' + Math.abs(constTerm);
      return str;
    }
    const xExpr = formatLinear(p, q, 'k');
    const yExpr = formatLinear(r, s, 'k');
    const ptStr = '(' + xExpr + ', ' + yExpr + ')';

    // Numerical coefficient of $k$ and constant term when substituting the
    // parametric point into the line equation — used in the worked solution.
    const kCoef   = A * p + B * r;
    const kConst  = A * q + B * s + C;

    return Q('lmp|' + A + '|' + B + '|' + C + '|' + D + '|' + E + '|' + F + '|' + p + '|' + q + '|' + r + '|' + s,
      [ T('The line $AB$ has equation $' + eq1 + '$.'),
        T('(a) The line $AB$ is parallel to the line with equation $y = mx + 7$.'),
        T('Find the value of $m$.'),
        T('(b) The line $AB$ intersects the line with equation $' + eq2 + '$ at the point $B$.'),
        T('Find the coordinates of $B$.'),
        T('(c) The point with coordinates $' + ptStr + '$ lies on the line $AB$.'),
        T('Find the value of $k$.') ],
      [{ text: '(a) $m = ' + ansA + '$  (b) $' + ptStr(xB, yB) + '$  (c) $k = ' + kval + '$' }],
      [ T('(a) Parallel lines have the same gradient. Rearranging $' + eq1 + '$ into the form $y = mx + c$ gives:'),
        T('$' + lineEqStr(gradient1, -C / B) + '$.'),
        T('Comparing with $y = mx + c$, we read off $m = ' + ansA + '$.'),
        T('(b) The line $AB$ and the second line intersect where they are simultaneously satisfied, so we solve:'),
        T('$' + eq1 + '$ and $' + eq2 + '$.'),
        T('Eliminating one variable and back-substituting gives the point of intersection $B' + ptStr(xB, yB) + '$.'),
        T('(c) Substitute $x = ' + xExpr + '$ and $y = ' + yExpr + '$ into $' + eq1 + '$:'),
        T('$' + A + '(' + xExpr + ') + ' + B + '(' + yExpr + ') + ' + C + ' = 0$.'),
        T('Expanding and collecting the terms in $k$:'),
        T('$' + nStr(kCoef) + 'k ' + (kConst >= 0 ? '+ ' + kConst : MINUS + ' ' + Math.abs(kConst)) + ' = 0$.'),
        T('So $k = ' + kval + '$.') ]);
  }
};

const tLineGradientPerpIntersection = {
  id: 'line-grad-perp-intersect', strand: 'S2', difficulty: 2,
  gen(){
    let a1, b1, a2, b2;
    do {
      a1 = ri(1, 6) * pick([1, -1]);
      b1 = ri(1, 6) * pick([1, -1]);
    } while (a1 === 0 || b1 === 0 || gcd(Math.abs(a1), Math.abs(b1)) !== 1);
    do {
      a2 = ri(1, 6) * pick([1, -1]);
      b2 = ri(1, 6) * pick([1, -1]);
    } while (a2 === 0 || b2 === 0 || gcd(Math.abs(a2), Math.abs(b2)) !== 1 || a1 * b2 === a2 * b1);

    const xA = ri(-5, 5), yA = ri(-5, 5);
    const c1 = -(a1 * xA + b1 * yA);
    const c2 = -(a2 * xA + b2 * yA);

    // Match image style: ax + by = c
    const eq1 = lineStandardStr(a1, b1, -c1);
    const eq2 = lineStandardStr(a2, b2, -c2);

    // Part (a)
    const mAB = -a1 / b1;
    const mABStr = gradientStr(mAB);

    // Part (b)
    let x0, y0;
    do {
      x0 = ri(-5, 5); y0 = ri(-5, 5);
    } while ((x0 === xA && y0 === yA) || (a1 * x0 + b1 * y0 + c1 === 0));
    // Perpendicular line: a1(y - y0) = b1(x - x0)
    // => b1 x - a1 y + a1 y0 - b1 x0 = 0
    let p = b1, q = -a1, r = a1 * y0 - b1 * x0;
    let g = gcd(gcd(Math.abs(p), Math.abs(q)), Math.abs(r)) || 1;
    p /= g; q /= g; r /= g;
    if (p < 0) { p = -p; q = -q; r = -r; }
    if (p === 0 && q < 0) { q = -q; r = -r; }
    const perpEq = lineGeneralStr(p, q, r);

    return Q('lgpi|' + a1 + '|' + b1 + '|' + c1 + '|' + a2 + '|' + b2 + '|' + c2 + '|' + x0 + '|' + y0,
      [ T('The line $AB$ has equation $' + eq1 + '$.'),
        T('(a) Find the gradient of $AB$.'),
        T('(b) Find an equation of the line that is perpendicular to the line $AB$ and which passes through the point $' + ptStr(x0, y0) + '$. Express your answer in the form $px + qy + r = 0$, where $p$, $q$ and $r$ are integers.'),
        T('(c) The line $AC$ has equation $' + eq2 + '$. Find the coordinates of $A$.') ],
      [{ text: '(a) $m = ' + mABStr + '$  (b) $' + perpEq + '$  (c) $A' + ptStr(xA, yA) + '$' }],
      [ T('(a) Rearrange $' + eq1 + '$ into the form $y = mx + c$ to find the gradient. So $m = ' + mABStr + '$.'),
        T('(b) The perpendicular gradient is $' + gradientStr(b1 / a1) + '$.'),
        T('Using $y - y_1 = m(x - x_1)$ with $' + ptStr(x0, y0) + '$:'),
        T('$y - (' + y0 + ') = ' + gradientStr(b1 / a1) + '(x - (' + x0 + '))$.'),
        T('Rearranging gives $' + perpEq + '$.'),
        T('(c) Solve $' + eq1 + '$ and $' + eq2 + '$ simultaneously:'),
        T('The point of intersection is $A' + ptStr(xA, yA) + '$.') ]);
  }
};

const tPerpBisectorBasic = {
  id: 'perp-bisector', strand: 'S3', difficulty: 2,
  gen(){
    let x1, y1, x2, y2;
    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5); x2 = ri(-5, 5); y2 = ri(-5, 5);
    } while (x1 === x2 || y1 === y2);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }
    const mPerp = -den / num;
    const c = my - mPerp * mx;
    const eq = lineEqStr(mPerp, c);
    return Q('pbb|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('The points $A$ and $B$ have coordinates $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$ respectively.'),
        T('Find the equation of the perpendicular bisector of $AB$, giving your answer in the form $y = mx + c$.') ],
      [{ text: '$' + eq + '$' }],
      [ T('Step 1 — Find the midpoint $M$ of $AB$:'),
        T('$M = \\left(\\frac{' + x1 + ' + (' + x2 + ')}{2}, \\frac{' + y1 + ' + (' + y2 + ')}{2}\\right) = ' + ptFracStr(mx, my) + '$.'),
        T('Step 2 — Find the gradient of $AB$:'),
        T('$m_{AB} = \\frac{' + y2 + ' - (' + y1 + ')}{' + x2 + ' - (' + x1 + ')} = ' + gradientFracStr(num, den) + '$.'),
        T('Step 3 — The perpendicular bisector passes through $M$ with gradient $' + gradientStr(mPerp) + '$.'),
        T('Step 4 — Use the point-slope form $y - y_1 = m(x - x_1)$ with $M$:'),
        T('$' + eq + '$.') ]);
  }
};

const tPerpBisectorIntersection = {
  id: 'perp-bisector-intersect', strand: 'S3', difficulty: 3,
  gen(){

    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5); x2 = ri(-5, 5); y2 = ri(-5, 5);

    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;

    const c = my - mPerp * mx;

const tSampleStyle = {

const tCircleCompleteSquare = {

const tCircleDiameter = {
  id: 'circle-diameter', strand: 'S4', difficulty: 2,
  gen(){
    let x1, y1, x2, y2, d2;
    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5); x2 = ri(-5, 5); y2 = ri(-5, 5);
      d2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
    } while ((x1 === x2 && y1 === y2) || d2 % 4 !== 0);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const r2 = d2 / 4;
    const r = Math.sqrt(r2);
    const rStr = Number.isInteger(r) ? String(r) : '\\sqrt{' + r2 + '}';
    const xPart = mx === 0 ? 'x^2'
                         : '(x ' + (mx > 0 ? '- ' + nStr(mx) : '+ ' + nStr(-mx)) + ')^2';
    const yPart = my === 0 ? 'y^2'
                         : '(y ' + (my > 0 ? '- ' + nStr(my) : '+ ' + nStr(-my)) + ')^2';
    const rhs = Number.isInteger(r) ? r * r : r2;
    const eq = xPart + ' + ' + yPart + ' = ' + rhs;
    return Q('cd|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('The points $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$ are the endpoints of a diameter of a circle.'),
        T('Find an equation for the circle.') ],
      [{ text: '$' + eq + '$' }],
      [ T('Step 1 — The centre is the midpoint of the diameter:'),
        T('$\\left(\\frac{' + x1 + ' + (' + x2 + ')}{2}, \\frac{' + y1 + ' + (' + y2 + ')}{2}\\right) = ' + ptStr(mx, my) + '$.'),
        T('Step 2 — The radius is half the diameter, so $r = \\frac{1}{2}\\sqrt{(' + x2 + ' - (' + x1 + '))^2 + (' + y2 + ' - (' + y1 + '))^2} = ' + rStr + '$.'),
        T('Step 3 — Substitute the centre $' + ptStr(mx, my) + '$ and radius $' + rStr + '$ into $(x - a)^2 + (y - b)^2 = r^2$:'),
        T('$' + eq + '$.') ]);
  }
};

const tCircleMultiPartChord = {

    const presets = [
      { r2: 50,  m: 2, n: 5, pOff: 5,  qOff: 5,  L: 2,  d: 7 },   // image match
      { r2: 20,  m: 5, n: 2, pOff: 2,  qOff: 4,  L: 8,  d: 2 },
      { r2: 45,  m: 5, n: 3, pOff: 3,  qOff: 6,  L: 12, d: 3 },

      { r2: 125, m: 5, n: 5, pOff: 5,  qOff: 10, L: 4,  d: 11 },
      { r2: 125, m: 5, n: 5, pOff: 10, qOff: 5,  L: 4,  d: 11 }
    ];
    const { r2, m, n, pOff, qOff, L, d } = pick(presets);
    const a = ri(-6, 6);
    const b = ri(-6, 6);

    const xCoef = -2 * a;
    const yCoef = -2 * b;
    const constTerm = a*a + b*b - r2;
    let eq = 'x^2 + y^2';
    if (xCoef !== 0) eq += (xCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(xCoef) + 'x';
    if (yCoef !== 0) eq += (yCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(yCoef) + 'y';
    if (constTerm !== 0) eq += (constTerm > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(constTerm);
    eq += ' = 0';

    const p  = a + pOff;
    const k1 = b + qOff;
    const k2 = b - qOff;

    const xPart = a === 0 ? 'x^2' : '(x ' + (a > 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const yPart = b === 0 ? 'y^2' : '(y ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';

      [ T('A circle with centre $C$ has equation $' + eq + '$.'),
        T('(a) Express this equation in the form $(x - a)^2 + (y - b)^2 = d$.'),

        T('(ii) Find the radius of the circle, giving your answer in the form $n\\sqrt{' + m + '}$.'),
        T('(c) The point $P$ with coordinates $' + ptStr(p, 'k') + '$ lies on the circle. Find the possible values of $k$.'),
        T('(d) The points $Q$ and $R$ also lie on the circle, and the length of the chord $QR$ is $' + L + '$. Calculate the shortest distance from $C$ to the chord $QR$.') ],
      [{ text: '(a) $' + completedEq + '$  (b)(i) $C' + ptStr(a, b) + '$  (b)(ii) $' + radiusStr + '$  (c) $k = ' + k2 + '$ or $k = ' + k1 + '$  (d) $' + d + '$' }],
      [ T('(a) Complete the square for $x$ and $y$: $' + completedEq + '$.'),
        T('(b) (i) The centre is $C' + ptStr(a, b) + '$.'),
        T('(ii) The radius is $\\sqrt{' + r2 + '} = ' + radiusStr + '$.'),
        T('(c) Substitute $x = ' + p + '$:  $' + pOff*pOff + ' + (y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r2 + '$.'),
        T('So $(y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + (qOff*qOff) + '$, giving $y = ' + k2 + '$ or $y = ' + k1 + '$.'),
        T('(d) The perpendicular from $C$ to a chord bisects it. In the right-angled triangle formed by $C$, the chord midpoint, and an endpoint: hypotenuse $' + radiusStr + '$, one leg $\\frac{' + L + '}{2} = ' + (L/2) + '$.'),
        T('Shortest distance $= \\sqrt{' + r2 + ' - ' + ((L/2)*(L/2)) + '} = ' + d + '$.') ]);

const tCircleMultiPartReflection = {
  id: 'circle-multipart-reflection', strand: 'S4', difficulty: 2,
  gen(){
    // Same "circle with chords" theme, but the flow is:
    //   (a) complete square (as in image)
    //   (b) centre & radius (as in image)
    //   (c) SHOW that a given point lies on the circle (verification)
    //   (d) find reflection in horizontal line y = b, show it also lies on the
    //       circle, and use the symmetry to find the chord length.
    // Uses the same Pythagorean-preset structure as tCircleMultiPartChord.
    const presets = [
      { r2: 50,  m: 2, n: 5, pOff: 5,  qOff: 5  },  // L = 10
      { r2: 20,  m: 5, n: 2, pOff: 2,  qOff: 4  },  // L = 8
      { r2: 45,  m: 5, n: 3, pOff: 3,  qOff: 6  },  // L = 12
      { r2: 80,  m: 5, n: 4, pOff: 4,  qOff: 8  },  // L = 16
      { r2: 125, m: 5, n: 5, pOff: 5,  qOff: 10 },  // L = 20
      { r2: 125, m: 5, n: 5, pOff: 10, qOff: 5  }   // L = 10
    ];
    const { r2, m, n, pOff, qOff } = pick(presets);
    const L = 2 * qOff;
    const a = ri(-6, 6);
    const b = ri(-6, 6);

    const xA = a + pOff, yA = b - qOff;
    const xB = a + pOff, yB = b + qOff;

    const xCoef = -2 * a;
    const yCoef = -2 * b;
    const constTerm = a*a + b*b - r2;
    let eq = 'x^2 + y^2';
    if (xCoef !== 0) eq += (xCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(xCoef) + 'x';
    if (yCoef !== 0) eq += (yCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(yCoef) + 'y';
    if (constTerm !== 0) eq += (constTerm > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(constTerm);
    eq += ' = 0';

    const xPart = a === 0 ? 'x^2' : '(x ' + (a > 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const yPart = b === 0 ? 'y^2' : '(y ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';
    const completedEq = xPart + ' + ' + yPart + ' = ' + r2;
    const radiusStr = (n === 1) ? '\\sqrt{' + m + '}' : n + '\\sqrt{' + m + '}';
    const reflectLine = (b === 0) ? 'the $x$-axis' : 'the line $y = ' + nStr(b) + '$';

    /* Display helpers for the worked solution.
       dxA = xA − a = pOff, dyA = yA − b = −qOff, and dyB = +qOff.
       These avoid string-concatenation sign artefacts like "(3 + -5)". */
    const dxA = xA - a;
    const dyA = yA - b;
    const dxB = xB - a;
    const dyB = yB - b;
    const groupedLHS = 'x^2 ' +
      (xCoef !== 0 ? (xCoef > 0 ? '+ ' + xCoef : MINUS + ' ' + Math.abs(xCoef)) + 'x ' : '') +
      '+ y^2 ' +
      (yCoef !== 0 ? (yCoef > 0 ? '+ ' + yCoef : MINUS + ' ' + Math.abs(yCoef)) + 'y ' : '') +
      (constTerm !== 0 ? (constTerm > 0 ? '+ ' + constTerm : MINUS + ' ' + Math.abs(constTerm)) : '');

    return Q('cmpr|' + a + '|' + b + '|' + r2 + '|' + pOff + '|' + qOff,
      [ T('The circle $C$ has equation $' + eq + '$.'),
        T('(a) Express this equation in the form $(x - a)^2 + (y - b)^2 = d$.'),
        T('(b) State the coordinates of the centre $C$ and find the radius of $C$ in the form $n\\sqrt{' + m + '}$.'),
        T('(c) Show that the point $A' + ptStr(xA, yA) + '$ lies on $C$.'),
        T('(d) The point $B$ is the reflection of $A$ in ' + reflectLine + '. Show that $B$ also lies on $C$, and hence find the length of the chord $AB$.') ],
      [{ text: '(a) $' + completedEq + '$  (b) $C' + ptStr(a, b) + '$, $r = ' + radiusStr + '$  (c) See proof.  (d) $AB = ' + L + '$' }],
      [ T('(a) Step 1 ŌĆö Group the terms so that the $x$-terms, the $y$-terms and the constant appear together:'),
        T('$' + groupedLHS + ' = 0$.'),
        T('Step 2 ŌĆö Complete the square in each variable. Recall that $x^2 + px = \\left(x + \\tfrac{p}{2}\\right)^2 - \\tfrac{p^2}{4}$; applying this to both $x$ and $y$, and collecting the leftover constants on the right, gives:'),
        T('$' + completedEq + '$.'),
        T('(b) Step 1 ŌĆö Comparing with the standard form $(x - h)^2 + (y - k)^2 = r^2$ allows the centre and radius to be read off directly: the centre is $C' + ptStr(a, b) + '$.'),
        T('Step 2 ŌĆö The right-hand side gives $r^2 = ' + r2 + '$. To express $r$ in the required form $n\\sqrt{' + m + '}$, factor the largest perfect square out of $' + r2 + '$: $' + r2 + ' = ' + m + ' \\cdot ' + n + '^2$, so $r = \\sqrt{' + r2 + '} = ' + radiusStr + '$.'),
        T('(c) Step 1 ŌĆö Substitute $x = ' + xA + '$ and $y = ' + yA + '$ into the completed-square form $' + completedEq + '$.'),
        T('Step 2 ŌĆö Compute each squared term: $(x_A - a)^2 = (' + xA + ' - (' + a + '))^2 = ' + nStr(dxA) + '^2 = ' + dxA*dxA + '$, and $(y_A - b)^2 = (' + yA + ' - (' + b + '))^2 = (' + nStr(dyA) + ')^2 = ' + dyA*dyA + '$.'),
        T('Step 3 ŌĆö Adding: $' + dxA*dxA + ' + ' + dyA*dyA + ' = ' + r2 + '$, which equals the right-hand side, so $A$ lies on $C$.'),
        T('(d) Step 1 ŌĆö Recall that reflection in a horizontal line $y = c$ leaves the $x$-coordinate unchanged and replaces $y$ with $2c - y$. Here $c = ' + nStr(b) + '$ and $y_A = ' + nStr(yA) + '$, so:'),
        T('$y_B = 2(' + nStr(b) + ') - (' + nStr(yA) + ') = ' + nStr(yB) + '$, giving $B' + ptStr(xB, yB) + '$.'),

const tShowParallelogram = {

    } while (dx1 * dy2 === dx2 * dy1);
    const A = [x1, y1];

const tShowRhombus = {
  id: 'show-rhombus', strand: 'S5', difficulty: 3,
  gen(){
    const cx = ri(-3, 3), cy = ri(-3, 3);
    const p = ri(1, 4), q = ri(1, 4);
    const A = [cx - p, cy];
    const B = [cx, cy + q];
    const C = [cx + p, cy];
    const D = [cx, cy - q];
    const sideSq = p * p + q * q;
    const sideStr = Number.isInteger(Math.sqrt(sideSq)) ? String(Math.sqrt(sideSq)) : '\\sqrt{' + sideSq + '}';

    // Compute each side squared explicitly so the worked solution can show
    // all four length calculations individually.
    const AB2 = (B[0] - A[0])**2 + (B[1] - A[1])**2;
    const BC2 = (C[0] - B[0])**2 + (C[1] - B[1])**2;
    const CD2 = (D[0] - C[0])**2 + (D[1] - C[1])**2;
    const DA2 = (A[0] - D[0])**2 + (A[1] - D[1])**2;

    return Q('srh|' + cx + '|' + cy + '|' + p + '|' + q,
      [ T('The points $A' + ptStr(A[0], A[1]) + '$, $B' + ptStr(B[0], B[1]) + '$, $C' + ptStr(C[0], C[1]) + '$ and $D' + ptStr(D[0], D[1]) + '$ are the vertices of a quadrilateral.'),
        T('Show that $ABCD$ is a rhombus.') ],
      [{ text: 'Proof — all four sides equal (each $= ' + sideStr + '$).' }],
      [ T('A rhombus is a quadrilateral with all four sides of equal length. We use the distance formula $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$ to compute each side individually.'),
        T('$AB = \\sqrt{(' + B[0] + ' - (' + A[0] + '))^2 + (' + B[1] + ' - (' + A[1] + '))^2} = \\sqrt{' + AB2 + '} = ' + sideStr + '$.'),
        T('$BC = \\sqrt{(' + C[0] + ' - (' + B[0] + '))^2 + (' + C[1] + ' - (' + B[1] + '))^2} = \\sqrt{' + BC2 + '} = ' + sideStr + '$.'),
        T('$CD = \\sqrt{(' + D[0] + ' - (' + C[0] + '))^2 + (' + D[1] + ' - (' + C[1] + '))^2} = \\sqrt{' + CD2 + '} = ' + sideStr + '$.'),
        T('$DA = \\sqrt{(' + A[0] + ' - (' + D[0] + '))^2 + (' + A[1] + ' - (' + D[1] + '))^2} = \\sqrt{' + DA2 + '} = ' + sideStr + '$.'),
        T('All four sides are equal in length, so $ABCD$ is a rhombus.') ]);
  }
};

const tAreaTriangle = {
  id: 'area-triangle', strand: 'S5', difficulty: 3,
  gen(){
    let x1, y1, x2, y2, x3, y3, area2;
    let tries = 0;
    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5);
      x2 = ri(-5, 5); y2 = ri(-5, 5);
      x3 = ri(-5, 5); y3 = ri(-5, 5);
      area2 = Math.abs(x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2));
      tries++;
    } while (area2 === 0 && tries < 50);
    if (area2 === 0) return tAreaTriangle.gen();
    const area = area2 / 2;
    const areaStr = fracOrIntStr(area);

    // Intermediate terms so the worked solution can show the arithmetic step by step.
    const term1 = x1 * (y2 - y3);
    const term2 = x2 * (y3 - y1);
    const term3 = x3 * (y1 - y2);
    const sum   = term1 + term2 + term3;

    return Q('area|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + x3 + '|' + y3,
      [ T('Find the area of the triangle with vertices $' + ptStr(x1, y1) + '$, $' + ptStr(x2, y2) + '$ and $' + ptStr(x3, y3) + '$.') ],
      [{ text: 'Area $= ' + areaStr + '$' }],
      [ T('For a triangle with vertices $(x_1, y_1)$, $(x_2, y_2)$ and $(x_3, y_3)$, the area is given by the formula'),
        T('$\\text{Area} = \\tfrac{1}{2}\\left|x_1(y_2 - y_3) + x_2(y_3 - y_1) + x_3(y_1 - y_2)\\right|$.'),
        T('Substituting the given coordinates:'),
        T('$\\text{Area} = \\tfrac{1}{2}\\left|' + nStr(x1) + '\\cdot(' + nStr(y2) + ' - (' + nStr(y3) + ')) + ' + nStr(x2) + '\\cdot(' + nStr(y3) + ' - (' + nStr(y1) + ')) + ' + nStr(x3) + '\\cdot(' + nStr(y1) + ' - (' + nStr(y2) + '))\\right|$'),
        T('Evaluating each term:'),
        T('$x_1(y_2 - y_3) = ' + nStr(x1) + ' \\times ' + nStr(y2 - y3) + ' = ' + nStr(term1) + '$'),
        T('$x_2(y_3 - y_1) = ' + nStr(x2) + ' \\times ' + nStr(y3 - y1) + ' = ' + nStr(term2) + '$'),
        T('$x_3(y_1 - y_2) = ' + nStr(x3) + ' \\times ' + nStr(y1 - y2) + ' = ' + nStr(term3) + '$'),
        T('So the sum inside the modulus is $' + nStr(term1) + ' + (' + nStr(term2) + ') + (' + nStr(term3) + ') = ' + nStr(sum) + '$.'),
        T('$\\text{Area} = \\tfrac{1}{2}\\left|' + nStr(sum) + '\\right| = \\tfrac{1}{2} \\cdot ' + Math.abs(sum) + ' = ' + areaStr + '$.') ]);
  }
};

const tChallengePerpBisectorArea = {
  id: 'challenge-perp-bisector-area', strand: 'S7', difficulty: 4,
  gen(){
    let x1, y1, x2, y2;
    do {
      x1 = ri(-6, 6); y1 = ri(-6, 6); x2 = ri(-6, 6); y2 = ri(-6, 6);
    } while (x1 === x2 || y1 === y2);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }
    const mPerp = -den / num;
    const c = my - mPerp * mx;
    if (mPerp === 0 || c === 0) return tChallengePerpBisectorArea.gen();
    const eq = lineEqStr(mPerp, c);
    const xInt = -c / mPerp;
    const yInt = c;
    const area = 0.5 * Math.abs(xInt * yInt);
    const areaStr = fracOrIntStr(area);
    return Q('cpba|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('The points $A$ and $B$ have coordinates $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$ respectively.'),
        T('The perpendicular bisector of $AB$ meets the $x$-axis at $P$ and the $y$-axis at $Q$.'),
        T('Find the area of triangle $OPQ$, where $O$ is the origin.') ],
      [{ text: 'Area $= ' + areaStr + '$' }],
      [ T('Step 1 — Find the midpoint $M$ of $AB$:'),
        T('$M = \\left(\\frac{' + x1 + ' + (' + x2 + ')}{2}, \\frac{' + y1 + ' + (' + y2 + ')}{2}\\right) = ' + ptFracStr(mx, my) + '$.'),
        T('Step 2 — Find the gradient of $AB$:'),
        T('$m_{AB} = \\frac{' + y2 + ' - (' + y1 + ')}{' + x2 + ' - (' + x1 + ')} = ' + gradientFracStr(num, den) + '$.'),
        T('The perpendicular bisector is perpendicular to $AB$, so its gradient is the negative reciprocal:'),
        T('$m_\\perp = ' + gradientStr(mPerp) + '$.'),
        T('Step 3 — Use the point-slope form $y - y_1 = m(x - x_1)$ with $M' + ptFracStr(mx, my) + '$ and $m = ' + gradientStr(mPerp) + '$:'),
        T('$y - ' + fracOrIntStr(my) + ' = ' + gradientStr(mPerp) + '\\left(x - ' + fracOrIntStr(mx) + '\\right)$.'),
        T('Expanding and rearranging gives the perpendicular bisector: $' + eq + '$.'),
        T('Step 4 — Find the intercepts with the coordinate axes.'),
        T('$x$-intercept $P$: set $y = 0$ in $' + eq + '$, so $x = ' + fracOrIntStr(xInt) + '$.'),
        T('$y$-intercept $Q$: set $x = 0$ in $' + eq + '$, so $y = ' + fracOrIntStr(yInt) + '$.'),
        T('Step 5 — $O(0,0)$, $P$ on the $x$-axis and $Q$ on the $y$-axis form a right-angled triangle whose legs are $|x_P|$ and $|y_Q|$.'),
        T('$\\text{Area} = \\tfrac{1}{2}\\,|x_P \\cdot y_Q| = \\tfrac{1}{2} \\times ' + fracOrIntStr(Math.abs(xInt)) + ' \\times ' + fracOrIntStr(Math.abs(yInt)) + ' = ' + areaStr + '$.') ]);
  }
};

const tCircleTangentStandard = {
  id: 'challenge-circle-tangent', strand: 'S7', difficulty: 2,
  gen(){
    const triples = [

      [8,15,17],[15,8,17],[7,24,25],[24,7,25],[20,21,29],[21,20,29]
    ];
    const [p, q, r] = pick(triples);
    const sign1 = pick([1, -1]);
    const sign2 = pick([1, -1]);
    const px0 = sign1 * p, py0 = sign2 * q;
    const a = ri(-5, 5), b = ri(-5, 5);
    const px = a + px0, py = b + py0;
    const cTanNum = b * py0 + r * r + px0 * a;
    const cTanDen = py0;
    const cTan = cTanNum / cTanDen;
    const mTan = -px0 / py0;
    const tanEq = lineEqStr(mTan, cTan);
    return Q('cct|' + a + '|' + b + '|' + r + '|' + px + '|' + py,
      [ T('The circle $C$ has centre $' + ptStr(a, b) + '$ and radius $' + r + '$.'),

      [{ text: '$' + tanEq + '$' }],
      [ T('Gradient of radius $= \\frac{' + py + ' - (' + b + ')}{' + px + ' - (' + a + ')} = ' + gradientStr(mTan === 0 ? 0 : py0 / px0) + '$'),

        T('Using $y - y_1 = m(x - x_1)$ with $P$:'),

};

const tCircleTangentYAxis = {
  id: 'circle-tangent-yaxis', strand: 'S8', difficulty: 4,
  gen(){
    const triples = [
      {r:5,  dx:3, dy:4}, {r:5,  dx:4, dy:3},
      {r:10, dx:6, dy:8}, {r:10, dx:8, dy:6},
      {r:13, dx:5, dy:12}, {r:13, dx:12, dy:5},
      {r:15, dx:9, dy:12}, {r:15, dx:12, dy:9},
      {r:17, dx:8, dy:15}, {r:17, dx:15, dy:8}
    ];
    let r, dx, dy;
    do {
      const t = pick(triples);
      r = t.r; dx = t.dx; dy = t.dy;
    } while (dx === 0 || dy === 0);

    const b = ri(-6, 6);
    const s1 = pick([1, -1]);
    const s2 = pick([1, -1]);

    const cX = r, cY = b;
    const Px = cX + s1 * dx;
    const Py = cY + s2 * dy;
    if (Px === 0) return tCircleTangentYAxis.gen();

    const c1 = -2 * cX, c2 = -2 * cY;
    const c3 = cX*cX + cY*cY - r*r;
    let eq = 'x^2 + y^2';
    if (c1 !== 0) eq += (c1 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c1) + 'x';
    if (c2 !== 0) eq += (c2 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c2) + 'y';
    if (c3 !== 0) eq += (c3 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c3);
    eq += ' = 0';

    let A = s1 * dx;
    let B = s2 * dy;
    let C = A * cX + B * cY + r * r;
    const gg = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    A /= gg; B /= gg; C /= gg;
    if (A < 0) { A = -A; B = -B; C = -C; }
    const tanEq = lineStandardStr(A, B, C);

    const qPt = { x: 0, y: cY };
    const rPt = { x: 0, y: C / B };

    const base = Math.abs(rPt.y - qPt.y);
    const height = Math.abs(Px);
    const area = 0.5 * base * height;
    const areaStr = fracOrIntStr(area);

    /* Display helpers for the worked solution */
    const xSq = cX === 0
      ? 'x^2'
      : '(x ' + (cX > 0 ? '- ' + cX : '+ ' + Math.abs(cX)) + ')^2';
    const ySq = cY === 0
      ? 'y^2'
      : '(y ' + (cY > 0 ? '- ' + cY : '+ ' + Math.abs(cY)) + ')^2';

    const rY = C / B;
    const rYStr = fracOrIntStr(rY);
    const cYStr = fracOrIntStr(cY);
    const mCPStr = gradientStr(s2 * dy / (s1 * dx));
    const mTanStr = gradientStr(-s1 * dx / (s2 * dy));

    return Q('cty|' + cX + '|' + cY + '|' + r + '|' + Px + '|' + Py,
      [ T('A circle with centre $C$ has equation $' + eq + '$.'),
        T('(i) Find the coordinates of $C$ and the radius of the circle.'),
        T('(ii) Show that the tangent to the circle at the point $P' + ptStr(Px, Py) + '$ has equation $' + tanEq + '$.'),
        T('(iii) The circle meets the $y$-axis at $Q$ and the tangent meets the $y$-axis at $R$.'),
        T('Find the area of triangle $PQR$.') ],
      [{ text: '(i) Centre $' + ptStr(cX, cY) + '$, radius $' + r + '$.   (ii) See proof.   (iii) Area $= ' + areaStr + '$' }],
      [ T('(i) Step 1 ŌĆö Complete the square for $x$ and $y$. Writing the terms in $x$ and $y$ alongside the constant:'),
        T('$x^2 ' + (c1 > 0 ? '+ ' + c1 : MINUS + ' ' + Math.abs(c1)) + 'x + y^2 ' + (c2 > 0 ? '+ ' + c2 : MINUS + ' ' + Math.abs(c2)) + 'y + ' + c3 + ' = 0$'),
        T('Step 2 ŌĆö Rewrite in completed-square form:'),
        T('$' + xSq + ' + ' + ySq + ' = ' + (r*r) + '$'),
        T('Comparing with $(x - a)^2 + (y - b)^2 = r^2$, the centre is $C' + ptStr(cX, cY) + '$ and the radius is $' + r + '$.'),
        T('(ii) Step 1 ŌĆö The gradient of the radius $CP$:'),
        T('$m_{CP} = \\frac{' + Py + ' - (' + cY + ')}{' + Px + ' - (' + cX + ')} = ' + mCPStr + '$'),
        T('Step 2 ŌĆö The tangent at $P$ is perpendicular to the radius, so its gradient is the negative reciprocal:'),
        T('$m_{\\text{tangent}} = ' + mTanStr + '$'),
        T('Step 3 ŌĆö Use the point-slope form $y - y_1 = m(x - x_1)$ with $P' + ptStr(Px, Py) + '$:'),
        T('$y - (' + Py + ') = ' + mTanStr + '\\left(x - (' + Px + ')\\right)$'),
        T('Expanding and rearranging into the form $ax + by = c$ gives $' + tanEq + '$.'),
        T('(iii) Step 1 ŌĆö Since the centre is at $x = ' + cX + '$ and the radius is $' + r + '$, the distance from the centre to the $y$-axis equals the radius. Hence the $y$-axis is tangent to the circle at the point $Q' + ptStr(0, cY) + '$.'),
        T('Step 2 ŌĆö Substitute $x = 0$ into the tangent equation $' + tanEq + '$:'),
        T('This gives $y = ' + rYStr + '$, so $R' + ptStr(0, rY) + '$.'),
        T('Step 3 ŌĆö The vertical base $QR$ has length $|' + rYStr + ' - (' + cYStr + ')| = ' + fracOrIntStr(base) + '$.'),
        T('The perpendicular height from $P$ to the $y$-axis is $|x_P| = ' + Math.abs(Px) + '$.'),
        T('So the area of $\\triangle PQR$ is $\\tfrac{1}{2} \\times ' + fracOrIntStr(base) + ' \\times ' + Math.abs(Px) + ' = ' + areaStr + '$.') ]);
  }
};

    const rPt = { x: C / A, y: 0 };

    const base = Math.abs(rPt.x - qPt.x);
    const height = Math.abs(Py);
    const area = 0.5 * base * height;
    const areaStr = fracOrIntStr(area);

    /* Display helpers for the worked solution */
    const xSq = cX === 0
      ? 'x^2'
      : '(x ' + (cX > 0 ? '- ' + cX : '+ ' + Math.abs(cX)) + ')^2';
    const ySq = cY === 0
      ? 'y^2'
      : '(y ' + (cY > 0 ? '- ' + cY : '+ ' + Math.abs(cY)) + ')^2';

    // Group the linear and constant terms by variable, skipping zero coefficients,
    // so the display matches "x^2 + ...x + y^2 + ...y + ... = 0" cleanly.
    let grouped = 'x^2';
    if (c1 !== 0) grouped += ' ' + (c1 > 0 ? '+ ' + c1 : MINUS + ' ' + Math.abs(c1)) + 'x';
    grouped += ' + y^2';
    if (c2 !== 0) grouped += ' ' + (c2 > 0 ? '+ ' + c2 : MINUS + ' ' + Math.abs(c2)) + 'y';
    if (c3 !== 0) grouped += ' ' + (c3 > 0 ? '+ ' + c3 : MINUS + ' ' + Math.abs(c3));

    const rX = C / A;
    const rXStr = fracOrIntStr(rX);
    const cXStr = fracOrIntStr(cX);
    const mCPStr = gradientStr(s2 * dy / (s1 * dx));
    const mTanStr = gradientStr(-s1 * dx / (s2 * dy));

    return Q('ctx|' + cX + '|' + cY + '|' + r + '|' + Px + '|' + Py,
      [ T('A circle with centre $C$ has equation $' + eq + '$.'),
        T('(i) Find the coordinates of $C$ and the radius of the circle.'),
        T('(ii) Show that the tangent to the circle at the point $P' + ptStr(Px, Py) + '$ has equation $' + tanEq + '$.'),
        T('(iii) The circle meets the $x$-axis at $Q$ and the tangent meets the $x$-axis at $R$.'),
        T('Find the area of triangle $PQR$.') ],
      [{ text: '(i) Centre $' + ptStr(cX, cY) + '$, radius $' + r + '$.   (ii) See proof.   (iii) Area $= ' + areaStr + '$' }],
      [ T('(i) Step 1 ŌĆö Complete the square for $x$ and $y$. Group the linear and constant terms:'),
        T('$' + grouped + ' = 0$'),
        T('Step 2 ŌĆö Rewrite in completed-square form:'),
        T('$' + xSq + ' + ' + ySq + ' = ' + (r*r) + '$'),
        T('Comparing with $(x - a)^2 + (y - b)^2 = r^2$, the centre is $C' + ptStr(cX, cY) + '$ and the radius is $' + r + '$.'),
        T('(ii) Step 1 ŌĆö The gradient of the radius $CP$:'),
        T('$m_{CP} = \\frac{' + Py + ' - (' + cY + ')}{' + Px + ' - (' + cX + ')} = ' + mCPStr + '$'),
        T('Step 2 ŌĆö The tangent at $P$ is perpendicular to the radius, so its gradient is the negative reciprocal:'),
        T('$m_{\\text{tangent}} = ' + mTanStr + '$'),
        T('Step 3 ŌĆö Use the point-slope form $y - y_1 = m(x - x_1)$ with $P' + ptStr(Px, Py) + '$:'),
        T('$y - (' + Py + ') = ' + mTanStr + '\\left(x - (' + Px + ')\\right)$'),
        T('Expanding and rearranging into the form $ax + by = c$ gives $' + tanEq + '$.'),
        T('(iii) Step 1 ŌĆö The centre is at height $y = ' + cY + '$ and the radius is $' + r + '$, so the vertical distance from the centre to the $x$-axis equals the radius. Hence the $x$-axis is tangent to the circle at the point $Q' + ptStr(cX, 0) + '$.'),
        T('Step 2 ŌĆö Substitute $y = 0$ into the tangent equation $' + tanEq + '$:'),
        T('This gives $x = ' + rXStr + '$, so $R' + ptStr(rX, 0) + '$.'),
        T('Step 3 ŌĆö The horizontal base $QR$ has length $\\left|' + rXStr + ' - (' + cXStr + ')\\right| = ' + fracOrIntStr(base) + '$.'),
        T('The perpendicular height from $P$ to the $x$-axis is $|y_P| = ' + Math.abs(Py) + '$.'),
        T('So the area of $\\triangle PQR$ is $\\tfrac{1}{2} \\times ' + fracOrIntStr(base) + ' \\times ' + Math.abs(Py) + ' = ' + areaStr + '$.') ]);
  }
};

const tCircleTangentExternal = {

        T('The circle is already in standard form $(x - a)^2 + (y - b)^2 = r^2$, so the centre is $C' + ptStr(a, b) + '$ and the radius is $r = ' + r + '$.'),
        T('Step 2 — Set up the right-angled triangle.'),
        T('Let $T$ be the point where the tangent from $P$ touches the circle. A tangent is perpendicular to the radius at the point of contact, so $CT \\perp PT$.'),
        T('Therefore $\\triangle CPT$ is right-angled at $T$, with hypotenuse $CP$.'),
        T('Step 3 — Apply Pythagoras\u2019 theorem.'),
        T('$CP^2 = CT^2 + PT^2$, and $CT = r$ (the radius), so:'),
        T('$PT^2 = CP^2 - r^2$.'),
        T('Step 4 — Calculate $CP^2$ using the distance formula.'),
        T('$CP^2 = (' + nStr(Px) + ' - (' + nStr(a) + '))^2 + (' + nStr(Py) + ' - (' + nStr(b) + '))^2$'),
        T('$= (' + nStr(Px - a) + ')^2 + (' + nStr(Py - b) + ')^2 = ' + (Px-a)*(Px-a) + ' + ' + (Py-b)*(Py-b) + ' = ' + d2 + '$.'),
        T('So $CP = ' + cpExact + '$.'),
        T('Step 5 — Find the tangent length.'),
        T('$PT = \\sqrt{CP^2 - r^2} = \\sqrt{' + d2 + ' - ' + (r*r) + '} = \\sqrt{' + l2 + '} = ' + lStr + '$.'),
        T('(Note $CP = ' + cpExact + '$ and $r = ' + r + '$; since $CP > r$, $P$ is indeed outside the circle.)') ]);
  }

const tCircleLineIntersection = {
  id: 'circle-line-intersection', strand: 'S8', difficulty: 3,
  gen(){
    const triples = [
      {r:5, dx:3, dy:4}, {r:5, dx:4, dy:3}, {r:10, dx:6, dy:8}, {r:10, dx:8, dy:6}
    ];
    const t = pick(triples);
    const r = t.r, dx = t.dx, dy = t.dy;
    const a = ri(-4, 4), b = ri(-4, 4);
    const Px = a + pick([1, -1]) * dx;
    const Py = b + pick([1, -1]) * dy;

    const m = - (Px - a) / (Py - b);
    const c = Py - m * Px;
    if (!Number.isFinite(m) || !Number.isFinite(c)) return tCircleLineIntersection.gen();

    const lineEq = lineEqStr(m, c);

    const c1 = -2 * a, c2 = -2 * b;
    const c3 = a*a + b*b - r*r;
    let circleEq = 'x^2 + y^2';
    if (c1 !== 0) circleEq += (c1 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c1) + 'x';
    if (c2 !== 0) circleEq += (c2 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c2) + 'y';
    if (c3 !== 0) circleEq += (c3 > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(c3);
    circleEq += ' = 0';

    // ---------- Worked-solution scaffolding ----------
    // Express m = p/q in lowest terms with q > 0.
    let p = m, q = 1;
    for (let d = 2; d <= 100; d++) {
      if (Math.abs(m * d - Math.round(m * d)) < 1e-9) {
        p = Math.round(m * d);
        q = d;
        break;
      }
    }
    if (q < 0) { p = -p; q = -q; }
    const gpq = gcd(Math.abs(p), q) || 1;
    p /= gpq; q /= gpq;

    // Integer form: Ax + By + K = 0
    // From y = (p/q)x + c: qy = px + qc, so px - qy + (q·Py - p·Px) = 0.
    let A = p, B = -q, K = q*Py - p*Px;
    if (A < 0 || (A === 0 && B < 0)) { A = -A; B = -B; K = -K; }
    const intLineStr = lineGeneralStr(A, B, K);

    // Perpendicular distance from (a, b) to Ax + By + K = 0.
    const num = A*a + B*b + K;
    const numAbs = Math.abs(num);
    const den2 = A*A + B*B;
    const den = Math.sqrt(den2);

    // Display helper: one signed term of the numerator, e.g. "3·1" or "- 3·2".
    function signedTerm(coeff, val) {
      const prod = coeff * val;
      const mag = Math.abs(coeff) + ' \\cdot ' + Math.abs(val);
      return { prod, mag };
    }
    const parts = [];
    if (A !== 0 && a !== 0) parts.push(signedTerm(A, a));
    if (B !== 0 && b !== 0) parts.push(signedTerm(B, b));
    if (K !== 0) parts.push({ prod: K, mag: String(Math.abs(K)) });
    let evalExpr = '';
    parts.forEach((pp, i) => {
      if (i === 0) evalExpr += (pp.prod < 0 ? MINUS + ' ' : '') + pp.mag;
      else evalExpr += (pp.prod < 0 ? ' ' + MINUS + ' ' : ' + ') + pp.mag;
    });
    if (!evalExpr) evalExpr = '0';

    const sqDisplay = Math.abs(A) + '^2 + ' + Math.abs(B) + '^2';
    const distStr = fracOrIntStr(numAbs / den);

    return Q('cli|' + a + '|' + b + '|' + r + '|' + m + '|' + c,
      [ T('The circle $C$ has equation $' + circleEq + '$.'),
        T('The line $L$ has equation $' + lineEq + '$.'),
        T('Show that $L$ is a tangent to $C$.') ],
      [{ text: 'Proof — perpendicular distance from centre to $L$ equals the radius $' + r + '$.' }],
      [ T('Step 1 — Read off the centre and radius of $C$. From $' + circleEq + '$, the centre is $C' + ptStr(a, b) + '$ and the radius is $r = ' + r + '$.'),
        T('Step 2 — Rewrite the line $' + lineEq + '$ in the integer form $Ax + By + K = 0$ by clearing fractions:'),
        T('$' + intLineStr + '$.'),
        T('So $A = ' + A + '$, $B = ' + B + '$, $K = ' + K + '$.'),
        T('Step 3 — The perpendicular distance from the point $(x_0, y_0)$ to the line $Ax + By + K = 0$ is:'),
        T('$d = \\dfrac{|A x_0 + B y_0 + K|}{\\sqrt{A^2 + B^2}}$.'),
        T('A line is tangent to a circle if and only if the perpendicular distance from the centre of the circle to the line equals the radius of the circle.'),
        T('Step 4 — Substitute $A = ' + A + '$, $B = ' + B + '$, $K = ' + K + '$, $x_0 = ' + a + '$, $y_0 = ' + b + '$:'),
        T('$d = \\dfrac{|' + evalExpr + '|}{\\sqrt{' + sqDisplay + '}}$.'),
        T('Step 5 — Evaluate the numerator and denominator.'),
        T('Numerator: $|' + num + '| = ' + numAbs + '$.'),
        T('Denominator: $\\sqrt{' + den2 + '} = ' + fracOrIntStr(den) + '$.'),
        T('So $d = \\dfrac{' + numAbs + '}{' + fracOrIntStr(den) + '} = ' + distStr + '$.'),
        T('Step 6 — The perpendicular distance from $C$ to $L$ equals $' + distStr + '$, which equals the radius $r = ' + r + '$. Therefore $L$ is a tangent to the circle $C$.') ]);
  }
};

const tCircleInequalitiesRange = {
  id: 'circle-inequalities-range', strand: 'S10', difficulty: 4,
  gen(){
    const r = pick([5, 10, 13]);
    const a = pick([-3, -2, -1, 1, 2, 3]);
    const b = -r;
    const cX = a, cY = b;

    let dx, dy;
    if (r === 5) {
      const triples = [[3,4],[4,3]];
      [dx, dy] = pick(triples);
    } else if (r === 10) {
      const triples = [[6,8],[8,6]];
      [dx, dy] = pick(triples);
    } else {
      const triples = [[5,12],[12,5]];
      [dx, dy] = pick(triples);
    }
    const sign = pick([1, -1]);
    const Px = cX + sign * dx;

    const kMin = -r - dy;
    const kMax = -r + dy;

    const K = r*r - a*a;
    let mMin, mMax;
    if (a > 0) { mMin = 0; mMax = 2*a*r/K; }
    else { mMin = 2*a*r/K; mMax = 0; }

    let m;
    do {
      m = pick([1/2, 1/3, 2/3, 1/4, 3/4, -1/2, -1/3, -2/3, -1/4, -3/4]);
    } while (m <= mMin || m >= mMax);

    let p = m, q = 1;
    for (let d = 2; d <= 10; d++) {
      if (Number.isInteger(m * d)) { p = m * d; q = d; break; }
    }
    if (p < 0) { p = -p; q = -q; }

    const lineEq = q + 'y = ' + p + 'x';

    const xCoef = -2 * a;
    const yCoef = -2 * b;
    const constTerm = a*a + b*b - r*r;
    let circleEq = 'x^2 + y^2';
    if (xCoef !== 0) circleEq += (xCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(xCoef) + 'x';
    if (yCoef !== 0) circleEq += (yCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(yCoef) + 'y';
    if (constTerm !== 0) circleEq += (constTerm > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(constTerm);
    circleEq += ' = 0';

    return Q('ciq|' + a + '|' + b + '|' + r + '|' + Px + '|' + m,
      [ T('A circle with centre $C$ has equation $' + circleEq + '$.'),
        T('(i) Show that no part of the circle lies above the $x$-axis.'),
        T('(ii) The point $P$ has coordinates $' + ptStr(Px, 'k') + '$ and lies inside the circle. Find the set of possible values of $k$.'),
        T('(iii) Prove that the line $' + lineEq + '$ does not meet the circle.') ],
      [ { text: '(i) See proof. (ii) $' + kMin + ' < k < ' + kMax + '$ (iii) See proof.' } ],
      [ T('(i) Complete the square: $(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y + ' + Math.abs(b) + ')^2 = ' + r*r + '$.'),
        T('Centre $' + ptStr(a, b) + '$, radius $' + r + '$.'),
        T('The maximum $y$-coordinate is $' + b + ' + ' + r + ' = ' + (b+r) + '$. Since this is at most 0, no part lies above the $x$-axis.'),
        T('(ii) For $' + ptStr(Px, 'k') + '$ to be inside, the distance to the centre must be less than the radius:'),
        T('$(' + Px + ' - (' + a + '))^2 + (k - (' + b + '))^2 < ' + r + '^2$'),
        T('$' + dx + '^2 + (k + ' + Math.abs(b) + ')^2 < ' + r*r + '$'),
        T('$(k + ' + Math.abs(b) + ')^2 < ' + (r*r - dx*dx) + '$'),
        T('$-' + dy + ' < k + ' + Math.abs(b) + ' < ' + dy + '$'),
        T('$' + kMin + ' < k < ' + kMax + '$.'),
        T('(iii) Substitute $' + lineEq + '$ into the circle equation:'),
        T('$' + lineEq + ' \\Rightarrow y = \\frac{' + p + '}{' + q + '}x$'),
        T('$(x - ' + a + ')^2 + (\\frac{' + p + '}{' + q + '}x + ' + Math.abs(b) + ')^2 = ' + r*r + '$'),
        T('Multiply by $' + q*q + '$:'),
        T('$' + q*q + '(x^2 - ' + (2*a) + 'x + ' + a*a + ') + (' + p + 'x + ' + (q*Math.abs(b)) + ')^2 = ' + (q*q*r*r) + '$'),
        T('Expand: $' + (p*p+q*q) + 'x^2 + ' + (2*(p*q*Math.abs(b) - a*q*q)) + 'x + ' + (a*a*q*q) + ' = ' + (q*q*r*r) + '$'),
        T('$' + (p*p+q*q) + 'x^2 + ' + (2*(p*q*Math.abs(b) - a*q*q)) + 'x + ' + (a*a*q*q - q*q*r*r) + ' = 0$'),
        T('The discriminant is $\\Delta = ' + (4*q*q*(p*p*(r*r - a*a) - 2*a*p*q*r)) + ' < 0$.'),
