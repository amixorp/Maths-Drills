/* -------- S17: Circle Tangent to a Line with a Constraint -------- */

const tCircleTangentConstraint = {
  id: 'circle-tangent-constraint', strand: 'S17', difficulty: 4,
  gen(){
    // Construct a circle tangent to a given line at a given point, and passing through another point.
    // This tests the geometric understanding that the centre lies on the normal at the tangent point.
    // We choose the tangent point T on the line, and the centre C such that CT is perpendicular to the line.
    // Then we scale the radius so that the circle passes through a second point P.

    // Choose a line: y = mx + c.
    const m = pick([1, 2, -1, -2, 0.5, -0.5]);
    // Choose tangent point T with integer coordinates on the line.
    const Tx = ri(-4, 4);
    const Ty = m * Tx + pick([-3, -2, -1, 0, 1, 2, 3]); // ensure integer Ty by choosing c = Ty - m*Tx
    const c = Ty - m * Tx;
    // The line equation is y = mx + c.

    // Normal direction: gradient -1/m.
    // Centre C = T + k * (normal direction). Let normal vector be (-m, 1) or (m, -1).
    // We need to choose k such that the radius r = |k| * sqrt(m^2+1) and the circle passes through a point P.
    // For simplicity, choose k and then find P on the circle.
    const k = pick([1, 2, 3]);
    const normalX = -m, normalY = 1; // vector perpendicular to (1, m)
    const Cx = Tx + k * normalX;
    const Cy = Ty + k * normalY;
    const r2 = k*k*(m*m + 1);
    const r = Math.sqrt(r2);

    // Now choose a second point P on the circle with integer coordinates.
    // We can parametrise the circle: P = C + r*(cosθ, sinθ). We need integer coordinates.
    // Instead, choose a vector (dx, dy) such that dx^2+dy^2 = r2, then P = C + (dx, dy).
    // Generate integer solutions to dx^2+dy^2 = r2.
    let Px, Py, found = false;
    for (let dx = -Math.floor(Math.sqrt(r2)); dx <= Math.floor(Math.sqrt(r2)); dx++){
      const dy2 = r2 - dx*dx;
      if (dy2 < 0) continue;
      const dy = Math.sqrt(dy2);
      if (!Number.isInteger(dy)) continue;
      Px = Cx + dx;
      Py = Cy + dy;
      if (Px === Tx && Py === Ty) continue; // avoid P = T
      found = true;
      break;
    }
    if (!found) return tCircleTangentConstraint.gen();

    // Circle equation: (x - Cx)^2 + (y - Cy)^2 = r2.
    const xPart = Cx === 0 ? 'x^2' : '(x ' + (Cx > 0 ? '- ' + Cx : '+ ' + Math.abs(Cx)) + ')^2';
    const yPart = Cy === 0 ? 'y^2' : '(y ' + (Cy > 0 ? '- ' + Cy : '+ ' + Math.abs(Cy)) + ')^2';
    const eq = xPart + ' + ' + yPart + ' = ' + r2;

    const lineEq = lineEqStr(m, c);

    return Q('ctc|' + Tx + '|' + Ty + '|' + Cx + '|' + Cy + '|' + r2 + '|' + Px + '|' + Py,
      [ T('A circle is tangent to the line $' + lineEq + '$ at the point $T' + ptStr(Tx, Ty) + '$.'),
        T('The circle also passes through the point $P' + ptStr(Px, Py) + '$.'),
        T('(a) Explain why the centre of the circle lies on the line perpendicular to $' + lineEq + '$ at $T$.'),
        T('(b) Find the centre and radius of the circle.'),
        T('(c) Write down the equation of the circle.') ],
      [{ text: '(a) The tangent is perpendicular to the radius at the point of contact. (b) Centre $' + ptStr(Cx, Cy) + '$, radius $' + (Number.isInteger(r) ? r : '\\sqrt{' + r2 + '}') + '$. (c) $' + eq + '$' }],
      [ T('(a) The radius to the point of tangency is perpendicular to the tangent line. Therefore the centre lies on the normal at $T$.'),
        T('(b) The normal has gradient $' + gradientStr(-1/m) + '$. The centre is $' + ptStr(Cx, Cy) + '$.'),
        T('The radius is the distance from the centre to $T$: $r = \\sqrt{(' + Cx + '-' + Tx + ')^2+(' + Cy + '-' + Ty + ')^2} = ' + (Number.isInteger(r) ? r : '\\sqrt{' + r2 + '}') + '$.'),
        T('(c) $' + eq + '$.') ]);
  }
};

const tOrthogonalCirclesParam = {

        T('Circle $C_2$: $' + eq2 + '$, where $k$ is a constant.'),
        T('(a) Find the centres and radii of both circles in terms of $k$ where necessary.'),
        T('(b) Show that the condition for two circles $x^2+y^2+2g_1x+2f_1y+c_1=0$ and $x^2+y^2+2g_2x+2f_2y+c_2=0$ to be orthogonal is $2g_1g_2 + 2f_1f_2 = c_1 + c_2$.'),
        T('(c) Hence find the value of $k$ for which $C_1$ and $C_2$ are orthogonal.'),
        T('(d) Find the coordinates of the points of intersection when $k$ takes this value.') ],
      [{ text: '(a) $C_1: ' + ptStr(-g1, -f1) + '$, $r_1 = ' + r1Str + '$; $C_2: ' + ptStr(-g2, -f2) + '$, $r_2 = ' + r2Str + '$. (b) See proof. (c) $k = ' + k + '$. (d) See working.' }],
      [ T('(a) Complete the square: $C_1$ has centre $' + ptStr(-g1, -f1) + '$ and radius $' + r1Str + '$; $C_2$ has centre $' + ptStr(-g2, -f2) + '$ and radius $\\sqrt{' + (g2*g2+f2*f2-k) + '}$.'),
        T('(b) At an intersection point the radii to that point are perpendicular. By Pythagoras on the triangle formed by the two centres and the intersection point: $d^2 = r_1^2 + r_2^2$. Expanding $d^2 = (g_1-g_2)^2 + (f_1-f_2)^2$ and substituting $r_1^2 = g_1^2+f_1^2-c_1$, $r_2^2 = g_2^2+f_2^2-c_2$ gives $2g_1g_2 + 2f_1f_2 = c_1 + c_2$.'),
        T('(c) Substitute the coefficients and $c_2 = k$: $2(' + g1 + ')(' + g2 + ') + 2(' + f1 + ')(' + f2 + ') = ' + c1 + ' + k$, giving $k = ' + k + '$.'),
        T('(d) With $k = ' + k + '$, solve the two circle equations simultaneously. Subtract to get the radical axis, then substitute into one circle and solve the resulting quadratic for the two intersection points.') ]);
  }
};

const DISABLED_KEY = 'as-coord-geom-disabled-v2';
const DEFAULT_DISABLED = [];

function loadDisabled(){
  try {
    const raw = localStorage.getItem(DISABLED_KEY);
    if (!raw) return new Set(DEFAULT_DISABLED);
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return new Set(DEFAULT_DISABLED);
    const known = new Set(TOPICS.map(t=>t.id));
    return new Set(arr.filter(id => known.has(id)));
  } catch(e) { return new Set(DEFAULT_DISABLED); }
}
function saveDisabled(s){ try { localStorage.setItem(DISABLED_KEY, JSON.stringify(Array.from(s))); } catch(e){} }

function activeTopics(){
  const off = loadDisabled();
  return TOPICS.filter(t => !off.has(t.id));
}

function strandOrder(topics){
  const byStrand = {};
  for (const t of shuffle(topics.slice())) (byStrand[t.strand]=byStrand[t.strand]||[]).push(t);
  const strands = Object.keys(byStrand).filter(s => byStrand[s].length > 0);
  const order = [];
  while (order.length < topics.length){
    for (const s of strands){
      if (byStrand[s].length > 0) order.push(byStrand[s].shift());
    }
  }
  return order;
}

function generateSheet(){
  const usedKeys = new Set();
  const usedTopics = new Set();
  const out = [];
  const order = strandOrder(activeTopics());
  for (const topic of order){
    if (usedTopics.has(topic.id)) continue;
    let cand = null;
    for (let t = 0; t < 20; t++){
      let c;
      try {
        c = topic.gen();
      } catch (err) {
        console.error('Generator failed: ' + topic.id, err);
        c = null;
        break;
      }
      if (c && !usedKeys.has(c.key) && c.blocks.length > 0){ cand = c; break; }
    }
    if (!cand) continue;

    cand.difficulty = topic.difficulty || 1;
    cand.topicId   = topic.id;      // <— add this line

    const trial = out.concat([cand]);
    const testPages = layoutSheet({ title:'Test', questions: trial, revealState: false });
    if (testPages.length > 2 && out.length >= 8) break;
    out.push(cand);
    usedTopics.add(topic.id);
    usedKeys.add(cand.key);
    if (out.length >= 20) break;
  }

  out.sort((a, b) => a.difficulty - b.difficulty);

  if (out.length === 0){
    out.push(Q('fallback', [T('No questions could be generated. Try clicking "Generate New" or check the Topics panel.')],
      [{ text: 'N/A' }], null));
  }

  return out;
}

/* ============================================================
   HTML renderer (with KaTeX)
   ============================================================ */
function esc(s){
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
  return String(s).replace(/[&<>"]/g, function(c){ return map[c]; });
}
function renderMath(text) {
  if (!text.includes('$')) return esc(text);
  if (typeof katex === 'undefined') return esc(text);
  const parts = text.split(/(\$[^$]*\$)/);
  let html = '';
  for (let p of parts) {
    if (p.length >= 2 && p.startsWith('$') && p.endsWith('$')) {
      try {
        html += katex.renderToString(p.slice(1, -1), { throwOnError: false, displayMode: false });
      } catch(e) {
        html += esc(p);
      }
    } else {
      html += esc(p);
    }
  }
  return html;
}

function drawHTML(pagesItems){
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = '';
  for (const items of pagesItems){
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    const pg = document.createElement('div');
    pg.className = 'page';
    const parts = [];

    const grouped = [];
    let currentGroup = null;
    for (const it of items) {
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer') {
        if (currentGroup
            && currentGroup.t === it.t
            && Math.abs(currentGroup.y - it.y) < 1
            && currentGroup.size === it.size
            && JSON.stringify(currentGroup.color || null) === JSON.stringify(it.color || null)) {
          currentGroup.s += it.s;
        } else {
          if (currentGroup) grouped.push(currentGroup);
          currentGroup = { t: it.t, x: it.x, y: it.y, size: it.size, s: it.s, color: it.color };
        }
      } else {
        if (currentGroup) { grouped.push(currentGroup); currentGroup = null; }
        grouped.push(it);
      }
    }
    if (currentGroup) grouped.push(currentGroup);

    for (const it of grouped){
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer'){
        const top = it.y - it.size * 0.755;
        const cls = it.t === 'answer' ? 'tx ans' : 'tx';
        let style = 'left:' + it.x.toFixed(2) + 'pt;top:' + top.toFixed(2) +
                    'pt;font-size:' + it.size.toFixed(2) + 'pt;';
        if (it.bold)   style += 'font-weight:700;';
        if (it.italic) style += 'font-style:italic;';
        if (it.color)  style += 'color:rgb(' + it.color[0] + ',' + it.color[1] + ',' + it.color[2] + ');';
        parts.push('<span class="' + cls + '" style="' + style + '">' + renderMath(it.s) + '</span>');
      } else if (it.t === 'line' || it.t === 'answer-line') {
        let color = it.grey ? '#94a3b8' : '#000';
        if (it.color) color = `rgb(${it.color[0]}, ${it.color[1]}, ${it.color[2]})`;
        const cls = it.t === 'answer-line' ? 'ans' : '';
        parts.push(
          '<svg class="' + cls + '" ' +
          'style="position:absolute;left:0;top:0;width:595.28pt;height:841.89pt;overflow:visible;pointer-events:none;" ' +
          'viewBox="0 0 595.28 841.89" xmlns="http://www.w3.org/2000/svg">' +
          '<line x1="'+it.x1.toFixed(2)+'" y1="'+it.y1.toFixed(2)+
          '" x2="'+it.x2.toFixed(2)+'" y2="'+it.y2.toFixed(2)+
          '" stroke="'+color+'" stroke-width="'+it.w.toFixed(2)+'"/></svg>');
      }
    }
    pg.innerHTML = parts.join('');
    wrap.appendChild(pg);
    pagesEl.appendChild(wrap);
  }
}

function fitPage(){
  const vp = document.getElementById('viewport');
  const pw = 210 * 96 / 25.4;
  const ph = 297 * 96 / 25.4;
  const avail = vp.clientWidth - 40;
  const z = Math.max(0.22, Math.min(1, avail / pw));
  document.querySelectorAll('.page-wrap').forEach(w => {
    w.style.width = (pw*z)+'px'; w.style.height = (ph*z)+'px';
  });
  document.querySelectorAll('.page').forEach(p => {
    p.style.transform = 'scale('+z+')';
  });
}
function applySeed(){
  const s = parseInt(seedInput.value, 10);

function getSeedFromURL(){
  const p = new URLSearchParams(window.location.search).get('seed');
  if (p === null) return null;
  const n = parseInt(p, 10);

}
function setSeedInURL(seed){

function dateSeed(){

    String(d.getDate()).padStart(2,'0') + String(d.getHours()).padStart(2,'0') +
    String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0'), 10);
}

function buildTopicsPanel(){
  const body = document.getElementById('tpBody');
  body.innerHTML = '';
  const off = loadDisabled();
  const byStrand = {};
  for (const t of TOPICS) (byStrand[t.strand]=byStrand[t.strand]||[]).push(t);
  Object.keys(byStrand).sort().forEach(s => {
    const head = document.createElement('div');
    head.className = 'tp-strand';
    head.textContent = (STRAND_LABEL[s]||s) + ' ('+byStrand[s].length+')';
    body.appendChild(head);
    byStrand[s].forEach(t => {
      const row = document.createElement('label');
      row.className = 'tp-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !off.has(t.id);
      cb.addEventListener('change', () => {
        const cur = loadDisabled();
        if (cb.checked) cur.delete(t.id); else cur.add(t.id);
        saveDisabled(cur); refreshCount(); scheduleRegen();
      });
      const name = document.createElement('span');
      name.className = 'name'; name.textContent = t.id;
      row.appendChild(cb); row.appendChild(name); body.appendChild(row);
    });
  });
  refreshCount();
}

  const off = loadDisabled();
  document.getElementById('tpCount').textContent =
    (TOPICS.length - off.size) + ' of ' + TOPICS.length + ' topics enabled';
