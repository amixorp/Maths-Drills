  }
};

const tCircleRangesTangent = {
  id: 'circle-ranges-tangent', strand: 'S10', difficulty: 4,
  gen(){
    const a = ri(-4, 4);
    const b = ri(-4, 4);
    const r = ri(3, 6);
    
    let dx;
    if (r === 3) dx = pick([1, 2]);
    else if (r === 4) dx = pick([1, 2, 3]);
    else if (r === 5) dx = pick([1, 2, 3, 4]);
    else dx = pick([1, 2, 3, 4, 5]);
    
    const R2 = r*r - dx*dx;
    const R = Math.sqrt(R2);
    const sign = pick([1, -1]);
    const px = a + sign * dx;
    
    let m, c, lineEq;
    let found = false;
    for (let tries = 0; tries < 50; tries++) {
      m = pick([3/4, -3/4, 4/3, -4/3, 5/12, -5/12, 12/5, -12/5]);
      let p = m, q = 1;
      for (let d = 2; d <= 10; d++) {
        if (Number.isInteger(m * d)) { p = m * d; q = d; break; }
      }
      const norm = Math.sqrt(p*p + q*q);
      if (!Number.isInteger(norm)) continue;
      
      const val = r * norm;
      let num = val - p*a + q*b;
      if (num % q === 0) {
        c = num / q;
        found = true;
      } else {
        num = -val - p*a + q*b;
        if (num % q === 0) {
          c = num / q;
          found = true;
        }
      }
      
      if (found) {
        lineEq = lineEqFracStr(p, q, c);
        break;
      }
    }
    if (!found) return tCircleRangesTangent.gen();

    const xMin = a - r, xMax = a + r;
    const kMin = b - R, kMax = b + R;
    const kMinStr = Number.isInteger(kMin) ? kMin : kMin.toFixed(2);
    const kMaxStr = Number.isInteger(kMax) ? kMax : kMax.toFixed(2);

    // ---------- Worked-solution scaffolding ----------
    // Recover p, q from m so the fraction inside lineEq can be cleared exactly.
    let p = m, q = 1;
    for (let d = 2; d <= 10; d++) {
      if (Number.isInteger(m * d)) { p = m * d; q = d; break; }
    }
    const dShift = c - b;
    // After substituting y = (p/q)x + c into (x - a)^2 + (y - b)^2 = r^2 and
    // multiplying through by q^2, the quadratic in x is Aq x^2 + Bq x + Cq = 0.
    const Aq = p*p + q*q;
    const Bq = 2*(p*q*dShift - a*q*q);
    const Cq = q*q*(a*a + dShift*dShift - r*r);
    const discQ = Bq*Bq - 4*Aq*Cq;

    // Bracket strings that match the *question* display exactly.
    const xBrQ = '(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const yBrQ = '(y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';

    // mFracStr uses the same "minus-inside-fraction" form as lineEqFracStr,
    // so the display of mx in the solution matches the display in the question.
    let mFracStr;
    if (q === 1) {
      if (p === 1) mFracStr = 'x';
      else if (p === -1) mFracStr = MINUS + 'x';
      else mFracStr = nStr(p) + 'x';
    } else {
      if (p === 1) mFracStr = '\\frac{1}{' + q + '}x';
      else if (p === -1) mFracStr = MINUS + '\\frac{1}{' + q + '}x';
      else mFracStr = '\\frac{' + nStr(p) + '}{' + q + '}x';
    }
    const cMinusBStr = dShift === 0
      ? ''
      : (dShift > 0 ? ' + ' + dShift : ' ' + MINUS + ' ' + Math.abs(dShift));
    const subBracket = mFracStr + cMinusBStr;

    const lineRhsStr = lineEq.replace('y = ', '');

    const term2 = q * dShift;
    const term2Str = term2 === 0
      ? ''
      : (term2 > 0 ? ' + ' + term2 : ' ' + MINUS + ' ' + Math.abs(term2));

    const pxMinusA = px - a;
    const pxMinusASq = pxMinusA * pxMinusA;

    const quadStr =
      Aq + 'x^2' +
      (Bq === 0 ? '' : ' ' + (Bq > 0 ? '+ ' + Bq : MINUS + ' ' + Math.abs(Bq)) + 'x') +
      (Cq === 0 ? '' : ' ' + (Cq > 0 ? '+ ' + Cq : MINUS + ' ' + Math.abs(Cq)));

    return Q('crt|' + a + '|' + b + '|' + r + '|' + px + '|' + m + '|' + c,
      [ T('The circle $C$ has equation $(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r*r + '$.'),
        T('(i) State the range of possible $x$-coordinates for points on $C$.'),
        T('(ii) The point $P$ has coordinates $' + ptStr(px, 'k') + '$ and lies outside $C$. Find the set of possible values of $k$.'),
        T('(iii) Prove that the line $' + lineEq + '$ is a tangent to $C$.') ],
      [ { text: '(i) $' + xMin + ' \\le x \\le ' + xMax + '$ (ii) $k < ' + kMinStr + '$ or $k > ' + kMaxStr + '$ (iii) See proof.' } ],
      [ T('(i) The circle has centre $C' + ptStr(a, b) + '$ and radius $' + r + '$. A point $(x, y)$ lies on $C$ exactly when $' + xBrQ + ' + ' + yBrQ + ' = ' + (r*r) + '$.'),
        T('Since $' + yBrQ + ' \\ge 0$, this requires $' + xBrQ + ' \\le ' + (r*r) + '$, i.e. $|x - ' + a + '| \\le ' + r + '$.'),
        T('Therefore $' + xMin + ' \\le x \\le ' + xMax + '$.'),
        T('(ii) Since $P' + ptStr(px, 'k') + '$ is outside $C$, its distance from $C' + ptStr(a, b) + '$ exceeds $' + r + '$:'),
        T('$(' + px + ' - (' + a + '))^2 + (k - (' + b + '))^2 > ' + (r*r) + '$.'),
        T('The first term is $(' + pxMinusA + ')^2 = ' + pxMinusASq + '$, so:'),
        T('$' + pxMinusASq + ' + (k - (' + b + '))^2 > ' + (r*r) + '$, i.e. $(k - (' + b + '))^2 > ' + R2 + '$.'),
        T('Hence $|k - (' + b + ')| > \\sqrt{' + R2 + '}$, giving $k < ' + kMinStr + '$ or $k > ' + kMaxStr + '$.'),
        T('(iii) Step 1 — Substituting $y = ' + lineRhsStr + '$ into $' + xBrQ + ' + ' + yBrQ + ' = ' + (r*r) + '$:'),
        T('$' + xBrQ + ' + (' + subBracket + ')^2 = ' + (r*r) + '$.'),
        T('Step 2 — Multiply through by $' + (q*q) + '$ to clear the fraction:'),
        T('$' + (q*q) + xBrQ + ' + (' + p + 'x' + term2Str + ')^2 = ' + (q*q*r*r) + '$.'),
        T('Step 3 — Expand both squares and collect like terms in $x$:'),
        T('$' + quadStr + ' = 0$.'),
        T('Step 4 — Compute the discriminant with $A = ' + Aq + '$, $B = ' + Bq + '$, $C = ' + Cq + '$:'),
        T('$\\Delta = B^2 - 4AC = (' + Bq + ')^2 - 4 \\cdot ' + Aq + ' \\cdot (' + Cq + ') = ' + (Bq*Bq) + ' - ' + (4*Aq*Cq) + ' = ' + discQ + '$.'),
        T('Since $\\Delta = 0$, the quadratic has a repeated root, so the line meets the circle at exactly one point. Therefore $y = ' + lineRhsStr + '$ is a tangent to $C$.') ]);
  }
};

const tCircleSegmentEnclosed = {
  id: 'circle-segment-enclosed', strand: 'S10', difficulty: 4,
  gen(){
    const a = ri(-3, 3);
    const b = ri(-3, 3);
    const r = ri(4, 8);
    
    const m = pick([1/2, -1/2, 2, -2]);
    const c = ri(-5, 5);
    const lineEq = lineEqStr(m, c);

    // Find the intersection points of y = mx + c and the circle
    // (x-a)^2 + (mx+c-b)^2 = r^2
    const A = 1 + m*m;
    const B = -2*a + 2*m*(c-b);
    const C = a*a + (c-b)*(c-b) - r*r;
    
    const disc = B*B - 4*A*C;
    if (disc <= 0) return tCircleSegmentEnclosed.gen(); // Line must cross the circle
    
    const x1 = (-B - Math.sqrt(disc)) / (2*A);
    const x2 = (-B + Math.sqrt(disc)) / (2*A);

    // Display helpers for the worked solution.
    // When m = ±1/2 the natural leading coefficient is 5/4, so AStr is
    // rendered as a fraction; disc is always an integer because 4AC is.
    const AStr = fracOrIntStr(A);
    const mStr = gradientStr(m);
    const cMinusB = c - b;
    const cPart = cMinusB === 0
      ? ''
      : (cMinusB > 0 ? ' + ' + cMinusB : ' ' + MINUS + ' ' + Math.abs(cMinusB));
    const xPart = a === 0
      ? 'x^2'
      : '(x ' + (a > 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const yPart = b === 0
      ? 'y^2'
      : '(y ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';

    return Q('cse|' + a + '|' + b + '|' + r + '|' + m + '|' + c,

        T('The line $L$ has equation $' + lineEq + '$.'),
        T('The line $L$ intersects $C$ at two points. The point $P(x_0, y_0)$ lies on the minor arc of $C$ between these two intersection points.'),

      [{ text: 'See proof.' }],
      [ T('Step 1 — Substitute the equation of the line into the equation of the circle:'),
        T('$' + xPart + ' + (' + mStr + 'x' + cPart + ')^2 = ' + r*r + '$.'),
        T('Step 2 — Expand both squares and collect like terms. This gives a quadratic in $x$:'),
        T('$' + AStr + 'x^2 ' + (B >= 0 ? '+ ' + B : MINUS + ' ' + Math.abs(B)) + 'x ' + (C >= 0 ? '+ ' + C : MINUS + ' ' + Math.abs(C)) + ' = 0$.'),
        T('Step 3 — Compute the discriminant $\\Delta = B^2 - 4AC$:'),
        T('$\\Delta = (' + B + ')^2 - 4 \\cdot ' + AStr + ' \\cdot (' + C + ') = ' + disc + '$.'),
        T('Since $\\Delta > 0$, the quadratic has two distinct real roots, so the line meets the circle at two distinct points.'),
        T('Step 4 — Solve the quadratic using $x = \\frac{-B \\pm \\sqrt{\\Delta}}{2A}$:'),
        T('$x = \\frac{' + (-B) + ' \\pm \\sqrt{' + disc + '}}{' + fracOrIntStr(2*A) + '}$.'),
        T('Numerically this gives $x \\approx ' + x1.toFixed(2) + '$ or $x \\approx ' + x2.toFixed(2) + '$.'),
        T('Step 5 — The minor arc of $C$ between the two intersection points corresponds to $x$-values strictly between these two roots, so:'),
        T('$' + x1.toFixed(2) + ' < x_0 < ' + x2.toFixed(2) + '$.') ]);
  }
};

const tFourLinesParallelogram = {
  id: 'four-lines-parallelogram', strand: 'S10', difficulty: 4,
  gen(){
    // Generate a parallelogram with integer vertices
    const cx = ri(-3, 3), cy = ri(-3, 3);
    const dx1 = pick([-4, -2, 2, 4]);
    const dy1 = pick([-3, -1, 1, 3]);
    let dx2, dy2;
    do {
      dx2 = pick([-4, -2, 2, 4]);
      dy2 = pick([-3, -1, 1, 3]);
    } while (dx1 * dy2 === dx2 * dy1);

    const A = { x: cx, y: cy };
    const B = { x: cx + dx1, y: cy + dy1 };
    const D = { x: cx + dx2, y: cy + dy2 };
    const C = { x: cx + dx1 + dx2, y: cy + dy1 + dy2 };

    // Line AB
    const m1 = (B.y - A.y) / (B.x - A.x);
    const c1 = A.y - m1 * A.x;
    // Line BC
    const m2 = (C.y - B.y) / (C.x - B.x);
    const c2 = B.y - m2 * B.x;
    // Line CD (parallel to AB)
    const c3 = C.y - m1 * C.x;
    // Line DA (parallel to BC)
    const c4 = D.y - m2 * D.x;

    const l1 = lineEqStr(m1, c1);
    const l2 = lineEqStr(m2, c2);
    const l3 = lineEqStr(m1, c3);
    const l4 = lineEqStr(m2, c4);

    const area = Math.abs(dx1 * dy2 - dx2 * dy1);

    /* Display helpers for the worked solution.
       p1 = dx1·dy2 and p2 = dx2·dy1 are the two terms of the
       2D cross product AB × AD, so the final numerical area
       can be written as |p1 − p2| without further algebra. */
    const m1Str = gradientStr(m1);
    const m2Str = gradientStr(m2);
    const p1 = dx1 * dy2;
    const p2 = dx2 * dy1;
    const diff = p1 - p2;

    return Q('flp|' + cx + '|' + cy + '|' + dx1 + '|' + dy1 + '|' + dx2 + '|' + dy2,
      [ T('The lines $L_1$ and $L_2$ have equations $' + l1 + '$ and $' + l3 + '$.'),
        T('The lines $L_3$ and $L_4$ have equations $' + l2 + '$ and $' + l4 + '$.'),
        T('(i) Show that the four lines form a parallelogram.'),
        T('(ii) Find the area of this parallelogram.') ],
      [{ text: '(i) See proof. (ii) Area $= ' + area + '$' }],
      [ T('(i) Step 1 ŌĆö Compare the gradients of $L_1$ and $L_2$. Reading off the coefficient of $x$ from each equation:'),
        T('$L_1: ' + l1 + '$ has gradient $m_1 = ' + m1Str + '$, and'),
        T('$L_2: ' + l3 + '$ has gradient $m_1 = ' + m1Str + '$.'),
        T('Since both lines have the same gradient, $L_1 \\parallel L_2$.'),
        T('Step 2 ŌĆö Compare the gradients of $L_3$ and $L_4$ in the same way:'),
        T('$L_3: ' + l2 + '$ has gradient $m_2 = ' + m2Str + '$, and'),
        T('$L_4: ' + l4 + '$ has gradient $m_2 = ' + m2Str + '$.'),
        T('Since both lines have the same gradient, $L_3 \\parallel L_4$.'),
        T('Step 3 ŌĆö The two gradients are different ($' + m1Str + ' \\ne ' + m2Str + '$), so the two parallel pairs are not the same lines. The four lines therefore enclose a parallelogram.'),
        T('(ii) Step 1 ŌĆö The four intersection points of the two parallel pairs are the vertices of the parallelogram:'),
        T('$A' + ptStr(A.x, A.y) + ' = L_1 \\cap L_4$, $B' + ptStr(B.x, B.y) + ' = L_1 \\cap L_3$, $C' + ptStr(C.x, C.y) + ' = L_2 \\cap L_3$, $D' + ptStr(D.x, D.y) + ' = L_2 \\cap L_4$.'),
        T('Step 2 ŌĆö Two adjacent edge vectors at $A$ are:'),
        T('$\\vec{AB} = (' + B.x + ' - (' + A.x + '), ' + B.y + ' - (' + A.y + ')) = (' + dx1 + ', ' + dy1 + ')$, and'),
        T('$\\vec{AD} = (' + D.x + ' - (' + A.x + '), ' + D.y + ' - (' + A.y + ')) = (' + dx2 + ', ' + dy2 + ')$.'),
        T('Step 3 ŌĆö For a parallelogram with adjacent edge vectors $(u_1, u_2)$ and $(v_1, v_2)$, the area equals the magnitude of the 2D cross product: $\\text{Area} = |u_1 v_2 - u_2 v_1|$.'),
        T('So $\\text{Area} = |(' + dx1 + ')(' + dy2 + ') - (' + dx2 + ')(' + dy1 + ')| = |' + nStr(p1) + ' - (' + nStr(p2) + ')| = |' + nStr(diff) + '| = ' + area + '$.') ]);
  }
};

const tLocusDistance = {
  id: 'locus-distance', strand: 'S11', difficulty: 4,
  gen(){
    const x1 = ri(-4, 4), y1 = ri(-4, 4);
    let a, b;
    do {
      a = ri(-4, 4); b = ri(-4, 4);
    } while (x1 === a && y1 === b);

    // Derive the locus equation from PA² = PB².
    //   (x - x1)² + (y - y1)² = (x - a)² + (y - b)²
    // Expanding and cancelling x², y²:
    //   2(a - x1)·x + 2(b - y1)·y + (x1² + y1² - a² - b²) = 0
    const A0 = 2 * (a - x1);
    const B0 = 2 * (b - y1);
    const C0 = (x1*x1 + y1*y1) - (a*a + b*b);

    let A = A0, B = B0, C = C0;
    const g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    A /= g; B /= g; C /= g;
    if (A < 0 || (A === 0 && B < 0)) { A = -A; B = -B; C = -C; }

    const eqForm = lineGeneralStr(A, B, C);

    // ---------- Display helpers for the worked solution ----------
    function expandSq(v, c) {
      // Returns (v - c)² in expanded form: v² − 2cv + c² (or just v² if c = 0)
      const parts = [v + '^2'];
      const lin = -2 * c;
      if (lin !== 0) parts.push((lin > 0 ? '+ ' : MINUS + ' ') + Math.abs(lin) + v);
      if (c * c !== 0) parts.push('+ ' + (c * c));
      return parts.join(' ');
    }
    function linearForm(cx, cy, cc) {
      // Returns "cx·x + cy·y + cc" with proper sign handling
      let s = '';
      if (cx !== 0) {
        if (cx === 1) s = 'x';
        else if (cx === -1) s = MINUS + 'x';
        else s = nStr(cx) + 'x';
      }
      if (cy !== 0) {
        if (s !== '') s += (cy > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(cy) + 'y';
        else if (cy === 1) s = 'y';
        else if (cy === -1) s = MINUS + 'y';
        else s = nStr(cy) + 'y';
      }
      if (cc !== 0) {
        if (s !== '') s += (cc > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(cc);
        else s = (cc > 0 ? '' : MINUS) + Math.abs(cc);
      }
      return s === '' ? '0' : s;
    }

    // Setup: (x - x1)² + (y - y1)² = (x - a)² + (y - b)²
    const xMinusX1 = x1 === 0 ? 'x^2' : '(x ' + (x1 > 0 ? MINUS + ' ' + x1 : '+ ' + Math.abs(x1)) + ')^2';
    const yMinusY1 = y1 === 0 ? 'y^2' : '(y ' + (y1 > 0 ? MINUS + ' ' + y1 : '+ ' + Math.abs(y1)) + ')^2';
    const xMinusA  = a  === 0 ? 'x^2' : '(x ' + (a  > 0 ? MINUS + ' ' + a  : '+ ' + Math.abs(a) ) + ')^2';
    const yMinusB  = b  === 0 ? 'y^2' : '(y ' + (b  > 0 ? MINUS + ' ' + b  : '+ ' + Math.abs(b) ) + ')^2';
    const setupStr = xMinusX1 + ' + ' + yMinusY1 + ' = ' + xMinusA + ' + ' + yMinusB;

    const lhsExpanded = expandSq('x', x1) + ' + ' + expandSq('y', y1);
    const rhsExpanded = expandSq('x', a)  + ' + ' + expandSq('y', b);
    const lhsLin      = linearForm(-2*x1, -2*y1, x1*x1 + y1*y1);
    const rhsLin      = linearForm(-2*a,  -2*b,  a*a   + b*b);
    const afterCollect = lineGeneralStr(A0, B0, C0);

    const solutionLines = [
      T('Step 1 — The locus condition is $PA = PB$, where $A' + ptStr(x1, y1) + '$ and $B' + ptStr(a, b) + '$.'),
      T('Squaring both sides removes the square roots and gives $PA^2 = PB^2$:'),
      T('$' + setupStr + '$.'),
      T('Step 2 — Expand each squared bracket.'),
      T('$PA^2 = ' + lhsExpanded + '$.'),
      T('$PB^2 = ' + rhsExpanded + '$.'),
      T('Step 3 — The $x^2$ and $y^2$ terms appear on both sides and cancel. Equating the remaining linear parts gives:'),
      T('$' + lhsLin + ' = ' + rhsLin + '$.'),
      T('Step 4 — Rearranging all terms to the left-hand side gives:'),
      T('$' + afterCollect + '$.')
    ];

    if (afterCollect !== eqForm) {
      solutionLines.push(T('Step 5 — Simplify to the standard form $ax + by + c = 0$ with a positive coefficient of $x$:'));
      solutionLines.push(T('$' + eqForm + '$.'));
    }

    solutionLines.push(T('Since the resulting equation is linear in $x$ and $y$, the locus of $P$ is a straight line. Geometrically it is the perpendicular bisector of the segment $AB$ — the set of all points equidistant from $A$ and $B$.'));

    return Q('loc|' + x1 + '|' + y1 + '|' + a + '|' + b,
      [ T('A point $P(x, y)$ moves such that its distance from $' + ptStr(x1, y1) + '$ is equal to its distance from the point $' + ptStr(a, b) + '$.'),
        T('Show that the locus of $P$ is a straight line, and find its equation in the form $ax + by + c = 0$.') ],
      [{ text: 'Locus equation: $' + eqForm + '$. See proof.' }],
      solutionLines);
  }
};

const tOptimisationCircle = {
  id: 'optimisation-circle', strand: 'S11', difficulty: 4,
  gen(){
    const a = ri(-4, 4), b = ri(-4, 4);
    const r = ri(3, 6);
    
    // ---------- Worked-solution scaffolding ----------
    // After substituting y = k - 2x into (x-a)^2 + (y-b)^2 = r^2:
    //   5x^2 - (2a + 4(k-b))x + (a^2 + (k-b)^2 - r^2) = 0
    // Discriminant: Δ = 20r^2 - 4(2a - (k-b))^2 = 20r^2 - 4(k - (2a+b))^2.
    // Δ ≥ 0  ⟺  |k - (2a+b)| ≤ r√5  ⟺  2a+b - r√5 ≤ k ≤ 2a+b + r√5.
    const twoA = 2 * a;
    const base = twoA + b;
    const discConst = 20 * r * r;
    const kMaxNum = (base + r * Math.sqrt(5)).toFixed(2);
    
    // Signed representations of the two endpoints of the k-range.
    const plusTerm  = base === 0 ? r + '\\sqrt{5}' : nStr(base) + ' + ' + r + '\\sqrt{5}';
    const minusTerm = base === 0 ? MINUS + r + '\\sqrt{5}' : nStr(base) + ' ' + MINUS + ' ' + r + '\\sqrt{5}';
    
    // Display helpers that avoid ugly sign collisions like "k - -3".
    const fmtKMinus    = (c) => c === 0 ? 'k'      : (c > 0 ? 'k - ' + c          : 'k + ' + Math.abs(c));
    const fmtKMinusSq  = (c) => c === 0 ? 'k^2'    : (c > 0 ? '(k - ' + c + ')^2' : '(k + ' + Math.abs(c) + ')^2');
    const fmtFourKMinus= (c) => c === 0 ? '4k'     : (c > 0 ? '4(k - ' + c + ')'  : '4(k + ' + Math.abs(c) + ')');
    
    const kB       = fmtKMinus(b);       //   "k",  "k - 3", "k + 3"
    const kBSq     = fmtKMinusSq(b);     // "k^2", "(k - 3)^2", "(k + 3)^2"
    const fourKB   = fmtFourKMinus(b);   //   "4k", "4(k - 3)", "4(k + 3)"
    const kBaseSq  = fmtKMinusSq(base);  // e.g. "(k - 7)^2"
    const kBase    = fmtKMinus(base);    // e.g. "k - 7"
    
    const coefXPlain   = (twoA !== 0 ? nStr(twoA) + ' + ' : '') + fourKB;
    const constTermStr = (a * a !== 0) ? ' + ' + (a * a) : '';
    
    return Q('optc|' + a + '|' + b + '|' + r,
      [ T('The circle $C$ has equation $(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r*r + '$.'),
        T('The point $P(x, y)$ lies on $C$. Find the maximum possible value of $2x + y$.') ],
      [{ text: 'Maximum $= ' + kMaxNum + '$' }],
      [ T('Step 1 — We want to maximise $k = 2x + y$ subject to the constraint $(x - ' + a + ')^2 + (y - ' + b + ')^2 = ' + r*r + '$.'),
        T('Rearrange to make $y$ the subject: $y = k - 2x$.'),
        T('Step 2 — Substitute $y = k - 2x$ into the circle equation:'),
        T('$(x - ' + a + ')^2 + (' + kB + ' - 2x)^2 = ' + r*r + '$.'),
        T('Step 3 — Expanding both squared brackets and collecting terms in $x$ gives the quadratic'),
        T('$5x^2 - (' + coefXPlain + ')x' + constTermStr + ' + ' + kBSq + ' - ' + r*r + ' = 0$.'),
        T('Step 4 — For the line $y = k - 2x$ to meet the circle, this quadratic must have real roots, so its discriminant must be non-negative:'),
        T('$\\Delta = (' + coefXPlain + ')^2 - 4 \\cdot 5 \\cdot \\left(' + (a*a !== 0 ? a*a + ' + ' : '') + kBSq + ' - ' + r*r + '\\right)$.'),
        T('Expanding and simplifying: $\\Delta = ' + discConst + ' - 4' + kBaseSq + '$.'),
        T('Step 5 — Requiring $\\Delta \\ge 0$ gives $4' + kBaseSq + ' \\le ' + discConst + '$, i.e. $|' + kBase + '| \\le ' + r + '\\sqrt{5}$.'),
        T('Therefore $' + minusTerm + ' \\le k \\le ' + plusTerm + '$.'),
        T('Step 6 — The maximum value of $2x + y$ is therefore $k = ' + plusTerm + ' \\approx ' + kMaxNum + '$, achieved when the line $2x + y = k$ is tangent to the circle.') ]);
  }
};

const tMidpointPerpToGivenLine = {
  id: 'midpoint-perp-given-line', strand: 'S12', difficulty: 3,
  gen(){
    // Generate A and B
    let x1, y1, x2, y2;
    do {
      x1 = ri(-6, 6); y1 = ri(-6, 6);
      x2 = ri(-6, 6); y2 = ri(-6, 6);
    } while (x1 === x2 || y1 === y2);

    // Generate the given line L1: ax + by + c = 0
    let a, b, c;
    do {
      a = ri(-4, 4) || 1;
      b = ri(-4, 4) || 1;
      c = ri(-8, 8);
    } while (a === 0 || b === 0 || (a * x1 + b * y1 + c === 0) || (a * x2 + b * y2 + c === 0));
    
    // Standardize a to be positive
    if (a < 0) { a = -a; b = -b; c = -c; }
    const g1 = gcd(gcd(Math.abs(a), Math.abs(b)), Math.abs(c)) || 1;
    a /= g1; b /= g1; c /= g1;

    const givenEq = lineGeneralStr(a, b, c);

    // Midpoint
    const mx2 = x1 + x2, my2 = y1 + y2; // 2*midpoint to keep integers
    const mxStr = fracOrIntStr(mx2 / 2);
    const myStr = fracOrIntStr(my2 / 2);

    // Line l: perpendicular to L1, passing through midpoint.
    // Gradient of L1 is -a/b. Perpendicular gradient is b/a.
    // Equation: y - my = (b/a)(x - mx) => a y - a my = b x - b mx => b x - a y + (a my - b mx) = 0
    // To clear the fraction from the midpoint (which has denominator 2):
    // 2b x - 2a y + (a(x1+x2) - b(y1+y2)) = 0
    let A = 2 * b;
    let B = -2 * a;
    let C = a * (y1 + y2) - b * (x1 + x2);

    const g2 = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    A /= g2; B /= g2; C /= g2;
    if (A < 0) { A = -A; B = -B; C = -C; }

    const ansEq = lineGeneralStr(A, B, C);

    return Q('mplg|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + a + '|' + b + '|' + c,
      [ T('The point $A$ is $' + ptStr(x1, y1) + '$ and $B$ is the point $' + ptStr(x2, y2) + '$.'),
        T('The line $l$ is perpendicular to the line $' + givenEq + '$ and passes through the mid-point of $AB$.'),
        T('Find the equation of $l$, giving your answer in the form $ax + by + c = 0$, where $a$, $b$ and $c$ are integers.') ],
      [{ text: '$' + ansEq + '$' }],
      [ T('Step 1 — Find the midpoint $M$ of $AB$:'),
        T('$M = \\left(\\frac{' + x1 + ' + (' + x2 + ')}{2}, \\frac{' + y1 + ' + (' + y2 + ')}{2}\\right) = ' + ptFracStr(mx2/2, my2/2) + '$.'),
        T('Step 2 — Rearrange the given line $' + givenEq + '$ into the form $y = mx + c$ to read off its gradient:'),
        T('$' + lineEqStr(-a/b, -c/b) + '$, so the gradient of the given line is $' + gradientStr(-a/b) + '$.'),
        T('Step 3 — The line $l$ is perpendicular to the given line, so its gradient is the negative reciprocal of $' + gradientStr(-a/b) + '$:'),
        T('$m_l = ' + gradientStr(b/a) + '$.'),
        T('Step 4 — Use the point-slope form $y - y_1 = m(x - x_1)$ with the midpoint $M' + ptFracStr(mx2/2, my2/2) + '$ and gradient $m = ' + gradientStr(b/a) + '$:'),
        T('$y - (' + fracOrIntStr(my2/2) + ') = ' + gradientStr(b/a) + '\\left(x - (' + fracOrIntStr(mx2/2) + ')\\right)$.'),
        T('Step 5 — Expand the bracket, multiply through by the denominator of the gradient to clear any fractions, and rearrange so that the coefficients of $x$ and $y$ are integers:'),
        T('$' + ansEq + '$.') ]);
  }
};

const tMidpointPerpToSlopeLine = {
  id: 'midpoint-perp-slope-line', strand: 'S12', difficulty: 3,
  gen(){
    let x1, y1, x2, y2;
    do {
      x1 = ri(-6, 6); y1 = ri(-6, 6);
      x2 = ri(-6, 6); y2 = ri(-6, 6);
    } while (x1 === x2 || y1 === y2);

    const m = pick([-3, -2, -1, 1, 2, 3, 0.5, -0.5]);
    const c = ri(-6, 6);
    const givenEq = lineEqStr(m, c);

    const mx2 = x1 + x2, my2 = y1 + y2;
    const mPerp = -1 / m;

    // Line l: y - my = mPerp (x - mx)
    // => y - (y1+y2)/2 = mPerp (x - (x1+x2)/2)
    // => 2y - (y1+y2) = 2*mPerp x - mPerp(x1+x2)
    // Let's use general form: (2*mPerp)x - 2y + (y1+y2 - mPerp(x1+x2)) = 0
    
    // To avoid fractions, let mPerp = -num/den
    // m = num/den -> mPerp = -den/num
    const num = m, den = 1; // since m is integer or half-integer, use a multiplier
    let p = m, q = 1;
    for (let d = 2; d <= 10; d++) {
      if (Number.isInteger(m * d)) { p = m * d; q = d; break; }
    }
    // mPerp = -q/p
    let A = -2 * q;
    let B = 2 * p;
    let C = p * (y1 + y2) + q * (x1 + x2);

    const g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    A /= g; B /= g; C /= g;
    if (A < 0) { A = -A; B = -B; C = -C; }

    const ansEq = lineGeneralStr(A, B, C);

    return Q('mpls|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + m + '|' + c,
      [ T('The point $A$ is $' + ptStr(x1, y1) + '$ and $B$ is the point $' + ptStr(x2, y2) + '$.'),
        T('The line $l$ is perpendicular to the line $' + givenEq + '$ and passes through the mid-point of $AB$.'),
        T('Find the equation of $l$, giving your answer in the form $ax + by + c = 0$, where $a$, $b$ and $c$ are integers.') ],
      [{ text: '$' + ansEq + '$' }],
      [ T('Midpoint of $AB$: $' + ptFracStr((x1+x2)/2, (y1+y2)/2) + '$'),
        T('Gradient of given line: $' + gradientStr(m) + '$'),
        T('Perpendicular gradient: $' + gradientStr(mPerp) + '$'),
        T('Using $y - y_1 = m(x - x_1)$ with the midpoint:'),
        T('$' + lineEqStr(mPerp, (y1+y2)/2 - mPerp*(x1+x2)/2) + '$'),
        T('Rearranging to general form gives $' + ansEq + '$.') ]);
  }
};

const tLineInterceptsDistance = {
  id: 'line-intercepts-distance', strand: 'S13', difficulty: 3,
  gen(){
    let a, b, c;
    do {
      a = pick([-5, -3, -2, 2, 3, 4, 5]);
      b = pick([-5, -3, -2, 2, 3, 4, 5]);
      c = ri(-20, 20);
    } while (c === 0 || a === 0 || b === 0);

    const g = gcd(gcd(Math.abs(a), Math.abs(b)), Math.abs(c)) || 1;
    a /= g; b /= g; c /= g;
    if (a < 0) { a = -a; b = -b; c = -c; }

    const eq = lineGeneralStr(a, b, c);
    const px = -c / a;
    const py = -c / b;
    
    // Length = |c|/|ab| * sqrt(a^2 + b^2)
    const num = Math.abs(c);
    const den = Math.abs(a * b);
    const sq = a*a + b*b;
    const sqStr = Number.isInteger(Math.sqrt(sq)) ? String(Math.sqrt(sq)) : '\\sqrt{' + sq + '}';
    
    // Simplify fraction num/den
    const g2 = gcd(num, den) || 1;
    const n = num / g2;
    const d = den / g2;
    const fracStr = d === 1 ? nStr(n) : '\\frac{' + n + '}{' + d + '}';
    const lenStr = (n === 1 && d === 1) ? sqStr : fracStr + sqStr;

    return Q('lid|' + a + '|' + b + '|' + c,
      [ T('The line $l$ has equation $' + eq + '$.'),
        T('The line crosses the $x$-axis at $P$ and the $y$-axis at $Q$.'),

        T('$= ' + lenStr + '$.') ]);
  }
};

const tLineInterceptsCircle = {
  id: 'line-intercepts-circle', strand: 'S13', difficulty: 4,
  gen(){
    let a, b, c;
    do {
      a = pick([-5, -3, -2, 2, 3, 4, 5]);
      b = pick([-5, -3, -2, 2, 3, 4, 5]);
      c = ri(-15, 15);
    } while (c === 0 || a === 0 || b === 0);

    const g = gcd(gcd(Math.abs(a), Math.abs(b)), Math.abs(c)) || 1;
    a /= g; b /= g; c /= g;
    if (a < 0) { a = -a; b = -b; c = -c; }

    const eq = lineGeneralStr(a, b, c);
    const px = -c / a;
    const py = -c / b;

    const mx = -c / (2 * a);
    const my = -c / (2 * b);
    const r2 = mx*mx + my*my;

    const xPart = mx === 0 ? 'x^2' : '(x ' + (mx > 0 ? '- ' + fracOrIntStr(mx) : '+ ' + fracOrIntStr(-mx)) + ')^2';
    const yPart = my === 0 ? 'y^2' : '(y ' + (my > 0 ? '- ' + fracOrIntStr(my) : '+ ' + fracOrIntStr(-my)) + ')^2';
    const rhs = Number.isInteger(r2) ? String(r2) : '\\frac{' + (mx*mx*4*a*a*Math.pow(b,4) + my*my*4*b*b*Math.pow(a,4)) + '}{' + (4*Math.pow(a,2)*Math.pow(b,2)) + '}';

    // Simplified r2 = (c^2 / (4a^2)) + (c^2 / (4b^2)) = c^2(a^2 + b^2) / (4a^2 b^2)
    const num = c*c*(a*a + b*b);
    const den = 4*a*a*b*b;
    const gg = gcd(num, den) || 1;
    const rn = num / gg;
    const rd = den / gg;
    const r2Str = rd === 1 ? nStr(rn) : '\\frac{' + rn + '}{' + rd + '}';

    return Q('lic|' + a + '|' + b + '|' + c,
      [ T('The line $l$ has equation $' + eq + '$.'),
        T('The line crosses the $x$-axis at $P$ and the $y$-axis at $Q$.'),
        T('Find an equation for the circle with diameter $PQ$. Give your answer in the form $(x - h)^2 + (y - k)^2 = r^2$.') ],
      [{ text: '$' + xPart + ' + ' + yPart + ' = ' + r2Str + '$' }],
      [ T('$x$-intercept $P$: set $y = 0 \\Rightarrow x = ' + fracOrIntStr(px) + '$.'),
        T('$y$-intercept $Q$: set $x = 0 \\Rightarrow y = ' + fracOrIntStr(py) + '$.'),
        T('The centre is the midpoint of $PQ$: $\\left(' + fracOrIntStr(mx) + ', ' + fracOrIntStr(my) + '\\right)$.'),
        T('The radius squared is the distance from the centre to $P$:'),
        T('$r^2 = \\left(' + fracOrIntStr(px) + ' - ' + fracOrIntStr(mx) + '\\right)^2 + \\left(0 - ' + fracOrIntStr(my) + '\\right)^2 = ' + r2Str + '$.'),
        T('Equation: $' + xPart + ' + ' + yPart + ' = ' + r2Str + '$.') ]);
  }
};

const tCircleMultiPartStandard = {
  id: 'circle-multipart-standard', strand: 'S14', difficulty: 3,
  gen(){
    const a = ri(-5, 5), b = ri(-5, 5);
    const r = pick([5, 10, 13]);

    // Generate a point P that is NOT on the circle
    let px, py, dist2;
    do {
      px = a + ri(-6, 6);
      py = b + ri(-6, 6);
      dist2 = (px - a)*(px - a) + (py - b)*(py - b);
    } while (dist2 === r*r || (px === a));

    const m = pick([1, 2, 3, -1, -2]);

    const xPart = a === 0 ? 'x^2' : '(x ' + (a > 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const yPart = b === 0 ? 'y^2' : '(y ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';
    const eq = xPart + ' + ' + yPart + ' = ' + r*r;

    // Line through C and P
    const mCP = (py - b) / (px - a);
    const cCP = b - mCP * a;
    const lineCP = lineEqStr(mCP, cCP);

    // Length CP
    const cpStr = Math.sqrt(dist2);
    const cpExact = Number.isInteger(cpStr) ? String(cpStr) : '\\sqrt{' + dist2 + '}';
    const pos = dist2 < r*r ? 'inside' : 'outside';

    // Line intersection y = mx
    // (x-a)^2 + (mx-b)^2 = r^2 => (1+m^2)x^2 - 2(a+mb)x + (a^2+b^2-r^2) = 0
    const A = 1 + m*m;
    const B = -2*(a + m*b);
    const C = a*a + b*b - r*r;
    const disc = B*B - 4*A*C;

    let intTxt = '';
    if (disc > 0) intTxt = 'The discriminant is positive, so the line meets the circle at two distinct points.';
    else if (disc === 0) intTxt = 'The discriminant is zero, so the line is a tangent to the circle.';
    else intTxt = 'The discriminant is negative, so the line does not meet the circle.';

    const discStr = disc > 0 ? '> 0' : (disc === 0 ? '= 0' : '< 0');

    // Handle m = 1 and m = -1 correctly
    let mStr;
    if (m === 1) mStr = '';
    else if (m === -1) mStr = MINUS;
    else mStr = nStr(m);

    const xBrQ = a === 0 ? 'x^2' : '(x ' + (a > 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2';
    const ySubstPart = b === 0
      ? mStr + 'x'
      : mStr + 'x ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b));
    const substEq = xBrQ + ' + (' + ySubstPart + ')^2 = ' + r*r;

    return Q('cmp|' + a + '|' + b + '|' + r + '|' + px + '|' + py + '|' + m,
      [ T('A circle has equation $' + eq + '$.'),
        T('(i) Find the coordinates of the centre $C$ and the length of the diameter.'),
        T('(ii) Find the equation of the line which passes through $C$ and the point $P' + ptStr(px, py) + '$.'),
        T('(iii) Calculate the length $CP$ and hence determine whether $P$ lies inside or outside the circle.'),
        T('(iv) Determine algebraically whether the line with equation $y = ' + mStr + 'x$ meets the circle.') ],
      [{ text: '(i) Centre $' + ptStr(a, b) + '$, diam $= ' + (2*r) + '$  (ii) $' + lineCP + '$  (iii) $CP = ' + cpExact + '$, so $P$ is ' + pos + '  (iv) ' + intTxt }],
      [ T('(i) Step 1 ŌĆö The equation is already in the standard form $(x - h)^2 + (y - k)^2 = r^2$.'),
        T('Comparing with the given equation, the centre is $C' + ptStr(a, b) + '$ and the radius is $' + r + '$.'),
        T('Step 2 ŌĆö The diameter is twice the radius, so the diameter $= 2 \\times ' + r + ' = ' + (2*r) + '$.'),
        T('(ii) Step 1 ŌĆö Find the gradient of $CP$ using $m = \\frac{y_2 - y_1}{x_2 - x_1}$:'),
        T('$m_{CP} = \\frac{' + py + ' - (' + b + ')}{' + px + ' - (' + a + ')} = ' + gradientStr(mCP) + '$.'),
        T('Step 2 ŌĆö Use the point-slope form $y - y_1 = m(x - x_1)$ with the point $C' + ptStr(a, b) + '$:'),
        T('$y - (' + b + ') = ' + gradientStr(mCP) + '(x - (' + a + '))$.'),
        T('Expanding and rearranging gives $' + lineCP + '$.'),
        T('(iii) Step 1 ŌĆö Apply the distance formula to find $CP$:'),
        T('$CP = \\sqrt{(' + px + ' - (' + a + '))^2 + (' + py + ' - (' + b + '))^2} = \\sqrt{' + dist2 + '} = ' + cpExact + '$.'),
        T('Step 2 ŌĆö Compare $CP$ with the radius $r = ' + r + '$.'),
        T('Since $' + cpExact + ' ' + (dist2 < r*r ? '<' : '>') + ' ' + r + '$, the point $P$ lies ' + pos + ' the circle.'),
        T('(iv) Step 1 ŌĆö Substitute $y = ' + mStr + 'x$ into the circle equation $' + eq + '$:'),
        T('$' + substEq + '$.'),
        T('Step 2 ŌĆö Expand both squares and collect the terms in $x$. This gives the quadratic'),
        T('$' + A + 'x^2 ' + (B >= 0 ? '+ ' + B : MINUS + ' ' + Math.abs(B)) + 'x ' + (C >= 0 ? '+ ' + C : MINUS + ' ' + Math.abs(C)) + ' = 0$.'),
        T('Step 3 ŌĆö Compute the discriminant $\\Delta = B^2 - 4AC$ with $A = ' + A + '$, $B = ' + B + '$, $C = ' + C + '$:'),
        T('$\\Delta = (' + B + ')^2 - 4(' + A + ')(' + C + ') = ' + disc + '$.'),
        T('Step 4 ŌĆö Since $\\Delta ' + discStr + '$, ' + intTxt.charAt(0).toLowerCase() + intTxt.slice(1)) ]);
  }
};

const tCircleMultiPartExactValue = {
  id: 'circle-multipart-exact', strand: 'S14', difficulty: 3,
  gen(){
    const R = pick([5, 10, 13]);
    const a = ri(-4, 4);
    const b = ri(-4, 4);

    // (i) Expanded equation
    const xCoef = -2 * a;
    const yCoef = -2 * b;
    const constTerm = a*a + b*b - R*R;
    let eq = 'x^2 + y^2';
    if (xCoef !== 0) eq += (xCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(xCoef) + 'x';
    if (yCoef !== 0) eq += (yCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(yCoef) + 'y';
    if (constTerm !== 0) eq += (constTerm > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(constTerm);
    eq += ' = 0';

    // (ii) Point (x0, k) on circle with k > 0
    let dx, q;
    do {
      dx = ri(1, R - 1);
      q = R*R - dx*dx;
    } while (Math.sqrt(q) % 1 === 0); // ensure q is not a perfect square
    
    const x0 = a + dx;
    const kStr = b >= 0 ? (b + ' + \\sqrt{' + q + '}') : ('\\sqrt{' + q + '} ' + MINUS + ' ' + Math.abs(b));

    // (iii) Point (x1, y1) inside/outside
    let x1, y1, d2;
    do {
      x1 = a + ri(-R-2, R+2);
      y1 = b + ri(-R-2, R+2);
      d2 = (x1-a)**2 + (y1-b)**2;
    } while (d2 === R*R);
    const pos = d2 < R*R ? 'inside' : 'outside';

    // (iv) Tangent at a point with integer coordinates
    const triples = [[3,4,5],[4,3,5],[6,8,10],[8,6,10],[5,12,13],[12,5,13]];
    const validTriples = triples.filter(t => t[2] === R);
    const [tdx, tdy] = pick(validTriples);
    const sx = pick([1, -1]), sy = pick([1, -1]);
    const x2 = a + sx * tdx;
    const y2 = b + sy * tdy;
    
    const mRad = (y2 - b) / (x2 - a);
    const mTan = -1 / mRad;
    const cTan = y2 - mTan * x2;
    const tanEq = lineEqStr(mTan, cTan);

    // ---------- Display helpers for the worked solution ----------
    const aMag = Math.abs(a);
    const bMag = Math.abs(b);

    // Expanded form of (x-a)^2 and (y-b)^2, one term at a time
    const expandX  = 'x^2' + (a === 0 ? '' : (a > 0 ? ' ' + MINUS + ' ' + (2*a) + 'x' : ' + ' + (2*aMag) + 'x')) + (a === 0 ? '' : ' + ' + (a*a));
    const expandY  = 'y^2' + (b === 0 ? '' : (b > 0 ? ' ' + MINUS + ' ' + (2*b) + 'y' : ' + ' + (2*bMag) + 'y')) + (b === 0 ? '' : ' + ' + (b*b));
    const shiftedX = (a >= 0 ? '(x ' + MINUS + ' ' + a + ')' : '(x + ' + aMag + ')');
    const shiftedY = (b >= 0 ? '(y ' + MINUS + ' ' + b + ')' : '(y + ' + bMag + ')');

    // (ii) sign-check helpers
    const bTerm = (b >= 0 ? MINUS + ' ' + b : '+ ' + bMag);
    const dxSq  = dx*dx;
    const qVal  = q;

    // (iv) helpers
    const dxT   = x2 - a;             // = sx · tdx
    const dyT   = y2 - b;             // = sy · tdy
    const bStr  = nStr(b);

    return Q('cme|' + a + '|' + b + '|' + R + '|' + x0 + '|' + x1 + '|' + y1 + '|' + x2 + '|' + y2,
      [ T('(i) Find the equation of the circle with radius $' + R + '$ and centre $' + ptStr(a, b) + '$, giving your answer in the form $x^2 + y^2 + ax + by + c = 0$.'),
        T('(ii) The circle passes through the point $' + ptStr(x0, 'k') + '$ where $k > 0$. Find the value of $k$ in the form $p + \\sqrt{q}$.'),
        T('(iii) Determine, showing all working, whether the point $' + ptStr(x1, y1) + '$ lies inside or outside the circle.'),
        T('(iv) Find an equation of the tangent to the circle at the point $' + ptStr(x2, y2) + '$.') ],
      [{ text: '(i) $' + eq + '$ (ii) $k = ' + kStr + '$ (iii) ' + pos + ' (iv) $' + tanEq + '$' }],
      [ /* ---- (i) ---- */
        T('(i) Step 1 — The standard equation of the circle with centre $' + ptStr(a, b) + '$ and radius $' + R + '$ is:'),
        T('$' + shiftedX + '^2 + ' + shiftedY + '^2 = ' + R + '^2 = ' + (R*R) + '$.'),
        T('Step 2 — Expand each squared bracket.'),
        T('$' + shiftedX + '^2 = ' + expandX + '$'),
        T('$' + shiftedY + '^2 = ' + expandY + '$'),
        T('Step 3 — Adding the two expansions and moving the constant to the left gives:'),
        T('$x^2 + y^2 ' + (xCoef !== 0 ? (xCoef > 0 ? '+ ' + xCoef : MINUS + ' ' + Math.abs(xCoef)) + 'x ' : '') + (yCoef !== 0 ? (yCoef > 0 ? '+ ' + yCoef : MINUS + ' ' + Math.abs(yCoef)) + 'y ' : '') + (constTerm > 0 ? '+ ' + constTerm : MINUS + ' ' + Math.abs(constTerm)) + ' = 0$.'),
        T('So the required equation is $' + eq + '$.'),
        /* ---- (ii) ---- */
        T('(ii) Step 1 — Since $' + ptStr(x0, 'k') + '$ lies on the circle, substitute $x = ' + x0 + '$ and $y = k$ into the standard form:'),
        T('$(' + x0 + ' ' + bTerm + ')^2 + (k ' + bTerm + ')^2 = ' + (R*R) + '$.'),
        T('Step 2 — Evaluate the $x$-term: $(' + x0 + ' ' + bTerm + ')^2 = ' + dx + '^2 = ' + dxSq + '$.'),
        T('Step 3 — The equation becomes $' + dxSq + ' + (k ' + bTerm + ')^2 = ' + (R*R) + '$, so:'),
        T('$(k ' + bTerm + ')^2 = ' + (R*R) + ' ' + MINUS + ' ' + dxSq + ' = ' + qVal + '$.'),
        T('Step 4 — Taking square roots: $k ' + bTerm + ' = \\pm\\sqrt{' + qVal + '}$.'),
        T('Step 5 — The condition $k > 0$ selects the positive root, so $k = ' + kStr + '$.'),
        /* ---- (iii) ---- */
        T('(iii) Step 1 — The squared distance from the centre $' + ptStr(a, b) + '$ to $' + ptStr(x1, y1) + '$ is:'),
        T('$d^2 = (' + x1 + ' ' + bTerm + ')^2 + (' + y1 + ' ' + bTerm + ')^2$.'),
        T('Step 2 — Evaluate each squared term.'),
        T('$(' + x1 + ' ' + bTerm + ')^2 = ' + ((x1-a)*(x1-a)) + '$'),
        T('$(' + y1 + ' ' + bTerm + ')^2 = ' + ((y1-b)*(y1-b)) + '$'),
        T('So $d^2 = ' + ((x1-a)*(x1-a)) + ' + ' + ((y1-b)*(y1-b)) + ' = ' + d2 + '$.'),
        T('Step 3 — The squared radius is $R^2 = ' + R + '^2 = ' + (R*R) + '$.'),
        T('Step 4 — Since $d^2 = ' + d2 + ' ' + (d2 < R*R ? '<' : '>') + ' ' + (R*R) + ' = R^2$, the point $' + ptStr(x1, y1) + '$ lies ' + pos + ' the circle.'),
        /* ---- (iv) ---- */
        T('(iv) Step 1 — The gradient of the radius from the centre $' + ptStr(a, b) + '$ to $' + ptStr(x2, y2) + '$ is:'),
        T('$m_{\\text{radius}} = \\dfrac{' + y2 + ' ' + bTerm + '}{' + x2 + ' ' + bTerm + '} = \\dfrac{' + nStr(dyT) + '}{' + nStr(dxT) + '} = ' + gradientStr(mRad) + '$.'),
        T('Step 2 — A tangent is perpendicular to the radius at the point of contact, so the tangent gradient is the negative reciprocal:'),
        T('$m_{\\text{tangent}} = -\\dfrac{1}{m_{\\text{radius}}} = ' + gradientStr(mTan) + '$.'),
        T('Step 3 — Use the point-slope form $y - y_1 = m(x - x_1)$ with $' + ptStr(x2, y2) + '$:'),
        T('$y ' + (y2 >= 0 ? MINUS + ' ' + y2 : '+ ' + Math.abs(y2)) + ' = ' + gradientStr(mTan) + '\\left(x ' + (x2 >= 0 ? MINUS + ' ' + x2 : '+ ' + Math.abs(x2)) + '\\right)$.'),
        T('Step 4 — Expanding and rearranging gives $' + tanEq + '$.')
      ]);
  }
};

const tCircleRadiusFindConstant = {
  id: 'circle-radius-find-constant', strand: 'S14', difficulty: 3,
  gen(){
    // 1. Generate circle center (a, 0) and radius R.
    let a, R, k;
    do {
      a = ri(-6, 6);
      R = pick([5, 10, 13]);
      k = R*R - a*a;
    } while (k <= 0 || a === 0); // ensure k is positive

    // 2. Generate point A(x_A, p) with p > 0 and point B(x_B, 0)
    const triples = [
      {R:5, dx:0, dy:5}, {R:5, dx:3, dy:4}, {R:5, dx:4, dy:3},
      {R:10, dx:0, dy:10}, {R:10, dx:6, dy:8}, {R:10, dx:8, dy:6},
      {R:13, dx:0, dy:13}, {R:13, dx:5, dy:12}, {R:13, dx:12, dy:5}
    ].filter(t => t.R === R);
    
    const t = pick(triples);
    const dx = t.dx, dy = t.dy;
    
    const sx = pick([1, -1]); // sign for dx
    const xA = a + sx * dx;
    const xB = a - R; // B is the left x-intercept
    
    // Length AB
    const dist2 = Math.pow(xA - xB, 2) + dy*dy;
    let lenStr;
    if (Number.isInteger(Math.sqrt(dist2))) {
      lenStr = String(Math.sqrt(dist2));
    } else {
      // Simplify surd
      let outside = 1;
      let inside = dist2;
      for (let i = 2; i*i <= inside; i++) {
        while (inside % (i*i) === 0) {
          outside *= i;
          inside /= (i*i);
        }
      }
      lenStr = (outside === 1 ? '' : outside) + '\\sqrt{' + inside + '}';
    }

    // Line AB gradient
    const mAB = dy / (xA - xB);
    const cAB = 0 - mAB * xB;
    const lineEq = lineEqStr(mAB, cAB);

    /* Display helpers for the worked solution. */
    const aMag      = Math.abs(a);
    const xCoefDisp = (a > 0 ? MINUS + ' ' + (2*a) : '+ ' + (2*aMag));
    const xHalfDisp = (a > 0 ? MINUS + ' ' + aMag   : '+ ' + aMag);
    const dxA       = xA - a;   // = sx · dx
    const dxAB      = xA - xB;  // = sx · dx + R

    return Q('crfc|' + a + '|' + R + '|' + xA + '|' + xB + '|' + dy,
      [ T('The circle with equation $x^2 + y^2 ' + (a > 0 ? '- ' + (2*a) : '+ ' + Math.abs(2*a)) + 'x - k = 0$ has radius $' + R + '$.'),
        T('(i) Find the centre of the circle and the value of $k$.'),
        T('The points $A(' + xA + ', p)$ and $B(' + xB + ', 0)$ lie on the circumference of the circle, with $p > 0$.'),
        T('(ii) Calculate the length of $AB$, giving your answer in simplified surd form.'),
        T('(iii) Find an equation for the line $AB$.') ],
      [{ text: '(i) Centre $' + ptStr(a, 0) + '$, $k = ' + k + '$   (ii) $' + lenStr + '$   (iii) $' + lineEq + '$' }],
      [ T('(i) Step 1 — The given equation is $x^2 + y^2 ' + xCoefDisp + 'x - k = 0$, where $k$ is the constant we need to find.'),
        T('Step 2 — Complete the square in $x$: $x^2 ' + xCoefDisp + 'x = \\left(x ' + xHalfDisp + '\\right)^2 - ' + (a*a) + '$.'),
        T('Step 3 — Substituting this back and collecting the constant terms gives $\\left(x ' + xHalfDisp + '\\right)^2 + y^2 = k + ' + (a*a) + '$.'),
        T('Step 4 — Comparing with the standard form $(x - h)^2 + (y - k)^2 = r^2$, the centre is $' + ptStr(a, 0) + '$. The right-hand side is $r^2$, and since the radius is $' + R + '$, we have $k + ' + (a*a) + ' = ' + R + '^2 = ' + (R*R) + '$.'),
        T('Step 5 — Solving for $k$: $k = ' + (R*R) + ' - ' + (a*a) + ' = ' + k + '$.'),
        T('(ii) Step 1 — Substitute $x = ' + xA + '$ into the completed-square form $\\left(x ' + xHalfDisp + '\\right)^2 + y^2 = ' + (R*R) + '$.'),
        T('Step 2 — The $x$-term becomes $(' + xA + ' ' + xHalfDisp + ')^2 = (' + nStr(dxA) + ')^2 = ' + (dxA*dxA) + '$.'),
        T('Step 3 — So $' + (dxA*dxA) + ' + p^2 = ' + (R*R) + '$, giving $p^2 = ' + (R*R) + ' - ' + (dxA*dxA) + ' = ' + (dy*dy) + '$.'),
        T('Step 4 — Since $p > 0$, we take the positive root: $p = ' + dy + '$, so $A = ' + ptStr(xA, dy) + '$.'),
        T('Step 5 — Using the distance formula with $A' + ptStr(xA, dy) + '$ and $B' + ptStr(xB, 0) + '$:'),
        T('$AB = \\sqrt{\\left(' + xA + ' - (' + xB + ')\\right)^2 + \\left(' + dy + ' - 0\\right)^2} = \\sqrt{' + (dxAB*dxAB) + ' + ' + (dy*dy) + '} = ' + lenStr + '$.'),
        T('(iii) Step 1 — Compute the gradient of $AB$:'),
        T('$m_{AB} = \\dfrac{' + dy + ' - 0}{' + xA + ' - (' + xB + ')} = ' + gradientStr(mAB) + '$.'),
        T('Step 2 — Using the point-slope form $y - y_1 = m(x - x_1)$ with the point $B' + ptStr(xB, 0) + '$:'),
        T('$y - 0 = ' + gradientStr(mAB) + '\\left(x - (' + xB + ')\\right)$.'),
        T('Step 3 — Expanding and simplifying gives $' + lineEq + '$.') ]);
  }
};

const tCircleChordTangentTriangle = {
  id: 'circle-chord-tangent-triangle', strand: 'S14', difficulty: 4,
  gen(){
    const R = pick([5, 13]);
    const a = ri(-4, 4);
    const b = ri(-4, 4);
    
    const triples = [[3,4,5],[4,3,5],[6,8,10],[8,6,10],[5,12,13],[12,5,13]];
    const validTriples = triples.filter(t => t[2] === R);
    const [tdx, tdy] = pick(validTriples);
    const sx = pick([1, -1]), sy = pick([1, -1]);
    const x0 = a + sx * tdx;
    const y0 = b + sy * tdy;
    
    const xCoef = -2*a;
    const yCoef = -2*b;
    const constTerm = a*a + b*b - R*R;
    let eqStr = 'x^2 + y^2';
    if (xCoef !== 0) eqStr += (xCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(xCoef) + 'x';
    if (yCoef !== 0) eqStr += (yCoef > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(yCoef) + 'y';
    if (constTerm !== 0) eqStr += (constTerm > 0 ? ' + ' : ' ' + MINUS + ' ') + Math.abs(constTerm);
    eqStr += ' = 0';
    
    const mTan = -(sx * tdx) / (sy * tdy);
    const cTan = y0 - mTan * x0;
    const tanEq = lineEqStr(mTan, cTan);
    
    const xInt = -cTan / mTan;
    const yInt = cTan;
    
    const area = 0.5 * Math.abs(xInt * yInt);
    const areaStr = fracOrIntStr(area);
    
    return Q('cta|' + a + '|' + b + '|' + R + '|' + x0 + '|' + y0,
      [ T('The circle $C$ has equation $' + eqStr + '$.'),
        T('(i) Show that the tangent to $C$ at the point $' + ptStr(x0, y0) + '$ has equation $' + tanEq + '$.'),
        T('(ii) The tangent intersects the $x$-axis at $A$ and the $y$-axis at $B$. Find the area of the triangle $OAB$, where $O$ is the origin.') ],
      [{ text: '(i) See proof. (ii) Area $= ' + areaStr + '$' }],
      [ T('(i) Gradient of radius is $' + gradientStr((y0 - b) / (x0 - a)) + '$.'),
        T('Tangent gradient is $' + gradientStr(mTan) + '$.'),
        T('Using $y - y_1 = m(x - x_1)$: $' + tanEq + '$.'),
        T('(ii) $x$-intercept: set $y=0 \\Rightarrow x = ' + fracOrIntStr(xInt) + '$.'),
        T('$y$-intercept: set $x=0 \\Rightarrow y = ' + fracOrIntStr(yInt) + '$.'),
        T('Area $= \\frac{1}{2} |x \\cdot y| = ' + areaStr + '$.') ]);
  }
};

const tCircleIntersectionRange = {
  id: 'circle-intersection-range', strand: 'S14', difficulty: 3,
  gen(){
    const a = ri(-4, 4), b = ri(-4, 4);
    const r2 = pick([25, 50, 100, 125]);
    const r  = Math.sqrt(r2);
    const m  = pick([1, 2, 3, -1, -2]);

    // Condition: |m·a − b + k| / √(m²+1) < r
    // ⟺  |k + offset| < r·√(m²+1)  with offset = m·a − b
    const offset = m * a - b;

    // Simplify r·√(m²+1) into p·√q with q square-free.
    const inner = r2 * (m*m + 1);
    let p = 1, q = inner;
    for (let i = 2; i*i <= q; i++){
      while (q % (i*i) === 0){ p *= i; q /= (i*i); }
    }

    // Endpoints: k = −offset ± p·√q
    function endpointStr(c, sign){
      const surdPart = p + '\\sqrt{' + q + '}';
      if (c === 0) return (sign < 0 ? MINUS : '') + surdPart;
      return nStr(c) + (sign < 0 ? ' ' + MINUS + ' ' : ' + ') + surdPart;
    }
    const leftStr  = endpointStr(-offset, -1);
    const rightStr = endpointStr(-offset, +1);

    const eq = '(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y ' +
               (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r2;

    return Q('cir|' + a + '|' + b + '|' + r2 + '|' + m,
      [ T('The circle $C$ has equation $' + eq + '$.'),
        T('The line $l$ has equation $y = ' + nStr(m) + 'x + k$, where $k$ is a constant.'),
        T('Find the range of values of $k$ for which the line $l$ intersects the circle $C$ at two distinct points.'),
        T('Give your answer in exact form.') ],
      [{ text: '$' + leftStr + ' < k < ' + rightStr + '$' }],
      [ T('Substitute $y = ' + nStr(m) + 'x + k$ into the circle equation and set the discriminant $\\Delta > 0$; equivalently, require the perpendicular distance from the centre $' + ptStr(a, b) + '$ to the line to be less than $r$:'),
        T('$\\frac{|' + nStr(m) + '(' + a + ') - (' + b + ') + k|}{\\sqrt{' + nStr(m) + '^2 + 1}} < ' + r + '$'),
        T('$|k ' + (offset >= 0 ? '+ ' + offset : MINUS + ' ' + Math.abs(offset)) + '| < ' + p + '\\sqrt{' + q + '}$'),
        T('$' + leftStr + ' < k < ' + rightStr + '$') ]);
  }
};

const tCircleParametricInside = {
  id: 'circle-parametric-inside', strand: 'S14', difficulty: 3,
  gen(){
    const a = ri(-4, 4), b = ri(-4, 4);
    const r = pick([5, 10, 13]);
    const m = pick([1, 2, -1, -2]);
    const c = ri(-5, 5);
    
    const eq = '(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r*r;
    
    // Point P is (k, mk+c). For P to be inside, (k-a)^2 + (mk+c-b)^2 < r^2
    // (1+m^2)k^2 + 2(-a + m(c-b))k + (a^2 + (c-b)^2 - r^2) < 0
    const A = 1 + m*m;
    const B = 2*(-a + m*(c-b));
    const C = a*a + (c-b)*(c-b) - r*r;
    
    const disc = B*B - 4*A*C;
    if (disc <= 0) return tCircleParametricInside.gen(); // Must intersect to have an inside region
    
    const k1 = (-B - Math.sqrt(disc)) / (2*A);
    const k2 = (-B + Math.sqrt(disc)) / (2*A);
    
    const k1Str = k1.toFixed(2);
    const k2Str = k2.toFixed(2);

    return Q('cpi|' + a + '|' + b + '|' + r + '|' + m + '|' + c,
      [ T('The circle $C$ has equation $' + eq + '$.'),
        T('The point $P$ has coordinates $(k, ' + nStr(m) + 'k ' + (c >= 0 ? '+ ' + c : MINUS + ' ' + Math.abs(c)) + ')$ and lies inside the circle.'),
        T('Find the set of possible values of $k$.') ],
      [{ text: '$' + k1Str + ' < k < ' + k2Str + '$' }],
      [ T('For $P$ to be inside the circle, its distance to the centre must be less than the radius:'),
        T('$(k ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (' + nStr(m) + 'k ' + (c >= 0 ? '+ ' + c : MINUS + ' ' + Math.abs(c)) + ' ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 < ' + r + '^2$'),
        T('Expand and simplify: $' + A + 'k^2 ' + (B >= 0 ? '+ ' + B : MINUS + ' ' + Math.abs(B)) + 'k ' + (C >= 0 ? '+ ' + C : MINUS + ' ' + Math.abs(C)) + ' < 0$.'),
        T('Find the roots of the corresponding quadratic equation:'),
        T('$k = ' + k1Str + '$ or $k = ' + k2Str + '$.'),
        T('Since the coefficient of $k^2$ is positive, the inequality holds between the roots:'),
        T('$' + k1Str + ' < k < ' + k2Str + '$.') ]);
  }
};

const tCircleIntersectionArea = {
  id: 'circle-intersection-area', strand: 'S14', difficulty: 4,
  gen(){
    // Generate a circle and a line that intersects it
    const a = ri(-3, 3), b = ri(-3, 3);
    const r = pick([5, 10, 13]);
    const m = pick([1, -1, 2, -2]);
    
    const eq = '(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (y ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r*r;
    
    // Line y = mx
    // (1+m^2)x^2 - 2(a+mb)x + (a^2+b^2-r^2) = 0
    const A = 1 + m*m;
    const B = -2*(a + m*b);
    const C = a*a + b*b - r*r;
    const disc = B*B - 4*A*C;
    if (disc <= 0) return tCircleIntersectionArea.gen();
    
    const x1 = (-B - Math.sqrt(disc)) / (2*A);
    const x2 = (-B + Math.sqrt(disc)) / (2*A);
    const y1 = m * x1;
    const y2 = m * x2;
    
    // Area of triangle with vertices C(a,b), P1(x1,y1), P2(x2,y2)
    // Base = distance P1P2. Height = perpendicular distance from C to line y = mx.
    const base = Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1));
    const height = Math.abs(m*a - b) / Math.sqrt(m*m + 1);
    const area = 0.5 * base * height;
    
    // Format area to 2 d.p. if not integer
    const areaStr = Number.isInteger(area) ? String(area) : area.toFixed(2);

    return Q('cia|' + a + '|' + b + '|' + r + '|' + m,
      [ T('The circle $C$ has equation $' + eq + '$.'),
        T('The line $l$ has equation $y = ' + nStr(m) + 'x$.'),
        T('(i) Find the coordinates of the two points of intersection of $l$ and $C$.'),
        T('(ii) Hence find the area of the triangle formed by the centre of the circle and these two points of intersection.') ],
      [{ text: '(i) $' + ptFracStr(x1, y1) + '$ and $' + ptFracStr(x2, y2) + '$ (ii) Area $= ' + areaStr + '$' }],
      [ T('(i) Substitute $y = ' + nStr(m) + 'x$ into the circle equation:'),
        T('$(x ' + (a >= 0 ? '- ' + a : '+ ' + Math.abs(a)) + ')^2 + (' + nStr(m) + 'x ' + (b >= 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2 = ' + r*r + '$'),
        T('Expand: $' + A + 'x^2 ' + (B >= 0 ? '+ ' + B : MINUS + ' ' + Math.abs(B)) + 'x ' + (C >= 0 ? '+ ' + C : MINUS + ' ' + Math.abs(C)) + ' = 0$.'),
        T('Using the quadratic formula gives $x = ' + x1.toFixed(2) + '$ or $x = ' + x2.toFixed(2) + '$.'),
        T('The points are $' + ptFracStr(x1, y1) + '$ and $' + ptFracStr(x2, y2) + '$.'),
        T('(ii) The length of the base is the distance between the two points:'),
        T('Base $= \\sqrt{(' + x2.toFixed(2) + ' - ' + x1.toFixed(2) + ')^2 + (' + y2.toFixed(2) + ' - ' + y1.toFixed(2) + ')^2} = ' + base.toFixed(2) + '$.'),
        T('The height is the perpendicular distance from the centre $' + ptStr(a, b) + '$ to the line:'),
        T('Height $= \\frac{|' + nStr(m) + '(' + a + ') - (' + b + ')|}{\\sqrt{' + nStr(m) + '^2 + 1}} = ' + height.toFixed(2) + '$.'),
        T('Area $= \\frac{1}{2} \\times ' + base.toFixed(2) + ' \\times ' + height.toFixed(2) + ' = ' + areaStr + '$.') ]);
  }

const tRightAngledCircumcircle = {
  id: 'right-angled-circumcircle', strand: 'S15', difficulty: 3,
  gen(){
    // Construct a right-angled triangle: A is the right angle.
    // B = A + (u, v), C = A + (k*v, -k*u) guarantees perpendicularity.
    const k = pick([1, 2, 3]);
    let u, v;
    do {
      u = pick([-3, -2, -1, 1, 2, 3]);
      v = pick([-3, -2, -1, 1, 2, 3]);
    } while (u === 0 || v === 0);
    
    const x0 = ri(-4, 4), y0 = ri(-4, 4);
    const pts = [
      { x: x0, y: y0 }, // right angle
      { x: x0 + u, y: y0 + v },
      { x: x0 + k*v, y: y0 - k*u }
    ];
    
    // Shuffle labels A, B, C
    const shuffled = shuffle(pts.slice());
    const A = shuffled[0], B = shuffled[1], C = shuffled[2];

    // Identify the right angle
    const dAB = (A.x-B.x)**2 + (A.y-B.y)**2;
    const dBC = (B.x-C.x)**2 + (B.y-C.y)**2;
    const dAC = (A.x-C.x)**2 + (A.y-C.y)**2;
    
    let rightAngle, side1, side2, hyp2, Mx, My, oppA;
    if (dAB + dAC === dBC) { rightAngle = 'A'; side1 = dAB; side2 = dAC; hyp2 = dBC; Mx = (B.x+C.x)/2; My = (B.y+C.y)/2; oppA = B; }
    else if (dAB + dBC === dAC) { rightAngle = 'B'; side1 = dAB; side2 = dBC; hyp2 = dAC; Mx = (A.x+C.x)/2; My = (A.y+C.y)/2; oppA = A; }
    else { rightAngle = 'C'; side1 = dAC; side2 = dBC; hyp2 = dAB; Mx = (A.x+B.x)/2; My = (A.y+B.y)/2; oppA = A; }

    // Circumcircle equation: x^2 + y^2 + ax + by + c = 0
    // Center is (Mx, My), so a = -2Mx, b = -2My.
    // c = Mx^2 + My^2 - R^2, where R^2 = (oppA.x - Mx)^2 + (oppA.y - My)^2
    const R2 = (oppA.x - Mx)**2 + (oppA.y - My)**2;
    const aCoeff = -2 * Mx;
    const bCoeff = -2 * My;
    const cCoeff = Mx*Mx + My*My - R2;

    let eqStr = 'x^2 + y^2';
    if (aCoeff !== 0) eqStr += (aCoeff > 0 ? ' + ' + aCoeff : ' ' + MINUS + ' ' + Math.abs(aCoeff)) + 'x';
    if (bCoeff !== 0) eqStr += (bCoeff > 0 ? ' + ' + bCoeff : ' ' + MINUS + ' ' + Math.abs(bCoeff)) + 'y';
    if (cCoeff !== 0) eqStr += (cCoeff > 0 ? ' + ' + cCoeff : ' ' + MINUS + ' ' + Math.abs(cCoeff));
    eqStr += ' = 0';

    /* Display helpers for the worked solution.
       Mx and My may be half-integers; fracOrIntStr renders them as
       proper KaTeX fractions (e.g. \frac{7}{2}) rather than decimals. */
    const MxStr = fracOrIntStr(Mx);
    const MyStr = fracOrIntStr(My);
    const R2Str = fracOrIntStr(R2);

    const xSq = Mx === 0
      ? 'x^2'
      : (Mx > 0 ? '(x - ' + MxStr + ')^2'
                : '(x + ' + fracOrIntStr(-Mx) + ')^2');
    const ySq = My === 0
      ? 'y^2'
      : (My > 0 ? '(y - ' + MyStr + ')^2'
                : '(y + ' + fracOrIntStr(-My) + ')^2');

    return Q('rac|' + A.x + '|' + A.y + '|' + B.x + '|' + B.y + '|' + C.x + '|' + C.y,
      [ T('The points $A' + ptStr(A.x, A.y) + '$, $B' + ptStr(B.x, B.y) + '$ and $C' + ptStr(C.x, C.y) + '$ are joined to form a triangle.'),
        T('(i) Show that this triangle is right-angled and state whether the right angle is at $A$, $B$ or $C$.'),
        T('(ii) The points $A$, $B$ and $C$ lie on the circumference of a circle. Find the equation of the circle in the form $x^2 + y^2 + ax + by + c = 0$.') ],
      [{ text: '(i) Right angle at $' + rightAngle + '$. (ii) $' + eqStr + '$' }],
      [ T('(i) Step 1 ŌĆö Compute the three squared side lengths using $d^2 = (x_2 - x_1)^2 + (y_2 - y_1)^2$:'),

const tTriangleAreaCircumcircle = {
  id: 'triangle-area-circumcircle', strand: 'S15', difficulty: 3,
  gen(){
    const k = pick([1, 2, 3]);
    let u, v;
    do {
      u = pick([-3, -2, -1, 1, 2, 3]);
      v = pick([-3, -2, -1, 1, 2, 3]);
    } while (u === 0 || v === 0);
    
    const x0 = ri(-4, 4), y0 = ri(-4, 4);
    const pts = [
      { x: x0, y: y0 }, // right angle
      { x: x0 + u, y: y0 + v },
      { x: x0 + k*v, y: y0 - k*u }
    ];
    
    const shuffled = shuffle(pts.slice());
    const A = shuffled[0], B = shuffled[1], C = shuffled[2];

    const dAB = (A.x-B.x)**2 + (A.y-B.y)**2;
    const dBC = (B.x-C.x)**2 + (B.y-C.y)**2;
    const dAC = (A.x-C.x)**2 + (A.y-C.y)**2;
    
    let rightAngle, side1, side2, hyp2, Mx, My, oppA;
    if (dAB + dAC === dBC) { rightAngle = 'A'; side1 = dAB; side2 = dAC; hyp2 = dBC; Mx = (B.x+C.x)/2; My = (B.y+C.y)/2; oppA = B; }
    else if (dAB + dBC === dAC) { rightAngle = 'B'; side1 = dAB; side2 = dBC; hyp2 = dAC; Mx = (A.x+C.x)/2; My = (A.y+C.y)/2; oppA = A; }
    else { rightAngle = 'C'; side1 = dAC; side2 = dBC; hyp2 = dAB; Mx = (A.x+B.x)/2; My = (A.y+B.y)/2; oppA = A; }

    // Area
    const area = 0.5 * Math.sqrt(side1 * side2);
    const areaStr = Number.isInteger(area) ? String(area) : area.toFixed(2);

    const R2 = (oppA.x - Mx)**2 + (oppA.y - My)**2;
    const aCoeff = -2 * Mx;
    const bCoeff = -2 * My;
    const cCoeff = Mx*Mx + My*My - R2;

    let eqStr = 'x^2 + y^2';
    if (aCoeff !== 0) eqStr += (aCoeff > 0 ? ' + ' + aCoeff : ' ' + MINUS + ' ' + Math.abs(aCoeff)) + 'x';
    if (bCoeff !== 0) eqStr += (bCoeff > 0 ? ' + ' + bCoeff : ' ' + MINUS + ' ' + Math.abs(bCoeff)) + 'y';
    if (cCoeff !== 0) eqStr += (cCoeff > 0 ? ' + ' + cCoeff : ' ' + MINUS + ' ' + Math.abs(cCoeff));
    eqStr += ' = 0';

    return Q('tac|' + A.x + '|' + A.y + '|' + B.x + '|' + B.y + '|' + C.x + '|' + C.y,
      [ T('The points $A' + ptStr(A.x, A.y) + '$, $B' + ptStr(B.x, B.y) + '$ and $C' + ptStr(C.x, C.y) + '$ are joined to form a triangle.'),
        T('(i) Show that this triangle is right-angled and state whether the right angle is at $A$, $B$ or $C$.'),
        T('(ii) Find the exact area of the triangle $ABC$.') ],
      [{ text: '(i) Right angle at $' + rightAngle + '$. (ii) Area $= ' + areaStr + '$' }],
      [ T('(i) $AB^2 = ' + dAB + '$, $BC^2 = ' + dBC + '$, $AC^2 = ' + dAC + '$.'),
        T('Since $' + side1 + ' + ' + side2 + ' = ' + hyp2 + '$, the triangle is right-angled at $' + rightAngle + '$.'),
        T('(ii) Area $= \\frac{1}{2} \\times \\text{base} \\times \\text{height} = \\frac{1}{2} \\times \\sqrt{' + side1 + '} \\times \\sqrt{' + side2 + '} = ' + areaStr + '$.') ]);

    };
    const R = pick([5, 13, 17]);

    do {
      p1 = pick(pts);
      p2 = pick(pts);
      D = p1[0]*p2[1] - p2[0]*p1[1];

        T('Using $y - y_1 = m(x - x_1)$ with $A' + ptStr(xA, yA) + '$:'),
        T('$y - (' + yA + ') = ' + gradientStr(-dx/dy) + '(x - (' + xA + '))$.'),

const tHiddenVertexArea = {
  id: 'hidden-vertex-area',
  strand: 'S5',
  difficulty: 4,
  gen(){
    let x1, y1, x2, y2, k, yc, tries = 0;

    do {
      x1 = ri(-5, 5);
      y1 = ri(-5, 5);
      x2 = ri(-5, 5);
      y2 = ri(-5, 5);
      k = ri(-5, 5);

      // C must have the same distance from A and B:
      // (k - x1)^2 + (yc - y1)^2 = (k - x2)^2 + (yc - y2)^2
      const a = 2 * (y2 - y1);
      const b = (k - x1) * (k - x1) - (k - x2) * (k - x2) + y1 * y1 - y2 * y2;

      if (a !== 0 && b % a === 0){
        yc = -b / a;
      } else {
        yc = null;
      }

      tries++;
    } while (
      yc === null ||
      !Number.isInteger(yc) ||
      Math.abs(yc) > 8 ||
      (x1 === x2 && y1 === y2) ||
      (k === x1 && yc === y1) ||
      (k === x2 && yc === y2) ||
      tries < 1
    );

    const area2 = Math.abs(
      x1 * (y2 - yc) + x2 * (yc - y1) + k * (y1 - y2)
    );
    const area = area2 / 2;
    const areaStr = fracOrIntStr(area);

    return Q(
      'hidden-vertex-area|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + k,
      [
        T('The points $A$ and $B$ have coordinates $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$ respectively.'),

      [
        { text: '(a) $C = ' + ptStr(k, yc) + '$' },
        { text: '(b) Area $= ' + areaStr + '$' }

      [
        T('Since $C$ is equidistant from $A$ and $B$, it lies on the perpendicular bisector of $AB$.'),
        T('Let $C = (' + k + ', y)$. Then:'),
        T('$((' + k + ') - (' + x1 + '))^2 + (y - (' + y1 + '))^2 = ((' + k + ') - (' + x2 + '))^2 + (y - (' + y2 + '))^2$.'),
        T('Expanding and simplifying gives $y = ' + yc + '$.'),
        T('Therefore $C = ' + ptStr(k, yc) + '$.'),

const tMultiPartLineAndDistance = {
  id: 'line-multipart-distance', strand: 'S9', difficulty: 2,
  gen(){
    // Pick A, B, and parametrisation line C = (k, mLine·k + cLine).
    // Construct B after choosing A and the C-line, so that the discriminant
    // of AC² = D² has two integer roots.
    let x1, y1, mLine, cLine, k1, k2, D2, ok = false;

    for (let attempt = 0; attempt < 300 && !ok; attempt++){
      x1 = ri(-5, 5); y1 = ri(-5, 5);
      mLine = pick([1, 2, -1, -2, 3, -3]);
      cLine = ri(-5, 5);

      // For integer k1, k2 with AC1² = AC2², we need
      //   k1 + k2 = 2(x1 + mLine·y1 − mLine·cLine) / (1 + mLine²)
      // to be an integer, and D² to be a small nice value.
      const num = 2 * (x1 + mLine*y1 - mLine*cLine);
      const den = 1 + mLine*mLine;
      if (num % den !== 0) continue;
      const kSum = num / den;

      // Try a few integer splittings kSum = k1 + k2.
      for (let d = 1; d <= 20 && !ok; d++){
        if ((kSum - d) % 2 !== 0) continue;
        const ka = (kSum - d) / 2;
        const kb = (kSum + d) / 2;
        const Da2 = (ka - x1)**2 + (mLine*ka + cLine - y1)**2;
        if (Da2 <= 0 || Da2 > 200) continue;
        if (!Number.isInteger(Math.sqrt(Da2))) continue;
        k1 = ka; k2 = kb; D2 = Da2;
        ok = true;
      }
    }
    if (!ok) return tMultiPartLineAndDistance.gen();

    // Pick B so that A ≠ B and B is not on the C-line (avoids degenerate cases).
    let x2, y2;
    do {
      x2 = ri(-5, 5); y2 = ri(-5, 5);
    } while ((x1 === x2 && y1 === y2) || (mLine*x2 + cLine === y2));

    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }
    const mABStr = gradientFracStr(num, den);
    const mPerpStr = gradientFracStr(-den, num);

    // Line AB: num·x − den·y = num·x1 − den·y1. Normalise p ≥ 0.
    let p = num, q = -den, rr = num*x1 - den*y1;
    if (p < 0 || (p === 0 && q < 0)) { p = -p; q = -q; rr = -rr; }
    const lineAB = lineStandardStr(p, q, rr);

    // Perpendicular bisector: 2·den·x + 2·num·y = den·(x1+x2) + num·(y1+y2).
    let pPerp = 2*den, qPerp = 2*num, rPerp = den*(x1+x2) + num*(y1+y2);
    const gp = gcd(gcd(Math.abs(pPerp), Math.abs(qPerp)), Math.abs(rPerp)) || 1;
    pPerp /= gp; qPerp /= gp; rPerp /= gp;
    if (pPerp < 0 || (pPerp === 0 && qPerp < 0)) { pPerp = -pPerp; qPerp = -qPerp; rPerp = -rPerp; }
    const perpEq = lineStandardStr(pPerp, qPerp, rPerp);

    const D = Math.sqrt(D2);
    const yExpr = (mLine === 1)  ? 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine))
                : (mLine === -1) ? MINUS + 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine))
                : nStr(mLine) + 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine));

    // ---------- Worked-solution scaffolding for part (c) ----------
    // C is (k, mLine·k + cLine), so y_C − y_A = mLine·k + (cLine − y1).
    // Substituting into AC² = D² gives
    //   (k − x1)² + (mLine·k + (cLine − y1))² = D²
    // Expanding and collecting in k gives Aq·k² + Bq·k + Cq = 0 with
    //   Aq = 1 + mLine²,  Bq = −2·x1 + 2·mLine·(cLine − y1),  Cq = x1² + (cLine − y1)² − D²
    const dShift = cLine - y1;
    const Aq = 1 + mLine*mLine;
    const Bq = -2*x1 + 2*mLine*dShift;
    const Cq = x1*x1 + dShift*dShift - D2;
    const discQ = Bq*Bq - 4*Aq*Cq;

    // Formatting helpers (only used inside this generator)
    const signed = (c) => c === 0 ? '' : (c > 0 ? ' + ' + c : ' ' + MINUS + ' ' + Math.abs(c));
    const secondInner = (mLine === 1 ? 'k'
                       : mLine === -1 ? MINUS + 'k'
                       : nStr(mLine) + 'k')
                      + (dShift === 0 ? '' : (dShift > 0 ? ' + ' + dShift : ' ' + MINUS + ' ' + Math.abs(dShift)));
    const firstExp = 'k^2'
                   + (-2*x1 === 0 ? '' : signed(-2*x1) + 'k')
                   + (x1*x1 !== 0 ? ' + ' + (x1*x1) : '');
    const a2 = mLine*mLine, b2 = 2*mLine*dShift, c2 = dShift*dShift;
    const secondExp = (a2 === 1 ? 'k^2' : a2 + 'k^2')
                    + (b2 === 0 ? '' : signed(b2) + 'k')
                    + (c2 === 0 ? '' : signed(c2));
    const quadStr = Aq + 'k^2'
                  + (Bq === 0 ? '' : signed(Bq) + 'k')
                  + (Cq === 0 ? '' : signed(Cq))
                  + ' = 0';
    const minusB = -Bq;
    const twoA = 2 * Aq;

    return Q('lmpdist|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + mLine + '|' + cLine + '|' + k1 + '|' + k2,
      [ T('The point $A$ has coordinates $' + ptStr(x1, y1) + '$ and the point $B$ has coordinates $' + ptStr(x2, y2) + '$.'),
        T('(a) (i) Find the gradient of $AB$.'),
        T('(ii) Hence find an equation of the line $AB$, giving your answer in the form $px + qy = r$, where $p$, $q$ and $r$ are integers.'),
        T('(b) The midpoint of $AB$ is $M$.'),
        T('(i) Find the coordinates of $M$.'),
        T('(ii) Find an equation of the line which passes through $M$ and which is perpendicular to $AB$, giving your answer in the form $px + qy = r$, where $p$, $q$ and $r$ are integers.'),
        T('(c) The point $C$ has coordinates $(' + 'k' + ', ' + yExpr + ')$. Given that the distance from $A$ to $C$ is $' + D + '$, find the two possible values of the constant $k$.') ],
      [{ text: '(a)(i) $m = ' + mABStr + '$  (a)(ii) $' + lineAB + '$  (b)(i) $M' + ptFracStr(mx, my) + '$  (b)(ii) $' + perpEq + '$  (c) $k = ' + k1 + '$ or $k = ' + k2 + '$' }],
      [ T('(a)(i) $m = \\frac{' + y2 + ' - (' + y1 + ')}{' + x2 + ' - (' + x1 + ')} = ' + mABStr + '$.'),
        T('(a)(ii) Using $y - y_1 = m(x - x_1)$:  $y - (' + y1 + ') = ' + mABStr + '(x - (' + x1 + '))$.'),
        T('Rearranging gives $' + lineAB + '$.'),
        T('(b)(i) $M = \\left(\\frac{' + x1 + ' + (' + x2 + ')}{2}, \\frac{' + y1 + ' + (' + y2 + ')}{2}\\right) = ' + ptFracStr(mx, my) + '$.'),
        T('(b)(ii) Perpendicular gradient $= ' + mPerpStr + '$. Using point-slope form with $M$, then rearranging to integer coefficients, gives $' + perpEq + '$.'),
        T('(c) Step 1 — For $C\\left(k, ' + yExpr + '\\right)$ the vertical separation is $y_C - y_A = (' + yExpr + ') - (' + y1 + ') = ' + secondInner + '$.'),
        T('So $AC = ' + D + '$ becomes $(k - (' + x1 + '))^2 + (' + secondInner + ')^2 = ' + D2 + '$.'),
        T('Step 2 — Expand the first square: $' + firstExp + '$.'),
        T('Step 3 — Expand the second square: $' + secondExp + '$.'),
        T('Step 4 — Add the two expansions and subtract $' + D2 + '$: $' + quadStr + '$.'),
        T('Step 5 — Apply the quadratic formula with $A = ' + Aq + '$, $B = ' + Bq + '$, $C = ' + Cq + '$:'),

const tLineFromPerpBisector = {
  id: 'line-from-perp-bisector', strand: 'S9', difficulty: 2,
  gen(){
    // Construct A, B so that the perpendicular bisector has integer coefficients.
    let x1, y1, x2, y2;
    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5);
      x2 = ri(-5, 5); y2 = ri(-5, 5);
    } while (x1 === x2 || y1 === y2);

    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }

    // Perpendicular bisector in integer form:
    // den·x + num·y = den·mx + num·my
    // Multiply by 2 to clear half-integer M.
    let pPerp = 2*den, qPerp = 2*num, rPerp = den*(x1+x2) + num*(y1+y2);
    const gp = gcd(gcd(Math.abs(pPerp), Math.abs(qPerp)), Math.abs(rPerp)) || 1;
    pPerp /= gp; qPerp /= gp; rPerp /= gp;
    if (pPerp < 0 || (pPerp === 0 && qPerp < 0)) { pPerp = -pPerp; qPerp = -qPerp; rPerp = -rPerp; }
    const perpEq = lineStandardStr(pPerp, qPerp, rPerp);
    const mPerpStr = gradientFracStr(-den, num);
    const mABStr = gradientFracStr(num, den);

    // Part (c) parametrisation — same constructive approach as the main generator.
    let mLine, cLine, k1, k2, D2, ok = false;
    for (let attempt = 0; attempt < 300 && !ok; attempt++){
      mLine = pick([1, 2, -1, -2]);
      cLine = ri(-5, 5);
      const numSum = 2 * (x1 + mLine*y1 - mLine*cLine);
      const denSum = 1 + mLine*mLine;
      if (numSum % denSum !== 0) continue;
      const kSum = numSum / denSum;
      for (let d = 1; d <= 20 && !ok; d++){
        if ((kSum - d) % 2 !== 0) continue;
        const ka = (kSum - d) / 2, kb = (kSum + d) / 2;
        const Da2 = (ka - x1)**2 + (mLine*ka + cLine - y1)**2;
        if (Da2 <= 0 || Da2 > 200) continue;
        if (!Number.isInteger(Math.sqrt(Da2))) continue;
        k1 = ka; k2 = kb; D2 = Da2; ok = true;
      }
    }
    if (!ok) return tLineFromPerpBisector.gen();

    const D = Math.sqrt(D2);
    const yExpr = (mLine === 1)  ? 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine))
                : (mLine === -1) ? MINUS + 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine))
                : nStr(mLine) + 'k' + (cLine >= 0 ? ' + ' + cLine : ' ' + MINUS + ' ' + Math.abs(cLine));

    return Q('lfpb|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + mLine + '|' + cLine + '|' + k1 + '|' + k2,
      [ T('The point $A$ has coordinates $' + ptStr(x1, y1) + '$. The perpendicular bisector of $AB$ has equation $' + perpEq + '$.'),
        T('(a) Find the gradient of $AB$.'),
        T('(b) Find an equation of the line $AB$, giving your answer in the form $px + qy = r$, where $p$, $q$ and $r$ are integers.'),
        T('(c) Find the coordinates of $M$, the midpoint of $AB$.'),
        T('(d) Find the coordinates of $B$.'),
        T('(e) The point $C$ has coordinates $(k, ' + yExpr + ')$. Given that $AC = ' + D + '$, find the two possible values of $k$.') ],
      [{ text: '(a) $m = ' + mABStr + '$  (b) $' + (function(){
          // Line AB through A with gradient num/den.
          let p = num, q = -den, rr = num*x1 - den*y1;
          if (p < 0 || (p === 0 && q < 0)) { p = -p; q = -q; rr = -rr; }
          return lineStandardStr(p, q, rr);
        })() + '$  (c) $M' + ptFracStr(mx, my) + '$  (d) $B' + ptStr(x2, y2) + '$  (e) $k = ' + k1 + '$ or $k = ' + k2 + '$' }],
      [ T('(a) The perpendicular bisector has gradient $' + mPerpStr + '$, so $m_{AB} = ' + mABStr + '$.'),
        T('(b) Using $y - y_1 = m(x - x_1)$ with $A' + ptStr(x1, y1) + '$, then rearranging to integer coefficients.'),
        T('(c) $M$ is the intersection of $AB$ with the perpendicular bisector; solving simultaneously gives $M' + ptFracStr(mx, my) + '$.'),
        T('(d) $M$ is the midpoint of $AB$, so $B = 2M - A = ' + ptStr(x2, y2) + '$.'),
        T('(e) $AC^2 = (k - (' + x1 + '))^2 + (' + yExpr + ' - (' + y1 + '))^2 = ' + D2 + '$, giving $k = ' + k1 + '$ or $k = ' + k2 + '$.') ]);
  }
};

const tPerpBisectorLocus = {
  id: 'perp-bisector-locus', strand: 'S9', difficulty: 2,
  gen(){
    let x1, y1, x2, y2;
    do {
      x1 = ri(-5, 5); y1 = ri(-5, 5);
      x2 = ri(-5, 5); y2 = ri(-5, 5);
    } while (x1 === x2 || y1 === y2);

    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const dx = x2 - x1, dy = y2 - y1;
    const g = gcd(Math.abs(dy), Math.abs(dx));
    let num = dy / g, den = dx / g;
    if (den < 0){ num = -num; den = -den; }

    // Perpendicular bisector: 2·den·x + 2·num·y = den·(x1+x2) + num·(y1+y2)
    let pPerp = 2*den, qPerp = 2*num, rPerp = den*(x1+x2) + num*(y1+y2);
    const gp = gcd(gcd(Math.abs(pPerp), Math.abs(qPerp)), Math.abs(rPerp)) || 1;
    pPerp /= gp; qPerp /= gp; rPerp /= gp;
    if (pPerp < 0 || (pPerp === 0 && qPerp < 0)) { pPerp = -pPerp; qPerp = -qPerp; rPerp = -rPerp; }
    const perpEq = lineStandardStr(pPerp, qPerp, rPerp);
    const mABStr = gradientFracStr(num, den);
    const mPerpStr = gradientFracStr(-den, num);

    // Third line L: pick an integer-slope line through a nice point so that
    // the intersection with the perpendicular bisector has integer coordinates.
    // Simplest: pick intersection point P = (px, py) with small integers,
    // then choose m3 so that L has integer intercept.
    let px, py, m3, c3, ok3 = false;
    for (let attempt = 0; attempt < 200 && !ok3; attempt++){
      px = ri(-4, 4); py = ri(-4, 4);
      // P must lie on perpendicular bisector:
      // pPerp·px + qPerp·py must equal rPerp
      if (pPerp*px + qPerp*py !== rPerp) continue;
      m3 = pick([-2, -1, 1, 2]);
      c3 = py - m3*px;
      ok3 = true;
    }
    if (!ok3) return tPerpBisectorLocus.gen();

    const lineL = lineEqStr(m3, c3);
    // Distance PA = PB (they must be equal since P is on the perpendicular bisector).

    const PAStr = Number.isInteger(PA) ? String(PA) : '\\sqrt{' + PA2 + '}';

    return Q('pbloc|' + x1 + '|' + y1 + '|' + x2 + '|' + y2 + '|' + px + '|' + py + '|' + m3 + '|' + c3,
      [ T('The points $A$ and $B$ have coordinates $' + ptStr(x1, y1) + '$ and $' + ptStr(x2, y2) + '$.'),
        T('(a) Find the gradient of $AB$.'),
        T('(b) Find the coordinates of the midpoint $M$ of $AB$.'),
        T('(c) Find an equation of the perpendicular bisector of $AB$, giving your answer in the form $px + qy = r$, where $p$, $q$ and $r$ are integers.'),
        T('(d) The line with equation $' + lineL + '$ intersects the perpendicular bisector of $AB$ at $P$. Find the coordinates of $P$.'),
        T('(e) Find the exact length $PA$.') ],
      [{ text: '(a) $m = ' + mABStr + '$  (b) $M' + ptFracStr(mx, my) + '$  (c) $' + perpEq + '$  (d) $P' + ptStr(px, py) + '$  (e) $PA = ' + PAStr + '$' }],
      [ T('(a) $m_{AB} = ' + mABStr + '$.'),
        T('(b) $M = ' + ptFracStr(mx, my) + '$.'),
        T('(c) The perpendicular bisector passes through $M$ with gradient $' + mPerpStr + '$. Rearranging to integer coefficients gives $' + perpEq + '$.'),
        T('(d) Solving $' + perpEq + '$ simultaneously with $' + lineL + '$ gives $P' + ptStr(px, py) + '$.'),
        T('(e) $PA = \\sqrt{(' + px + ' - (' + x1 + '))^2 + (' + py + ' - (' + y1 + '))^2} = ' + PAStr + '$.'),
        T('(Since $P$ lies on the perpendicular bisector of $AB$, we also have $PB = ' + PAStr + '$ by symmetry.)') ]);
  }
};

/* -------- S17: Radical Axis and Common Chord -------- */

const tRadicalAxisChord = {
  id: 'radical-axis-chord', strand: 'S17', difficulty: 4,

    // Circle 1: (x - a1)^2 + (y - b1)^2 = r1^2
    // Circle 2: (x - a2)^2 + (y - b2)^2 = r2^2
    // Radical axis: subtract => 2(a2-a1)x + 2(b2-b1)y + (a1^2+b1^2-r1^2 - a2^2-b2^2+r2^2) = 0.
    // We want the common chord length to be an integer or simple surd.

    let a1, b1, r1, a2, b2, r2, ok = false;
    for (let tries = 0; tries < 200 && !ok; tries++){
      a1 = ri(-4, 4); b1 = ri(-4, 4); r1 = pick([5, 10, 13]);
      a2 = ri(-4, 4); b2 = ri(-4, 4); r2 = pick([5, 10, 13]);
      if (a1 === a2 && b1 === b2) continue;

      const d2 = (a1-a2)**2 + (b1-b2)**2;
      const rSum = r1 + r2;
      const rDiff = Math.abs(r1 - r2);
      if (d2 >= rSum*rSum || d2 <= rDiff*rDiff) continue; // must intersect in two points

      // Radical axis coefficients
      const A = 2*(a2 - a1);
      const B = 2*(b2 - b1);
      const C = (a1*a1 + b1*b1 - r1*r1) - (a2*a2 + b2*b2 - r2*r2);
      // Simplify by GCD
      const g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
      const Ax = A/g, By = B/g, Cc = C/g;

      // Distance from centre 1 to radical axis
      const dist = Math.abs(Ax*a1 + By*b1 + Cc) / Math.sqrt(Ax*Ax + By*By);
      const halfChord2 = r1*r1 - dist*dist;
      if (halfChord2 <= 0) continue;

      const halfChord = Math.sqrt(halfChord2);
      // Check if chord length is nice (integer or simple surd)
      const chord2 = 4 * halfChord2;
      const chord = Math.sqrt(chord2);
      if (Number.isInteger(chord) || (Number.isInteger(Math.sqrt(chord2)) === false && chord2 < 200)){
        // accept
      } else {
        continue;
      }
      ok = true;
    }
    if (!ok) return tRadicalAxisChord.gen();

    const A = 2*(a2 - a1), B = 2*(b2 - b1), C = (a1*a1 + b1*b1 - r1*r1) - (a2*a2 + b2*b2 - r2*r2);
    const g = gcd(gcd(Math.abs(A), Math.abs(B)), Math.abs(C)) || 1;
    const Ax = A/g, By = B/g, Cc = C/g;

    function circleEq(a, b, r){

      const yPart = b === 0 ? 'y^2' : '(y ' + (b > 0 ? '- ' + b : '+ ' + Math.abs(b)) + ')^2';

    }

    const eq1 = circleEq(a1, b1, r1);
    const eq2 = circleEq(a2, b2, r2);

    // Radical axis equation in general form

    if (Ax !== 0) radEq += (Ax === 1 ? 'x' : Ax === -1 ? MINUS + 'x' : nStr(Ax) + 'x');

    if (Cc !== 0) radEq += (radEq ? (Cc > 0 ? ' + ' : ' ' + MINUS + ' ') : (Cc === 1 ? '' : Cc === -1 ? MINUS : nStr(Cc))) + Math.abs(Cc);

    const chordStr = Number.isInteger(chord) ? String(chord) : '2\\sqrt{' + (chord2/4) + '}';

    return Q('rad|' + a1 + '|' + b1 + '|' + r1 + '|' + a2 + '|' + b2 + '|' + r2,
