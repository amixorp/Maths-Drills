<style>
  :root{ --ink:#0f172a; --muted:#64748b; --accent:#2563eb; --accent-dark:#1d4ed8; --page-bg:#eef2f7; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--page-bg); color:var(--ink); font-size:16px;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;}

    align-items:center; gap:12px; padding:12px 20px;

  .tb-title{font-weight:800; font-size:15px; letter-spacing:.3px; white-space:nowrap}

<p class="hint no-print">
  Generates a <b>two-page</b> worksheet drawn from the AS Chapter 3 topic bank.

  Add <kbd>?seed=12345</kbd> to the URL to reproduce a sheet.
</p>

<script>
(function(){
'use strict';

/* ============================================================
   RNG + helpers
   ============================================================ */
let rng = Math.random;
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
const pick = a => a[Math.floor(rng()*a.length)];
const ri   = (a,b) => a + Math.floor(rng()*(b-a+1));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1));
  const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b);
  while(b){ const t=a%b; a=b; b=t; } return a; }
const MINUS = '\u2212';
function nStr(x){ return x<0 ? MINUS + Math.abs(x) : String(x); }
function T(text){ return { type:'text', text: text }; }
function Q(key, blocks, answers, solution, opts){
  const q = { key, blocks, answers: answers||[], solution: solution||null };
  if (opts) for (const k in opts) if (opts[k]!==undefined) q[k]=opts[k];
  return q;
}

/* Format a quadratic in the standard way, using LaTeX-friendly syntax. */
function fmtQuad(a,b,c){
  let s='';
  if (a!==0){
    if (a===1) s='x^2';
    else if (a===-1) s='-x^2';
    else s=a+'x^2';
  }
  if (b!==0){
    const sign = b>0 ? ' + ' : ' - ';
    const mag  = Math.abs(b);
    s += s==='' ? (b<0?'-':'')+(mag===1?'x':mag+'x')
                : sign+(mag===1?'x':mag+'x');
  }
  if (c!==0){
    const sign = c>0 ? ' + ' : ' - ';
    s += (s==='' ? (c<0?'-':'')+Math.abs(c) : sign+Math.abs(c));
  }
  if (s==='') s='0';
  return s;
}

/* ============================================================
   Text measurement (Helvetica widths × 1000)
   ============================================================ */
const W_REG = [
  278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584
];
const W_BOLD = [
  278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  333,333,584,584,584,611,975,
  722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  333,278,333,584,556,333,
  556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
  389,280,389,584
];
function textWidth(str, size, bold){
  const t = bold ? W_BOLD : W_REG;
  let w=0;
  for (let i=0;i<str.length;i++){
    const c=str.charCodeAt(i);
    if (c===96) continue;
    if (c===0xE000){ w += t[0]*0.55; continue; }
    w += (c>=32 && c<=126) ? t[c-32] : 556;
  }
  return w * size / 1000;
}

/* ============================================================
   Run parsing + emission
   ============================================================ */
function parseRuns(text){
  const runs=[]; let i=0;
  while(i<text.length){
    const tick = text.indexOf('`', i);
    const frac = text.indexOf('\\frac{', i);
    const sqrt = text.indexOf('\\sqrt{', i);
    const dollar = text.indexOf('$', i);

    let next = -1, kind = null;
    if (dollar !== -1 && (next===-1 || dollar<next)) { next=dollar; kind='math'; }
    if (tick !== -1 && (next===-1 || tick<next)) { next=tick; kind='tick'; }
    if (frac !== -1 && (next===-1 || frac<next)) { next=frac; kind='frac'; }
    if (sqrt !== -1 && (next===-1 || sqrt<next)) { next=sqrt; kind='sqrt'; }

    if (next === -1){ if (i<text.length) runs.push({kind:'text',text:text.slice(i),italic:false}); break; }
    if (next > i) runs.push({kind:'text', text:text.slice(i,next), italic:false});

    if (kind==='math'){
      const close = text.indexOf('$', next+1);
      if (close !== -1) {
        let inner = text.slice(next+1, close);
        inner = inner.replace(/\u2212/g, '-');
        runs.push({kind:'math', text: '$'+inner+'$', inner: inner});
        i = close+1;
      } else {
        runs.push({kind:'text', text: text.slice(next), italic:false});
        break;
      }
    } else if (kind==='tick'){
      const close = text.indexOf('`', next+1);
      if (close===-1){ runs.push({kind:'text',text:text.slice(next),italic:false}); break; }
      runs.push({kind:'text', text:text.slice(next+1,close), italic:true});
      i = close+1;
    } else if (kind==='sqrt'){
      const open = text.indexOf('{', next);
      let close = open + 1, depth = 1;
      while (close < text.length && depth > 0) {
          if (text[close] === '{') depth++;
          else if (text[close] === '}') depth--;
          close++;
      }
      runs.push({kind:'sqrt', inner: text.slice(open+1, close-1)});
      i = close;
    } else {
      const o1=text.indexOf('{',next); const c1=o1===-1?-1:text.indexOf('}',o1);
      const o2=c1===-1?-1:text.indexOf('{',c1); const c2=o2===-1?-1:text.indexOf('}',o2);
      if (o1===-1||c1===-1||o2===-1||c2===-1){
        runs.push({kind:'text',text:text.slice(next),italic:false}); break;
      }
      runs.push({kind:'frac', num:text.slice(o1+1,c1), den:text.slice(o2+1,c2)});
      i = c2+1;
    }
  }
  const merged=[];
  for (const r of runs){
    const last = merged[merged.length-1];
    if (r.kind==='text' && last && last.kind==='text' && last.italic===r.italic){
      last.text += r.text;
    } else merged.push(r);
  }
  return merged.filter(r => r.kind!=='text' || r.text.length>0);
}

function textToTokens(text){
  const runs = parseRuns(text);
  const tokens=[]; let pendingSpace=false;
  for (const r of runs){
    if (r.kind==='math'){ tokens.push({kind:'math', text:r.text, inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='frac'){ tokens.push({kind:'frac', num:r.num, den:r.den, space:pendingSpace}); pendingSpace=false; continue; }
    if (r.kind==='sqrt'){ tokens.push({kind:'sqrt', inner:r.inner, space:pendingSpace}); pendingSpace=false; continue; }
    const parts = r.text.split(/(\s+)/);
    for (const p of parts){
      if (p==='') continue;
      if (/^\s+$/.test(p)){ pendingSpace=true; continue; }
      tokens.push({kind:'word', word:p, italic:r.italic, space:pendingSpace});
      pendingSpace=false;
    }
  }
  return tokens;
}

function approxMathWidth(inner, size, bold){
  let approx = inner
    .replace(/\\[a-zA-Z]+/g, 'xxxx')
    .replace(/[\{\}]/g, '')
    .replace(/\s+/g, '');
  let baseW = textWidth(approx, size, bold);
  let supCount = (inner.match(/\^|_/g) || []).length;
  let opCount = (inner.match(/[+\-=<>]/g) || []).length;
  // Increased multipliers to prevent math blocks from overflowing the column
  return Math.max(25, baseW * 1.3 + supCount * size * 0.3 + opCount * size * 0.3 + 20);
}

function tokenWidth(tok, size, bold){
  if (tok.kind==='math') return approxMathWidth(tok.inner, size, bold);
  if (tok.kind==='frac'){
    const sub=size*0.7;
    const nw=textWidth(tok.num,sub,bold);
    const dw=textWidth(tok.den,sub,bold);
    return Math.max(nw,dw)+0.20*size;
  }
  if (tok.kind==='sqrt') return textWidth(tok.inner, size, bold) + 0.4*size;
  return textWidth(tok.word,size,bold);
}

function wrapTokens(tokens, size, bold, maxW){
  const lines=[]; let cur=[]; let curW=0;
  for (const tok of tokens){
    const spaceW = (tok.space && cur.length) ? textWidth(' ',size,bold) : 0;
    const w = spaceW + tokenWidth(tok,size,bold);
    if (cur.length && curW + w > maxW){
      lines.push(cur);
      cur = [{ kind:tok.kind, num:tok.num, den:tok.den, inner:tok.inner,
               text:tok.text, word:tok.word, italic:tok.italic, space:false }];
      curW = tokenWidth(tok,size,bold);
    } else { cur.push(tok); curW += w; }
  }
  if (cur.length) lines.push(cur);
  return lines;
}

function lineToRuns(lineTokens){
  const runs=[];
  for (let i=0;i<lineTokens.length;i++){
    const tok = lineTokens[i];
    const prefix = (i===0) ? '' : (tok.space ? ' ' : '');
    if (tok.kind==='math') runs.push({kind:'math', text:tok.text, inner:tok.inner, prefix});
    else if (tok.kind==='frac') runs.push({kind:'frac', num:tok.num, den:tok.den, prefix});
    else if (tok.kind==='sqrt') runs.push({kind:'sqrt', inner:tok.inner, prefix});
    else {
      const last = runs[runs.length-1];
      if (last && last.kind==='text' && last.italic===tok.italic) last.text += prefix + tok.word;
      else runs.push({kind:'text', text:prefix + tok.word, italic:tok.italic});
    }
  }
  return runs;
}

function emitRuns(runs, x0, y, size, items, variant){
  let textType, barType;
  if (variant==='answer'){ textType='answer'; barType='answer-line'; }
  else { textType='run'; barType='line'; }
  let rx = x0;
  for (let i = 0; i < runs.length; i++){
    const run = runs[i];
    let prefix = '';
    if (i > 0 && run.prefix) {
      prefix = ' ';
      rx += textWidth(' ', size, false);
    }
    
    if (run.kind==='math'){
      items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix + run.text });
      rx += approxMathWidth(run.inner, size, false);
    } else if (run.kind==='frac'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const sub = size*0.7;
      const nw = textWidth(run.num, sub, false);
      const dw = textWidth(run.den, sub, false);
      const innerW = Math.max(nw, dw);
      const totalW = innerW + 0.20*size;
      const barW = innerW + 0.08*size;
      items.push({ t: textType, x: rx + (totalW-nw)/2, y: y - 0.32*size,
        size: sub, bold:false, italic:false, s: run.num });
      items.push({ t: barType,
        x1: rx + (totalW-barW)/2, y1: y - 0.12*size,
        x2: rx + (totalW+barW)/2, y2: y - 0.12*size, w: 0.5 });
      items.push({ t: textType, x: rx + (totalW-dw)/2, y: y + 0.44*size,
        size: sub, bold:false, italic:false, s: run.den });
      rx += totalW;
    } else if (run.kind==='sqrt'){
      if (prefix) items.push({ t: textType, x: rx, y, size, bold:false, italic:false, s: prefix });
      const innerW = textWidth(run.inner, size, false);
      const totalW = innerW + size * 0.4;
      items.push({ t: barType, x1: rx, y1: y, x2: rx + size*0.15, y2: y - size*0.5, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.15, y1: y - size*0.5, x2: rx + size*0.3, y2: y + size*0.1, w: 0.7 });
      items.push({ t: barType, x1: rx + size*0.3, y1: y + size*0.1, x2: rx + totalW, y2: y + size*0.1, w: 0.7 });
      items.push({ t: textType, x: rx + size*0.35, y: y, size: size, bold: false, italic: false, s: run.inner });
      rx += totalW;
    } else {
      items.push({ t: textType, x: rx, y, size, bold:false, italic:run.italic, s: prefix + run.text });
      rx += textWidth(run.text, size, false);
    }
  }
  return rx;
}

/* ============================================================
   LAYOUT — quadratic graph block
   ============================================================ */
function layoutQuadGraph(x, y, block, fs, maxW){
  const a = block.a, b = block.b, c = block.c;
  const xMin = block.xMin, xMax = block.xMax;
  const yMin = block.yMin, yMax = block.yMax;

  const drawW = Math.min(190, maxW * 0.52);
  const drawH = Math.min(135, drawW * 0.72);
  const scaleX = drawW / (xMax - xMin);
  const scaleY = drawH / (yMax - yMin);

  const gx = x + Math.max(6, (maxW - drawW - 20)/2);
  const gy = y + 8;
  const px = u => gx + (u - xMin) * scaleX;
  const py = u => gy + (yMax - u) * scaleY;
  const items = [];

  const originX = px(0);
  const originY = py(0);

  items.push({t:'line', x1:gx, y1:originY, x2:gx+drawW, y2:originY, w:0.9});
  items.push({t:'line', x1:gx+drawW-5, y1:originY-2.5, x2:gx+drawW, y2:originY, w:0.9});
  items.push({t:'line', x1:gx+drawW-5, y1:originY+2.5, x2:gx+drawW, y2:originY, w:0.9});
  items.push({t:'line', x1:originX, y1:gy+drawH, x2:originX, y2:gy, w:0.9});
  items.push({t:'line', x1:originX-2.5, y1:gy+5, x2:originX, y2:gy, w:0.9});
  items.push({t:'line', x1:originX+2.5, y1:gy+5, x2:originX, y2:gy, w:0.9});

  items.push({t:'run', x:originX-8, y:originY+7, size:fs*0.7, bold:false, italic:false, s:'O'});
  items.push({t:'run', x:gx+drawW+2, y:originY+3, size:fs*0.75, bold:false, italic:true, s:'x'});
  items.push({t:'run', x:originX+3, y:gy-1, size:fs*0.75, bold:false, italic:true, s:'y'});

  if (!block.blank){
    const steps = 100;
    let prev = null;
    for (let i = 0; i <= steps; i++){
      const ux = xMin + (xMax-xMin) * i / steps;
      const uy = a*ux*ux + b*ux + c;
      if (uy < yMin - 0.4 || uy > yMax + 0.4){ prev = null; continue; }
      const cx = px(ux);
      const cy = py(Math.max(yMin, Math.min(yMax, uy)));
      if (prev) items.push({t:'line', x1:prev[0], y1:prev[1], x2:cx, y2:cy, w:1.5, color: [37, 99, 235]});
      prev = [cx, cy];
    }
  }

    if (block.markPoints){
    for (const p of block.markPoints){
      if (p.x < xMin || p.x > xMax || p.y < yMin || p.y > yMax) continue;
      const mx = px(p.x), my = py(p.y);
      const pts = [];
      for (let i=0; i<10; i++){ const ang = i/10*Math.PI*2;
        pts.push([mx + 2.2*Math.cos(ang), my + 2.2*Math.sin(ang)]); }
      items.push({t:'poly', grey:0, pts});
      
      if (p.label){
        const lw = textWidth(p.label, fs*0.65, false);
        let lx = mx - lw/2;
        let ly = my - 8;

        if (p.y === 0 && p.x !== 0) {
          // x-intercept: keep horizontally centered, but push vertically away from the curve
          ly = a > 0 ? my + 14 : my - 6;
          // lx remains mx - lw/2 so it is perfectly aligned
        } else if (p.x === 0 && p.y !== 0) {
          // y-intercept: push it to the left
          lx = mx - lw - 6;
          ly = my + fs * 0.3;
        } else if (p.x === 0 && p.y === 0) {
          // origin: push it bottom-left
          lx = mx - lw - 6;
          ly = my + 14;
        } else {
          // general point (like vertex): push it outside the parabola
          if (a > 0) {
            ly = my + 16; // below minimum
          } else {
            ly = my - 6; // above maximum
          }
          if (p.x > 0) lx = mx + 8;
          else lx = mx - lw - 8;
        }

        items.push({t:'run', x:lx, y:ly, size:fs*0.65, bold:false, italic:false, s:p.label});
      }
    }
  }

  const figH = drawH + 22;
  return { items, height: figH };
}

/* ============================================================
   LAYOUT — question layout
   ============================================================ */
const PW = 595.276, PH = 841.890, MG = 42.52, FIXED_FS = 11;
const HEADER_H = 19*0.78 + 19*0.32 + 6 + 17 + 10.5*0.78 + 26;
const CONT_HEADER_H = 9*1.4 + 8 + 14;
const QUESTION_GAP = 14;

function columnRuleX(){ return MG + (PW - 2*MG) * 0.60; }
function promptWidth(fs){ return columnRuleX() - (MG + fs*1.6) - 10; }

function drawQuestionBlocks(blocks, x, y, fs, maxW, items, baselines){
  const lineH = fs*1.42;
  let cursor = y;
  for (const block of blocks){
    if (baselines) baselines.push(cursor);
    if (block.type === 'text'){
      const lines = wrapTokens(textToTokens(block.text), fs, false, maxW);
      for (let j=0;j<lines.length;j++)
        emitRuns(lineToRuns(lines[j]), x, cursor + j*lineH, fs, items, 'normal');
      cursor += lines.length * lineH;
    } else if (block.type === 'quad-graph'){
      const gl = layoutQuadGraph(x, cursor - fs*0.4, block, fs, maxW);
      for (const it of gl.items) items.push(it);
      cursor = cursor - fs*0.4 + gl.height + fs*1.0;
    }
  }
  return cursor;
}

function measureQuestion(q, fs){
  const maxW = promptWidth(fs);
  const lineH = fs*1.42;
  let h = 0;

  // ADD THIS BLOCK
  if (q.difficulty >= 4) {
    h += fs * 1.1 + 8; 
  }
  // ------------------------------

  for (const b of q.blocks){
    if (b.type === 'text'){
      const lines = wrapTokens(textToTokens(b.text), fs, false, maxW);
      h += lines.length * lineH;
    } else if (b.type === 'quad-graph'){
      const gl = layoutQuadGraph(0, 0, b, fs, maxW);
      h += gl.height + fs*1.0;
    }
  }
  return h;
}

function drawHeader(items, title){
  const innerW = PW - 2*MG;
  const ts = 19;
  const tw = textWidth(title, ts, true);
  let bl = MG + ts*0.78;
  items.push({t:'text', x: MG + Math.max(0, (innerW-tw)/2), y: bl, size: ts, bold: true, s: title});
  let top = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:top, x2:PW-MG, y2:top, w:1.1});
  top += 17;
  const ns = 10.5;
  bl = top + ns*0.78;
  items.push({t:'text', x:MG, y:bl, size:ns, bold:false, s:'Name:'});
  const nlw = textWidth('Name:', ns, false);
  items.push({t:'line', x1:MG+nlw+6, y1:bl+2.2, x2:MG+innerW*0.46, y2:bl+2.2, w:0.6});
  items.push({t:'text', x:MG+innerW*0.60, y:bl, size:ns, bold:false, s:'Date:'});
  const dlw = textWidth('Date:', ns, false);
  items.push({t:'line', x1:MG+innerW*0.60+dlw+6, y1:bl+2.2, x2:PW-MG, y2:bl+2.2, w:0.6});
}
function drawContinuationHeader(items, title){
  items.push({t:'text', x:MG, y:MG+9*0.78, size:9, bold:false, s:title+' (continued)'});
  const ruleY = MG + 9*1.4 + 8;
  items.push({t:'line', x1:MG, y1:ruleY, x2:PW-MG, y2:ruleY, w:0.4, grey:true});
}

function drawQuestion(q, index, fs, qTop, items, revealState){
  const lineH = fs*1.42;
  const numColW = fs*1.6;
  const textX = MG + numColW;
  const ruleX = columnRuleX();
  const maxW = ruleX - textX - 10; 

  let contentY = qTop + fs*0.78;

  // --- ADD CHALLENGING BADGE ---
  if (q.difficulty >= 4) {
    const badgeText = 'CHALLENGING';
    const badgeFs = fs * 0.55; 
    const badgeW = textWidth(badgeText, badgeFs, true) + 8;
    const boxH = fs * 1.1;
    const badgeX = ruleX - badgeW - 2; 
    
    // Changed from qTop + 2 to qTop to make it flush
    const badgeY = qTop - 6; 

    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX+badgeW, y2:badgeY, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY+boxH, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX, y1:badgeY, x2:badgeX, y2:badgeY+boxH, w:0.8});
    items.push({t:'line', x1:badgeX+badgeW, y1:badgeY, x2:badgeX+badgeW, y2:badgeY+boxH, w:0.8});
    items.push({t:'text', x: badgeX + 4, y: badgeY + boxH*0.72, size: badgeFs, bold: true, s: badgeText});

    // Reduced the gap from + 8 to + 4
    contentY += fs * 1.1 + 4; 
  }
  // ------------------------------
// ... rest of the function
  // ------------------------------

  items.push({t:'text', x:MG, y:contentY, size:fs, bold:true, s:(index+1)+'.'});
  drawQuestionBlocks(q.blocks, textX, contentY, fs, maxW, items, null);

  const qH = measureQuestion(q, fs);
  items.push({t:'line', x1:ruleX, y1:qTop+2, x2:ruleX, y2:qTop+qH-2, w:0.4, grey:true});

  if (revealState && q.answers && q.answers.length) {
      const rightX = ruleX + 8;
      const rightW = PW - MG - rightX - 4;
      const ansStr = q.answers.map(a => a.text).join('   ');
      const lines = wrapTokens(textToTokens(ansStr), fs, false, rightW);
      for (let j=0; j<lines.length; j++) {
          // Changed qTop + fs*0.78 to contentY so answers align with the pushed-down question
          emitRuns(lineToRuns(lines[j]), rightX, contentY + j*lineH, fs, items, 'answer');
      }
  }
  return qTop + qH;
}

function layoutSheet(opts){
  const title = opts.title, questions = opts.questions, revealState = opts.revealState;
  const fs = FIXED_FS;
  const pages = []; let items = []; let y = MG;
  drawHeader(items, title);
  y = MG + HEADER_H;
  let onPage = 0;
  for (let i = 0; i < questions.length; i++){
    const q = questions[i];
    const qH = measureQuestion(q, fs);
    if (onPage > 0 && y + qH > PH - MG){
      pages.push(items); items = []; y = MG + CONT_HEADER_H;
      drawContinuationHeader(items, title); onPage = 0;
    }
    if (onPage > 0){
      items.push({t:'line', x1:MG, y1:y-7, x2:PW-MG, y2:y-7, w:0.4, grey:true});
    }
    drawQuestion(q, i, fs, y, items, revealState);
    y += qH + QUESTION_GAP;
    onPage++;
  }
  if (items.length) pages.push(items);
  if (pages.length > 1){
    for (let i = 0; i < pages.length; i++){
      const s = 'Page ' + (i+1) + ' of ' + pages.length;
      const w = textWidth(s, 8, false);
      pages[i].push({t:'text', x:PW-MG-w, y:PH-MG+12, size:8, bold:false, s:s});
    }
  }
  return pages;
}

function layoutCompactAnswers(opts){
  const title = opts.title, questions = opts.questions, seed = opts.seed;
  const items = []; const innerW = PW - 2*MG;
  let top = MG;
  const ts = 17;
  const heading = title + ' — Answers';
  const tw = textWidth(heading, ts, true);
  let bl = top + ts*0.78;
  items.push({t:'text', x:MG + Math.max(0,(innerW-tw)/2), y:bl, size:ts, bold:true, s:heading});
  top = bl + ts*0.32 + 6;
  items.push({t:'line', x1:MG, y1:top, x2:PW-MG, y2:top, w:1.1});
  top += 24;

  const fs = 11;
  const lineH = fs * 2.4;
  const colW = innerW/2;
  const perCol = Math.ceil(questions.length/2);

  for (let i = 0; i < questions.length; i++){
    const col = Math.floor(i/perCol);
    const row = i % perCol;
    const x0 = MG + col*colW;
    const yy = top + row*lineH + fs*0.78;
    items.push({t:'text', x:x0, y:yy, size:fs, bold:true, s:(i+1)+'.'});
    const numW = textWidth((i+1)+'.', fs, true) + 5;
    const ansJoined = (questions[i].answers||[]).map(a=>a.text).join('   ');
    emitRuns(parseRuns(ansJoined), x0+numW, yy, fs, items, 'normal');
  }
  const note = 'Seed: ' + seed;
  const noteSize = 8.5;
  const noteW = textWidth(note, noteSize, false);
  items.push({t:'text', x:PW-MG-noteW, y:PH-MG+2, size:noteSize, bold:false, s:note});
  return [items];
}

/* ============================================================
   PDF writer
   ============================================================ */
const WINANSI = {
  0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84,
  0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88,
  0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C,
  0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93,
  0x201D:0x94, 0x2022:0x95, 0x2013:0x96, 0x2014:0x97,
  0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B,
  0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F
};
function cleanLatexForPdf(text){
  if (!text.includes('$')) return text;
  return text.replace(/\$([^$]*)\$/g, function(match, inner) {
    let s = inner;
    s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '($1)/($2)');
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√($1)');
    s = s.replace(/\\pm/g, '±');
    s = s.replace(/\\Delta/g, 'Δ');
    s = s.replace(/\\cdot/g, '·');
    s = s.replace(/\^2/g, '²');
    s = s.replace(/\^3/g, '³');
    s = s.replace(/\\log_2/g, 'log₂');
    s = s.replace(/\\div/g, '÷');
    s = s.replace(/\\times/g, '×');
    s = s.replace(/\\le/g, '≤').replace(/\\ge/g, '≥');
    s = s.replace(/\\Rightarrow/g, '⇒');
    s = s.replace(/\u2212/g, '-');
    return s;
  });
}
function pdfEsc(s){
  s = cleanLatexForPdf(s);
  let out='';
  for (let i=0;i<s.length;i++){
    const ch = s[i]; const code = ch.charCodeAt(0);
    if (ch==='\\') out += '\\\\';
    else if (ch==='(') out += '\\(';
    else if (ch===')') out += '\\)';
    else if (code >= 32 && code <= 126) out += ch;
    else if (code >= 0xA0 && code <= 0xFF) out += '\\' + code.toString(8).padStart(3,'0');
    else if (WINANSI[code] !== undefined) out += '\\' + WINANSI[code].toString(8).padStart(3,'0');
    else out += '?';
  }
  return out;
}
function pdfStrokeColourOp(it){
  if (it.color) {
      return (it.color[0]/255).toFixed(3) + ' ' + (it.color[1]/255).toFixed(3) + ' ' + (it.color[2]/255).toFixed(3) + ' RG';
  }
  return (it.grey ? '0.58' : '0') + ' G';
}
function pdfFillColourOp(it){
  return (it.grey !== undefined ? it.grey : 0) + ' g';
}
function contentStream(items){
  const ops=[];
  for (const it of items){
    if (it.t === 'text' || it.t === 'run'){
      let font = 'F1';
      if (it.bold && it.italic) font='F4';
      else if (it.bold) font='F2';
      else if (it.italic) font='F3';
      ops.push('0 g');
      ops.push('BT /' + font + ' ' + it.size.toFixed(2) + ' Tf ' +
        it.x.toFixed(2) + ' ' + (PH-it.y).toFixed(2) + ' Td (' + pdfEsc(it.s) + ') Tj ET');
    } else if (it.t === 'line'){
      ops.push(pdfStrokeColourOp(it) + ' ' + it.w.toFixed(2) + ' w ' +
        it.x1.toFixed(2) + ' ' + (PH-it.y1).toFixed(2) + ' m ' +
        it.x2.toFixed(2) + ' ' + (PH-it.y2).toFixed(2) + ' l S');
    } else if (it.t === 'poly'){
      const pts = it.pts;
      let s = pdfFillColourOp(it);
      s += ' ' + pts[0][0].toFixed(2) + ' ' + (PH-pts[0][1]).toFixed(2) + ' m';
      for (let k=1; k<pts.length; k++)
        s += ' ' + pts[k][0].toFixed(2) + ' ' + (PH-pts[k][1]).toFixed(2) + ' l';
      s += ' h f';
      ops.push(s);
    }
  }
  return ops.join('\n');
}
function assemblePDF(pagesItems){
  const N = pagesItems.length;
  const maxObj = 6 + 2*N;
  const objects = []; const kidRefs = [];
  for (let i = 0; i < N; i++) kidRefs.push((8 + 2*i) + ' 0 R');
  objects[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objects[2] = '<< /Type /Pages /Kids [' + kidRefs.join(' ') + '] /Count ' + N + ' >>';
  objects[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objects[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objects[5] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>';
  objects[6] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>';
  for (let i = 0; i < N; i++){
    const stream = contentStream(pagesItems[i]);
    const streamObj = 7 + 2*i;
    const pageObj = 8 + 2*i;
    objects[streamObj] = '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream';
    objects[pageObj] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] ' +
      '/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> ' +
      '/Contents ' + streamObj + ' 0 R >>';
  }
  let out = '%PDF-1.4\n';
  const offsets = [];
  for (let i = 1; i <= maxObj; i++){ offsets[i] = out.length;
    out += i + ' 0 obj\n' + objects[i] + '\nendobj\n'; }
  const xrefPos = out.length;
  out += 'xref\n0 ' + (maxObj+1) + '\n0000000000 65535 f \n';
  for (let i = 1; i <= maxObj; i++)
    out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  out += 'trailer\n<< /Size ' + (maxObj+1) + ' /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF\n';
  return out;
}
function downloadPDF(pagesItems, filename){
  const pdfStr = assemblePDF(pagesItems);
  const bytes = new Uint8Array(pdfStr.length);
  for (let i = 0; i < pdfStr.length; i++) bytes[i] = pdfStr.charCodeAt(i) & 0xFF;
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* -------- Q1: Solving equations -------- */

const tSolveFactorise = {
  id:'solve-factorise', strand:'Q1', difficulty: 1,
  gen(){
    let r1, r2;
    do { r1 = ri(-4, 4) || 2; r2 = ri(-4, 4) || -3; }
    while (r1 === r2 || r1 === 0 || r2 === 0);
    const B = -(r1 + r2), C = r1 * r2;
    const a = ri(2, 4);
    const c = a - 1;
    const b = ri(-4, 6);
    const d = b - B;
    const e = -C;
    const lhs = fmtQuad(a, b, 0);
    const rhs = fmtQuad(c, d, e);
    const arr = fmtQuad(1, B, C);
    const f1 = r1 > 0 ? `(x - ${r1})` : `(x + ${-r1})`;
    const f2 = r2 > 0 ? `(x - ${r2})` : `(x + ${-r2})`;
    return Q('fq|'+a+'|'+b+'|'+c+'|'+d+'|'+e,
      [ T('Solve the equation  $'+lhs+' = '+rhs+'$') ],
      [{ text: '$x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$' }],
      [ T('Rearrange:  $'+arr+' = 0$'),
        T('Factorise:  $'+f1+f2+' = 0$'),
        T('So  $x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$.') ]);
  }
};

const tSolveBracket = {
  id:'solve-bracket', strand:'Q1', difficulty: 1,
  gen(){
    let r1, r2;
    do { r1 = ri(-5, 5) || 3; r2 = ri(-5, 5) || -2; }
    while (r1 === r2 || r1 === 0 || r2 === 0);
    const B = -(r1 + r2), C = r1 * r2;
    let a, b;
    if (B >= 0){ a = ri(1, 3); b = a + B; }
    else        { b = ri(1, 3); a = b - B; }
    const c = -a*b - C;
    if (c === 0) return tSolveBracket.gen();
    const rhs = nStr(c);
    const lhsBracket = `(x - ${a})(x + ${b})`;
    const expanded = fmtQuad(1, B, C);
    const f1 = r1 > 0 ? `(x - ${r1})` : `(x + ${-r1})`;
    const f2 = r2 > 0 ? `(x - ${r2})` : `(x + ${-r2})`;
    return Q('sb|'+a+'|'+b+'|'+c,
      [ T('Solve  $'+lhsBracket+' = '+rhs+'$') ],
      [{ text: '$x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$' }],
      [ T('Expand:  $x^2 + '+(b-a)+'x - '+a*b+' = '+rhs+'$'),
        T('Rearrange:  $'+expanded+' = 0$'),
        T('Factorise:  $'+f1+f2+' = 0$'),
        T('So  $x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$.') ]);
  }
};

const tSolveFraction = {
  id:'solve-fraction', strand:'Q1', difficulty: 2,
  gen(){
    let r1, r2;
    do { r1 = ri(2, 6); r2 = -ri(1, 5); } while (r1 === -r2);
    const L = 1;
    const b = -L*(r1 + r2);
    const c = -L * r1 * r2;
    if (b <= 0 || c <= 0) return tSolveFraction.gen();
    const lhs = 'x';
    const rhs = b + ' + \\frac{' + c + '}{x}';
    const expanded = fmtQuad(1, -b, -c);
    return Q('sfr|'+L+'|'+b+'|'+c,
      [ T('Solve  $'+lhs+' = '+rhs+'$') ],
      [{ text: '$x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$' }],
      [ T('Multiply both sides by $x$:  $x^2 = '+b+'x + '+c+'$'),
        T('Rearrange:  $'+expanded+' = 0$'),
        T('Factorise:  $(x - '+r1+')(x + '+(-r2)+') = 0$'),
        T('So  $x = '+nStr(r1)+'$ or $x = '+nStr(r2)+'$.') ]);
  }
};

const tSolveFormula = {
  id:'solve-formula', strand:'Q1', difficulty: 2,
  gen(){
    const cases = [
      {B:-4, C:-3, a:1, simp:[2,7]},
      {B:6,  C:7,  a:1, simp:[3,2]},
      {B:-2, C:-4, a:1, simp:[1,5]},
      {B:-6, C:4,  a:1, simp:[3,5]},
      {B:-8, C:9,  a:1, simp:[4,7]},
      {B:4,  C:-1, a:1, simp:[-2,5]}
    ];
    const c = pick(cases);
    const a = c.a, b = c.B, cc = c.C;
    const lhs = fmtQuad(a, b, cc);
    const [p, k] = [c.simp[0], c.simp[1]];
    const ans = '$x = ' + nStr(p) + ' \\pm \\sqrt{' + k + '}$';
    const discVal = b*b - 4*a*cc;
    return Q('sfo|'+a+'|'+b+'|'+cc,
      [ T('Solve  $'+lhs+' = 0$, giving exact answers.') ],
      [{ text: ans }],
      [ T('Use the quadratic formula:  $x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$'),
        T('Discriminant:  $b^2 - 4ac = '+discVal+'$'),
        T('Simplifies to give '+ans+'.') ]);
  }
};

/* -------- Q2: Graphs -------- */

const tGraphSketch = {
  id:'graph-sketch', strand:'Q2', difficulty: 1,
  gen(){
    let r1, r2;
    do { r1 = ri(-4, 4) || 3; r2 = ri(-4, 4) || -2; } while (r1 === r2 || r1 === 0 || r2 === 0);
    const a = pick([1, 1, 2, -1, -2]);
    const b = -a*(r1 + r2);
    const c = a * r1 * r2;
    const eq = 'y = ' + fmtQuad(a, b, c);
    const dirTxt = a > 0 ? 'positive quadratic (opens upward)' : 'negative quadratic (opens downward)';
    const rootsTxt = (r1 === r2) ? `repeated root at $x = ${r1}$` :
                     `roots at $x = ${nStr(r1)}$ and $x = ${nStr(r2)}$`;
    const yIntTxt = `y-intercept at $(0, ${nStr(c)})$`;
    const vx = -b / (2*a);
    const vy = a*vx*vx + b*vx + c;
    const vxR = Math.round(vx*100)/100;
    const vyR = Math.round(vy*100)/100;
    const vertexTxt = 'turning point at $(' + vxR + ', ' + vyR + ')$';
    const xs = [0, r1, r2].sort((p,q)=>p-q);
    const ys = [0, c, vy];
    const xPad = Math.max(1.5, (xs[2]-xs[0])*0.3);
    const yPad = Math.max(2, (Math.max(...ys)-Math.min(...ys))*0.3);
    return Q('gsk|'+a+'|'+b+'|'+c,
      [ T('Sketch the graph of  $'+eq+'$,  labelling all axis intercepts.'),
        { type:'quad-graph', a, b, c, blank:true,
          xMin: Math.floor(xs[0]-xPad), xMax: Math.ceil(xs[2]+xPad),
          yMin: Math.floor(Math.min(...ys)-yPad), yMax: Math.ceil(Math.max(...ys)+yPad) } ],
      [{ text: 'See sketch — '+dirTxt+'; '+rootsTxt+'; '+yIntTxt+'; '+vertexTxt+'.' }],
      [ T('Direction: '+dirTxt+'.'),
        T('x-intercepts: '+rootsTxt+'.'),
        T('y-intercept: '+yIntTxt+'.'),
        T('Vertex: '+vertexTxt+'.') ]);
  }
};

const tGraphFromRoots = {
  id:'graph-from-roots', strand:'Q2', difficulty: 2,
  gen(){
    let r1, r2;
    do { r1 = ri(-3, 3) || 2; r2 = ri(-3, 3) || -2; }
    while (r1 === r2 || r1 === 0 || r2 === 0);
    const a = pick([1, 1, 2, -1, -2]);
    const b = -a*(r1 + r2);
    const c = a*r1*r2;
    if (Math.abs(c) < 2) return tGraphFromRoots.gen();
    const pts = [
      { x: r1, y: 0, label: nStr(r1) },
      { x: r2, y: 0, label: nStr(r2) },
      { x: 0,  y: c, label: nStr(c) }
    ];
    const xs = [0, r1, r2].sort((p,q)=>p-q);
    const ys = [0, c];
    const xPad = 1.5, yPad = Math.max(2, Math.abs(c)*0.3);
    
    const f1 = r1 > 0 ? `(x - ${r1})` : `(x + ${-r1})`;
    const f2 = r2 > 0 ? `(x - ${r2})` : `(x + ${-r2})`;

    return Q('gfr|'+a+'|'+b+'|'+c,
      [ T('Find the equation of this graph, giving your answer in the form $y = ax^2 + bx + c$.'),
        { type:'quad-graph', a, b, c, markPoints: pts,
          xMin: Math.floor(xs[0]-xPad), xMax: Math.ceil(xs[2]+xPad),
          yMin: Math.floor(Math.min(...ys)-yPad), yMax: Math.ceil(Math.max(...ys)+yPad) } ],
      [{ text: '$y = ' + fmtQuad(a, b, c) + '$' }],
      [ T('The parabola crosses the x-axis at $x = '+nStr(r1)+'$ and $x = '+nStr(r2)+'$.'),
        T('So the factorised form is  $y = k'+f1+f2+'$.'),
        T('The y-intercept $(0, '+nStr(c)+')$ gives $k \\cdot ('+r1+') \\cdot ('+r2+') = '+nStr(c)+'$, so $k = '+a+'$.'),
        T('Thus  $y = '+a+f1+f2+' = '+fmtQuad(a, b, c)+'$.') ]);
  }
};

const tGraphFromVertex = {
  id:'graph-from-vertex', strand:'Q2', difficulty: 2,
  gen(){
    const h = ri(-3, 3);
    const k = ri(-4, 4);
    if (k === 0) return tGraphFromVertex.gen();
    const a = pick([1, 1, -1, 2, -2]);
    let x0;
    do { x0 = ri(-4, 4); } while (x0 === h || x0 === 0);
    const y0 = a*(x0-h)*(x0-h) + k;
    const eqExpanded = fmtQuad(a, -2*a*h, a*h*h + k);
    const pts = [
      { x: h,  y: k,  label: `(${nStr(h)}, ${nStr(k)})` },
      { x: x0, y: y0, label: `(${nStr(x0)}, ${nStr(y0)})` }
    ];
    const xs = [h, x0].sort((p,q)=>p-q);
    const ys = [k, y0, 0].sort((p,q)=>p-q);
    const xPad = 1.5;
    const yPad = Math.max(2, (ys[2]-ys[0])*0.25);
    
    const aStr = (a === 1 ? '' : (a === -1 ? '-' : a));
    
    return Q('gfv|'+a+'|'+h+'|'+k+'|'+x0+'|'+y0,
      [ T('The graph of a quadratic function has a turning point at $('+
          nStr(h)+', '+nStr(k)+')$ and passes through the point $('+
          nStr(x0)+', '+nStr(y0)+')$.'),
        T('Find the equation of the graph, giving your answer in the form $y = a(x - p)^2 + q$.'),
        { type:'quad-graph', a, b: -2*a*h, c: a*h*h + k, markPoints: pts,
          xMin: Math.floor(xs[0]-xPad), xMax: Math.ceil(xs[1]+xPad),
          yMin: Math.floor(ys[0]-yPad), yMax: Math.ceil(ys[2]+yPad) } ],
      [{ text: `$y = ${aStr}(x ${h>=0?'- ':'+ '}${Math.abs(h)})^2 ${k>=0?'+ ':MINUS+' '}${Math.abs(k)}$` }],
      [ T('Vertex form:  $y = a(x '+(h>=0?'- ':'+ ')+Math.abs(h)+')^2 '+
          (k>=0?'+ '+k:'- '+Math.abs(k))+'$.'),
        T('Using $('+nStr(x0)+', '+nStr(y0)+')$:  $'+nStr(y0)+' = a('+
          nStr(x0)+' '+(h>=0?'- ':'+ ')+Math.abs(h)+')^2 '+(k>=0?'+ '+k:'- '+Math.abs(k))+'$'),
        T('So $a = '+a+'$.'),
        T('Expanding gives  $y = '+eqExpanded+'$.') ]);
  }
};

/* -------- Q3: Completing the square -------- */

const tCtsBasic = {
  id:'cts-basic', strand:'Q3', difficulty: 1,
  gen(){
    const B = 2 * pick([-5,-4,-3,-2,-1,1,2,3,4,5]);
    const C = ri(-8, 8);
    const halfB = B/2;
    const q = C - B*B/4;
    const eq = fmtQuad(1, B, C);
    const ansStr = '(x ' + (halfB>=0?'+ '+halfB:'- '+(-halfB)) + ')^2 ' +
                   (q>=0?'+ '+q:'- '+(-q));
    return Q('cb|'+B+'|'+C,
      [ T('Write  $'+eq+'$  in the form $(x + p)^2 + q$, stating $p$ and $q$.') ],
      [{ text: '$'+ansStr+'$   ($p = '+nStr(halfB)+'$, $q = '+nStr(q)+'$)' }],
      [ T('Halve the coefficient of $x$:  $'+B+' \\div 2 = '+halfB+'$.'),
        T('Subtract the square of this:  $(x '+(halfB>=0?'+ ':'- ')+halfB+')^2 - '+halfB*halfB+'$'),
        T('Result:  $'+ansStr+'$.') ]);
  }
};

const tCtsFractional = {

const tCtsLeading = {
  id:'cts-leading', strand:'Q3', difficulty: 2,
  gen(){
    const a = pick([2, 3, -1, -2]);
    const B = a * ri(-4, 4);
    if (B === 0) return tCtsLeading.gen();
    const C = ri(-4, 8);
    const p = B / (2*a);
    const q = C - a*p*p;
    const eq = fmtQuad(a, B, C);
    const pStr = Number.isInteger(p) ? nStr(p) : (p<0?MINUS:'')+Math.abs(p*2)+'/2';
    const qStr = Number.isInteger(q) ? nStr(q) : q.toFixed(2);
    const ansStr = a + '(x ' + (p>=0?'+ ':MINUS) + pStr.replace('-','') + ')^2 ' +
                   (q>=0?'+ '+qStr:'- '+Math.abs(q).toFixed(2));
    return Q('cl|'+a+'|'+B+'|'+C,
      [ T('Write  $'+eq+'$  in the form $a(x + p)^2 + q$.') ],
      [{ text: '$'+ansStr+'$' }],
      [ T('Factor out $'+a+'$:  $'+a+'(x^2 '+(B/a>=0?'+ '+B/a:MINUS+' '+Math.abs(B/a))+'x)$'),
        T('Complete the square inside:  $p = '+pStr+'$.'),
        T('Result:  $'+ansStr+'$.') ]);
  }
};

const tCtsVertex = {
  id:'cts-vertex', strand:'Q3', difficulty: 2,
  gen(){
    const a = pick([1, 1, -1, 2, -2]);
    const B = a * 2 * ri(-3, 3);
    if (B === 0) return tCtsVertex.gen();
    const C = ri(-6, 8);
    const eq = fmtQuad(a, B, C);
    const vx = -B/(2*a);
    const vy = C - B*B/(4*a);
    const vxR = Math.round(vx*100)/100;
    const vyR = Math.round(vy*100)/100;
    const vertexStr = '(' + vxR + ', ' + vyR + ')';
    return Q('cv|'+a+'|'+B+'|'+C,
      [ T('Find the coordinates of the turning point of  $'+eq+'$.') ],
      [{ text: '$'+vertexStr+'$' }],
      [ T('Complete the square to get  $y = '+a+'(x - '+vxR+')^2 '+nStr(vyR)+'$.'),
        T('So the vertex is at $'+vertexStr+'$.') ]);
  }
};

const tCtsNoReal = {
  id:'cts-no-real', strand:'Q3', difficulty: 3,
  gen(){
    const B = pick([4, 6, 8, 10, 12]);
    const C = ri(6, 15);
    if (!(C > B*B/4)) return tCtsNoReal.gen();
    const p = B/2;
    const q = B*B/4 - C;
    const eqFmt = fmtQuad(-1, B, -C);
    const completed = '-(x - '+p+')^2 '+(q>=0?'+ '+q:'- '+Math.abs(q));
    return Q('cn|'+B+'|'+C,
      [ T('a)  Complete the square for  $'+eqFmt+'$.'),
        T('b)  Hence explain why the equation  $'+eqFmt+' = 0$  has no real solutions.') ],
      [{ text: 'a)  $'+completed+'$.  b)  This has maximum $'+nStr(q)+' < 0$, so never $0$.' }],
      [ T('a)  $'+eqFmt+' = '+completed+'$.'),
        T('b)  $-(x - '+p+')^2 \\le 0$ always, so $'+completed+' \\le '+nStr(q)+' < 0$.'),
        T('Therefore $'+eqFmt+'$ is never 0.') ]);

};

/* -------- Q4: Inequalities -------- */

const tIneqFactorised = {
  id:'ineq-factorised', strand:'Q4', difficulty: 1,
  gen(){
    let a, b;
    do { a = ri(-5, 5); b = ri(-5, 5); } while (a === b || a === 0 && b === 0);
    const op = pick(['>', '<']);
    const ea = a > 0 ? '+ '+a : MINUS+' '+(-a);
    const eb = b > 0 ? '+ '+b : MINUS+' '+(-b);
    const eq = '(x '+ea+')(x '+eb+') '+op+' 0';
    const lo = Math.min(a,b), hi = Math.max(a,b);
    const soln = op === '>' ? ('$x < '+lo+'$ or $x > '+hi+'$') : ('$'+lo+' < x < '+hi+'$');
    return Q('iqf|'+a+'|'+b+'|'+op,
      [ T('Solve the inequality  $'+eq+'$.') ],
      [{ text: soln }],
      [ T(op === '>' ? 'Roots at '+lo+' and '+hi+'; upward parabola, so outside the roots: $x < '+lo+'$ or $x > '+hi+'$.'
                     : 'Roots at '+lo+' and '+hi+'; upward parabola, so between the roots: $'+lo+' < x < '+hi+'$.') ]);
  }
};

const tIneqRearrange = {
  id:'ineq-rearrange', strand:'Q4', difficulty: 2,
  gen(){
    let r1, r2;
    do { r1 = ri(-3, 3); r2 = ri(-3, 3); } while (r1 === r2);
    const coef = pick([1, 1, 2]);
    const B = -coef * (r1 + r2);
    const C = coef * r1 * r2;
    const q = ri(-4, 6);
    const p = B + q;
    const r = -C;
    const op = pick(['<', '>']);
    const lhs = fmtQuad(coef, p, 0);
    const rhs = fmtQuad(0, q, r);
    const eq = lhs + ' ' + op + ' ' + rhs;
    const rearranged = fmtQuad(coef, B, C) + ' ' + op + ' 0';
    const lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    const soln = op === '<'
      ? '$' + lo + ' < x < ' + hi + '$'
      : '$x < ' + lo + '$ or $x > ' + hi + '$';
    return Q('iqr|'+coef+'|'+p+'|'+q+'|'+r+'|'+op,
      [T('Solve the inequality  $' + eq + '$.')],
      [{ text: soln }],
      [ T('Rearrange:  $' + rearranged + '$.'),
        T('Solution:  ' + soln + '.') ]);
  }
};

const tIneqSimultaneous = {
  id:'ineq-simultaneous', strand:'Q4', difficulty: 3,
  gen(){
    let a = ri(-3, 2);
    let b = a + ri(2, 4);
    let c = b + ri(1, 3);
    let d = c + ri(2, 4);

    let r1 = a, r2 = b, r3 = c, r4 = d;
    
    const eq1 = fmtQuad(1, -(r1+r2), r1*r2) + ' < 0';

      [ T('First inequality:  $'+fmtQuad(1, -(r1+r2), r1*r2)+' < 0  \\Rightarrow  '+r1+' < x < '+r2+'$.'),

        T('Intersection of these regions:  '+soln+'.') ]);
  }
};

const tIneqWordProblem = {

/* -------- Q5: Discriminant -------- */

const tDiscEvaluate = {
  id:'disc-evaluate', strand:'Q5', difficulty: 1,
  gen(){
    const a = ri(1, 3), b = ri(-8, 8), c = ri(-8, 8);
    if (b === 0 && c === 0) return tDiscEvaluate.gen();
    const disc = b*b - 4*a*c;
    const eq = fmtQuad(a, b, c) + ' = 0';
    let kind;
    if (disc > 0){ kind = 'two distinct real roots'; }
    else if (disc === 0){ kind = 'one (repeated) real root'; }
    else { kind = 'no real roots'; }
    return Q('de|'+a+'|'+b+'|'+c,
      [ T('For the quadratic equation  $'+eq+'$,'),
        T('(a)  find the discriminant.'),
        T('(b)  state the number of real roots.') ],
      [{ text: '(a)  $\\Delta = '+disc+'$    (b)  '+kind }],
      [ T('$a = '+a+'$, $b = '+b+'$, $c = '+c+'$.'),
        T('$\\Delta = b^2 - 4ac = '+disc+'$.'),
        T('So the equation has '+kind+'.') ]);
  }
};

/* -------- Q6: Disguised quadratics -------- */

const tDisguisedQuartic = {
  id:'disguised-quartic', strand:'Q6', difficulty: 3,
  gen(){
    let r1, r2;
    do { r1 = ri(-4, 4) || 2; r2 = ri(-4, 4) || -3; }
    while (r1 === r2 || r1 === 0 || r2 === 0 || Math.sign(r1) === Math.sign(r2));
    const B = -(r1 + r2);
    const C = r1 * r2;
    const quarticStr = 'x^4 ' + (B>0?'+ '+B:'- '+(-B)) + 'x^2 ' + (C>0?'+ '+C:'- '+(-C)) + ' = 0';
    const posR = Math.max(r1, r2);
    const sqrts = [Math.sqrt(posR), -Math.sqrt(posR)].filter(v => Number.isInteger(v));
    if (sqrts.length === 0) return tDisguisedQuartic.gen();
    const ans = sqrts.map(v => '$x = '+v+'$').join(' or ');
    const f1 = r1 > 0 ? `(y - ${r1})` : `(y + ${-r1})`;
    const f2 = r2 > 0 ? `(y - ${r2})` : `(y + ${-r2})`;
    return Q('dq|'+r1+'|'+r2,
      [ T('Solve  $'+quarticStr+'$') ],
      [{ text: ans }],
      [ T('Let $y = x^2$.  Then $y^2 '+(B>0?'+ '+B:'- '+(-B))+'y '+(C>0?'+ '+C:'- '+(-C))+' = 0$.'),
        T('Factorise:  $'+f1+f2+' = 0  \\Rightarrow  y = '+nStr(r1)+'$ or $y = '+nStr(r2)+'$.'),
        T('$y = '+nStr(Math.min(r1,r2))+'$ gives $x^2 < 0$ — rejected.'),
        T('$y = '+posR+'$ gives $x = \\pm'+Math.sqrt(posR)+'$.  So '+ans+'.') ]);
  }
};

const tDisguisedReciprocal = {
  id:'disguised-reciprocal', strand:'Q6', difficulty: 3,
  gen(){
    let y1, y2;
    do { y1 = ri(1, 6); y2 = ri(1, 6); } while (y1 === y2);
    const c = y1 + y2;
    const k = y1 * y2;
    const eq = 'x^2 + \\frac{'+k+'}{x^2} = '+c;
    const sq1 = Math.sqrt(y1), sq2 = Math.sqrt(y2);
    let answer;
    if (Number.isInteger(sq1) && Number.isInteger(sq2)){
      answer = '$x = \\pm'+sq1+'$ or $x = \\pm'+sq2+'$';
    } else {
      answer = '$x = \\pm\\sqrt{'+y1+'}$ or $x = \\pm\\sqrt{'+y2+'}$';
    }
    return Q('dre|'+y1+'|'+y2, [T('Solve  $'+eq+'$.  Give your answers in exact form.')],
      [{ text: answer }],
      [ T('Multiply by $x^2$:  $x^4 - '+c+'x^2 + '+k+' = 0$.'),
        T('Let $y = x^2$:  $y^2 - '+c+'y + '+k+' = 0  \\Rightarrow  y = '+y1+'$ or $y = '+y2+'$.'),
        T('So $x^2 = '+y1+'$ or $x^2 = '+y2+'  \\Rightarrow  '+answer+'$.') ]);
  }
};

const tDisguisedExp = {

const tDisguisedSqrt = {

/* -------- Q7: Challenging -------- */

const tChallengingTangent = {
  id:'challenging-tangent', strand:'Q7', difficulty: 4,
  gen(){
    const p = ri(-4, 4);
    const q = ri(-5, 10);
    const m = ri(-4, 6);
    const num = (p - m) * (p - m);
    if (num % 4 !== 0) return tChallengingTangent.gen();
    const c = q - num / 4;
    
    const curveEq = 'y = ' + fmtQuad(1, p, q);
    const lineEq = 'y = ' + m + 'x + c';
    const rearranged = fmtQuad(1, p - m, q - c);
    const deltaEq = '(' + (p-m) + ')^2 - 4(' + (q-c) + ') = 0';

    return Q('cht|'+p+'|'+q+'|'+m,
      [ T('The line $'+lineEq+'$ is a tangent to the curve $'+curveEq+'$.'),
        T('Find the value of $c$.') ],
      [{ text: '$c = '+c+'$' }],
      [ T('At the point of intersection:  $'+curveEq+' = '+lineEq+'$'),
        T('$'+rearranged+' = 0$'),
        T('Since the line is a tangent, the discriminant is zero:'),
        T('$\\Delta = '+deltaEq+'$'),
        T('$'+(p-m)*(p-m)+' - 4q + 4c = 0  \\Rightarrow  c = '+c+'$.') ]);
  }
};

const tChallengingConjugate = {
  id:'challenging-conjugate', strand:'Q7', difficulty: 4,
  gen(){
    const p = ri(1, 5);
    const q = pick([2, 3, 5, 6, 7]);
    
    // Conjugate pair p ± √q gives equation x² - 2px + (p² - q) = 0
    const b = -2 * p;
    const c = p * p - q;
    
    // Completing the square: (x - p)² - q
    const m = -p;
    const n = -q;

    const bStr = (b > 0 ? '+ ' + b : '- ' + Math.abs(b));
    const cStr = (c > 0 ? '+ ' + c : '- ' + Math.abs(c));
    const eq = 'x^2 ' + bStr + 'x ' + cStr + ' = 0';
    const rootStr = p + ' - \\sqrt{' + q + '}';

    const mStr = (m > 0 ? '+ ' + m : '- ' + Math.abs(m));
    const nStr = (n > 0 ? '+ ' + n : '- ' + Math.abs(n));
    const compSquare = '(x ' + mStr + ')^2 ' + nStr;

    return Q('ccr|'+p+'|'+q,
      [
        T('The equation $' + eq + '$, where $b$ and $c$ are integers, has $' + rootStr + '$ as one of its roots.'),
        T('(a) Find the exact values of $b$ and $c$.'),
        T('(b) Hence, write the expression $x^2 + bx + c$ in the form $(x + m)^2 + n$, where $m$ and $n$ are integers to be found.')
      ],
      [
        { text: '(a) $b = ' + b + '$, $c = ' + c + '$   (b) $' + compSquare + '$' }
      ],
      [
        T('(a) Since the coefficients are integers and the root is irrational, the conjugate $' + p + ' + \\sqrt{' + q + '}$ must also be a root.'),
        T('Sum of roots: $(' + p + ' - \\sqrt{' + q + '}) + (' + p + ' + \\sqrt{' + q + '}) = ' + (2*p) + '$, so $b = -2p = ' + b + '$.'),
        T('Product of roots: $(' + p + ' - \\sqrt{' + q + '})(' + p + ' + \\sqrt{' + q + '}) = ' + p + '^2 - (' + q + ') = ' + c + '$.'),
        T('(b) Complete the square: $x^2 - ' + (2*p) + 'x + ' + c + ' = (x - ' + p + ')^2 - ' + q + '$.'),
        T('So $m = ' + m + '$ and $n = ' + n + '$.')
      ]
    );
  }
};

const tExtraDistinctRoots = {
  id:'extra-distinct-roots', strand:'Q4', difficulty: 3,
  gen(){
    const m = ri(1, 4);
    const n = m + 1;
    const eq = `kx^2 + (2k - ${m})x + (k - ${n}) = 0`;
    
    // Simplify the fraction m*m / 4
    const g = gcd(m*m, 4);
    const num = m*m / g;
    const den = 4 / g;
    const fracStr = den === 1 ? String(num) : `${num}/${den}`;

    return Q('edr|'+m+'|'+n,
      [ T(`Find all values of $k$ for which the equation $${eq}$ has two distinct real roots.`) ],
      [{ text: `$k > -${fracStr}, k \\neq 0$` }],
      [ T(`For two distinct real roots, we need $a \\neq 0$ and $\\Delta > 0$.`),
        T(`Here $a = k$, so $k \\neq 0$.`),
        T(`$\\Delta = (2k - ${m})^2 - 4(k)(k - ${n}) = 4k^2 - ${4*m}k + ${m*m} - 4k^2 + ${4*n}k = ${4*(n-m)}k + ${m*m}$.`),
        T(`So $${4*(n-m)}k + ${m*m} > 0 \\Rightarrow k > -${fracStr}$.`),
        T(`Therefore, $k > -${fracStr}$ and $k \\neq 0$.`) ]);
  }
};

/* ============================================================
   Composition — fill 2 pages
   ============================================================ */
const DISABLED_KEY = 'as-quadratic-disabled-v1';
const DEFAULT_DISABLED = ['graph-from-vertex'];

function loadDisabled(){
  try {
    const raw = localStorage.getItem(DISABLED_KEY);
    if (!raw) return new Set(DEFAULT_DISABLED);
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return new Set(DEFAULT_DISABLED);
    const known = new Set(TOPICS.map(t=>t.id));
    return new Set(arr.filter(id => known.has(id)));
  } catch(e) { return new Set(DEFAULT_DISABLED); }
}
function saveDisabled(s){ try { localStorage.setItem(DISABLED_KEY, JSON.stringify(Array.from(s))); } catch(e){} }

function activeTopics(){
  const off = loadDisabled();
  return TOPICS.filter(t => !off.has(t.id));
}

function strandOrder(topics){
  const byStrand = {};
  for (const t of shuffle(topics.slice())) (byStrand[t.strand]=byStrand[t.strand]||[]).push(t);
  const strands = Object.keys(byStrand).filter(s => byStrand[s].length > 0);
  const order = [];
  while (order.length < topics.length){
    for (const s of strands){
      if (byStrand[s].length > 0) order.push(byStrand[s].shift());
    }
  }
  return order;
}

function generateSheet(){
  const usedKeys = new Set();
  const usedTopics = new Set();
  const out = [];
  const order = strandOrder(activeTopics());
  for (const topic of order){
    if (usedTopics.has(topic.id)) continue;
    let cand = null;
    for (let t = 0; t < 20; t++){
      const c = topic.gen();
      if (c && !usedKeys.has(c.key) && c.blocks.length > 0){ cand = c; break; }
    }
    if (!cand) continue;
    
    cand.difficulty = topic.difficulty || 1;
    
    const trial = out.concat([cand]);
    const testPages = layoutSheet({ title:'Test', questions: trial, revealState: false });
    if (testPages.length > 2 && out.length >= 8) break;
    out.push(cand);
    usedTopics.add(topic.id);
    usedKeys.add(cand.key);
    if (out.length >= 20) break;
  }
  
  out.sort((a, b) => a.difficulty - b.difficulty);
  
  return out;
}

/* ============================================================
   HTML renderer (with KaTeX)
   ============================================================ */
function esc(s){
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
  return String(s).replace(/[&<>"]/g, function(c){ return map[c]; });
}
function greyToColour(g){
  const shade = Math.round(g * 255);
  return 'rgb('+shade+','+shade+','+shade+')';
}
function renderMath(text) {
  if (!text.includes('$')) return esc(text);
  if (typeof katex === 'undefined') return esc(text);
  const parts = text.split(/(\$[^$]*\$)/);
  let html = '';
  for (let p of parts) {
    if (p.length >= 2 && p.startsWith('$') && p.endsWith('$')) {
      try {
        html += katex.renderToString(p.slice(1, -1), { throwOnError: false, displayMode: false });
      } catch(e) {
        html += esc(p);
      }
    } else {
      html += esc(p);
    }
  }
  return html;
}

function drawHTML(pagesItems){
  const pagesEl = document.getElementById('pages');
  pagesEl.innerHTML = '';
  for (const items of pagesItems){
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    const pg = document.createElement('div');
    pg.className = 'page';
    const parts = [];
    
    const grouped = [];
    let currentGroup = null;
    for (const it of items) {
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer') {
        if (currentGroup && Math.abs(currentGroup.y - it.y) < 1 && currentGroup.size === it.size) {
          currentGroup.s += it.s;
        } else {
          if (currentGroup) grouped.push(currentGroup);
          currentGroup = { t: it.t, x: it.x, y: it.y, size: it.size, s: it.s };
        }
      } else {
        if (currentGroup) { grouped.push(currentGroup); currentGroup = null; }
        grouped.push(it);
      }
    }
    if (currentGroup) grouped.push(currentGroup);

    for (const it of grouped){
      if (it.t === 'text' || it.t === 'run' || it.t === 'answer'){
        const top = it.y - it.size * 0.755;
        const cls = it.t === 'answer' ? 'tx ans' : 'tx';
        parts.push('<span class="' + cls + '" style="left:'+it.x.toFixed(2)+
          'pt;top:'+top.toFixed(2)+'pt;font-size:'+it.size.toFixed(2)+'pt;' +
          (it.bold ? 'font-weight:700;' : '') +
          (it.italic ? 'font-style:italic;' : '') + '">' + renderMath(it.s) + '</span>');
      } else if (it.t === 'line' || it.t === 'answer-line'){
        let color = it.grey ? '#94a3b8' : '#000';
        if (it.color) color = `rgb(${it.color[0]}, ${it.color[1]}, ${it.color[2]})`;
        const cls = it.t === 'answer-line' ? 'ans' : '';
        parts.push(
          '<svg class="' + cls + '" ' +
          'style="position:absolute;left:0;top:0;width:595.28pt;height:841.89pt;overflow:visible;pointer-events:none;" ' +
          'viewBox="0 0 595.28 841.89" xmlns="http://www.w3.org/2000/svg">' +
          '<line x1="'+it.x1.toFixed(2)+'" y1="'+it.y1.toFixed(2)+
          '" x2="'+it.x2.toFixed(2)+'" y2="'+it.y2.toFixed(2)+
          '" stroke="'+color+'" stroke-width="'+it.w.toFixed(2)+'"/></svg>');
      } else if (it.t === 'poly'){
        const fill = greyToColour(it.grey!==undefined ? it.grey : 0);
        const ptsStr = it.pts.map(p => p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
        parts.push('<svg style="position:absolute;left:0;top:0;width:595.28pt;height:841.89pt;overflow:visible;pointer-events:none;" viewBox="0 0 595.28 841.89" xmlns="http://www.w3.org/2000/svg"><polygon points="'+ptsStr+'" fill="'+fill+'"/></svg>');
      }
    }
    pg.innerHTML = parts.join('');
    wrap.appendChild(pg);
    pagesEl.appendChild(wrap);
  }
}

function refreshCount(){
  const off = loadDisabled();
  document.getElementById('tpCount').textContent =
    (TOPICS.length - off.size) + ' of ' + TOPICS.length + ' topics enabled';
}
let regenTimer = null;
function scheduleRegen(){ if (regenTimer) clearTimeout(regenTimer);
  regenTimer = setTimeout(regenerate, 120); }

function openTopicsPanel(){
  buildTopicsPanel();
  document.getElementById('topicsPanel').classList.add('open');
  document.getElementById('topicsPanel').setAttribute('aria-hidden','false');
  document.getElementById('backdrop').classList.add('open');
}
function closeTopicsPanel(){
  document.getElementById('topicsPanel').classList.remove('open');
  document.getElementById('topicsPanel').setAttribute('aria-hidden','true');
  document.getElementById('backdrop').classList.remove('open');
}
document.getElementById('topicsBtn').addEventListener('click', openTopicsPanel);
document.getElementById('tpClose').addEventListener('click', closeTopicsPanel);
document.getElementById('backdrop').addEventListener('click', closeTopicsPanel);
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopicsPanel(); });
document.getElementById('tpAll').addEventListener('click', () => {
  saveDisabled(new Set()); buildTopicsPanel(); scheduleRegen();
});
document.getElementById('tpNone').addEventListener('click', () => {
  saveDisabled(new Set(TOPICS.map(t => t.id))); buildTopicsPanel(); scheduleRegen();
});
document.getElementById('tpReset').addEventListener('click', () => {
  try { localStorage.removeItem(DISABLED_KEY); } catch(e){}
  buildTopicsPanel(); scheduleRegen();
});

/* Boot */
function boot(){
  const urlSeed = getSeedFromURL();
  seedInput.value = (urlSeed !== null) ? urlSeed : Date.now() % 100000;
  applySeed();
  regenerate();
  setSeedInURL(seedInput.value);
  fitPage();
}
if (document.readyState === 'complete') boot();
else window.addEventListener('load', boot, { once: true });

})();
</script>
</body>
