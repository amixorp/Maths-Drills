<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indices &amp; Surds — Foundation Practice</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script><style>
  :root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:#eef1f5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* KaTeX sizing: let the parent font-size control rendering */
  .katex{ font-size: 1em !important; }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 20px;
    background:#111827; color:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    font-size:14px;
  }
  .tb-title{font-weight:700; margin-right:auto; letter-spacing:.3px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e5e7eb}
  .toolbar input[type=number]{
    width:110px; padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:8px 14px; border-radius:8px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit; font-weight:600; cursor:pointer;
  }
  .toolbar button:hover{background:#374151}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
  .score-chip{
    padding:6px 12px; border-radius:999px;
    background:#1f2937; border:1px solid #374151;
    font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
  }

  /* ---------- sheet ---------- */
  .sheet{
    background:#fff;
    max-width:1100px;
    margin:22px auto 60px;
    padding:30px 34px 42px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .sheet-head h1{margin:0; font-size:26px; letter-spacing:.5px}
  .meta{margin-left:auto; display:flex; gap:18px; font-size:13px; color:#374151}
  .meta .line{display:inline-block; width:110px; border-bottom:1px solid #9ca3af}
  .meta .line.short{width:80px}
  .meta .line.tiny{width:48px}
  .instructions{margin:14px 0 18px; font-size:14px; color:var(--muted)}

  /* ---------- questions ---------- */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(400px, 1fr));
    gap:14px;
  }
  @media (max-width:880px){ .questions{grid-template-columns:1fr} }

  .q{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px 12px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px}
  .q-num{
    flex:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:13.5px; line-height:1.35; font-weight:600}

  /* ---------- diagram ---------- */
  .diagram{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;
    min-height:96px;
    margin:2px 0 12px;
    padding:6px 2px;
  }
  .lhs{ font-size: 24px; }
  .eq{ font-size: 22px; font-weight: 700; color: var(--muted); white-space: nowrap; }

  /* ---------- drop slot ---------- */
  .drop-zone{border-radius:12px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:#dbeafe; transform:scale(1.05)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:108px; min-height:60px;
    padding:8px 14px;
    border:2.5px dashed #9ca3af;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#9ca3af;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  /* ---------- options ---------- */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed #e5e7eb;
  }
  @media (max-width:520px){ .options{grid-template-columns:1fr} }

  .option{
    display:flex; align-items:center; gap:8px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fafafa;
    padding:8px 10px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
  .option:hover{background:#f3f4f6}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 2px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 2px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    80%{transform:translateX(-3px)}
  }
  .opt-letter{
    flex:none;
    width:20px; height:20px; border-radius:50%;
    background:#e5e7eb; color:#374151;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    min-height:32px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
  }

  /* ---------- drag ghost ---------- */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 16px;
    border-radius:10px;
    background:#fff; border:1.5px solid var(--line);
    box-shadow:0 10px 22px rgba(15,23,42,.28);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
    font-size:17px;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }

  /* ---------- per-question feedback ---------- */
  .q-feedback{
    margin-top:8px; min-height:15px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* ---------- answer key ---------- */
  .key{
    margin-top:26px;
    border-top:3px solid var(--ink);
    padding-top:12px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 10px; font-size:16px; letter-spacing:.5px}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:6px 10px;
    font-size:13px;
    color:#374151;
  }
  .key-grid b{color:var(--ink)}

  /* ---------- print ---------- */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#9ca3af}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🧮 Indices &amp; Surds Worksheet</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
 </label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option selected>8</option>
      <option>10</option>
      <option>12</option>
    </select>
  </label>
  <label>Topic
    <select id="topicSelect">
      <option value="mixed" selected>Mixed</option>
      <option value="eval">Evaluate powers</option>
      <option value="fracpow">Negative &amp; fractional powers</option>
      <option value="powerform">Write as a power</option>
      <option value="simplify">Simplify to one power</option>
      <option value="expand">Expand into ax^p + bx^q</option>
      <option value="solvepow">Solve x^(m/n) = a/b</option>
      <option value="solveexp">Solve exponential equations</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 8 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

  /* ============================================================
     EXACT RATIONALS
     ============================================================ */
  function R(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
  const rAdd = (a, b) => R(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
  const rSub = (a, b) => R(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
  const rMul = (a, b) => R(a[0] * b[0], a[1] * b[1]);
  const rKey = a => a[0] + '/' + a[1];

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      // Fallback: if the CDN is blocked, show the raw source rather than nothing.
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* Fraction as LaTeX: \frac{n}{d}, reduced, sign hoisted. */
  function sFracL(n, d) {
    if (d === 1) return String(n);
    const sign = n < 0 ? '-' : '';
    return sign + '\\frac{' + Math.abs(n) + '}{' + d + '}';
  }
  function fracL(n, d) {
    if (d === 1) return String(n);
    return '\\frac{' + Math.abs(n) + '}{' + d + '}';
  }

  /* x to a rational power, using \sqrt / \sqrt[3] when the numerator is 1. */
  function xExpL(r) {
    const n = r[0], d = r[1];
    if (d === 1) {
      if (n === 1) return 'x';
      return 'x^{' + n + '}';
    }
    if (n === 1) {
      if (d === 2) return '\\sqrt{x}';
      if (d === 3) return '\\sqrt[3]{x}';
      if (d === 4) return '\\sqrt[4]{x}';
    }
    return 'x^{' + sFracL(n, d) + '}';
  }
  function axExpL(A, r) {
    return (A === 1 ? '' : String(A)) + xExpL(r);
  }

  /* ============================================================
     DISTRACTOR POOLS
     Each returns { latex, key } objects.  Dedup is done on the
     canonical key, not on the rendered HTML.
     ============================================================ */
  function numberPool(correct, cands) {
    const seen = new Set([String(correct)]);
    const out = [];
    const add = v => {
      if (!Number.isInteger(v) || v < 2 || v > 20000 || seen.has(String(v))) return;
      seen.add(String(v));
      out.push({ latex: String(v), key: 'n:' + v });
    };
    cands.forEach(add);
    for (let k = 1; out.length < 8 && k < 60; k++) {
      add(correct + k); add(correct - k); add(correct * 2); add(Math.round(correct / 2));
    }
    return out;
  }
  function fracPool(correctR, candsR) {
    const seen = new Set([rKey(correctR)]);
    const out = [];
    candsR.forEach(r => {
      if (!r) return;
      if (r[1] === 0) return;                  // ← NEW: no /0
                if (r[0] === 0) return;                  // ← NEW: no bare "0"
      if (Math.abs(r[0]) > 4000 || r[1] > 4000 || r[0] === 0) return;
      const k = rKey(r);
      if (seen.has(k)) return;
      seen.add(k);
      out.push({ latex: sFracL(r[0], r[1]), key: 'f:' + k });
    });
    return out;
  }
  function powerPool(base, correctR, candsR) {
    const seen = new Set([rKey(correctR)]);
    const out = [];
    candsR.forEach(r => {
      if (!r) return;
      if (Math.abs(r[0]) > 30 || r[1] > 12) return;
      const k = rKey(r);
      if (seen.has(k)) return;
      seen.add(k);
      out.push({
        latex: (base === 'x') ? ('x^{' + sFracL(r[0], r[1]) + '}')
                              : (base + '^{' + sFracL(r[0], r[1]) + '}'),
        key: 'p:' + base + '^' + k
      });
    });
    return out;
  }
  function exprPool(correctLatex, correctKey, cands) {
    const seen = new Set([correctKey]);
    const out = [];
    cands.forEach(c => {
      if (!c || !c.latex || seen.has(c.key)) return;
      seen.add(c.key);
      out.push(c);
    });
    return out;
  }

  /* ============================================================
     QUESTION GENERATORS
     ============================================================ */

  /* 1. Evaluate a^(m/n) */
  function genEval() {
    for (let t = 0; t < 400; t++) {
      const n = pick([2, 3, 4]);
      const kmax = n === 2 ? 10 : (n === 3 ? 5 : 4);
      const k = ri(2, kmax);
      const a = Math.pow(k, n);
      if (a > 1000) continue;
      const m = ri(2, 5);
      const ans = Math.pow(k, m);
      if (ans > 3000 || ans === a || ans < 2) continue;
      const sig = 'E|' + a + '|' + m + '|' + n;
      const lhs = tex(String(a) + '^{' + sFracL(m, n) + '}');
      const cands = [
        Math.pow(k, m + 1), Math.pow(k, m - 1), k, k * m,
        a * k, Math.pow(a, m), Math.round(a / k), k + m,
        Math.pow(k, n - m > 0 ? n - m : 1)
      ];
      const pool = numberPool(ans, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: String(ans), ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return { sig, prompt: 'Evaluate.', lhs, eq: '=', options: opts };
    }
    return null;
  }

  /* 2. Evaluate (p/q)^(-m/n) */
  function genFracPow() {
    for (let t = 0; t < 400; t++) {
      const n = pick([2, 3, 4]);
      const u = ri(2, 3);
      const v = ri(2, 4);
      if (u === v) continue;
      const p = Math.pow(u, n), q = Math.pow(v, n);
      if (p > 500 || q > 500) continue;
      const m = ri(2, 4);
      const am = Math.pow(u, m), bm = Math.pow(v, m);
      if (am > 2000 || bm > 2000) continue;
      const sig = 'F|' + p + '|' + q + '|' + m + '|' + n;
      const lhs = tex('\\left(' + fracL(p, q) + '\\right)^{' + sFracL(-m, n) + '}');
      const correctR = R(bm, am);
      const cands = [
        R(am, bm), R(-bm, am), R(v, u), R(u, v),
        R(Math.pow(v, m + 1), Math.pow(u, m + 1)),
        R(Math.pow(v, m - 1), Math.pow(u, m - 1)),
        R(Math.pow(v, m * n), Math.pow(u, m * n))
      ];
      const pool = fracPool(correctR, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: sFracL(correctR[0], correctR[1]), ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return { sig, prompt: 'Evaluate.', lhs, eq: '=', options: opts };
    }
    return null;
  }

  /* 3. Write N in the form b^p */
  function genPowerForm() {
    for (let t = 0; t < 400; t++) {
      const k = ri(2, 5);
      const q = pick([2, 3, 4]);
      const b = Math.pow(k, q);
      if (b > 200) continue;
      const p = ri(2, 6);
      const N = Math.pow(k, p);
      if (N > 1000 || N < 4) continue;
      const r = R(p, q);
      if (r[1] === 1) continue;
      const sig = 'P|' + N + '|' + b;
      const lhs = tex(String(N));
      const correctLatex = b + '^{' + sFracL(r[0], r[1]) + '}';
      const cands = [
        R(r[1], r[0]), R(r[0], 1), R(-r[0], r[1]),
        R(r[0] + r[1], r[1]), R(r[0] - r[1], r[1]),
        R(r[0] * r[1], 1), R(1, r[1])
      ];
      const pool = powerPool(String(b), r, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: correctLatex, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Write ' + N + ' in the form ' + tex(b + '^p') + '.',
        lhs, eq: '=', options: opts
      };
    }
    return null;
  }

  /* 4. Write 1/N in the form b^p */
  function genPowerFormRecip() {
    for (let t = 0; t < 400; t++) {
      const k = ri(2, 5);
      const q = pick([2, 3, 4]);
      const b = Math.pow(k, q);
      if (b > 200) continue;
      const p = ri(2, 6);
      const N = Math.pow(k, p);
      if (N > 1000 || N < 4) continue;
      const r = R(p, q);
      if (r[1] === 1) continue;
      const negR = R(-r[0], r[1]);
      const sig = 'PR|' + N + '|' + b;
      const lhs = tex('\\frac{1}{' + N + '}');
      const correctLatex = b + '^{' + sFracL(negR[0], negR[1]) + '}';
      const cands = [
        R(r[0], r[1]), R(-r[1], r[0]), R(-r[0], 1),
        R(-r[0] - r[1], r[1]), R(-r[0] + r[1], r[1]),
        R(-r[0] * r[1], 1), R(-1, r[1])
      ];
      const pool = powerPool(String(b), negR, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: correctLatex, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Write this fraction in the form ' + tex(b + '^p') + '.',
        lhs, eq: '=', options: opts
      };
    }
    return null;
  }

  /* 5. Simplify to a single power of x */
  function genSimplify() {
    for (let t = 0; t < 400; t++) {
      const a = pick([[3, 2], [5, 2], [2, 1], [1, 2], [7, 2], [4, 1]]);
      const b = pick([[1, 2], [1, 3], [3, 4], [2, 3], [1, 4]]);
      const c = pick([[1, 3], [1, 2], [1, 4], [2, 3], [3, 4]]);
      const A = R(a[0], a[1]), B = R(b[0], b[1]), C = R(c[0], c[1]);
      const ans = rSub(rAdd(A, B), C);
      if (ans[1] > 6 || Math.abs(ans[0]) > 12 || ans[0] === 0) continue;
      if (ans[0] === 1 && ans[1] === 1) continue;

      const numL = xExpL(A) + ' \\times ' + xExpL(B);
      const denL = xExpL(C);
      const lhs = tex('\\frac{' + numL + '}{' + denL + '}');

      const sig = 'S|' + rKey(A) + '|' + rKey(B) + '|' + rKey(C);
      const correctLatex = 'x^{' + sFracL(ans[0], ans[1]) + '}';

      const candsR = [
        rAdd(rAdd(A, B), C),
        rSub(rSub(A, B), C),
        rSub(rMul(A, B), C),
        R(rAdd(A, B)[0] * C[1], rAdd(A, B)[1] * C[0]),
        rMul(rMul(A, B), C),
        R(-ans[0], ans[1]),
        rAdd(rAdd(A, B), rMul(B, C)),
        rSub(rMul(A, C), B)
      ];
      const pool = powerPool('x', ans, candsR);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: correctLatex, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Write as a single power of x.',
        lhs, eq: '=', options: opts
      };
    }
    return null;
  }

  /* 6. Expand (A x^m + x^n) / x^k into ax^p + bx^q */
  function genExpand() {
    for (let t = 0; t < 400; t++) {
      const A = ri(2, 5);
      const m = pick([[1, 1], [2, 1], [1, 2], [3, 2]]);
      const nn = pick([[1, 2], [1, 3], [3, 2], [5, 2]]);
      const k = ri(2, 3);
      const M = R(m[0], m[1]), N = R(nn[0], nn[1]), K = R(k, 1);

      const p1 = rSub(M, K);
      const p2 = rSub(N, K);

      const numL = axExpL(A, M) + ' + ' + xExpL(N);
      const denL = 'x^{' + k + '}';
      const lhs = tex('\\frac{' + numL + '}{' + denL + '}');

      const sig = 'X|' + A + '|' + rKey(M) + '|' + rKey(N) + '|' + rKey(K);
      const correctKey = 'sum:' + rKey(p1) + ':' + rKey(p2);
      const correctLatex = axExpL(A, p1) + ' + ' + xExpL(p2);

      const mkSum = (q1, q2) => ({
        latex: axExpL(A, q1) + ' + ' + xExpL(q2),
        key: 'sum:' + rKey(q1) + ':' + rKey(q2)
      });

      const cands = [
        mkSum(p1, rAdd(N, K)),
        mkSum(rSub(R(0, 1), K), p2),
        mkSum(rAdd(M, K), p2),
        mkSum(p1, rMul(N, K)),
        mkSum(rMul(M, N), p2),
        mkSum(rSub(M, R(1, 1)), p2),
        mkSum(p1, rSub(R(1, 2), K)),
        mkSum(R(-p1[0], p1[1]), p2)
      ];
      const pool = exprPool(correctLatex, correctKey, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: correctLatex, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Write in the form ' + tex('ax^{p} + bx^{q}') + '.',
        lhs, eq: '=', options: opts
      };
    }
    return null;
  }

  /* 7. Solve x^(m/n) = A/B */
  function genSolvePower() {
    for (let t = 0; t < 400; t++) {
      const u = ri(2, 4), v = ri(2, 5);
      if (u === v) continue;
      const n = pick([2, 3]);
      const m = pick([2, 3]);
      const A = Math.pow(u, m), B = Math.pow(v, m);
      if (A > 400 || B > 400) continue;
      const ansN = Math.pow(u, n), ansD = Math.pow(v, n);
      if (ansN > 3000 || ansD > 3000) continue;
      const g = gcd(m, n);
      const mm = m / g, nn = n / g;
      if (nn === 1) continue;
      const sig = 'SP|' + mm + '|' + nn + '|' + A + '|' + B;
      const lhs = tex('x^{' + sFracL(mm, nn) + '} = ' + fracL(A, B));
      const correctR = R(ansN, ansD);
      const cands = [
        R(u, v),
        R(ansD, ansN),
        R(A, B),
        R(Math.pow(u, n * m), Math.pow(v, n * m)),
        R(v, u),
        R(Math.pow(u, n + 1), Math.pow(v, n + 1)),
        R(Math.pow(u, n - 1), Math.pow(v, n - 1))
      ];
      const pool = fracPool(correctR, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: sFracL(correctR[0], correctR[1]), ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Solve the equation for x.',
        lhs, eq: tex('\\Rightarrow x ='), options: opts
      };
    }
    return null;
  }

  /* 8. Exponential equation */
  function genExpEquation() {
    const combos = [];
    for (const g of [2, 3]) {
      for (let A = 1; A <= 3; A++) {
        for (let B = 1; B <= 3; B++) {
          for (let D = 2; D <= 3; D++) {
            for (let E = 1; E <= 3; E++) {
              const C = D * E;
              const den = A + B - C;
              if (den === 0) continue;
              if (A === C) continue;
              const r = R(-B, den);
              if (r[0] === 0) continue;
              if (Math.abs(r[0]) > 6 || r[1] > 6) continue;
              combos.push({ g, A, B, D, E, C, r });
            }
          }
        }
      }
    }
    if (!combos.length) return null;

    for (let t = 0; t < 60; t++) {
      const c = pick(combos);
      const { g, A, B, D, E, C, r } = c;
      const sig = 'EE|' + g + '|' + A + '|' + B + '|' + D + '|' + E;

      const firstL  = g + '^{' + (A === 1 ? 'x' : A + 'x') + '}';
      const secondL = Math.pow(g, B) + '^{x+1}';
      const rhsL    = Math.pow(g, D) + '^{' + (E === 1 ? '' : E) + 'x}';
      const lhs = tex(firstL + ' \\times ' + secondL + ' = ' + rhsL);

      const cands = [
        R(-r[0], r[1]),
        R(-B, A + B + C),
        R(-B, A - B - C),
        R(-B, A + B),
        R(B, A + B - C),
        R(-B, A + B - C + 1),
        R(1, A + B - C),
        R(-B, C - A - B + 1),
        R(1, Math.abs(A + B - C))
      ];
      const pool = fracPool(r, cands);
      if (pool.length < 3) continue;
      const opts = shuffle([
        { latex: sFracL(r[0], r[1]), ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Solve the exponential equation.',
        lhs, eq: tex('\\Rightarrow x ='), options: opts
      };
    }
    return null;
  }

  /* ============================================================
     REGISTRY + MIX
     ============================================================ */
  const GENERATORS = {
    eval:        genEval,
    fracpow:     genFracPow,
    powerform:   genPowerForm,
    powerrecip:  genPowerFormRecip,
    simplify:    genSimplify,
    expand:      genExpand,
    solvepow:    genSolvePower,
    solveexp:    genExpEquation
  };

  const MIX = [
    'eval', 'eval', 'eval',
    'fracpow', 'fracpow',
    'powerform', 'powerform', 'powerrecip',
    'simplify', 'simplify',
    'expand', 'expand',
    'solvepow', 'solvepow',
    'solveexp'
  ];

  const TOPIC_TYPES = {
    mixed:      MIX,
    eval:       ['eval'],
    fracpow:    ['fracpow'],
    powerform:  ['powerform', 'powerrecip'],
    simplify:   ['simplify'],
    expand:     ['expand'],
    solvepow:   ['solvepow'],
    solveexp:   ['solveexp']
  };

  function buildQuestions(n, types) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const q = GENERATORS[pick(types)]();
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const q = GENERATORS[pick(types)]();
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + tex(o.latex) + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.prompt + '</span>' +
      '</div>' +
      '<div class="diagram">' +
        '<span class="lhs">' + q.lhs + '</span>' +
        '<span class="eq">' + q.eq + '</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);
    const topic = document.getElementById('topicSelect').value;
    const types = TOPIC_TYPES[topic] || MIX;

    questions = buildQuestions(n, types);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Indices &amp; Surds</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Drag the correct answer into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.innerHTML = tex(q.options[idx].latex);
      slot.classList.add('filled');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const topicSel   = document.getElementById('topicSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = Math.floor(Math.random() * 1e9);
    applySeed();
    render();
  });

  /* --- seed handling --- */

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  function dateSeed() {
    const d = new Date();
    return parseInt(
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') +
      String(d.getSeconds()).padStart(2, '0'),
      10
    );
  }

  /* --- event wiring --- */

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  topicSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  /* --- boot --- */

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
