<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fractions → Decimals — Foundation Practice</title>
<link rel="stylesheet" href="core/drill.css">
<style>
  :root{
    --q-min:400px; --eq-size:34px; --opt-size:24px;
    --slot-min-w:120px; --slot-min-h:64px; --slot-font:24px; --diagram-min-h:84px;
  }
  /* A fraction drawn with a horizontal bar. */
  .frac{
    display:inline-flex; flex-direction:column; align-items:center;
    vertical-align:middle; line-height:1.05; font-weight:800;
  }
  .frac > .num{border-bottom:2.5px solid currentColor; padding:0 .22em .04em}
  .frac > .den{padding:.04em .22em 0}
  .diagram .frac{font-size:clamp(30px, 9vw, 42px); color:var(--ink)}
  @media print{ .diagram .frac{font-size:32px} }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM  (same seed => same worksheet)
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     FRACTION → DECIMAL  (exact, no floats for the correct answer)
     Only denominators that give terminating decimals are used.
     NOTE: denominator 8 has been removed.
     ============================================================ */
  const DEN_TO_MULT = {
    2:   [5,   10],
    4:   [25,  100],
    5:   [2,   10],
    10:  [1,   10],
    20:  [5,   100],
    25:  [4,   100],
    50:  [2,   100],
    100: [1,   100],
    200: [5,  1000]   /* even numerator → divide top & bottom by 2 to get /100 */
  };

  function fractionToDecimalStr(num, den) {
    const entry = DEN_TO_MULT[den];
    if (!entry) return null;
    const [m, p] = entry;
    const scaled = num * m;
    const digits = String(p).length - 1;       // 10 → 1, 100 → 2, 1000 → 3
    const s = String(scaled).padStart(digits + 1, '0');
    const intPart = s.slice(0, s.length - digits) || '0';
    const decPart = s.slice(-digits);
    let trimmed = decPart.replace(/0+$/, '');
    if (trimmed === '') trimmed = '0';
    return intPart + '.' + trimmed;
  }

  /* Pretty-print a number as a decimal string ("5" → "5.0"). */
  function fmtDecimal(v) {
    const r = Math.round(v * 1000000) / 1000000;
    let s = r.toString();
    if (!s.includes('.') && !s.includes('e')) s += '.0';
    return s;
  }

  /* Plausible wrong answers based on real misconceptions. */
  function buildDecimalDistractors(num, den, correctStr) {
    const correctVal = parseFloat(correctStr);
    const pool = [];
    const seen = new Set([correctStr]);

    const add = (v) => {
      if (!isFinite(v) || v <= 0 || v > 20) return;
      const s = fmtDecimal(v);
      if (seen.has(s)) return;
      seen.add(s);
      pool.push(s);
    };

    // Digit concatenation: 3/4 → 0.34 / 0.43
    if (num < 10 && den < 10) {
      add(parseFloat('0.' + num + den));
      if (num !== den) add(parseFloat('0.' + den + num));
    }
    // Numerator or denominator over 10/100
    if (num < 10)  add(num / 10);
    if (num < 100) add(num / 100);
    if (den < 10)  add(den / 10);
    if (den < 100) add(den / 100);
    // Orders of magnitude out
    add(correctVal * 10);
    add(correctVal / 10);
    // Near-miss on the last decimal place: 0.75 → 0.7 / 0.76
    const dot = correctStr.indexOf('.');
    if (dot >= 0) {
      const intPart = correctStr.slice(0, dot);
      const decPart = correctStr.slice(dot + 1);
      if (decPart.length >= 2) {
        add(parseFloat(intPart + '.' + decPart.slice(0, -1)));
        const last = parseInt(decPart[decPart.length - 1], 10);
        if (last < 9) {
          add(parseFloat(intPart + '.' + decPart.slice(0, -1) + (last + 1)));
        }
      }
    }
    // Gentle fallbacks so we always have enough to choose from
    [0.1, -0.1, 0.05, -0.05, 0.2, -0.2, 0.5, -0.5].forEach(d => add(correctVal + d));

    return pool;
  }

  /* ============================================================
     SMALL HTML HELPERS
     ============================================================ */
  function fractionHTML(num, den) {
    return '<span class="frac"><span class="num">' + num +
           '</span><span class="den">' + den + '</span></span>';
  }
  const qmarkHTML = () => '<div class="drop-zone"><div class="qmark">?</div></div>';

  /* ============================================================
     QUESTION GENERATORS
     ============================================================ */

  const POOL_HALVES_QUARTERS = [[1,2],[1,4],[3,4]];
  const POOL_TENTHS = [
    [1,10],[2,10],[3,10],[4,10],[5,10],[6,10],[7,10],[8,10],[9,10]
  ];
  const POOL_HUNDREDTHS = [
    [1,100],[3,100],[7,100],[23,100],[45,100],[57,100],[89,100]
  ];
  const POOL_FIFTHS = [[1,5],[2,5],[3,5],[4,5]];
  /* Denominator 8 removed. */
  const POOL_LARGER = [
    [1,20],[3,20],[7,20],[9,20],[11,20],[13,20],
    [1,25],[2,25],[3,25],[4,25],[6,25],[7,25],[8,25],[9,25],[11,25],[12,25],
    [1,50],[3,50],[7,50],[9,50],[11,50],[13,50]
  ];
  /* Denominator 200 — even numerators only, so dividing top & bottom by 2
     puts the fraction straight over 100 (a nice extra practice step).
     Appears with a deliberately low weight (see TYPE_WEIGHTS). */
  const POOL_TWO_HUNDREDTHS = [
    [2,200],[6,200],[14,200],[26,200],[34,200],[46,200],
    [58,200],[74,200],[86,200],[94,200],[110,200],[126,200],
    [142,200],[158,200],[174,200],[190,200],[198,200]
  ];

  function makeQuestion(num, den) {
    const correct = fractionToDecimalStr(num, den);
    const distractors = shuffle(buildDecimalDistractors(num, den, correct)).slice(0, 3);

    // Absolute safety net — should never trigger.
    let bump = 1;
    while (distractors.length < 3) {
      const f = fmtDecimal(parseFloat(correct) + bump * 0.1);
      if (f !== correct && !distractors.includes(f)) distractors.push(f);
      bump++;
    }

    const opts = shuffle([
      { text: correct, ok: true },
      ...distractors.map(d => ({ text: d, ok: false }))
    ]);

    return {
      prompt: 'Write this fraction as a decimal.',
      num, den,
      options: opts,
      answer: opts.findIndex(o => o.ok)
    };
  }

  const fromPool = pool => {
    const [num, den] = pick(pool);
    return makeQuestion(num, den);
  };

  const GENERATORS = {
    halves:        () => fromPool(POOL_HALVES_QUARTERS),
    tenths:        () => fromPool(POOL_TENTHS),
    hundredths:    () => fromPool(POOL_HUNDREDTHS),
    fifths:        () => fromPool(POOL_FIFTHS),
    larger:        () => fromPool(POOL_LARGER),
    twoHundredths: () => fromPool(POOL_TWO_HUNDREDTHS)
  };

  /* ============================================================
     UNIQUE QUESTION SET — no fraction (and no decimal value)
     appears twice within the same worksheet.
     ============================================================ */
  function generateUniqueQuestions(typeList) {
    const usedPairs  = new Set();   // e.g. "1/2"
    const usedValues = new Set();   // e.g. "0.5" — also stops 1/2 and 5/10 colliding

    const tryGenerate = (type) => {
      for (let i = 0; i < 40; i++) {
        const q   = GENERATORS[type]();
        const key = q.num + '/' + q.den;
        const val = fractionToDecimalStr(q.num, q.den);
        if (!usedPairs.has(key) && !usedValues.has(val)) {
          usedPairs.add(key);
          usedValues.add(val);
          return q;
        }
      }
      return null;   // this type's pool is exhausted
    };

    const out = [];
    for (const type of typeList) {
      let q = tryGenerate(type);

      // If the assigned type is exhausted, borrow from any other type.
      if (!q) {
        for (const alt of shuffle(Object.keys(GENERATORS))) {
          q = tryGenerate(alt);
          if (q) break;
        }
      }

      // Truly exhausted (never happens with the current pool sizes) — accept.
      if (!q) q = GENERATORS[type]();
      out.push(q);
    }
    return out;
  }

  /* ============================================================
     ASSEMBLY — weighted so denominator-200 questions are rare
     ============================================================ */
  const TYPE_WEIGHTS = {
    halves:        3,
    tenths:        3,
    hundredths:    2,
    fifths:        2,
    larger:        2,
    twoHundredths: 1     /* ~1 in 13 questions */
  };

  function buildTypeList(n) {
    const bag = [];
    for (const [type, w] of Object.entries(TYPE_WEIGHTS)) {
      for (let i = 0; i < w; i++) bag.push(type);
    }
    const out = [];
    while (out.length < n) out.push(...shuffle(bag));
    return out.slice(0, n);
  }

  Drill.define({
    id: 'fractions-to-decimals',
    title: 'Fractions → Decimals',
    toolbarTitle: '🔢 Fractions → Decimals',
    counts: [6, 8, 10, 12, 15],
    defaultCount: 10,
    build: function (r, s) {
      rng = r;
      return generateUniqueQuestions(buildTypeList(s.n));
    },
    renderBody: q => '<div class="diagram">' +
      fractionHTML(q.num, q.den) + '<span class="eq">=</span>' + qmarkHTML() +
    '</div>',
    renderOption: o => '<span class="opt-text">' + o.text + '</span>'
  });
})();
</script>
</body>
</html>
