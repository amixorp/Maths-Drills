<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perimeter — Missing Side</title>
<style>
  :root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:#eef1f5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 20px;
    background:#111827; color:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    font-size:14px;
  }
  .tb-title{font-weight:700; margin-right:auto; letter-spacing:.3px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e5e7eb}
  .toolbar input[type=number]{
    width:110px; padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:8px 14px; border-radius:8px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit; font-weight:600; cursor:pointer;
  }
  .toolbar button:hover{background:#374151}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
  .score-chip{
    padding:6px 12px; border-radius:999px;
    background:#1f2937; border:1px solid #374151;
    font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
  }

  /* ---------- sheet ---------- */
  .sheet{
    background:#fff;
    max-width:1100px;
    margin:22px auto 60px;
    padding:30px 34px 42px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .sheet-head h1{margin:0; font-size:26px; letter-spacing:.5px}
  .meta{margin-left:auto; display:flex; gap:18px; font-size:13px; color:#374151}
  .meta .line{display:inline-block; width:110px; border-bottom:1px solid #9ca3af}
  .meta .line.short{width:80px}
  .meta .line.tiny{width:48px}
  .instructions{margin:14px 0 18px; font-size:14px; color:var(--muted); line-height:1.55}

  /* ---------- questions ---------- */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(400px, 1fr));
    gap:14px;
  }
  @media (max-width:880px){ .questions{grid-template-columns:1fr} }

  .q{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px 14px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px}
  .q-num{
    flex:none;
    width:24px; height:24px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:21px; line-height:1.3; font-weight:700}
  .q-prompt .ltr{font-style:italic}

  /* ---------- perimeter body: SVG + answer row ---------- */
  .perimeter-body{
    display:flex; flex-direction:column; align-items:center;
    gap:2px;
    margin:4px 0 12px;
  }
  .triangle-wrap{
    width:100%;
    max-width:360px;
    color:var(--ink);
    padding:2px 0;
  }
  .tri-svg{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
  }
  .tri-label{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size:22px;
    font-weight:700;
    fill:var(--ink);
  }
  .tri-label-q{
    font-size:32px;
    font-weight:800;
    fill:var(--accent);
  }

  .answer-row{
    display:flex; align-items:center; gap:12px;
    margin-top:6px;
  }
  .answer-label{
    font-size:17px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.2px;
  }

  /* ---------- drop slot ---------- */
  .drop-zone{border-radius:12px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:#dbeafe; transform:scale(1.05)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:140px; min-height:60px;
    padding:8px 16px;
    border:2.5px dashed #94a3b8;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#94a3b8;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}
  .qmark .ltr{font-style:italic}

  /* ---------- options ---------- */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed #e5e7eb;
  }
  @media (max-width:520px){ .options{grid-template-columns:1fr} }

  .option{
    display:flex; align-items:center; gap:8px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fafafa;
    padding:9px 11px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
  .option:hover{background:#f3f4f6}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 2px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 2px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    80%{transform:translateX(-3px)}
  }
  .opt-letter{
    flex:none;
    width:20px; height:20px; border-radius:50%;
    background:#e5e7eb; color:#374151;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:20px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    min-height:32px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
  }
  .opt-visual .ltr{font-style:italic}

  /* ---------- drag ghost ---------- */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 16px;
    border-radius:10px;
    background:#fff; border:1.5px solid var(--line);
    box-shadow:0 10px 22px rgba(15,23,42,.28);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
    font-size:20px; font-weight:700;
  }
  .drag-ghost .ltr{font-style:italic}

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }

  /* ---------- per-question feedback ---------- */
  .q-feedback{
    margin-top:8px; min-height:15px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* ---------- answer key ---------- */
  .key{
    margin-top:26px;
    border-top:3px solid var(--ink);
    padding-top:12px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 10px; font-size:16px; letter-spacing:.5px}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:6px 10px;
    font-size:13px;
    color:#374151;
  }
  .key-grid b{color:var(--ink)}

  /* ---------- print ---------- */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#9ca3af}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .triangle-wrap{max-width:320px}
    .tri-label{font-size:19px}
    .tri-label-q{font-size:26px}
    .qmark{min-width:120px; min-height:52px; font-size:19px}
    .opt-visual{font-size:18px}
    .q-prompt{font-size:18px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">📐 Perimeter — Missing Side</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     VARIABLES
     All lowercase letters except 'o' (which too easily reads as 0).
     ============================================================ */
  const VAR_LETTERS = 'abcdefghijklmnpqrstuvwxyz'.split('');

  /* ============================================================
     EXPRESSION FORMATTING
     An expression is [coefficient, constant], representing
     coefficient · letter + constant, with both parts ≥ 0.
     ============================================================ */
  function fmtExpr(expr, letter) {
    const a = expr[0], b = expr[1];
    const coeff = a === 1 ? '' : String(a);
    if (b === 0) return coeff + letter;
    return coeff + letter + ' + ' + b;
  }

  /* Format for display in HTML — wrap the letter in a span that
     italicises just the variable, leaving digits upright. */
  function fmtExprHtml(expr, letter) {
    return fmtExpr(expr, letter).split(letter).join(
      '<span class="ltr">' + letter + '</span>'
    );
  }

  /* ============================================================
     TRIANGLE GEOMETRY
     ============================================================ */

  /* Generate a random triangle that isn't too thin or too close to
     degenerate. Returns an array of three {x, y} vertices, or null
     if no acceptable triangle was found in the allowed attempts. */
  function generateTriangle() {
    for (let attempt = 0; attempt < 40; attempt++) {
      const v0 = { x: 40 + rng() * 40, y: 208 - rng() * 24 };
      const v1 = { x: 260 - rng() * 40, y: 208 - rng() * 24 };
      const v2 = { x: 80 + rng() * 160, y: 30 + rng() * 54 };
      const verts = [v0, v1, v2];

      /* Reject triangles with a very sharp or very flat angle. */
      let ok = true;
      for (let i = 0; i < 3 && ok; i++) {
        const p = verts[(i + 2) % 3];
        const c = verts[i];
        const n = verts[(i + 1) % 3];
        const a1 = Math.atan2(p.y - c.y, p.x - c.x);
        const a2 = Math.atan2(n.y - c.y, n.x - c.x);
        let deg = Math.abs(a1 - a2) * 180 / Math.PI;
        if (deg > 180) deg = 360 - deg;
        if (deg < 25 || deg > 145) ok = false;
      }
      if (!ok) continue;

      /* Reject triangles with too small an area. */
      const area = Math.abs(
        (v1.x - v0.x) * (v2.y - v0.y) - (v2.x - v0.x) * (v1.y - v0.y)
      ) / 2;
      if (area < 6500) continue;

      return verts;
    }
    return null;
  }

  /* Given a side (v1 to v2), the centroid of the triangle, and an
     outward offset, return the position and rotation angle for a
     label attached to that side. The label is placed just outside
     the triangle and rotated to run parallel with the edge, flipped
     so that it is always readable left-to-right. */
  function labelPlacement(v1, v2, centroid, offset) {
    const mx = (v1.x + v2.x) / 2;
    const my = (v1.y + v2.y) / 2;
    const dx = v2.x - v1.x;
    const dy = v2.y - v1.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len;
    const uy = dy / len;

    /* Two perpendicular directions, pick the one pointing away
       from the triangle's centroid. */
    const p1 = { x: -uy, y:  ux };
    const p2 = { x:  uy, y: -ux };
    const toC = { x: centroid.x - mx, y: centroid.y - my };
    const dot = p1.x * toC.x + p1.y * toC.y;
    const perp = dot > 0 ? p2 : p1;

    const px = mx + perp.x * offset;
    const py = my + perp.y * offset;

    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle > 90) angle -= 180;
    else if (angle < -90) angle += 180;

    return { x: px, y: py, angle };
  }

  /* ============================================================
     QUESTION GENERATOR
     ============================================================ */

  /* Difficulty measure: how many of the three sides carry a
     constant term. Range 0-3.
       0  → all sides are simple monomials (e.g. 3x)
       1  → one side has a constant (e.g. 2x + 1)
       2  → two sides have constants
       3  → all three sides have constants                        */
  function questionDifficulty(sides) {
    return sides.filter(s => s[1] > 0).length;
  }

  function genPerimeterQuestion(pos) {
    const target = pos * 2.2;   /* 0 at start, 2.2 at end */
    const sigma = 0.9;

    for (let attempt = 0; attempt < 120; attempt++) {
      const letter = pick(VAR_LETTERS);

      /* Generate three sides as [coefficient, constant]. */
      const sides = [];
      for (let i = 0; i < 3; i++) {
        const a = 1 + Math.floor(rng() * 4);   /* 1..4 */
        const b = rng() < 0.5 ? 0 : (1 + Math.floor(rng() * 4));  /* 0 or 1..4 */
        sides.push([a, b]);
      }

      /* Reject if the perimeter coefficient grows too large. */
      const P = [
        sides[0][0] + sides[1][0] + sides[2][0],
        sides[0][1] + sides[1][1] + sides[2][1]
      ];
      if (P[0] > 12) continue;

      /* Accept/reject according to the target difficulty. */
      const diff = questionDifficulty(sides);
      const z = (diff - target) / sigma;
      if (rng() > Math.exp(-0.5 * z * z)) continue;

      /* Choose which of the three sides is missing. */
      const missingIdx = Math.floor(rng() * 3);
      const M  = sides[missingIdx];
      const S1 = sides[(missingIdx + 1) % 3];
      const S2 = sides[(missingIdx + 2) % 3];

      /* Generate the triangle. */
      const verts = generateTriangle();
      if (!verts) continue;

      /* Shuffle the mapping between side index and edge index, so
         the missing side can appear on any of the three edges. */
      const perm = shuffle([0, 1, 2]);
      const edgeToSide = [];
      for (let s = 0; s < 3; s++) edgeToSide[perm[s]] = s;

      /* Centroid of the triangle, used for placing labels. */
      const centroid = {
        x: (verts[0].x + verts[1].x + verts[2].x) / 3,
        y: (verts[0].y + verts[1].y + verts[2].y) / 3
      };

      /* Build the SVG. */
      let svg = '<svg viewBox="0 0 340 260" class="tri-svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
      svg += '<polygon points="' +
        verts.map(v => v.x.toFixed(1) + ',' + v.y.toFixed(1)).join(' ') +
        '" fill="none" stroke="currentColor" stroke-width="2.5" ' +
        'stroke-linejoin="round"/>';

      for (let e = 0; e < 3; e++) {
        const s = edgeToSide[e];
        const v1 = verts[e];
        const v2 = verts[(e + 1) % 3];
        const place = labelPlacement(v1, v2, centroid, 30);
        const isMissing = (s === missingIdx);
        const labelHtml = isMissing
          ? '?'
          : fmtExpr(sides[s], letter).split(letter).join(
              '<tspan font-style="italic">' + letter + '</tspan>'
            );
        const cls = isMissing ? 'tri-label tri-label-q' : 'tri-label';
        svg +=
          '<text class="' + cls + '" ' +
          'x="' + place.x.toFixed(1) + '" y="' + place.y.toFixed(1) + '" ' +
          'text-anchor="middle" dominant-baseline="middle" ' +
          'transform="rotate(' + place.angle.toFixed(1) + ',' +
            place.x.toFixed(1) + ',' + place.y.toFixed(1) + ')">' +
          labelHtml +
          '</text>';
      }
      svg += '</svg>';

      /* Build the distractor pool. */
      const pool = [];
      const seen = new Set([M[0] + ',' + M[1]]);
      const add = (expr) => {
        if (expr[0] < 1 || expr[1] < 0) return;
        if (expr[0] > 25 || expr[1] > 30) return;
        const key = expr[0] + ',' + expr[1];
        if (seen.has(key)) return;
        seen.add(key);
        pool.push(fmtExprHtml(expr, letter));
      };

      /* Sum of the two known sides — pupil forgot the perimeter. */
      add([S1[0] + S2[0], S1[1] + S2[1]]);
      /* Subtracted only one side from the perimeter. */
      add([P[0] - S1[0], P[1] - S1[1]]);
      add([P[0] - S2[0], P[1] - S2[1]]);
      /* Off-by-one on coefficient. */
      add([M[0] + 1, M[1]]);
      if (M[0] > 1) add([M[0] - 1, M[1]]);
      /* Off-by-one on constant. */
      add([M[0], M[1] + 1]);
      if (M[1] > 0) add([M[0], M[1] - 1]);
      /* Dropped the constant, kept only the variable term. */
      if (M[1] > 0) add([M[0], 0]);
      /* Dropped the variable, kept only the constant. */
      if (M[1] > 0) add([1, M[1]]);
      /* Copied one of the given sides. */
      add(S1);
      add(S2);

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);

      const opts = shuffle([
        { html: fmtExprHtml(M, letter), ok: true },
        ...distractors.map(h => ({ html: h, ok: false }))
      ]);

      const sig = 'P|' + letter + '|' +
                  sides.map(s => s.join(':')).join('|') + '|' + missingIdx;

      return {
        sig,
        promptHtml: 'Perimeter = ' + fmtExprHtml(P, letter),
        svg,
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS — with position-based difficulty gradient
     ============================================================ */
  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 3000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      let q = null;
      try {
        q = genPerimeterQuestion(pos);
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 300) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = genPerimeterQuestion(pos);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + o.html + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.promptHtml + '</span>' +
      '</div>' +
      '<div class="perimeter-body">' +
        '<div class="triangle-wrap">' + q.svg + '</div>' +
        '<div class="answer-row">' +
          '<span class="answer-label">Missing side =</span>' +
          '<div class="drop-zone"><div class="qmark">?</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);

    questions = buildQuestions(n);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Perimeter — Missing Side</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'For each triangle, the perimeter is given. ' +
        'Work out an expression for the <b>missing side</b>. ' +
        'Drag the correct answer into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.innerHTML = q.options[idx].html;
      slot.classList.add('filled');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  function dateSeed() {
    const d = new Date();
    return parseInt(
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') +
      String(d.getSeconds()).padStart(2, '0'),
      10
    );
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
