<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dividing in a Given Ratio</title>
<style>
  :root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:#eef1f5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 20px;
    background:#111827; color:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    font-size:14px;
  }
  .tb-title{font-weight:700; margin-right:auto; letter-spacing:.3px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e5e7eb}
  .toolbar input[type=number]{
    width:110px; padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:8px 14px; border-radius:8px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit; font-weight:600; cursor:pointer;
  }
  .toolbar button:hover{background:#374151}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
    .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
  .tb-group{
    display:flex; align-items:center; gap:10px;
    color:#e5e7eb; padding:4px 10px;
    background:#1f2937; border-radius:8px; border:1px solid #374151;
  }
  .score-chip{
    padding:6px 12px; border-radius:999px;
    background:#1f2937; border:1px solid #374151;
    font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
  }

  .sheet{
    background:#fff;
    max-width:1100px;
    margin:22px auto 60px;
    padding:30px 34px 42px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .sheet-head h1{margin:0; font-size:26px; letter-spacing:.5px}
  .meta{margin-left:auto; display:flex; gap:18px; font-size:13px; color:#374151}
  .meta .line{display:inline-block; width:110px; border-bottom:1px solid #9ca3af}
  .meta .line.short{width:80px}
  .meta .line.tiny{width:48px}
  .instructions{margin:14px 0 18px; font-size:14px; color:var(--muted); line-height:1.55}

  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(460px, 1fr));
    gap:14px;
  }
  @media (max-width:900px){ .questions{grid-template-columns:1fr} }

  .q{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:12px 14px 14px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:8px; margin-bottom:10px}
  .q-num{
    flex:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:13.5px; line-height:1.45; font-weight:600}

  .diagram{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
    min-height:80px;
    margin:4px 0 12px;
    padding:6px 2px;
  }
  .lhs{
    font-size: 22px; font-weight: 700; letter-spacing: .5px;
    line-height: 1.3; text-align: center; max-width: 100%;
  }
  .eq{ font-size: 26px; font-weight: 700; color: var(--muted); white-space: nowrap; }

  .drop-zone{border-radius:12px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:#dbeafe; transform:scale(1.05)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:180px; min-height:66px;
    padding:8px 16px;
    border:3px dashed #94a3b8;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#94a3b8;
    white-space:normal; text-align:center;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed #e5e7eb;
  }
  @media (max-width:520px){ .options{grid-template-columns:1fr} }

  .option{
    display:flex; align-items:center; gap:8px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fafafa;
    padding:8px 10px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
  .option:hover{background:#f3f4f6}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 2px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 2px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    80%{transform:translateX(-3px)}
  }
  .opt-letter{
    flex:none;
    width:20px; height:20px; border-radius:50%;
    background:#e5e7eb; color:#374151;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:16px;
    font-weight:700;
    letter-spacing:.3px;
    display:flex; align-items:center; justify-content:center;
    min-height:28px;
    text-align:center;
    min-width:0;
  }

  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:8px 14px;
    border-radius:10px;
    background:#fff; border:1.5px solid var(--line);
    box-shadow:0 10px 22px rgba(15,23,42,.28);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
    font-size:16px; font-weight:700; letter-spacing:.3px;
    max-width:320px;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }

  .q-feedback{
    margin-top:8px; min-height:15px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  .key{
    margin-top:26px;
    border-top:3px solid var(--ink);
    padding-top:12px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 10px; font-size:16px; letter-spacing:.5px}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:6px 10px;
    font-size:13px;
    color:#374151;
  }
  .key-grid b{color:var(--ink)}

  .error-box{
    max-width:640px;
    margin:60px auto;
    padding:28px 32px;
    background:#fff;
    border-left:5px solid #dc2626;
    border-radius:8px;
    box-shadow:0 4px 18px rgba(15,23,42,.08);
    color:#7f1d1d;
  }
  .error-box h2{margin:0 0 10px; font-size:20px}
  .error-box code{background:#f3f4f6; padding:2px 6px; border-radius:4px; font-size:14px}

  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#9ca3af}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .lhs{font-size:18px}
    .eq{font-size:20px}
    .qmark{min-width:140px; min-height:52px; font-size:16px}
    .opt-visual{font-size:14px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">➗ Dividing in a Given Ratio</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
    <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
      <option>12</option>
    </select>
  </label>
  <label>Types
    <select id="typeSelect">
      <option value="mixed" selected>Mixed</option>
      <option value="T1">Share in a ratio</option>
      <option value="T2">Find a share</option>
      <option value="T3">Find the total</option>
    </select>
  </label>
  <span class="tb-group">Difficulty:
    <label class="chk"><input type="checkbox" id="diffEasy" checked> Simplest</label>
    <label class="chk"><input type="checkbox" id="diffMid" checked> Middle</label>
    <label class="chk"><input type="checkbox" id="diffHard" checked> Harder</label>
  </span>

  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script src="banks.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     DEPENDENCY CHECK
     ============================================================ */
  if (typeof BANKS === 'undefined' || !BANKS.items || !BANKS.names) {
    document.getElementById('sheet').outerHTML =
      '<div class="error-box">' +
        '<h2>banks.js not loaded</h2>' +
        '<p>This sheet needs <code>banks.js</code> to be in the same folder ' +
        'and loaded via <code>&lt;script src="banks.js"&gt;&lt;/script&gt;</code> ' +
        'before this script runs.</p>' +
      '</div>';
    return;
  }

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { while (b) { const t = a % b; a = b; b = t; } return a; }

  /* ============================================================
     RATIO PART POOLS
     All pairs/triples are coprime, listed in increasing order.
     Three difficulty bands so early questions stay simple.
     ============================================================ */
  const RATIO_2_EASY = [
    [1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,5],[3,5],[4,5]
  ];
  const RATIO_2_MID = [
    [1,2],[1,3],[2,3],[3,4],[2,5],[3,5],[4,5],
    [2,7],[3,7],[5,7],[1,6],[5,6],[4,7],[5,8],[3,8]
  ];
  const RATIO_2_HARD = [
    [3,4],[4,5],[5,6],[4,7],[5,7],[3,7],[5,8],[7,9],
    [5,9],[3,8],[7,8],[8,9],[4,9],[7,8]
  ];
  const RATIO_3_EASY = [
    [1,1,2],[1,2,3],[2,2,3],[1,1,3],[1,3,4],[2,3,4],[1,2,5]
  ];
  const RATIO_3_MID = [
    [2,3,4],[3,4,5],[1,3,5],[2,3,5],[1,4,5],
    [1,1,2],[2,2,3],[1,2,3]
  ];
  const RATIO_3_HARD = [
    [4,5,6],[1,5,6],[3,4,5],[2,5,7],[3,5,7],
    [4,5,7],[2,3,7],[1,3,5],[5,6,7]
  ];

  function pickRatioParts(n, pos) {
    let pool;
    if (n === 2) {
      pool = pos < 0.35 ? RATIO_2_EASY : pos < 0.7 ? RATIO_2_MID : RATIO_2_HARD;
    } else {
      pool = pos < 0.35 ? RATIO_3_EASY : pos < 0.7 ? RATIO_3_MID : RATIO_3_HARD;
    }
    let parts = pick(pool).slice();
    if (n === 2 && rng() < 0.5) parts = [parts[1], parts[0]];
    if (n === 3 && rng() < 0.5) parts = shuffle(parts);
    return parts;
  }

  /* ============================================================
     CONTENT PICKER (money vs. countable item)
     ============================================================ */
  function pickContent(useMoney) {
    if (useMoney) {
      const c = pick(BANKS.currency);
      return {
        kind: 'money',
        symbol: c.symbol,
        name: c.name,
        min: c.min, max: c.max,
        step: c.step || 1
      };
    } else {
      const c = pick(BANKS.items);
      return {
        kind: 'item',
        sing: c.sing, plur: c.plur,
        min: c.min, max: c.max,
        step: c.step || 1
      };
    }
  }

  /* Choose a multiplier k so total = k * sum lands in the item's
     range and satisfies the item's granularity. Returns null if
     the range can't accommodate this ratio. */
  function pickK(sum, content) {
    const step = content.step || 1;
    const g = gcd(sum, step);
    const kStep = step / g;
    const kMin = Math.max(1, Math.ceil(content.min / (sum * kStep)) * kStep);
    const kMax = Math.floor(content.max / (sum * kStep)) * kStep;
    if (kMax < kMin) return null;
    const numChoices = Math.floor((kMax - kMin) / kStep) + 1;
    return kMin + Math.floor(rng() * numChoices) * kStep;
  }

  /* ============================================================
     FORMATTERS
     ============================================================ */
  function fmtTotal(content, n) {
    if (content.kind === 'money') return content.symbol + n;
    return n + ' ' + (n === 1 ? content.sing : content.plur);
  }
  function fmtAmount(content, n) {
    if (content.kind === 'money') return content.symbol + n;
    return n + ' ' + (n === 1 ? content.sing : content.plur);
  }
  function fmtShares(content, shares) {
    if (content.kind === 'money') {
      const sym = content.symbol;
      if (shares.length === 2) return sym + shares[0] + ' and ' + sym + shares[1];
      return shares.slice(0, -1).map(s => sym + s).join(', ') +
             ' and ' + sym + shares[shares.length - 1];
    }
    if (shares.length === 2) return shares[0] + ' and ' + shares[1] + ' ' + content.plur;
    return shares.slice(0, -1).join(', ') +
           ' and ' + shares[shares.length - 1] + ' ' + content.plur;
  }
  function fmtNameList(names) {
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' and ' + names[1];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }
  function contentKey(content) {
    return content.kind + '|' + (content.kind === 'money' ? content.symbol : content.plur);
  }

  /* ============================================================
     DISTRACTORS — T1 (compound share answer)
     ============================================================ */
  function t1DistractorShares(parts, k, total) {
    const correct = parts.map(p => p * k);
    const pool = [];
    const seen = new Set([JSON.stringify(correct)]);
    const add = arr => {
      if (arr.length !== parts.length) return;
      if (arr.some(v => !Number.isInteger(v) || v <= 0)) return;
      const key = JSON.stringify(arr);
      if (seen.has(key)) return;
      seen.add(key);
      pool.push(arr);
    };

    // Used ratio parts directly (forgot to multiply by k)
    add(parts.slice());

    // Swapped / permuted order
    if (parts.length === 2) add([correct[1], correct[0]]);
    if (parts.length === 3) {
      add([correct[1], correct[2], correct[0]]);
      add([correct[2], correct[0], correct[1]]);
    }

    // Wrong k (off by one)
    add(parts.map(p => p * (k + 1)));
    if (k > 1) add(parts.map(p => p * (k - 1)));

    // Equal split
    if (total % parts.length === 0) {
      add(parts.map(() => total / parts.length));
    }

    // Off-by-k on one share
    for (let i = 0; i < parts.length; i++) {
      const up = correct.slice(); up[i] += k; add(up);
      if (correct[i] - k > 0) {
        const dn = correct.slice(); dn[i] -= k; add(dn);
      }
    }
    return pool;
  }

  /* ============================================================
     DISTRACTORS — T2 (find another person's share)
     ============================================================ */
  function t2Distractors(parts, k, givenIdx, targetIdx, sum) {
    const given = parts[givenIdx] * k;
    const target = parts[targetIdx] * k;
    const total = sum * k;
    const pool = [];
    const seen = new Set([target]);
    const add = v => {
      if (!Number.isInteger(v) || v <= 0) return;
      if (seen.has(v)) return;
      seen.add(v);
      pool.push(v);
    };

    add(given);                            // read the wrong share
    add(total);                            // found total instead
    add(parts[targetIdx] * (k + 1));       // off-by-one k
    if (k > 1) add(parts[targetIdx] * (k - 1));
    for (let i = 0; i < parts.length; i++) {
      if (i !== givenIdx && i !== targetIdx) add(parts[i] * k);
    }
    add(given + target);                   // added instead of read
    add(Math.abs(target - given));         // difference
    add(parts[targetIdx]);                 // ratio coefficient only
    add(k);                                // unit only
    return pool;
  }

  /* ============================================================
     DISTRACTORS — T3 (find the total)
     ============================================================ */
  function t3Distractors(parts, k, givenIdx, sum) {
    const given = parts[givenIdx] * k;
    const total = sum * k;
    const pool = [];
    const seen = new Set([total]);
    const add = v => {
      if (!Number.isInteger(v) || v <= 0) return;
      if (seen.has(v)) return;
      seen.add(v);
      pool.push(v);
    };

    add(given);                     // stopped at given share
    add(sum);                       // forgot to multiply by k
    add(k);                         // unit only
    for (let i = 0; i < parts.length; i++) {
      if (i !== givenIdx) add(parts[i] * k);
    }
    add(sum * (k + 1));             // off-by-one k
    if (k > 1) add(sum * (k - 1));
    add(given + k);
    add(given * 2);
    return pool;
  }

  /* ============================================================
     T1 — Divide a total in a given ratio (no names)
     ============================================================ */
  function genT1(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.3 ? 0.05 : pos < 0.6 ? 0.3 : 0.5;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.4;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const total = sum * k;
      const shares = parts.map(p => p * k);
      const correctText = fmtShares(content, shares);

      const rawDistractors = t1DistractorShares(parts, k, total);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const arr of rawDistractors) {
        const txt = fmtShares(content, arr);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const totalText = fmtTotal(content, total);
      const ratioText = parts.join(' : ');

      return {
        sig: 'T1|' + contentKey(content) + '|' + parts.join(',') + '|' + k,
        prompt: 'Divide ' + totalText + ' in the ratio ' + ratioText + '.',
        lhs: totalText + ' in ratio ' + ratioText,
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     T2 — One share given; find another person's share
     ============================================================ */
  function genT2(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.5 ? 0.1 : 0.4;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.45;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const givenIdx = ri(0, nParts - 1);
      let targetIdx = ri(0, nParts - 1);
      while (targetIdx === givenIdx) targetIdx = ri(0, nParts - 1);

      const givenAmount = parts[givenIdx] * k;
      const targetAmount = parts[targetIdx] * k;

      const names = shuffle(BANKS.names.slice()).slice(0, nParts);
      const givenName = names[givenIdx];
      const targetName = names[targetIdx];
      const nameList = fmtNameList(names);
      const nameColons = names.join(' : ');

      const correctText = fmtAmount(content, targetAmount);
      const rawDistractors = t2Distractors(parts, k, givenIdx, targetIdx, sum);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const v of rawDistractors) {
        const txt = fmtAmount(content, v);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const givenText = fmtAmount(content, givenAmount);
      const ratioText = parts.join(' : ');

      let prompt, shareVerb;
      if (content.kind === 'money') {
        shareVerb = 'share a sum of money';
        prompt = nameList + ' ' + shareVerb + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How much does ' + targetName + ' receive?';
      } else {
        shareVerb = 'share ' + content.plur;
        prompt = nameList + ' ' + shareVerb + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How many ' + content.plur + ' does ' + targetName + ' receive?';
      }

      const lhs = nameColons + ' = ' + ratioText +
                  '  (' + givenName + ' = ' + givenText + ')';

      return {
        sig: 'T2|' + contentKey(content) + '|' + parts.join(',') +
             '|' + k + '|' + givenIdx + '|' + targetIdx,
        prompt: prompt,
        lhs: lhs,
        eq: '→',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     T3 — One share given; find the total
     ============================================================ */
  function genT3(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.5 ? 0.2 : 0.5;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.45;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const givenIdx = ri(0, nParts - 1);
      const givenAmount = parts[givenIdx] * k;
      const total = sum * k;

      const names = shuffle(BANKS.names.slice()).slice(0, nParts);
      const givenName = names[givenIdx];
      const nameList = fmtNameList(names);
      const nameColons = names.join(' : ');

      const correctText = fmtAmount(content, total);
      const rawDistractors = t3Distractors(parts, k, givenIdx, sum);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const v of rawDistractors) {
        const txt = fmtAmount(content, v);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const givenText = fmtAmount(content, givenAmount);
      const ratioText = parts.join(' : ');

      let prompt;
      if (content.kind === 'money') {
        const who = nParts === 3 ? 'the three of them' : 'they';
        prompt = nameList + ' share a sum of money in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How much money did ' + who + ' share altogether?';
      } else {
        prompt = nameList + ' share ' + content.plur + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How many ' + content.plur + ' did they share altogether?';
      }

      const lhs = nameColons + ' = ' + ratioText +
                  '  (' + givenName + ' = ' + givenText + ')';

      return {
        sig: 'T3|' + contentKey(content) + '|' + parts.join(',') +
             '|' + k + '|' + givenIdx,
        prompt: prompt,
        lhs: lhs,
        eq: '→ total',
        options: opts
      };
    }
    return null;
  }

    /* ============================================================
     DIFFICULTY TIERS
     Three tiers: 0 = simplest, 1 = middle, 2 = harder.
     The checkbox selection decides which tiers are in play.
     The first four questions always use the *simplest selected*
     tier; the rest progress through the remaining tiers.
     ============================================================ */
  const TIER_POS = [0.15, 0.5, 0.85];   // pos fed into the generators

  function getSelectedTiers() {
    const tiers = [];
    if (document.getElementById('diffEasy').checked) tiers.push(0);
    if (document.getElementById('diffMid').checked)  tiers.push(1);
    if (document.getElementById('diffHard').checked) tiers.push(2);
    if (tiers.length === 0) tiers.push(0);  // safety; UI prevents this
    return tiers;
  }

  function tierFor(i, n, selectedTiers) {
    const firstBatch = Math.min(4, n);
    if (i < firstBatch) return selectedTiers[0];
    if (selectedTiers.length === 1) return selectedTiers[0];
    const remainingTiers = selectedTiers.slice(1);
    const remainingQs = n - firstBatch;
    const qIdx = i - firstBatch;
    const subIdx = Math.min(
      remainingTiers.length - 1,
      Math.floor(qIdx * remainingTiers.length / remainingQs)
    );
    return remainingTiers[subIdx];
  }

  function pickType(pos, forced) {
    if (forced && forced !== 'mixed') return forced;
    if (pos < 0.25) return 'T1';
    if (pos < 0.55) return rng() < 0.6 ? 'T1' : 'T2';
    if (pos < 0.80) return rng() < 0.55 ? 'T2' : 'T3';
    return rng() < 0.7 ? 'T3' : 'T2';
  }

  function genOne(pos, forced) {
    const t = pickType(pos, forced);
    if (t === 'T1') return genT1(pos);
    if (t === 'T2') return genT2(pos);
    return genT3(pos);
  }

  function buildQuestions(n, forced) {
    const selectedTiers = getSelectedTiers();
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 8000) {
      guard++;
      const tier = tierFor(out.length, n, selectedTiers);
      const pos = TIER_POS[tier];
      let q = null;
      try { q = genOne(pos, forced); }
      catch (e) { if (typeof console !== 'undefined') console.warn(e); continue; }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const tier = tierFor(out.length, n, selectedTiers);
      const pos = TIER_POS[tier];
      const q = genOne(pos, forced);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + o.text + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.prompt + '</span>' +
      '</div>' +
      '<div class="diagram">' +
        '<span class="lhs">' + q.lhs + '</span>' +
        '<span class="eq">' + q.eq + '</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);
    const forced = document.getElementById('typeSelect').value;

    questions = buildQuestions(n, forced);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Dividing in a Given Ratio</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Work out each sharing <b>without a calculator</b>. ' +
        'For each question, find the missing share or total. ' +
        'Drag the correct answer into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.textContent = q.options[idx].text;
      slot.classList.add('filled');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const typeSel    = document.getElementById('typeSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  function dateSeed() {
    const d = new Date();
    return parseInt(
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') +
      String(d.getSeconds()).padStart(2, '0'),
      10
    );
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  typeSel.addEventListener('change', () => { applySeed(); render(); });

    /* --- difficulty checkboxes --- */

  function syncDiffCheckboxes() {
    const boxes = ['diffEasy', 'diffMid', 'diffHard']
      .map(id => document.getElementById(id));
    const checkedCount = boxes.filter(b => b.checked).length;
    boxes.forEach(b => { b.disabled = (checkedCount === 1 && b.checked); });
  }

  ['diffEasy', 'diffMid', 'diffHard'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      syncDiffCheckboxes();
      applySeed();
      render();
    });
  });

  syncDiffCheckboxes();   // set the initial enabled/disabled state

  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
