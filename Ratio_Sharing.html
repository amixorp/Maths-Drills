<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dividing in a Given Ratio</title>
<link rel="stylesheet" href="core/drill.css">
<style>
  :root{
    --q-min:460px; --lhs-size:22px; --eq-size:26px; --opt-size:20px;
    --slot-min-w:180px; --slot-min-h:66px; --slot-font:20px; --diagram-min-h:80px;
  }
  /* Questions and answers are short phrases ("29, 58 and 116 sweets"):
     wrap them on narrow screens rather than shrinking them. */
  .lhs, .opt-visual{white-space:normal; text-align:center; line-height:1.25}
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="banks.js"></script>
<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  if (typeof BANKS === 'undefined' || !BANKS.items || !BANKS.names) {
    Drill.fail('banks.js not loaded',
      '<p>This sheet needs <code>banks.js</code> to be in the same folder ' +
      'and loaded via <code>&lt;script src="banks.js"&gt;&lt;/script&gt;</code> ' +
      'before this script runs.</p>');
    return;
  }

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { while (b) { const t = a % b; a = b; b = t; } return a; }

  /* ============================================================
     RATIO PART POOLS
     All pairs/triples are coprime, listed in increasing order.
     Three difficulty bands so early questions stay simple.
     ============================================================ */
  const RATIO_2_EASY = [
    [1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,5],[3,5],[4,5]
  ];
  const RATIO_2_MID = [
    [1,2],[1,3],[2,3],[3,4],[2,5],[3,5],[4,5],
    [2,7],[3,7],[5,7],[1,6],[5,6],[4,7],[5,8],[3,8]
  ];
  const RATIO_2_HARD = [
    [3,4],[4,5],[5,6],[4,7],[5,7],[3,7],[5,8],[7,9],
    [5,9],[3,8],[7,8],[8,9],[4,9],[7,8]
  ];
  const RATIO_3_EASY = [
    [1,1,2],[1,2,3],[2,2,3],[1,1,3],[1,3,4],[2,3,4],[1,2,5]
  ];
  const RATIO_3_MID = [
    [2,3,4],[3,4,5],[1,3,5],[2,3,5],[1,4,5],
    [1,1,2],[2,2,3],[1,2,3]
  ];
  const RATIO_3_HARD = [
    [4,5,6],[1,5,6],[3,4,5],[2,5,7],[3,5,7],
    [4,5,7],[2,3,7],[1,3,5],[5,6,7]
  ];

  function pickRatioParts(n, pos) {
    let pool;
    if (n === 2) {
      pool = pos < 0.35 ? RATIO_2_EASY : pos < 0.7 ? RATIO_2_MID : RATIO_2_HARD;
    } else {
      pool = pos < 0.35 ? RATIO_3_EASY : pos < 0.7 ? RATIO_3_MID : RATIO_3_HARD;
    }
    let parts = pick(pool).slice();
    if (n === 2 && rng() < 0.5) parts = [parts[1], parts[0]];
    if (n === 3 && rng() < 0.5) parts = shuffle(parts);
    return parts;
  }

  /* ============================================================
     CONTENT PICKER (money vs. countable item)
     ============================================================ */
  function pickContent(useMoney) {
    if (useMoney) {
      const c = pick(BANKS.currency);
      return {
        kind: 'money',
        symbol: c.symbol,
        name: c.name,
        min: c.min, max: c.max,
        step: c.step || 1
      };
    } else {
      const c = pick(BANKS.items);
      return {
        kind: 'item',
        sing: c.sing, plur: c.plur,
        min: c.min, max: c.max,
        step: c.step || 1
      };
    }
  }

  /* Choose a multiplier k so total = k * sum lands in the item's
     range and satisfies the item's granularity. Returns null if
     the range can't accommodate this ratio. */
  function pickK(sum, content) {
    const step = content.step || 1;
    const g = gcd(sum, step);
    const kStep = step / g;
    const kMin = Math.max(1, Math.ceil(content.min / (sum * kStep)) * kStep);
    const kMax = Math.floor(content.max / (sum * kStep)) * kStep;
    if (kMax < kMin) return null;
    const numChoices = Math.floor((kMax - kMin) / kStep) + 1;
    return kMin + Math.floor(rng() * numChoices) * kStep;
  }

  /* ============================================================
     FORMATTERS
     ============================================================ */
  function fmtTotal(content, n) {
    if (content.kind === 'money') return content.symbol + n;
    return n + ' ' + (n === 1 ? content.sing : content.plur);
  }
  function fmtAmount(content, n) {
    if (content.kind === 'money') return content.symbol + n;
    return n + ' ' + (n === 1 ? content.sing : content.plur);
  }
  function fmtShares(content, shares) {
    if (content.kind === 'money') {
      const sym = content.symbol;
      if (shares.length === 2) return sym + shares[0] + ' and ' + sym + shares[1];
      return shares.slice(0, -1).map(s => sym + s).join(', ') +
             ' and ' + sym + shares[shares.length - 1];
    }
    if (shares.length === 2) return shares[0] + ' and ' + shares[1] + ' ' + content.plur;
    return shares.slice(0, -1).join(', ') +
           ' and ' + shares[shares.length - 1] + ' ' + content.plur;
  }
  function fmtNameList(names) {
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' and ' + names[1];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }
  function contentKey(content) {
    return content.kind + '|' + (content.kind === 'money' ? content.symbol : content.plur);
  }

  /* ============================================================
     DISTRACTORS — T1 (compound share answer)
     ============================================================ */
  function t1DistractorShares(parts, k, total) {
    const correct = parts.map(p => p * k);
    const pool = [];
    const seen = new Set([JSON.stringify(correct)]);
    const add = arr => {
      if (arr.length !== parts.length) return;
      if (arr.some(v => !Number.isInteger(v) || v <= 0)) return;
      const key = JSON.stringify(arr);
      if (seen.has(key)) return;
      seen.add(key);
      pool.push(arr);
    };

    // Used ratio parts directly (forgot to multiply by k)
    add(parts.slice());

    // Swapped / permuted order
    if (parts.length === 2) add([correct[1], correct[0]]);
    if (parts.length === 3) {
      add([correct[1], correct[2], correct[0]]);
      add([correct[2], correct[0], correct[1]]);
    }

    // Wrong k (off by one)
    add(parts.map(p => p * (k + 1)));
    if (k > 1) add(parts.map(p => p * (k - 1)));

    // Equal split
    if (total % parts.length === 0) {
      add(parts.map(() => total / parts.length));
    }

    // Off-by-k on one share
    for (let i = 0; i < parts.length; i++) {
      const up = correct.slice(); up[i] += k; add(up);
      if (correct[i] - k > 0) {
        const dn = correct.slice(); dn[i] -= k; add(dn);
      }
    }
    return pool;
  }

  /* ============================================================
     DISTRACTORS — T2 (find another person's share)
     ============================================================ */
  function t2Distractors(parts, k, givenIdx, targetIdx, sum) {
    const given = parts[givenIdx] * k;
    const target = parts[targetIdx] * k;
    const total = sum * k;
    const pool = [];
    const seen = new Set([target]);
    const add = v => {
      if (!Number.isInteger(v) || v <= 0) return;
      if (seen.has(v)) return;
      seen.add(v);
      pool.push(v);
    };

    add(given);                            // read the wrong share
    add(total);                            // found total instead
    add(parts[targetIdx] * (k + 1));       // off-by-one k
    if (k > 1) add(parts[targetIdx] * (k - 1));
    for (let i = 0; i < parts.length; i++) {
      if (i !== givenIdx && i !== targetIdx) add(parts[i] * k);
    }
    add(given + target);                   // added instead of read
    add(Math.abs(target - given));         // difference
    add(parts[targetIdx]);                 // ratio coefficient only
    add(k);                                // unit only
    return pool;
  }

  /* ============================================================
     DISTRACTORS — T3 (find the total)
     ============================================================ */
  function t3Distractors(parts, k, givenIdx, sum) {
    const given = parts[givenIdx] * k;
    const total = sum * k;
    const pool = [];
    const seen = new Set([total]);
    const add = v => {
      if (!Number.isInteger(v) || v <= 0) return;
      if (seen.has(v)) return;
      seen.add(v);
      pool.push(v);
    };

    add(given);                     // stopped at given share
    add(sum);                       // forgot to multiply by k
    add(k);                         // unit only
    for (let i = 0; i < parts.length; i++) {
      if (i !== givenIdx) add(parts[i] * k);
    }
    add(sum * (k + 1));             // off-by-one k
    if (k > 1) add(sum * (k - 1));
    add(given + k);
    add(given * 2);
    return pool;
  }

  /* ============================================================
     T1 — Divide a total in a given ratio (no names)
     ============================================================ */
  function genT1(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.3 ? 0.05 : pos < 0.6 ? 0.3 : 0.5;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.4;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const total = sum * k;
      const shares = parts.map(p => p * k);
      const correctText = fmtShares(content, shares);

      const rawDistractors = t1DistractorShares(parts, k, total);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const arr of rawDistractors) {
        const txt = fmtShares(content, arr);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const totalText = fmtTotal(content, total);
      const ratioText = parts.join(' : ');

      return {
        sig: 'T1|' + contentKey(content) + '|' + parts.join(',') + '|' + k,
        prompt: 'Divide ' + totalText + ' in the ratio ' + ratioText + '.',
        lhs: totalText + ' in ratio ' + ratioText,
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     T2 — One share given; find another person's share
     ============================================================ */
  function genT2(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.5 ? 0.1 : 0.4;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.45;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const givenIdx = ri(0, nParts - 1);
      let targetIdx = ri(0, nParts - 1);
      while (targetIdx === givenIdx) targetIdx = ri(0, nParts - 1);

      const givenAmount = parts[givenIdx] * k;
      const targetAmount = parts[targetIdx] * k;

      const names = shuffle(BANKS.names.slice()).slice(0, nParts);
      const givenName = names[givenIdx];
      const targetName = names[targetIdx];
      const nameList = fmtNameList(names);
      const nameColons = names.join(' : ');

      const correctText = fmtAmount(content, targetAmount);
      const rawDistractors = t2Distractors(parts, k, givenIdx, targetIdx, sum);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const v of rawDistractors) {
        const txt = fmtAmount(content, v);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const givenText = fmtAmount(content, givenAmount);
      const ratioText = parts.join(' : ');

      let prompt, shareVerb;
      if (content.kind === 'money') {
        shareVerb = 'share a sum of money';
        prompt = nameList + ' ' + shareVerb + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How much does ' + targetName + ' receive?';
      } else {
        shareVerb = 'share ' + content.plur;
        prompt = nameList + ' ' + shareVerb + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How many ' + content.plur + ' does ' + targetName + ' receive?';
      }

      const lhs = nameColons + ' = ' + ratioText +
                  '  (' + givenName + ' = ' + givenText + ')';

      return {
        sig: 'T2|' + contentKey(content) + '|' + parts.join(',') +
             '|' + k + '|' + givenIdx + '|' + targetIdx,
        prompt: prompt,
        lhs: lhs,
        eq: '→',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     T3 — One share given; find the total
     ============================================================ */
  function genT3(pos) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const pThree = pos < 0.5 ? 0.2 : 0.5;
      const nParts = rng() < pThree ? 3 : 2;
      const useMoney = rng() < 0.45;
      const content = pickContent(useMoney);
      const parts = pickRatioParts(nParts, pos);
      const sum = parts.reduce((s, p) => s + p, 0);

      const k = pickK(sum, content);
      if (!k) continue;

      const givenIdx = ri(0, nParts - 1);
      const givenAmount = parts[givenIdx] * k;
      const total = sum * k;

      const names = shuffle(BANKS.names.slice()).slice(0, nParts);
      const givenName = names[givenIdx];
      const nameList = fmtNameList(names);
      const nameColons = names.join(' : ');

      const correctText = fmtAmount(content, total);
      const rawDistractors = t3Distractors(parts, k, givenIdx, sum);
      const dTexts = [];
      const dSeen = new Set([correctText]);
      for (const v of rawDistractors) {
        const txt = fmtAmount(content, v);
        if (dSeen.has(txt)) continue;
        dSeen.add(txt);
        dTexts.push(txt);
      }
      if (dTexts.length < 3) continue;

      const opts = shuffle([
        { text: correctText, ok: true },
        ...shuffle(dTexts).slice(0, 3).map(t => ({ text: t, ok: false }))
      ]);

      const givenText = fmtAmount(content, givenAmount);
      const ratioText = parts.join(' : ');

      let prompt;
      if (content.kind === 'money') {
        const who = nParts === 3 ? 'the three of them' : 'they';
        prompt = nameList + ' share a sum of money in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How much money did ' + who + ' share altogether?';
      } else {
        prompt = nameList + ' share ' + content.plur + ' in the ratio ' + ratioText + '. ' +
                 givenName + ' receives ' + givenText + '. ' +
                 'How many ' + content.plur + ' did they share altogether?';
      }

      const lhs = nameColons + ' = ' + ratioText +
                  '  (' + givenName + ' = ' + givenText + ')';

      return {
        sig: 'T3|' + contentKey(content) + '|' + parts.join(',') +
             '|' + k + '|' + givenIdx,
        prompt: prompt,
        lhs: lhs,
        eq: '→ total',
        options: opts
      };
    }
    return null;
  }

    /* ============================================================
     DIFFICULTY TIERS
     Three tiers: 0 = simplest, 1 = middle, 2 = harder.
     The checkbox selection decides which tiers are in play.
     The first four questions always use the *simplest selected*
     tier; the rest progress through the remaining tiers.
     ============================================================ */
  const TIER_POS = [0.15, 0.5, 0.85];   // pos fed into the generators

  /* The ticked difficulty tiers, set by build() from the settings. */
  let selectedTiers = [];
  function getSelectedTiers() {
    const tiers = selectedTiers.slice();
    if (tiers.length === 0) tiers.push(0);  // safety; UI prevents this
    return tiers;
  }

  function tierFor(i, n, selectedTiers) {
    const firstBatch = Math.min(4, n);
    if (i < firstBatch) return selectedTiers[0];
    if (selectedTiers.length === 1) return selectedTiers[0];
    const remainingTiers = selectedTiers.slice(1);
    const remainingQs = n - firstBatch;
    const qIdx = i - firstBatch;
    const subIdx = Math.min(
      remainingTiers.length - 1,
      Math.floor(qIdx * remainingTiers.length / remainingQs)
    );
    return remainingTiers[subIdx];
  }

  function pickType(pos, forced) {
    if (forced && forced !== 'mixed') return forced;
    if (pos < 0.25) return 'T1';
    if (pos < 0.55) return rng() < 0.6 ? 'T1' : 'T2';
    if (pos < 0.80) return rng() < 0.55 ? 'T2' : 'T3';
    return rng() < 0.7 ? 'T3' : 'T2';
  }

  function genOne(pos, forced) {
    const t = pickType(pos, forced);
    if (t === 'T1') return genT1(pos);
    if (t === 'T2') return genT2(pos);
    return genT3(pos);
  }

  function buildQuestions(n, forced) {
    const selectedTiers = getSelectedTiers();
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 8000) {
      guard++;
      const tier = tierFor(out.length, n, selectedTiers);
      const pos = TIER_POS[tier];
      let q = null;
      try { q = genOne(pos, forced); }
      catch (e) { if (typeof console !== 'undefined') console.warn(e); continue; }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const tier = tierFor(out.length, n, selectedTiers);
      const pos = TIER_POS[tier];
      const q = genOne(pos, forced);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'ratio-sharing',
    title: 'Dividing in a Given Ratio',
    toolbarTitle: '➗ Dividing in a Given Ratio',
    counts: [4, 6, 8, 10, 12],
    defaultCount: 10,
    instructions: 'Work out each sharing <b>without a calculator</b>. ' +
                  'For each question, find the missing share or total.',
    settings: [
      { key: 'type', label: 'Types', type: 'select', default: 'mixed', options: [
        { value: 'mixed', label: 'Mixed' },
        { value: 'T1', label: 'Share in a ratio' },
        { value: 'T2', label: 'Find a share' },
        { value: 'T3', label: 'Find the total' }
      ] },
      { key: 'diff', label: 'Difficulty', type: 'checkboxes', options: [
        { value: 0, label: 'Simplest' },
        { value: 1, label: 'Middle' },
        { value: 2, label: 'Harder' }
      ] }
    ],
    build: function (r, s) {
      rng = r;
      selectedTiers = s.diff;
      return buildQuestions(s.n, s.type);
    }
  });
})();
</script>
</body>
</html>
