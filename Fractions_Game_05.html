<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fraction Fall — Equivalent Fractions Game</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --good: #10b981;
    --bad: #ef4444;
    --bg-1: #eef2ff;
    --bg-2: #f8fafc;
    --tile: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  .app {
    max-width: 660px;
    margin: 0 auto;
    padding: 12px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* -------- HUD -------- */
  .hud { display: flex; flex-direction: column; gap: 10px; }

  .hud-top { display: flex; align-items: center; gap: 10px; }

  .title {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hud-btns { margin-left: auto; display: flex; gap: 6px; }

  .icon-btn {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .icon-btn:hover { background: #f8fafc; }
  .icon-btn:active { transform: translateY(1px); }

  .hud-stats {
    display: grid;
    grid-template-columns:
      minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1fr) auto;
    gap: 8px;
  }

  .stat {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .stat-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1;
    margin-bottom: 3px;
  }

  .stat-value {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
    min-width: 0;
  }
  .stat-value.flash { animation: statFlash .45s ease; }
  @keyframes statFlash {
    0% { color: var(--ink); }
    40% { color: var(--good); transform: scale(1.06); }
    100% { color: var(--ink); transform: scale(1); }
  }

  .next-stat {
    padding: 4px 8px;
    align-items: center;
  }
  .next-tile {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* -------- Board -------- */
  .board-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    position: relative;
  }

  .board {
    position: relative;
    background: #fbfcfe;
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 1.5px var(--line),
      0 10px 30px -12px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    background-image:
      linear-gradient(to right, rgba(226, 232, 240, 0.55) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(226, 232, 240, 0.55) 1px, transparent 1px);
    background-size: var(--tile) var(--tile);
    transition: box-shadow .25s ease;
  }
  .board.danger {
    box-shadow:
      inset 0 0 0 1.5px var(--bad),
      0 10px 30px -12px rgba(239, 68, 68, 0.35);
  }

  .placed-layer, .effects {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .falling, .ghost {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--tile);
    height: var(--tile);
    padding: 2px;
    pointer-events: none;
  }

  /* -------- Tiles -------- */
  .tile {
    position: absolute;
    width: var(--tile);
    height: var(--tile);
    padding: 2px;
    will-change: left, top;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    background: #fff;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    box-sizing: border-box;
    overflow: hidden;
  }

  .frac {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    color: var(--ink);
    font-weight: 700;
    font-size: calc(var(--tile) * 0.31);
    letter-spacing: -0.02em;
  }
  .frac .bar {
    width: 78%;
    height: 2px;
    background: currentColor;
    border-radius: 1px;
    margin: 2px 0;
  }

  .next-tile .frac { font-size: calc(var(--tile) * 0.25); }

  .falling .tile-inner {
    border-color: var(--accent);
    box-shadow:
      0 0 0 3px rgba(99, 102, 241, 0.18),
      0 8px 24px rgba(99, 102, 241, 0.35);
  }

  .ghost .tile-inner {
    border: 2px dashed rgba(100, 116, 139, 0.5);
    background: rgba(255, 255, 255, 0.55);
    box-shadow: none;
  }
  .ghost .frac { color: rgba(100, 116, 139, 0.55); }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .popping {
    animation: pop 0.42s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  .popping .tile-inner {
    border-color: var(--good);
    background: #ecfdf5;
  }

  @keyframes gainFloat {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    75% { opacity: 1; transform: translate(-50%, -160%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
  }
  .gain {
    position: absolute;
    pointer-events: none;
    color: var(--good);
    font-weight: 800;
    font-size: calc(var(--tile) * 0.32);
    text-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    animation: gainFloat 1.1s ease-out forwards;
    white-space: nowrap;
  }

  .confetti {
    position: absolute;
    border-radius: 2px;
    pointer-events: none;
  }

  /* -------- Controls -------- */
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 2px 0 4px;
  }

  .ctrl-btn {
    width: 68px;
    height: 56px;
    border-radius: 16px;
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
    transition: transform 0.06s, box-shadow 0.06s, background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    padding: 0;
  }
  .ctrl-btn:hover { background: #f8fafc; }
  .ctrl-btn.active, .ctrl-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 var(--line);
    background: #eef2ff;
    border-color: var(--accent);
    color: var(--accent);
  }

  /* -------- Overlay -------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }

  .overlay-card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.5);
    animation: cardIn .25s cubic-bezier(.2,.8,.3,1.1);
  }
  @keyframes cardIn {
    0% { transform: scale(.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .overlay-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .overlay-msg {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .overlay-score {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    margin: 8px 0 20px;
    font-variant-numeric: tabular-nums;
  }
  .overlay-btn {
    padding: 12px 24px;
    border-radius: 12px;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 16px -6px var(--accent);
  }
  .overlay-btn:hover { filter: brightness(1.05); }
  .overlay-btn:active { transform: translateY(1px); }

  @media (max-width: 480px) {
    .app { padding: 8px; gap: 8px; }
    .title { font-size: 19px; }
    .stat-value { font-size: 15px; }
    .stat { padding: 5px 8px; }
    .ctrl-btn { width: 60px; height: 50px; border-radius: 14px; }
  }

  @media (max-height: 600px) {
    .hud-stats { gap: 6px; }
    .stat { padding: 4px 8px; }
    .stat-value { font-size: 15px; }
    .next-tile { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hud-top">
      <h1 class="title">Fraction Fall</h1>
      <div class="hud-btns">
        <button class="icon-btn" id="btnPause" aria-label="Pause">❚❚</button>
      </div>
    </div>
    <div class="hud-stats">
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
      <div class="stat next-stat">
        <div class="stat-label">Next</div>
        <div class="next-tile" id="next"></div>
      </div>
    </div>
  </header>

  <main class="board-wrap">
    <div class="board" id="board">
      <div class="placed-layer" id="placedLayer"></div>
      <div class="ghost" id="ghost"></div>
      <div class="falling" id="falling"></div>
      <div class="effects" id="effects"></div>
    </div>
  </main>

  <footer class="controls">
    <button class="ctrl-btn" id="btnLeft" aria-label="Move left">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctrl-btn" id="btnDown" aria-label="Drop faster">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctrl-btn" id="btnRight" aria-label="Move right">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>

  <div class="overlay" id="overlay" hidden></div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTS
     ============================================================ */
  const COLS = 8;
  const ROWS = 10;
  const BASE_FALL = 1.0;
  const FALL_PER_LEVEL = 0.18;
  const LATERAL_SPEED = 6.5;
  const SOFT_DROP_MULT = 8;
  const MATCHES_PER_LEVEL = 10;
  const SPAWN_HOLD = 0.15;

  /* Difficulty knobs. */
  const SPAWN_MATCH_PROB = 0.6;  //  the probability that a spwaning tile has a
                                  //  match available
  const MAX_UNMATCHED_STREAK = 3;

  /* Fraction of a tile's width that may overhang a taller neighbour
     without counting as "over" that neighbour. This is what makes a
     1-column gap a realistic target under free-floating lateral
     movement: the player just needs to be within ~20% of the gap
     centre, instead of pixel-perfect. Larger = more forgiving to aim
     but more visible overhang at landing. */
  const OVERLAP_TOL = 0.20;

  /* ============================================================
     FRACTIONS
     ============================================================ */
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = b; b = a % b; a = t; }
    return a || 1;
  }
  function reduce(n, d) {
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fracEq(a, b) { return a.n * b.d === b.n * a.d; }
  function fracAdd(a, b) {
    return reduce(a.n * b.d + b.n * a.d, a.d * b.d);
  }
  function fracCmp(a, b) { return a.n * b.d - b.n * a.d; }
  function fracDisplay(f) {
    const r = reduce(f.n, f.d);
    if (r.d === 1) return String(r.n);
    if (r.n < r.d) return r.n + '/' + r.d;
    const w = Math.floor(r.n / r.d);
    const rem = r.n % r.d;
    return w + ' ' + rem + '/' + r.d;
  }

  function buildClasses() {
    const map = new Map();
    for (let d = 2; d <= 12; d++) {
      for (let n = 1; n < d; n++) {
        const r = reduce(n, d);
        const k = r.n + '/' + r.d;
        if (!map.has(k)) map.set(k, []);
        map.get(k).push({ n, d });
      }
    }
    return Array.from(map.values()).filter(a => a.length >= 2);
  }
  const CLASSES = buildClasses();
  const CLASS_BY_KEY = new Map();
  for (const cls of CLASSES) {
    const r = reduce(cls[0].n, cls[0].d);
    CLASS_BY_KEY.set(r.n + '/' + r.d, cls);
  }
  function classOf(f) {
    const r = reduce(f.n, f.d);
    return CLASS_BY_KEY.get(r.n + '/' + r.d) || [f];
  }
  function randomFraction() {
    const cls = CLASSES[Math.floor(Math.random() * CLASSES.length)];
    return cls[Math.floor(Math.random() * cls.length)];
  }

  /* ============================================================
     DOM
     ============================================================ */
  const boardEl     = document.getElementById('board');
  const placedEl    = document.getElementById('placedLayer');
  const ghostEl     = document.getElementById('ghost');
  const fallingEl   = document.getElementById('falling');
  const effectsEl   = document.getElementById('effects');
  const scoreEl     = document.getElementById('score');
  const bestEl      = document.getElementById('best');
  const levelEl     = document.getElementById('level');
  const nextEl      = document.getElementById('next');
  const overlayEl   = document.getElementById('overlay');
  const pauseBtn    = document.getElementById('btnPause');
  const btnLeft     = document.getElementById('btnLeft');
  const btnRight    = document.getElementById('btnRight');
  const btnDown     = document.getElementById('btnDown');

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    board: [],
    heights: [],
    falling: null,
    next: null,
    score: { n: 0, d: 1 },
    matches: 0,
    level: 1,
    best: { n: 0, d: 1 },
    paused: false,
    over: false,
    keys: { left: false, right: false, down: false },
    lastT: 0,
    tileSize: 56,
    started: false,
    unmatchedStreak: 0,
  };

  /* ============================================================
     SOUND
     ============================================================ */
  let audioCtx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('fractionFall.sound') !== '0'; } catch (e) {}

  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }
  function beep(freq, dur, type) {
    if (!soundOn) return;
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function playMatch() {
    beep(523.25, 0.14);
    setTimeout(function () { beep(659.25, 0.14); }, 70);
    setTimeout(function () { beep(783.99, 0.24); }, 140);
  }
  function playLand() { beep(180, 0.07, 'triangle'); }
  function playLevelUp() {
    beep(659.25, 0.1);
    setTimeout(function () { beep(783.99, 0.1); }, 80);
    setTimeout(function () { beep(1046.5, 0.2); }, 160);
  }

  /* ============================================================
     TILE ELEMENTS
     ============================================================ */
  function tileInner(f) {
    const wrap = document.createElement('div');
    wrap.className = 'tile-inner';
    const frac = document.createElement('div');
    frac.className = 'frac';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(f.n);
    const bar = document.createElement('span');
    bar.className = 'bar';
    const den = document.createElement('span');
    den.className = 'den';
    den.textContent = String(f.d);
    frac.appendChild(num);
    frac.appendChild(bar);
    frac.appendChild(den);
    wrap.appendChild(frac);
    return wrap;
  }
  function makeTileEl(f) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.appendChild(tileInner(f));
    return t;
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  function computeTileSize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const padX = 24;
    const reservedY = 250;
    const availW = Math.min(vw - padX * 2, 640);
    const availH = vh - reservedY;
    const tw = (availW - 8) / COLS;
    const th = (availH - 8) / ROWS;
    return Math.max(28, Math.min(Math.floor(Math.min(tw, th)), 66));
  }

  function layout() {
    state.tileSize = computeTileSize();
    const T = state.tileSize;
    boardEl.style.width = (T * COLS) + 'px';
    boardEl.style.height = (T * ROWS) + 'px';
    boardEl.style.setProperty('--tile', T + 'px');
    document.documentElement.style.setProperty('--tile', T + 'px');
    renderPlaced();
    positionFalling();
  }

  /* ============================================================
     BOARD STATE
     ============================================================ */
  function initBoard() {
    state.board = [];
    state.heights = [];
    for (let c = 0; c < COLS; c++) {
      state.board.push(new Array(ROWS).fill(null));
      state.heights.push(0);
    }
    for (let c = 0; c < COLS; c++) {
      state.board[c][ROWS - 1] = randomFraction();
      state.heights[c] = 1;
    }
  }

  function renderPlaced() {
    while (placedEl.firstChild) placedEl.removeChild(placedEl.firstChild);
    const T = state.tileSize;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const f = state.board[c][r];
        if (!f) continue;
        const t = makeTileEl(f);
        t.style.left = (c * T) + 'px';
        t.style.top = (r * T) + 'px';
        placedEl.appendChild(t);
      }
    }
    updateDangerState();
  }

  function updateDangerState() {
    const danger = state.heights.some(function (h) { return h >= ROWS - 1; });
    boardEl.classList.toggle('danger', danger);
  }

  /* ============================================================
     GEOMETRY / COLLISION
     ============================================================ */
  function colAt(x) {
    const T = state.tileSize;
    return Math.max(0, Math.min(COLS - 1, Math.floor((x + T / 2) / T)));
  }

  /* How many pixels of a tile placed at x overlap column j. */
  function overlapWith(x, j) {
    const T = state.tileSize;
    const jL = j * T;
    const jR = (j + 1) * T;
    return Math.max(0, Math.min(x + T, jR) - Math.max(x, jL));
  }

  /* Lateral movement is permitted unless it would push the tile
     FURTHER into a column whose top is already above the tile's
     bottom edge. Equal or decreasing overlap is always allowed, so a
     tile that has drifted over a tower can always be slid back
     towards the gap even after its bottom edge has dropped below the
     tower's top. Before this change, `isValidX` blocked any target
     that overlapped the tower at all — which made escape impossible
     and produced the "locks onto the tower" symptom. */
  function canMoveTo(newX) {
    const f = state.falling;
    if (!f) return true;
    const T = state.tileSize;
    const tol = T * OVERLAP_TOL;
    for (let j = 0; j < COLS; j++) {
      if (state.heights[j] === 0) continue;
      const stackTop = (ROWS - state.heights[j]) * T;
      if (f.y + T <= stackTop) continue;   /* still above this stack */
      const newO = overlapWith(newX, j);
      if (newO <= tol) continue;           /* negligible overhang */
      const curO = overlapWith(f.x, j);
      if (newO > curO + 0.001) return false;
    }
    return true;
  }

  /* The column the tile will rest on. Overhangs of up to OVERLAP_TOL
     of a tile's width are ignored — so a tile roughly centred over a
     gap lands in the gap rather than on the adjacent tower. Among
     columns the tile genuinely covers, the tallest wins (tie-break:
     closest to the tile's centre). */
  function computeLandingCol(x) {
    const T = state.tileSize;
    const tol = T * OVERLAP_TOL;
    const cx = x + T / 2;
    let bestCol = colAt(x);
    let bestH = state.heights[bestCol];
    let bestDist = Math.abs((bestCol + 0.5) * T - cx);
    for (let j = 0; j < COLS; j++) {
      if (overlapWith(x, j) <= tol) continue;
      const h = state.heights[j];
      const dist = Math.abs((j + 0.5) * T - cx);
      if (h > bestH || (h === bestH && dist < bestDist)) {
        bestH = h;
        bestCol = j;
        bestDist = dist;
      }
    }
    return bestCol;
  }

  function computeLandingY(x) {
    const T = state.tileSize;
    const col = computeLandingCol(x);
    return (ROWS - state.heights[col] - 1) * T;
  }

  /* ============================================================
     SPAWNING
     ============================================================ */
  function topFractions() {
    const out = [];
    for (let c = 0; c < COLS; c++) {
      const h = state.heights[c];
      if (h > 0) {
        const f = state.board[c][ROWS - h];
        if (f) out.push(f);
      }
    }
    return out;
  }

  function generateNextFraction() {
    const tops = topFractions();
    const forceMatch = state.unmatchedStreak >= MAX_UNMATCHED_STREAK;
    const wantMatch = forceMatch || Math.random() < SPAWN_MATCH_PROB;

    let f;
    if (wantMatch && tops.length > 0) {
      const matching = [];
      const nonIdentical = [];
      for (const t of tops) {
        for (const cand of classOf(t)) {
          matching.push(cand);
          if (cand.n !== t.n || cand.d !== t.d) nonIdentical.push(cand);
        }
      }
      const pool = nonIdentical.length > 0 ? nonIdentical : matching;
      f = pool[Math.floor(Math.random() * pool.length)];
    } else {
      const nonMatching = [];
      for (const cls of CLASSES) {
        for (const cand of cls) {
          let matches = false;
          for (const t of tops) {
            if (fracEq(t, cand)) { matches = true; break; }
          }
          if (!matches) nonMatching.push(cand);
        }
      }
      f = nonMatching.length > 0
        ? nonMatching[Math.floor(Math.random() * nonMatching.length)]
        : randomFraction();
    }

    let hits = false;
    for (const t of tops) {
      if (fracEq(t, f)) { hits = true; break; }
    }
    if (hits) state.unmatchedStreak = 0;
    else state.unmatchedStreak++;

    return f;
  }

  function shortestColumn() {
    let best = 0;
    let minH = Infinity;
    for (let c = 0; c < COLS; c++) {
      if (state.heights[c] < minH) { minH = state.heights[c]; best = c; }
    }
    return best;
  }

  function spawnTile() {
    const T = state.tileSize;
    const f = state.next || generateNextFraction();
    state.next = generateNextFraction();

    const col = shortestColumn();
    if (state.heights[col] >= ROWS) { gameOver(); return; }

    state.falling = {
      n: f.n,
      d: f.d,
      x: col * T,
      y: 0,
      col: col,
      hold: SPAWN_HOLD,
    };

    setFallingContent(f);
    positionFalling();
    renderHUD();
  }

  /* ============================================================
     FALLING TILE RENDER
     ============================================================ */
  function setFallingContent(f) {
    fallingEl.innerHTML = '';
    fallingEl.appendChild(tileInner(f));
  }

  function positionFalling() {
    const f = state.falling;
    const T = state.tileSize;
    if (!f) {
      fallingEl.style.display = 'none';
      ghostEl.style.display = 'none';
      return;
    }
    fallingEl.style.display = '';
    fallingEl.style.transform = 'translate(' + f.x + 'px,' + f.y + 'px)';

    const ghostCol = computeLandingCol(f.x);
    const ghostRow = ROWS - state.heights[ghostCol] - 1;
    if (ghostRow < 0) {
      ghostEl.style.display = 'none';
    } else {
      ghostEl.style.display = '';
      ghostEl.style.transform = 'translate(' + (ghostCol * T) + 'px,' + (ghostRow * T) + 'px)';
      if (ghostEl.dataset.frac !== f.n + '/' + f.d) {
        ghostEl.dataset.frac = f.n + '/' + f.d;
        ghostEl.innerHTML = '';
        ghostEl.appendChild(tileInner(f));
      }
    }
  }

  /* ============================================================
     UPDATE / LOOP
     ============================================================ */
  function getFallSpeed() {
    return BASE_FALL + (state.level - 1) * FALL_PER_LEVEL;
  }

  function update(dt) {
    if (!state.falling) { spawnTile(); return; }
    const f = state.falling;
    const T = state.tileSize;

    let dx = 0;
    if (state.keys.left)  dx -= LATERAL_SPEED * T * dt;
    if (state.keys.right) dx += LATERAL_SPEED * T * dt;
    if (dx !== 0) {
      const newX = Math.max(0, Math.min((COLS - 1) * T, f.x + dx));
      if (canMoveTo(newX)) {
        f.x = newX;
        f.col = colAt(f.x);
      }
    }

    if (f.hold > 0) {
      f.hold -= dt;
    } else {
      const speed = getFallSpeed() * T * dt * (state.keys.down ? SOFT_DROP_MULT : 1);
      f.y += speed;
    }

    const targetY = computeLandingY(f.x);
    if (f.y >= targetY) {
      f.y = targetY;
      /* Snap x onto the landed column so the visual jump is zero —
         placeTile() reads the landing column anyway, so the placed
         tile appears exactly where the ghost was. */
      f.x = computeLandingCol(f.x) * T;
      f.col = colAt(f.x);
      placeTile();
      return;
    }
    positionFalling();
  }

  let rafId = 0;
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!state.started) { state.lastT = now; return; }
    const dt = Math.min((now - state.lastT) / 1000, 0.05);
    state.lastT = now;
    if (state.paused || state.over) return;
    update(dt);
  }

  /* ============================================================
     PLACEMENT & MATCH
     ============================================================ */
  function placeTile() {
    const f = state.falling;
    if (!f) return;
    const T = state.tileSize;
    const col = computeLandingCol(f.x);
    const h = state.heights[col];

    if (h >= ROWS) { gameOver(); return; }

    const row = ROWS - h - 1;
    state.board[col][row] = { n: f.n, d: f.d };
    state.heights[col] = h + 1;
    state.falling = null;
    fallingEl.style.display = 'none';
    ghostEl.style.display = 'none';

    let matched = false;
    if (row + 1 < ROWS) {
      const below = state.board[col][row + 1];
      if (below && fracEq(below, f)) {
        matched = true;
        const gain = fracAdd(f, below);
        state.score = fracAdd(state.score, gain);
        state.matches++;

        popTiles(col, row, f, below);
        showGain(col, row, gain);
        burstConfetti((col + 0.5) * T, (row + 0.5) * T);
        playMatch();

        state.board[col][row] = null;
        state.board[col][row + 1] = null;
        state.heights[col] -= 2;

        const targetLevel = 1 + Math.floor(state.matches / MATCHES_PER_LEVEL);
        if (targetLevel > state.level) {
          state.level = targetLevel;
          playLevelUp();
          levelEl.classList.remove('flash');
          void levelEl.offsetWidth;
          levelEl.classList.add('flash');
        }

        if (fracCmp(state.score, state.best) > 0) {
          state.best = { n: state.score.n, d: state.score.d };
          saveBest(state.best);
        }
        scoreEl.classList.remove('flash');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('flash');
      }
    }

    if (!matched) playLand();

    renderPlaced();
    renderHUD();
    spawnTile();
  }

  /* ============================================================
     EFFECTS
     ============================================================ */
  function popTiles(col, row, f1, f2) {
    const T = state.tileSize;
    [[row, f1], [row + 1, f2]].forEach(function (pair) {
      const t = makeTileEl(pair[1]);
      t.classList.add('popping');
      t.style.left = (col * T) + 'px';
      t.style.top = (pair[0] * T) + 'px';
      effectsEl.appendChild(t);
      setTimeout(function () { t.remove(); }, 500);
    });
  }

  function showGain(col, row, gain) {
    const T = state.tileSize;
    const el = document.createElement('div');
    el.className = 'gain';
    el.textContent = '+' + fracDisplay(gain);
    el.style.left = ((col + 0.5) * T) + 'px';
    el.style.top = ((row + 0.5) * T) + 'px';
    effectsEl.appendChild(el);
    setTimeout(function () { el.remove(); }, 1200);
  }

  function burstConfetti(cx, cy) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colours = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#fb7185'];
    const COUNT = 20;
    for (let i = 0; i < COUNT; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.background = colours[i % colours.length];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const w = 4 + Math.random() * 6;
      const h = 6 + Math.random() * 8;
      p.style.width = w + 'px';
      p.style.height = h + 'px';
      if (Math.random() < 0.4) p.style.borderRadius = '50%';
      effectsEl.appendChild(p);

      const angle = (Math.PI * 2 * i) / COUNT + Math.random() * 0.5;
      const dist = 40 + Math.random() * 90;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      const rot = (Math.random() - 0.5) * 720;

      const anim = p.animate([
        { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(1)', opacity: 0 }
      ], {
        duration: 700 + Math.random() * 400,
        delay: Math.random() * 80,
        easing: 'cubic-bezier(.15,.7,.3,1)',
        fill: 'forwards'
      });
      anim.onfinish = function () { p.remove(); };
    }
  }

  /* ============================================================
     HUD
     ============================================================ */
  function renderHUD() {
    scoreEl.textContent = fracDisplay(state.score);
    bestEl.textContent = fracDisplay(state.best);
    levelEl.textContent = String(state.level);
    nextEl.innerHTML = '';
    if (state.next) nextEl.appendChild(tileInner(state.next));
  }

  /* ============================================================
     PERSISTENCE
     ============================================================ */
  function loadBest() {
    try {
      const raw = localStorage.getItem('fractionFall.best');
      if (!raw) return { n: 0, d: 1 };
      const o = JSON.parse(raw);
      if (o && typeof o.n === 'number' && typeof o.d === 'number' && o.d > 0) {
        return reduce(o.n, o.d);
      }
    } catch (e) {}
    return { n: 0, d: 1 };
  }
  function saveBest(b) {
    try { localStorage.setItem('fractionFall.best', JSON.stringify(b)); } catch (e) {}
  }

  /* ============================================================
     OVERLAYS
     ============================================================ */
  function showOverlay(title, msg, scoreText, btnLabel, onClick) {
    overlayEl.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'overlay-card';

    const h = document.createElement('h2');
    h.className = 'overlay-title';
    h.textContent = title;
    card.appendChild(h);

    if (msg) {
      const p = document.createElement('p');
      p.className = 'overlay-msg';
      p.textContent = msg;
      card.appendChild(p);
    }
    if (scoreText) {
      const s = document.createElement('div');
      s.className = 'overlay-score';
      s.textContent = scoreText;
      card.appendChild(s);
    }
    if (btnLabel) {
      const b = document.createElement('button');
      b.className = 'overlay-btn';
      b.textContent = btnLabel;
      b.addEventListener('click', onClick);
      card.appendChild(b);
    }
    overlayEl.appendChild(card);
    overlayEl.hidden = false;
  }
  function hideOverlay() {
    overlayEl.hidden = true;
    overlayEl.innerHTML = '';
  }

  function gameOver() {
    state.over = true;
    state.falling = null;
    fallingEl.style.display = 'none';
    ghostEl.style.display = 'none';
    showOverlay(
      'Game Over',
      'The stack reached the top. Try to find the equivalent fractions faster next time.',
      fracDisplay(state.score),
      'Play again',
      restartGame
    );
  }

  function togglePause() {
    if (state.over || !state.started) return;
    state.paused = !state.paused;
    if (state.paused) {
      showOverlay('Paused', 'Take a breath — the game is on hold.', null, 'Resume', function () {
        state.paused = false;
        hideOverlay();
        state.lastT = performance.now();
      });
    } else {
      hideOverlay();
      state.lastT = performance.now();
    }
  }

  /* ============================================================
     CONTROLS
     ============================================================ */
  function bindHold(btn, key) {
    function set(v) {
      state.keys[key] = v;
      btn.classList.toggle('active', v);
    }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      set(true);
    });
    btn.addEventListener('pointerup', function (e) {
      e.preventDefault();
      try { btn.releasePointerCapture(e.pointerId); } catch (err) {}
      set(false);
    });
    btn.addEventListener('pointercancel', function () { set(false); });
    btn.addEventListener('lostpointercapture', function () { set(false); });
  }
  bindHold(btnLeft, 'left');
  bindHold(btnRight, 'right');
  bindHold(btnDown, 'down');

  pauseBtn.addEventListener('click', togglePause);

  document.addEventListener('keydown', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { state.keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { state.keys.right = true; e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { state.keys.down = true; e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); }
  });
  document.addEventListener('keyup', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') state.keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') state.keys.right = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') state.keys.down = false;
  });

  /* ============================================================
     GAME LIFECYCLE
     ============================================================ */
  function resetState() {
    state.board = [];
    state.heights = [];
    state.falling = null;
    state.next = null;
    state.score = { n: 0, d: 1 };
    state.matches = 0;
    state.level = 1;
    state.best = loadBest();
    state.paused = false;
    state.over = false;
    state.keys = { left: false, right: false, down: false };
    state.unmatchedStreak = 0;
    btnLeft.classList.remove('active');
    btnRight.classList.remove('active');
    btnDown.classList.remove('active');
  }

  function restartGame() {
    hideOverlay();
    resetState();
    initBoard();
    state.tileSize = computeTileSize();
    layout();
    spawnTile();
    renderHUD();
    state.started = true;
    state.lastT = performance.now();
  }

  window.addEventListener('resize', function () {
    if (!state.started) return;
    state.tileSize = computeTileSize();
    layout();
    renderPlaced();
    positionFalling();
  });

  boardEl.addEventListener('touchstart', function (e) {
    if (e.target === boardEl) e.preventDefault();
  }, { passive: false });

  resetState();
  initBoard();
  state.tileSize = computeTileSize();
  layout();
  spawnTile();
  renderHUD();
  state.started = true;
  state.lastT = performance.now();
  rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
