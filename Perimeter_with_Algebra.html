<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perimeter — Missing Side</title>
<link rel="stylesheet" href="core/drill.css">
<style>
  :root{
    --q-min:400px; --opt-size:22px;
    --slot-min-w:140px; --slot-min-h:60px; --slot-font:22px;
  }
  /* Letters stand for unknowns, so they are italic everywhere. */
  .ltr{font-style:italic}

  .perimeter-body{
    display:flex; flex-direction:column; align-items:center;
    gap:2px; margin:4px 0 12px;
  }
  .triangle-wrap{width:100%; max-width:360px; color:var(--ink); padding:2px 0}
  .tri-svg{display:block; width:100%; height:auto; overflow:visible}
  .tri-label{
    font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size:22px; font-weight:700; fill:var(--ink);
  }
  .tri-label-q{font-size:32px; font-weight:800; fill:var(--accent)}
  .answer-row{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; margin-top:6px}
  .answer-label{font-size:17px; font-weight:700; color:var(--muted); letter-spacing:.2px}
  @media print{
    .triangle-wrap{max-width:320px}
    .tri-label{font-size:19px}
    .tri-label-q{font-size:26px}
    .q-prompt{font-size:18px}
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     VARIABLES
     All lowercase letters except 'o' (which too easily reads as 0).
     ============================================================ */
  const VAR_LETTERS = 'abcdefghijklmnpqrstuvwxyz'.split('');

  /* ============================================================
     EXPRESSION FORMATTING
     An expression is [coefficient, constant], representing
     coefficient · letter + constant, with both parts ≥ 0.
     ============================================================ */
  function fmtExpr(expr, letter) {
    const a = expr[0], b = expr[1];
    const coeff = a === 1 ? '' : String(a);
    if (b === 0) return coeff + letter;
    return coeff + letter + ' + ' + b;
  }

  /* Format for display in HTML — wrap the letter in a span that
     italicises just the variable, leaving digits upright. */
  function fmtExprHtml(expr, letter) {
    return fmtExpr(expr, letter).split(letter).join(
      '<span class="ltr">' + letter + '</span>'
    );
  }

  /* ============================================================
     TRIANGLE GEOMETRY
     ============================================================ */

  /* Generate a random triangle that isn't too thin or too close to
     degenerate. Returns an array of three {x, y} vertices, or null
     if no acceptable triangle was found in the allowed attempts. */
  function generateTriangle() {
    for (let attempt = 0; attempt < 40; attempt++) {
      const v0 = { x: 40 + rng() * 40, y: 208 - rng() * 24 };
      const v1 = { x: 260 - rng() * 40, y: 208 - rng() * 24 };
      const v2 = { x: 80 + rng() * 160, y: 30 + rng() * 54 };
      const verts = [v0, v1, v2];

      /* Reject triangles with a very sharp or very flat angle. */
      let ok = true;
      for (let i = 0; i < 3 && ok; i++) {
        const p = verts[(i + 2) % 3];
        const c = verts[i];
        const n = verts[(i + 1) % 3];
        const a1 = Math.atan2(p.y - c.y, p.x - c.x);
        const a2 = Math.atan2(n.y - c.y, n.x - c.x);
        let deg = Math.abs(a1 - a2) * 180 / Math.PI;
        if (deg > 180) deg = 360 - deg;
        if (deg < 25 || deg > 145) ok = false;
      }
      if (!ok) continue;

      /* Reject triangles with too small an area. */
      const area = Math.abs(
        (v1.x - v0.x) * (v2.y - v0.y) - (v2.x - v0.x) * (v1.y - v0.y)
      ) / 2;
      if (area < 6500) continue;

      return verts;
    }
    return null;
  }

  /* Given a side (v1 to v2), the centroid of the triangle, and an
     outward offset, return the position and rotation angle for a
     label attached to that side. The label is placed just outside
     the triangle and rotated to run parallel with the edge, flipped
     so that it is always readable left-to-right. */
  function labelPlacement(v1, v2, centroid, offset) {
    const mx = (v1.x + v2.x) / 2;
    const my = (v1.y + v2.y) / 2;
    const dx = v2.x - v1.x;
    const dy = v2.y - v1.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len;
    const uy = dy / len;

    /* Two perpendicular directions, pick the one pointing away
       from the triangle's centroid. */
    const p1 = { x: -uy, y:  ux };
    const p2 = { x:  uy, y: -ux };
    const toC = { x: centroid.x - mx, y: centroid.y - my };
    const dot = p1.x * toC.x + p1.y * toC.y;
    const perp = dot > 0 ? p2 : p1;

    const px = mx + perp.x * offset;
    const py = my + perp.y * offset;

    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    if (angle > 90) angle -= 180;
    else if (angle < -90) angle += 180;

    return { x: px, y: py, angle };
  }

  /* ============================================================
     QUESTION GENERATOR
     ============================================================ */

  /* Difficulty measure: how many of the three sides carry a
     constant term. Range 0-3.
       0  → all sides are simple monomials (e.g. 3x)
       1  → one side has a constant (e.g. 2x + 1)
       2  → two sides have constants
       3  → all three sides have constants                        */
  function questionDifficulty(sides) {
    return sides.filter(s => s[1] > 0).length;
  }

  function genPerimeterQuestion(pos) {
    const target = pos * 2.2;   /* 0 at start, 2.2 at end */
    const sigma = 0.9;

    for (let attempt = 0; attempt < 120; attempt++) {
      const letter = pick(VAR_LETTERS);

      /* Generate three sides as [coefficient, constant]. */
      const sides = [];
      for (let i = 0; i < 3; i++) {
        const a = 1 + Math.floor(rng() * 4);   /* 1..4 */
        const b = rng() < 0.5 ? 0 : (1 + Math.floor(rng() * 4));  /* 0 or 1..4 */
        sides.push([a, b]);
      }

      /* Reject if the perimeter coefficient grows too large. */
      const P = [
        sides[0][0] + sides[1][0] + sides[2][0],
        sides[0][1] + sides[1][1] + sides[2][1]
      ];
      if (P[0] > 12) continue;

      /* Accept/reject according to the target difficulty. */
      const diff = questionDifficulty(sides);
      const z = (diff - target) / sigma;
      if (rng() > Math.exp(-0.5 * z * z)) continue;

      /* Choose which of the three sides is missing. */
      const missingIdx = Math.floor(rng() * 3);
      const M  = sides[missingIdx];
      const S1 = sides[(missingIdx + 1) % 3];
      const S2 = sides[(missingIdx + 2) % 3];

      /* Generate the triangle. */
      const verts = generateTriangle();
      if (!verts) continue;

      /* Shuffle the mapping between side index and edge index, so
         the missing side can appear on any of the three edges. */
      const perm = shuffle([0, 1, 2]);
      const edgeToSide = [];
      for (let s = 0; s < 3; s++) edgeToSide[perm[s]] = s;

      /* Centroid of the triangle, used for placing labels. */
      const centroid = {
        x: (verts[0].x + verts[1].x + verts[2].x) / 3,
        y: (verts[0].y + verts[1].y + verts[2].y) / 3
      };

      /* Build the SVG. */
      let svg = '<svg viewBox="0 0 340 260" class="tri-svg" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
      svg += '<polygon points="' +
        verts.map(v => v.x.toFixed(1) + ',' + v.y.toFixed(1)).join(' ') +
        '" fill="none" stroke="currentColor" stroke-width="2.5" ' +
        'stroke-linejoin="round"/>';

      for (let e = 0; e < 3; e++) {
        const s = edgeToSide[e];
        const v1 = verts[e];
        const v2 = verts[(e + 1) % 3];
        const place = labelPlacement(v1, v2, centroid, 30);
        const isMissing = (s === missingIdx);
        const labelHtml = isMissing
          ? '?'
          : fmtExpr(sides[s], letter).split(letter).join(
              '<tspan font-style="italic">' + letter + '</tspan>'
            );
        const cls = isMissing ? 'tri-label tri-label-q' : 'tri-label';
        svg +=
          '<text class="' + cls + '" ' +
          'x="' + place.x.toFixed(1) + '" y="' + place.y.toFixed(1) + '" ' +
          'text-anchor="middle" dominant-baseline="middle" ' +
          'transform="rotate(' + place.angle.toFixed(1) + ',' +
            place.x.toFixed(1) + ',' + place.y.toFixed(1) + ')">' +
          labelHtml +
          '</text>';
      }
      svg += '</svg>';

      /* Build the distractor pool. */
      const pool = [];
      const seen = new Set([M[0] + ',' + M[1]]);
      const add = (expr) => {
        if (expr[0] < 1 || expr[1] < 0) return;
        if (expr[0] > 25 || expr[1] > 30) return;
        const key = expr[0] + ',' + expr[1];
        if (seen.has(key)) return;
        seen.add(key);
        pool.push(fmtExprHtml(expr, letter));
      };

      /* Sum of the two known sides — pupil forgot the perimeter. */
      add([S1[0] + S2[0], S1[1] + S2[1]]);
      /* Subtracted only one side from the perimeter. */
      add([P[0] - S1[0], P[1] - S1[1]]);
      add([P[0] - S2[0], P[1] - S2[1]]);
      /* Off-by-one on coefficient. */
      add([M[0] + 1, M[1]]);
      if (M[0] > 1) add([M[0] - 1, M[1]]);
      /* Off-by-one on constant. */
      add([M[0], M[1] + 1]);
      if (M[1] > 0) add([M[0], M[1] - 1]);
      /* Dropped the constant, kept only the variable term. */
      if (M[1] > 0) add([M[0], 0]);
      /* Dropped the variable, kept only the constant. */
      if (M[1] > 0) add([1, M[1]]);
      /* Copied one of the given sides. */
      add(S1);
      add(S2);

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);

      const opts = shuffle([
        { html: fmtExprHtml(M, letter), ok: true },
        ...distractors.map(h => ({ html: h, ok: false }))
      ]);

      const sig = 'P|' + letter + '|' +
                  sides.map(s => s.join(':')).join('|') + '|' + missingIdx;

      return {
        sig,
        promptHtml: 'Perimeter = ' + fmtExprHtml(P, letter),
        svg,
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS — with position-based difficulty gradient
     ============================================================ */
  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 3000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      let q = null;
      try {
        q = genPerimeterQuestion(pos);
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 300) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = genPerimeterQuestion(pos);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'perimeter-missing-side',
    title: 'Perimeter — Missing Side',
    toolbarTitle: '📐 Perimeter — Missing Side',
    counts: [4, 6, 8, 10],
    defaultCount: 10,
    instructions: 'For each triangle, the perimeter is given. ' +
                  'Work out an expression for the <b>missing side</b>.',
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n);
    },
    renderPrompt: q => q.promptHtml,
    renderBody: q =>
      '<div class="perimeter-body">' +
        '<div class="triangle-wrap">' + q.svg + '</div>' +
        '<div class="answer-row">' +
          '<span class="answer-label">Missing side =</span>' +
          Drill.slot() +
        '</div>' +
      '</div>'
  });
})();
</script>
</body>
</html>
