<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Negative Numbers — Practice</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#cbd5e1;
    --line-soft:#e2e8f0;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#dbeafe;
    --page:#eef2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--page);
    font-size:17px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* toolbar */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px 22px;
    background:#0f172a; color:#f9fafb;
    box-shadow:0 2px 10px rgba(15,23,42,.25);
    font-size:15px;
  }
  .tb-title{font-weight:800; margin-right:auto; letter-spacing:.3px; font-size:16px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e2e8f0}
  .toolbar input[type=number]{
    width:130px; padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:9px 16px; border-radius:9px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit; font-weight:700; cursor:pointer;
  }
  .toolbar button:hover{background:#334155}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:var(--accent-dark)}
  .chk{cursor:pointer}
  .score-chip{
    padding:8px 14px; border-radius:999px;
    background:#1e293b; border:1px solid #334155;
    font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;
  }
  @keyframes chipPop{
    0%{transform:scale(1)}
    40%{transform:scale(1.14); background:#16a34a; border-color:#16a34a}
    100%{transform:scale(1)}
  }
  .score-chip.pop{animation:chipPop .5s ease}

  /* operation toggles */
  .op-group{
    display:flex; flex-wrap:wrap; gap:4px;
    padding:4px;
    border-radius:12px;
    background:#1e293b;
    border:1px solid #334155;
  }
  .toolbar .op-toggle{
    padding:7px 13px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color:#94a3b8;
    font:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .toolbar .op-toggle:hover{background:#334155; color:#e2e8f0}
  .toolbar .op-toggle.active{
    background:var(--accent);
    border-color:var(--accent-dark);
    color:#fff;
  }
  .toolbar .op-toggle:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

  /* sheet */
  .sheet{
    background:#fff;
    max-width:1180px;
    margin:26px auto 60px;
    padding:34px 38px 46px;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
  }
  .sheet-head h1{margin:0; font-size:30px; letter-spacing:.4px; font-weight:800}
  .meta{margin-left:auto; display:flex; gap:20px; font-size:14px; color:#334155}
  .meta .line{display:inline-block; width:120px; border-bottom:1px solid #94a3b8}
  .meta .line.short{width:90px}
  .meta .line.tiny{width:55px}
  .instructions{margin:16px 0 20px; font-size:15.5px; color:var(--muted); line-height:1.5}

  /* questions */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(500px, 1fr));
    gap:18px;
  }
  @media (max-width:920px){ .questions{grid-template-columns:1fr} }

  .q{
    border:2px solid var(--line-soft);
    border-radius:14px;
    padding:14px 18px 16px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px}
  .q-num{
    flex:none;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{
    font-size:16px; line-height:1.3; font-weight:700; color:#1e293b;
    padding-top:5px;
  }

  /* expression display */
  .sequence-wrap{
    text-align:center;
    padding:10px 0 8px;
  }
  .sequence{
    display:inline-block;
    font-size: clamp(24px, 3.6vw, 36px);
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--ink);
    white-space: nowrap;
    line-height:1.2;
  }

  /* missing-number box inside the equation */
  .miss-box{
    display:inline-block;
    min-width:1.35em;
    padding:0 .16em;
    margin:0 .06em;
    border:3px solid var(--accent);
    border-radius:8px;
    background:#eff6ff;
    color:var(--accent);
    font-weight:800;
    line-height:1.05;
    text-align:center;
    vertical-align:middle;
  }

  /* answer row */
  .rule-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px;
    margin:6px 0 14px;
  }
  .rule-label{
    font-size:17px; font-weight:800; color:var(--muted);
    letter-spacing:.2px;
  }

  /* drop slot */
  .drop-zone{border-radius:14px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:var(--accent-soft); transform:scale(1.03)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:170px; min-height:58px;
    padding:8px 18px;
    border:3px dashed #94a3b8;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#94a3b8;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}
  .qmark.correct{
    border-color:#16a34a; color:#15803d; background:#f0fdf4;
  }
  @keyframes popIn{
    0%{transform:scale(.55)}
    55%{transform:scale(1.22)}
    100%{transform:scale(1)}
  }
  .qmark.just-correct{animation:popIn .5s cubic-bezier(.2,.9,.3,1.4)}

  /* options */
  .options{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:8px;
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--line-soft);
  }
  @media (max-width:560px){ .options{grid-template-columns:repeat(2, minmax(0,1fr))} }

  .option{
    display:flex; align-items:center; gap:10px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:2px solid var(--line-soft);
    border-radius:12px;
    background:#f8fafc;
    padding:10px 12px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .option:hover{background:#f1f5f9}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 3px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 3px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    60%{transform:translateX(6px)}
    80%{transform:translateX(-4px)}
  }
  .opt-letter{
    flex:none;
    width:22px; height:22px; border-radius:50%;
    background:#e2e8f0; color:#475569;
    font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    display:flex; align-items:center;
    justify-content:center;
    min-height:30px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
    white-space:nowrap;
  }

  /* drag ghost */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 18px;
    border-radius:12px;
    background:#fff; border:2px solid var(--line-soft);
    box-shadow:0 12px 26px rgba(15,23,42,.30);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.06);
    font-size:20px; font-weight:700;
    white-space:nowrap;
  }

  /* confetti canvas */
  .confetti-canvas{
    position:fixed; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:9998;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }

  /* feedback */
  .q-feedback{
    margin-top:10px; min-height:20px; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* answer key */
  .key{
    margin-top:30px;
    border-top:3px solid var(--ink);
    padding-top:14px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 12px; font-size:18px; letter-spacing:.5px; font-weight:800}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:8px 12px;
    font-size:15px;
    color:#334155;
  }
  .key-grid b{color:var(--ink); font-size:17px}

  @media (prefers-reduced-motion: reduce){
    .option.wrong{animation:none}
    .qmark.just-correct{animation:none}
    .score-chip.pop{animation:none}
    body.dragging-active .drop-zone .qmark{animation:none}
  }

  /* print */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff; font-size:14px}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#94a3b8}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .sequence{font-size:26px}
    .qmark{min-width:150px; min-height:50px; font-size:19px}
    .opt-visual{font-size:17px}
    .opt-letter{width:20px; height:20px; font-size:11px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">➖ Negative Numbers</div>

  <div class="op-group" role="group" aria-label="Operations to practise">
    <button class="op-toggle active" data-op="add" aria-pressed="true">＋ Add</button>
    <button class="op-toggle active" data-op="sub" aria-pressed="true">− Subtract</button>
    <button class="op-toggle active" data-op="mul" aria-pressed="true">× Multiply</button>
    <button class="op-toggle active" data-op="div" aria-pressed="true">÷ Divide</button>
  </div>

  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <button id="shareBtn">🔗 Copy link to this sheet</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  const MINUS = '\u2212';
  const LETTERS = 'ABCD';
  const LIMIT = 25;                      // everything stays within ±25
  const BOX = '<span class="miss-box">?</span>';

  function num(n) {
    return n < 0 ? MINUS + Math.abs(n) : String(n);
  }
  function randSigned(max) {
    const v = ri(1, Math.max(1, max));
    return rng() < 0.5 ? -v : v;
  }

  /* ============================================================
     DIFFICULTY RAMP
     ------------------------------------------------------------
     Every question sits at a position i in 0..n-1.  We map that
     to t in [0, 1]: 0 is the gentlest setting, 1 the hardest.
     Each generator takes t and scales its number ranges smoothly,
     so the sheet gets gradually harder no matter how many
     questions are chosen.
     ============================================================ */
  function difficultyAt(i, n) {
    if (n <= 1) return 0.5;
    return i / (n - 1);
  }

  /* ============================================================
     QUESTION GENERATORS
     ------------------------------------------------------------
     All operands and all answers stay within −25 … 25.  Each
     generator is guaranteed to involve at least one negative
     number (or a negative result), so every question is genuine
     negative-number practice.
     ============================================================ */

  function genAdd(t) {
    const max = clamp(Math.round(6 + 19 * t), 6, LIMIT);
    const threeP = t > 0.55 ? (t - 0.55) * 1.1 : 0;
    const n = rng() < threeP ? 3 : 2;
    for (let k = 0; k < 100; k++) {
      const terms = [];
      for (let i = 0; i < n; i++) terms.push(randSigned(max));
      if (!terms.some(v => v < 0)) {
        const idx = ri(0, n - 1);
        terms[idx] = -Math.abs(terms[idx]);
      }
      const sum = terms.reduce((s, v) => s + v, 0);
      if (Math.abs(sum) > LIMIT) continue;
      if (n === 2 && terms[0] === terms[1]) continue;
      return terms;
    }
    return [randSigned(6), -randSigned(6)];
  }

  function genSub(t) {
    const max = clamp(Math.round(6 + 19 * t), 6, LIMIT);
    const pDouble = 0.08 + 0.45 * t;   // chance the second operand is negative
    for (let k = 0; k < 100; k++) {
      const a = randSigned(max);
      const b = (rng() < pDouble) ? -ri(1, Math.min(max, 20)) : randSigned(max);
      const res = a - b;
      if (Math.abs(res) > LIMIT) continue;
      if (a === b) continue;
      if (!(a < 0 || b < 0 || res < 0)) continue;   // must involve negatives
      if (a > 0 && b > 0 && res >= 0) continue;     // e.g. 8 − 3 is too plain
      return [a, b];
    }
    return [ri(2, 6), ri(7, 9)];                    // e.g. 3 − 8 = −5
  }

  function genMul(t) {
    const maxA = clamp(Math.round(3 + 6 * t), 3, 9);
    const cap = clamp(Math.round(9 + 16 * t), 9, LIMIT);   // limits the product
    for (let k = 0; k < 100; k++) {
      const A = ri(2, maxA);
      const maxB = Math.min(9, Math.floor(cap / A));
      if (maxB < 2) continue;
      const B = ri(2, maxB);
      const pattern = ri(1, 3);
      let a = A, b = B;
      if (pattern === 1) b = -b;
      else if (pattern === 2) a = -a;
      else { a = -a; b = -b; }
      return [a, b];
    }
    return [ri(2, 5), -ri(2, 5)];
  }

  function genDiv(t) {
    const maxB = clamp(Math.round(3 + 6 * t), 3, 9);
    const cap = clamp(Math.round(9 + 16 * t), 9, LIMIT);   // limits the dividend
    for (let k = 0; k < 100; k++) {
      const B = ri(2, maxB);
      const maxQ = Math.min(9, Math.floor(cap / B));
      if (maxQ < 2) continue;
      const Q = ri(2, maxQ);
      const A = B * Q;
      const pattern = ri(1, 3);
      let a = A, b = B;
      if (pattern === 1) b = -b;
      else if (pattern === 2) a = -a;
      else { a = -a; b = -b; }
      return [a, b];
    }
    return [12, -3];
  }

  /* ------------------------------------------------------------
     MISSING-NUMBER QUESTIONS
     ------------------------------------------------------------
     These show an equation with one value hidden, e.g.

          −5 + ? = 4            ? − 6 = −2
          7 × ? = −21           ? ÷ −3 = 4

     The pupil works out what belongs in the box.  Only used once
     the sheet has warmed up (t > 0.3).
     ------------------------------------------------------------ */
  function genMissing(op, t) {
    const max = clamp(Math.round(6 + 19 * t), 6, LIMIT);
    const cap = clamp(Math.round(9 + 16 * t), 9, LIMIT);
    const maxF = clamp(Math.round(3 + 6 * t), 3, 9);

    for (let k = 0; k < 160; k++) {
      if (op === 'add') {
        // a + BOX = c   or   BOX + b = c     (answer h = c − a)
        const a = randSigned(max);
        const h = randSigned(max);
        const c = a + h;
        if (Math.abs(c) > LIMIT) continue;
        if (!(a < 0 || h < 0 || c < 0)) continue;
        const html = rng() < 0.5
          ? num(a) + ' + ' + BOX + ' = ' + num(c)
          : BOX + ' + ' + num(a) + ' = ' + num(c);
        return { html, answer: h, mistakes: [c + a, a - c, -h, c] };
      }

      if (op === 'sub') {
        if (rng() < 0.5) {
          // a − BOX = c    →    h = a − c
          const a = randSigned(max);
          const h = randSigned(max);
          const c = a - h;
          if (Math.abs(c) > LIMIT) continue;
          if (!(a < 0 || h < 0 || c < 0)) continue;
          return {
            html: num(a) + ' ' + MINUS + ' ' + BOX + ' = ' + num(c),
            answer: h,
            mistakes: [a + c, c - a, -h]
          };
        }
        // BOX − b = c    →    h = c + b
        const b = randSigned(max);
        const h = randSigned(max);
        const c = h - b;
        if (Math.abs(c) > LIMIT) continue;
        if (!(b < 0 || h < 0 || c < 0)) continue;
        return {
          html: BOX + ' ' + MINUS + ' ' + num(b) + ' = ' + num(c),
          answer: h,
          mistakes: [c - b, b - c, -h]
        };
      }

      if (op === 'mul') {
        // A × BOX = c    →    h = c ÷ A
        const A = ri(2, maxF);
        const hMax = Math.min(9, Math.floor(cap / A));
        if (hMax < 2) continue;
        const h = randSigned(hMax);
        const c = A * h;
        if (Math.abs(c) > LIMIT) continue;
        const html = rng() < 0.5
          ? num(A) + ' \u00D7 ' + BOX + ' = ' + num(c)
          : BOX + ' \u00D7 ' + num(A) + ' = ' + num(c);
        return { html, answer: h, mistakes: [c * A, c + A, c - A, -h] };
      }

      if (op === 'div') {
        if (rng() < 0.5) {
          // a ÷ BOX = c    →    h = a ÷ c
          const h = randSigned(maxF);
          const cMax = Math.min(9, Math.floor(cap / Math.abs(h)));
          if (cMax < 2) continue;
          const c = randSigned(cMax);
          const a = c * h;
          if (Math.abs(a) > LIMIT) continue;
          if (!(a < 0 || h < 0 || c < 0)) continue;
          return {
            html: num(a) + ' \u00F7 ' + BOX + ' = ' + num(c),
            answer: h,
            mistakes: [a * c, a + c, -h, c]
          };
        }
        // BOX ÷ b = c    →    h = c × b
        const b = randSigned(maxF);
        const cMax = Math.min(9, Math.floor(cap / Math.abs(b)));
        if (cMax < 2) continue;
        const c = randSigned(cMax);
        const h = c * b;
        if (Math.abs(h) > LIMIT) continue;
        if (!(b < 0 || h < 0 || c < 0)) continue;
        return {
          html: BOX + ' \u00F7 ' + num(b) + ' = ' + num(c),
          answer: h,
          mistakes: [c + b, c - b, -h]
        };
      }
    }
    return null;
  }

  /* ============================================================
     EVALUATION & DISPLAY
     ------------------------------------------------------------
     No brackets around negative numbers — matching exam style:
       3 − −5     5 × −3     −15 ÷ 3
     ============================================================ */

  function evalExpr(op, o) {
    if (op === 'add')  return o[0] + o[1];
    if (op === 'add3') return o[0] + o[1] + o[2];
    if (op === 'sub')  return o[0] - o[1];
    if (op === 'mul')  return o[0] * o[1];
    if (op === 'div')  return o[0] / o[1];
  }

  function displayExpr(op, o) {
    if (op === 'add')  return num(o[0]) + ' + ' + num(o[1]);
    if (op === 'add3') return num(o[0]) + ' + ' + num(o[1]) + ' + ' + num(o[2]);
    if (op === 'sub')  return num(o[0]) + ' ' + MINUS + ' ' + num(o[1]);
    if (op === 'mul')  return num(o[0]) + ' \u00D7 ' + num(o[1]);
    if (op === 'div')  return num(o[0]) + ' \u00F7 ' + num(o[1]);
  }

  /* ============================================================
     DISTRACTORS
     ------------------------------------------------------------
     Candidates are the classic slips: sign errors, the wrong
     operation, reversed order, off-by-one slips and mixed-up
     times-table facts.  The sign-flipped answer is always offered
     (when it isn't zero), then two more are drawn from the pool.
     Anything outside ±25 is filtered out.
     ============================================================ */

  function candidatesFor(op, o, answer) {
    const out = [];
    const add = v => out.push(v);

    if (op === 'add') {
      const [a, b] = o;
      add(-answer);
      add(a - b);                       // subtracted instead of added
      add(b - a);                       // reversed
      add(Math.abs(a) + Math.abs(b));   // ignored the signs
      add(Math.abs(a) - Math.abs(b));
      add(Math.abs(b) - Math.abs(a));
      add(answer + 1); add(answer - 1);
      add(answer + 2); add(answer - 2);
    } else if (op === 'add3') {
      const [a, b, c] = o;
      add(-answer);
      add(a + b - c);                   // sign slip on the third term
      add(a - b + c);                   // sign slip on the middle term
      add(-a + b + c);                  // sign slip on the first term
      add(a - b - c);
      add(-a + b - c);
      add(-a - b + c);
      add(Math.abs(a) + Math.abs(b) + Math.abs(c));
      add(answer + 1); add(answer - 1);
    } else if (op === 'sub') {
      const [a, b] = o;
      add(-answer);
      add(a + b);                       // added instead of subtracted
      add(b - a);                       // reversed
      add(Math.abs(a) + Math.abs(b));
      add(Math.abs(a) - Math.abs(b));
      add(Math.abs(b) - Math.abs(a));
      add(answer + 1); add(answer - 1);
      add(answer + 2); add(answer - 2);
    } else if (op === 'mul') {
      const [a, b] = o;
      const A = Math.abs(a), B = Math.abs(b);
      const s = answer < 0 ? -1 : 1;
      add(-answer);                     // sign error
      add(a + b);                       // added instead
      add(-(a + b));
      add(s * (A + 1) * B);             // times-table slip
      add(s * (A - 1) * B);
      add(s * A * (B + 1));
      add(s * A * (B - 1));
      add(answer + 1); add(answer - 1);
    } else if (op === 'div') {
      const [a, b] = o;
      add(-answer);                     // sign error
      add(answer + 1);
      add(answer - 1);
      add(answer + 2);
      add(answer - 2);
      add(a + b);                       // added instead
      add(a - b);
      add(-(a + b));
    }
    return out;
  }

  /* Build four options from an answer plus a pool of mistakes. */
  function buildOptionsFrom(answer, candidates) {
    const chosen = [];
    const seen = new Set([answer]);

    const take = v => {
      if (!Number.isInteger(v)) return false;
      if (v === 0 || seen.has(v)) return false;
      if (Math.abs(v) > LIMIT) return false;
      seen.add(v);
      chosen.push(v);
      return true;
    };

    take(-answer);                       // guaranteed sign-flip distractor

    const pool = shuffle(candidates.slice());
    for (let i = 0; i < pool.length && chosen.length < 3; i++) take(pool[i]);

    let d = 1;
    while (chosen.length < 3 && d < 200) {
      take(answer + d);
      take(answer - d);
      d++;
    }

    return shuffle([
      { text: num(answer), ok: true },
      ...chosen.slice(0, 3).map(v => ({ text: num(v), ok: false }))
    ]);
  }

  /* ============================================================
     QUESTION BUILDING
     ============================================================ */

  function makeQuestion(op, t) {
    const tryMissing = t > 0.3 && rng() < 0.22;

    for (let att = 0; att < 60; att++) {
      if (tryMissing) {
        const m = genMissing(op, t);
        if (!m) continue;
        return {
          html: m.html,
          answer: m.answer,
          options: buildOptionsFrom(m.answer, m.mistakes),
          prompt: 'What number goes in the box?'
        };
      }

      let operands;
      if (op === 'add')      operands = genAdd(t);
      else if (op === 'sub') operands = genSub(t);
      else if (op === 'mul') operands = genMul(t);
      else if (op === 'div') operands = genDiv(t);
      else return null;

      if (!operands) continue;
      if (operands.some(v => !Number.isInteger(v) || Math.abs(v) > LIMIT)) continue;

      const qop = (op === 'add' && operands.length === 3) ? 'add3' : op;
      const answer = evalExpr(qop, operands);
      if (!Number.isInteger(answer) || Math.abs(answer) > LIMIT) continue;

      return {
        html: displayExpr(qop, operands),
        answer: answer,
        options: buildOptionsFrom(answer, candidatesFor(qop, operands, answer)),
        prompt: 'Work out the answer.'
      };
    }
    return null;
  }

  function buildQuestions(n, ops) {
    const opSeq = [];
    for (let i = 0; i < n; i++) opSeq.push(ops[i % ops.length]);

    const out = [];
    const seen = new Set();
    let guard = 0;

    while (out.length < n && guard < 3000) {
      guard++;
      const op = opSeq[out.length];
      const t = difficultyAt(out.length, n);
      let q = null;
      try { q = makeQuestion(op, t); }
      catch (err) { continue; }
      if (!q || seen.has(q.html)) continue;
      seen.add(q.html);
      out.push(q);
    }

    /* safety net — allow repeats rather than render too few questions */
    let g2 = 0;
    while (out.length < n && g2 < 400) {
      g2++;
      const op = opSeq[out.length];
      const t = difficultyAt(out.length, n);
      const q = makeQuestion(op, t);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     CELEBRATIONS (canvas confetti)
     ============================================================ */
  let confettiCanvas = null;
  let confettiCtx = null;
  let confettiParts = [];
  let confettiRaf = null;

  const CONFETTI_COLORS = [
    '#2563eb', '#16a34a', '#f59e0b', '#ef4444',
    '#8b5cf6', '#06b6d4', '#ec4899', '#facc15'
  ];

  function reducedMotion() {
    return window.matchMedia &&
           window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function initConfetti() {
    if (confettiCanvas) return;
    confettiCanvas = document.createElement('canvas');
    confettiCanvas.className = 'confetti-canvas';
    document.body.appendChild(confettiCanvas);
    confettiCtx = confettiCanvas.getContext('2d');
    sizeConfetti();
    window.addEventListener('resize', sizeConfetti);
  }

  function sizeConfetti() {
    if (!confettiCanvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCanvas.width  = Math.floor(window.innerWidth  * dpr);
    confettiCanvas.height = Math.floor(window.innerHeight * dpr);
    confettiCanvas.style.width  = window.innerWidth + 'px';
    confettiCanvas.style.height = window.innerHeight + 'px';
    confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function celebrate(x, y) {
    if (reducedMotion()) return;
    initConfetti();

    const count = 64;
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.7;
      const speed = 3 + Math.random() * 7;
      confettiParts.push({
        x: x, y: y,
        vx: Math.cos(ang) * speed + (Math.random() - 0.5) * 3,
        vy: Math.sin(ang) * speed - Math.random() * 2,
        w: 5 + Math.random() * 6,
        h: 6 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
        life: 55 + Math.random() * 55,
        age: 0,
        shape: Math.random() < 0.3 ? 'circle' : 'rect'
      });
    }
    if (!confettiRaf) confettiRaf = requestAnimationFrame(tickConfetti);
  }

  function tickConfetti() {
    const w = window.innerWidth, h = window.innerHeight;
    confettiCtx.clearRect(0, 0, w, h);

    for (let i = confettiParts.length - 1; i >= 0; i--) {
      const p = confettiParts[i];
      p.age++;
      p.vy += 0.24;
      p.vx *= 0.994;
      p.vy *= 0.994;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;

      const alpha = Math.max(0, 1 - p.age / p.life);
      confettiCtx.save();
      confettiCtx.globalAlpha = alpha;
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.fillStyle = p.color;
      if (p.shape === 'circle') {
        confettiCtx.beginPath();
        confettiCtx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        confettiCtx.fill();
      } else {
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      confettiCtx.restore();

      if (p.age >= p.life || p.y > h + 40) confettiParts.splice(i, 1);
    }

    if (confettiParts.length) {
      confettiRaf = requestAnimationFrame(tickConfetti);
    } else {
      confettiRaf = null;
      confettiCtx.clearRect(0, 0, w, h);
    }
  }

  /* ============================================================
     RENDER
     ============================================================ */
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + o.text + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.prompt + '</span>' +
      '</div>' +
      '<div class="sequence-wrap"><span class="sequence">' + q.html + '</span></div>' +
      '<div class="rule-row">' +
        '<span class="rule-label">Answer:</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);
    const ops = enabledOps();

    questions = buildQuestions(n, ops);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Negative Numbers</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Work out each answer. The questions get gradually harder as you go down the sheet, ' +
        'and all numbers stay within \u221225 to 25. ' +
        'Some questions ask you to find the number that belongs in the box. ' +
        'Drag the correct answer into the box \u2014 or simply tap/click an answer. ' +
        'Use the buttons at the top to choose which operations to practise. ' +
        '(Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50",
                  'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;
    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;
    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');
    if (cancelled) return;
    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;
    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;
    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;
    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
    const state = qState[qi];
    if (state) state.attempts++;
    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.innerHTML = q.options[idx].text;
      slot.classList.add('filled');
      slot.classList.remove('correct', 'just-correct');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);

      if (slot) {
        slot.classList.add('correct');
        // retrigger the pop animation
        void slot.offsetWidth;
        slot.classList.add('just-correct');
        setTimeout(() => slot.classList.remove('just-correct'), 600);
      }

      // 🎉 confetti burst from the answer
      const r = opt.getBoundingClientRect();
      celebrate(r.left + r.width / 2, r.top + r.height / 2);

      // score chip pulse
      const chip = document.getElementById('scoreTag');
      if (chip) {
        chip.classList.remove('pop');
        void chip.offsetWidth;
        chip.classList.add('pop');
      }
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) {
        slot.textContent = '?';
        slot.classList.remove('filled', 'correct', 'just-correct');
      }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const answersChk = document.getElementById('answersChk');

  const opButtons = Array.from(document.querySelectorAll('.op-toggle'));
  const OP_ORDER = ['add', 'sub', 'mul', 'div'];

  function enabledOps() {
    const ops = opButtons
      .filter(b => b.classList.contains('active'))
      .map(b => b.dataset.op);
    return ops.length ? ops : ['add'];
  }

  opButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const active = opButtons.filter(b => b.classList.contains('active'));
      /* never allow the last active operation to be switched off */
      if (btn.classList.contains('active') && active.length === 1) return;
      btn.classList.toggle('active');
      btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
      applySeed();
      render();
    });
  });

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  function randomSeed() {
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % 1000000000;
    }
    return Math.floor(
      ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0
    ) % 1000000000;
  }

  document.getElementById('shareBtn').addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seedInput.value);
    url.searchParams.set('ops', enabledOps().join(','));
    navigator.clipboard.writeText(url.toString()).then(
      () => {
        const b = document.getElementById('shareBtn');
        b.textContent = '✅ Link copied';
        setTimeout(() => { b.textContent = '🔗 Copy link to this sheet'; }, 1500);
      },
      () => window.prompt('Copy this link:', url.toString())
    );
  });

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = randomSeed();
    applySeed();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => { applySeed(); render(); });
  countSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const params = new URLSearchParams(window.location.search);

    /* restore operations from the link, if present */
    const opsParam = params.get('ops');
    if (opsParam) {
      const wanted = opsParam.split(',').filter(o => OP_ORDER.indexOf(o) !== -1);
      if (wanted.length) {
        opButtons.forEach(b => {
          const on = wanted.indexOf(b.dataset.op) !== -1;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }
    }

    /* restore (or invent) a seed */
    const seedParam = params.get('seed');
    const parsed = seedParam === null ? NaN : parseInt(seedParam, 10);
    seedInput.value = isNaN(parsed) ? randomSeed() : parsed;

    /* Remove the seed/ops parameters so a reload gives a fresh sheet. */
    if (seedParam !== null || opsParam !== null) {
      const u = new URL(window.location.href);
      u.searchParams.delete('seed');
      u.searchParams.delete('ops');
      window.history.replaceState({}, '', u);
    }

    applySeed();
    render();
  }

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
