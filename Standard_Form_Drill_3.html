<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Form — Add &amp; Subtract</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#cbd5e1;
    --line-soft:#e2e8f0;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#dbeafe;
    --page:#eef2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--page);
    font-size:17px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .katex{ font-size: 1em !important; }

  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:14px 22px;
    background:#0f172a; color:#f9fafb;
    box-shadow:0 2px 10px rgba(15,23,42,.25);
    font-size:15px;
  }
  .tb-title{font-weight:800; margin-right:auto; letter-spacing:.3px; font-size:16px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e2e8f0}
  .toolbar input[type=number]{
    width:130px; padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:9px 16px; border-radius:9px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit; font-weight:700; cursor:pointer;
  }
  .toolbar button:hover{background:#334155}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:var(--accent-dark)}
  .chk{cursor:pointer}
  .score-chip{
    padding:8px 14px; border-radius:999px;
    background:#1e293b; border:1px solid #334155;
    font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;
  }

  .sheet{
    background:#fff;
    max-width:1180px;
    margin:26px auto 60px;
    padding:34px 38px 46px;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
  }
  .sheet-head h1{margin:0; font-size:30px; letter-spacing:.4px; font-weight:800}
  .meta{margin-left:auto; display:flex; gap:20px; font-size:14px; color:#334155}
  .meta .line{display:inline-block; width:120px; border-bottom:1px solid #94a3b8}
  .meta .line.short{width:90px}
  .meta .line.tiny{width:55px}
  .instructions{margin:16px 0 20px; font-size:15.5px; color:var(--muted); line-height:1.5}

  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(480px, 1fr));
    gap:18px;
  }
  @media (max-width:1000px){ .questions{grid-template-columns:1fr} }

  .q{
    border:2px solid var(--line-soft);
    border-radius:14px;
    padding:14px 16px 16px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px}
  .q-num{
    flex:none;
    width:28px; height:28px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:16px; line-height:1.3; font-weight:700; color:#1e293b}

  .diagram{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:18px;
    min-height:120px;
    margin:6px 0 16px;
    padding:6px 2px;
    overflow-x:auto;
  }
  .lhs{ font-size: 32px; font-weight: 700; }
  .eq{ font-size: 32px; font-weight: 800; color: var(--muted); white-space: nowrap; }

  .drop-zone{border-radius:14px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:var(--accent-soft); transform:scale(1.05)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:170px; min-height:82px;
    padding:10px 20px;
    border:3px dashed #94a3b8;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:800; color:#94a3b8;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:auto;
    padding-top:14px;
    border-top:1px dashed var(--line-soft);
  }
  @media (max-width:560px){ .options{grid-template-columns:1fr} }

  .option{
    display:flex; align-items:center; gap:12px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:2px solid var(--line-soft);
    border-radius:12px;
    background:#f8fafc;
    padding:12px 14px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .option:hover{background:#f1f5f9}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 3px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 3px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    60%{transform:translateX(6px)}
    80%{transform:translateX(-4px)}
  }
  .opt-letter{
    flex:none;
    width:26px; height:26px; border-radius:50%;
    background:#e2e8f0; color:#475569;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:22px;
    display:flex; align-items:center; justify-content:center;
    min-height:40px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
  }

  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:12px 20px;
    border-radius:12px;
    background:#fff; border:2px solid var(--line-soft);
    box-shadow:0 12px 26px rgba(15,23,42,.30);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
    font-size:22px;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }

  .q-feedback{
    margin-top:10px; min-height:20px; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  .key{
    margin-top:30px;
    border-top:3px solid var(--ink);
    padding-top:14px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 12px; font-size:18px; letter-spacing:.5px; font-weight:800}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:8px 12px;
    font-size:15px;
    color:#334155;
  }
  .key-grid b{color:var(--ink); font-size:17px}

  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff; font-size:14px}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#94a3b8}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .lhs{font-size:22px}
    .eq{font-size:22px}
    .qmark{min-width:130px; min-height:58px; font-size:20px}
    .opt-visual{font-size:17px; min-height:32px}
    .opt-letter{width:22px; height:22px; font-size:11px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🔢 Standard Form — Add &amp; Subtract</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
      <option>12</option>
    </select>
  </label>
  <label>Operation
    <select id="opSelect">
      <option value="mixed" selected>Mixed</option>
      <option value="add">Addition only</option>
      <option value="sub">Subtraction only</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* ============================================================
     NUMBER REPRESENTATION AND STANDARD FORM

     A "term" is a pair (coefStr, exp) displayed as coefStr × 10^exp.
     Internally, we track it as (num, e) where the value is
     num × 10^e, so that addition and subtraction can be done with
     exact integer arithmetic.
     ============================================================ */

  /* Parse a coefficient string like "5", "2.3", "0.9" into
     { num, scale } where the value is num / 10^scale. */
  function parseDecimal(s) {
    const neg = s.startsWith('-');
    const abs = neg ? s.slice(1) : s;
    const parts = abs.split('.');
    let num, scale;
    if (parts.length === 1) {
      num = parseInt(abs, 10);
      scale = 0;
    } else {
      num = parseInt(parts[0] + parts[1], 10);
      scale = parts[1].length;
    }
    return { num: neg ? -num : num, scale: scale };
  }

  /* Parse a displayed term into { num, exp } so that the value is
     num × 10^exp.  E.g.  "2.3" at exp 3  →  { num: 23, exp: 2 } */
  function parseTerm(coefStr, exp) {
    const d = parseDecimal(coefStr);
    return { num: d.num, exp: exp - d.scale };
  }

  /* Combine two terms with a given sign (1 = add, -1 = subtract).
     Returns { num, exp } with the value num × 10^exp. */
  function combineTerms(t1, t2, sign) {
    const minExp = Math.min(t1.exp, t2.exp);
    const c1 = t1.num * Math.pow(10, t1.exp - minExp);
    const c2 = t2.num * Math.pow(10, t2.exp - minExp);
    return { num: c1 + sign * c2, exp: minExp };
  }

  /* Convert { num, exp } to standard form { A, n } where the value
     is A × 10^n with 1 ≤ |A| < 10, as a string coefficient. */
  function toStandardForm(num, exp) {
    if (num === 0) return null;
    const neg = num < 0;
    const abs = Math.abs(num);
    const digits = String(abs);
    let trimmed = digits;
    while (trimmed.length > 1 && trimmed.endsWith('0')) {
      trimmed = trimmed.slice(0, -1);
    }
    const newExp = exp + (digits.length - 1);
    let A;
    if (trimmed.length === 1) {
      A = trimmed;
    } else {
      A = trimmed[0] + '.' + trimmed.slice(1);
    }
    if (neg) A = '-' + A;
    return { A, n: newExp };
  }

  /* LaTeX for A × 10^n. */
  function sfLatex(A, n) {
    return A + ' \\times 10^{' + n + '}';
  }

  function sfKey(sf) {
    return sf.A + '|' + sf.n;
  }

  /* ============================================================
     DIFFICULTY MODEL

     The difficulty of a question is driven by two things:
       - the exponent difference between the two terms ("diff"),
         which determines how much compensation is needed
       - the coefficient complexity

     The first few questions use diff = 0 (same index).  Then the
     difference ramps up through 1 and 2, reaching 3 at the end.
     Coefficient complexity also increases with position, from
     single digits early on to decimals and 2-digit integers later.
     ============================================================ */

  /* Choose the exponent difference for this question. */
  function chooseDiff(pos) {
    /* First question: always same index. */
    if (pos < 0.15) return 0;
    /* Second and third: mostly same index. */
    if (pos < 0.25) return rng() < 0.85 ? 0 : 1;

    /* After that, a smooth ramp towards 3. */
    const target = Math.max(0, (pos - 0.2) * 3.75);
    const sigma = 0.7;
    const diffs = [0, 1, 2, 3];
    const weights = diffs.map(d =>
      Math.exp(-0.5 * Math.pow((d - target) / sigma, 2))
    );
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < diffs.length; i++) {
      r -= weights[i];
      if (r <= 0) return diffs[i];
    }
    return 3;
  }

  /* Choose a coefficient for this question. */
  function chooseCoef(pos) {
    const r = rng();
    if (pos < 0.35) {
      /* Single digit only. */
      return String(ri(1, 9));
    }
    if (pos < 0.65) {
      /* Single digit, or X.Y decimal. */
      if (r < 0.6) return String(ri(1, 9));
      return ri(1, 9) + '.' + ri(1, 9);
    }
    /* Later: mix of decimals, 2-digit integers, and rare 0.X. */
    if (r < 0.1) return '0.' + ri(1, 9);
    if (r < 0.65) return ri(1, 9) + '.' + ri(1, 9);
    let n;
    do { n = ri(11, 99); } while (n % 10 === 0);
    return String(n);
  }

  /* ============================================================
     DISTRACTOR POOL
     ============================================================ */
  function buildDistractors(coef1, exp1, coef2, exp2, opSign, correctSF) {
    const pool = [];
    const seen = new Set([sfKey(correctSF)]);
    const add = (sf) => {
      if (!sf) return;
      if (sf.A === '0' || sf.A === '') return;
      const key = sfKey(sf);
      if (seen.has(key)) return;
      seen.add(key);
      pool.push(sf);
    };

    /* 1. Exponent off by one (either way). */
    add({ A: correctSF.A, n: correctSF.n + 1 });
    add({ A: correctSF.A, n: correctSF.n - 1 });

    /* 2. Sign flip on the exponent. */
    if (correctSF.n !== 0) {
      add({ A: correctSF.A, n: -correctSF.n });
    }

    /* 3. Sign flip on the operation. */
    const t1 = parseTerm(coef1, exp1);
    const t2 = parseTerm(coef2, exp2);
    const altResult = combineTerms(t1, t2, -opSign);
    if (altResult.num > 0) {
      add(toStandardForm(altResult.num, altResult.exp));
    }

    /* 4. Naive: subtract coefficients without aligning exponents.
       (For diff = 0 this gives the same answer, and is skipped.) */
    const aD = parseDecimal(coef1);
    const bD = parseDecimal(coef2);
    const commonScale = Math.max(aD.scale, bD.scale);
    const aAdj = aD.num * Math.pow(10, commonScale - aD.scale);
    const bAdj = bD.num * Math.pow(10, commonScale - bD.scale);
    const naiveNum = aAdj + opSign * bAdj;
    if (naiveNum > 0) {
      add(toStandardForm(naiveNum, exp1 - commonScale));
    }

    return pool;
  }

  /* ============================================================
     QUESTION GENERATOR
     ============================================================ */
  function generateQuestion(pos, opFilter) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const diff = chooseDiff(pos);

      /* Decide the operation. */
      let opSign;
      if (opFilter === 'add') opSign = 1;
      else if (opFilter === 'sub') opSign = -1;
      else opSign = rng() < 0.5 ? 1 : -1;
      const signStr = opSign > 0 ? '+' : '-';

      /* Choose exponents. */
      const exp1 = ri(-3, 7);
      const exp2 = exp1 - diff;

      /* Choose coefficients. */
      const coef1 = chooseCoef(pos);
      const coef2 = chooseCoef(pos);

      /* Compute the correct answer. */
      const t1 = parseTerm(coef1, exp1);
      const t2 = parseTerm(coef2, exp2);
      const result = combineTerms(t1, t2, opSign);
      if (result.num <= 0) continue;

      const correctSF = toStandardForm(result.num, result.exp);
      if (!correctSF) continue;

      /* Limit to at most 4 significant figures in the answer. */
      const sigFigs = correctSF.A.replace('-', '').replace('.', '').length;
      if (sigFigs > 4) continue;

      /* Build the distractor pool. */
      const pool = buildDistractors(coef1, exp1, coef2, exp2, opSign, correctSF);
      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);
      const opts = shuffle([
        { latex: sfLatex(correctSF.A, correctSF.n), ok: true },
        ...distractors.map(d => ({ latex: sfLatex(d.A, d.n), ok: false }))
      ]);

      const sig = 'SF|' + coef1 + '|' + exp1 + '|' + signStr + '|' +
                  coef2 + '|' + exp2;

      return {
        sig,
        prompt: 'Work out without a calculator. Give your answer in standard form.',
        lhs: tex(coef1 + ' \\times 10^{' + exp1 + '} ' + signStr + ' ' +
                 coef2 + ' \\times 10^{' + exp2 + '}'),
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS
     ============================================================ */
  function buildQuestions(n, opFilter) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 8000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      let q = null;
      try {
        q = generateQuestion(pos, opFilter);
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow repeats rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = generateQuestion(pos, opFilter);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
                '<span class="opt-visual">' + tex(o.latex) + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.prompt + '</span>' +
      '</div>' +
      '<div class="diagram">' +
        '<span class="lhs">' + q.lhs + '</span>' +
        '<span class="eq">' + q.eq + '</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);
    const opFilter = document.getElementById('opSelect').value;

    questions = buildQuestions(n, opFilter);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Standard Form — Add &amp; Subtract</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Work out each calculation <b>without a calculator</b>. ' +
        'Give your answer in standard form. ' +
        'Drag the correct answer into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.innerHTML = tex(q.options[idx].latex);
      slot.classList.add('filled');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const opSel      = document.getElementById('opSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  function dateSeed() {
    const d = new Date();
    return parseInt(
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') +
      String(d.getSeconds()).padStart(2, '0'),
      10
    );
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  opSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
