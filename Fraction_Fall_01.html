<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fraction Fall — Equivalent Fractions Game</title>
<style>
  :root {
    --ink: #0f172a;
    --ink-2: #334155;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --good: #10b981;
    --bad: #ef4444;
    --bg-1: #eef2ff;
    --bg-2: #f8fafc;
    --tile: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  .app {
    max-width: 660px;
    margin: 0 auto;
    padding: 12px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hud { display: flex; flex-direction: column; gap: 10px; }
  .hud-top { display: flex; align-items: center; gap: 10px; }

  .title {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hud-btns { margin-left: auto; display: flex; gap: 6px; }

  .icon-btn {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .icon-btn:hover { background: #f8fafc; }
  .icon-btn:active { transform: translateY(1px); }

  .hud-stats {
    display: grid;
    grid-template-columns:
      minmax(0, 1.4fr) minmax(0, 1.4fr) minmax(0, 1fr) auto;
    gap: 8px;
  }

  .stat {
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 6px 10px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }

  .stat-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1;
    margin-bottom: 3px;
  }

  .stat-value {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
    min-width: 0;
  }
  .stat-value.flash { animation: statFlash .45s ease; }
  @keyframes statFlash {
    0% { color: var(--ink); }
    40% { color: var(--good); transform: scale(1.06); }
    100% { color: var(--ink); transform: scale(1); }
  }

  .next-stat {
    padding: 4px 8px;
    align-items: center;
  }
  .next-tile {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .board-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 0;
    position: relative;
  }

  .board {
    position: relative;
    background: #fbfcfe;
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 1.5px var(--line),
      0 10px 30px -12px rgba(15, 23, 42, 0.18);
    overflow: hidden;
    background-image:
      linear-gradient(to right, rgba(226, 232, 240, 0.55) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(226, 232, 240, 0.55) 1px, transparent 1px);
    background-size: var(--tile) var(--tile);
    transition: box-shadow .25s ease;
  }
  .board.danger {
    box-shadow:
      inset 0 0 0 1.5px var(--bad),
      0 10px 30px -12px rgba(239, 68, 68, 0.35);
  }
  .board.chain-shake { animation: chainShake .45s ease; }
  @keyframes chainShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-4px, 3px); }
    45% { transform: translate(4px, -3px); }
    70% { transform: translate(-3px, 2px); }
    90% { transform: translate(3px, -1px); }
  }

  .placed-layer, .effects {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .falling, .ghost {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--tile);
    height: var(--tile);
    padding: 2px;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    width: var(--tile);
    height: var(--tile);
    padding: 2px;
    will-change: transform;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    background: #fff;
    border: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Fraction typography.
     The linear form 0.5*T - 7px is the largest size that fits in the
     tile's interior without clipping the numerator or denominator at
     any tile size. The clamp keeps it readable on very small phones
     (min 10px) and prevents it from growing past 26px on big screens
     where two-digit fractions would look cartoonishly large.          */
  .frac {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    color: var(--ink);
    font-weight: 700;
    font-size: clamp(10px, calc(var(--tile) * 0.5 - 7px), 26px);
    letter-spacing: -0.02em;
  }
  .frac .bar {
    width: 78%;
    height: 2px;
    background: currentColor;
    border-radius: 1px;
    margin: 1px 0;
  }

  .next-tile .frac { font-size: clamp(8px, calc(var(--tile) * 0.3), 14px); }

  .falling .tile-inner {
    border-color: var(--accent);
    box-shadow:
      0 0 0 3px rgba(99, 102, 241, 0.18),
      0 8px 24px rgba(99, 102, 241, 0.35);
  }

  .ghost .tile-inner {
    border: 2px dashed rgba(100, 116, 139, 0.5);
    background: rgba(255, 255, 255, 0.55);
    box-shadow: none;
  }
  .ghost .frac { color: rgba(100, 116, 139, 0.55); }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1.4); opacity: 0; }
  }
  .popping {
    animation: pop 0.42s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  .popping .tile-inner {
    border-color: var(--good);
    background: #ecfdf5;
  }

  /* ---------- cascade drops & landings ---------- */
  .tile.dropping .tile-inner {
    animation: dropStretch var(--drop-dur, 260ms) cubic-bezier(.4, 0, .7, 1) both;
    box-shadow: 0 10px 20px rgba(99, 102, 241, .16);
  }
  @keyframes dropStretch {
    0%   { transform: scale(1, 1); }
    35%  { transform: scale(.97, 1.07); }
    100% { transform: scale(1, 1.06); }
  }

  .tile.landed .tile-inner {
    transform-origin: 50% 100%;
    animation: landJolt .36s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes landJolt {
    0%   { transform: scale(1, 1.06); border-color: rgba(99, 102, 241, .85); }
    20%  { transform: scale(1.15, .76); }
    46%  { transform: scale(.93, 1.09); }
    68%  { transform: scale(1.04, .97); }
    85%  { transform: scale(.99, 1.01); }
    100% { transform: scale(1, 1); border-color: var(--ink); }
  }

  .placed-layer.impact { animation: layerJolt .26s cubic-bezier(.2, .8, .3, 1); }
  @keyframes layerJolt {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(3px); }
    60%      { transform: translateY(-1.5px); }
    80%      { transform: translateY(.5px); }
  }

  .impact-ring {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(99, 102, 241, .55);
    transform: translate(-50%, -50%) scale(.3);
    pointer-events: none;
  }
  .dust {
    position: absolute;
    border-radius: 50%;
    background: rgba(100, 116, 139, .5);
    pointer-events: none;
  }

  @keyframes gainFloat {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    75% { opacity: 1; transform: translate(-50%, -160%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
  }
  .gain {
    position: absolute;
    pointer-events: none;
    color: var(--good);
    font-weight: 800;
    font-size: calc(var(--tile) * 0.32);
    text-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    animation: gainFloat 1.1s ease-out forwards;
    white-space: nowrap;
    text-align: center;
  }

  .gain.chain {
    color: #f59e0b;
    font-size: calc(var(--tile) * 0.42);
    text-shadow: 0 2px 14px rgba(245, 158, 11, 0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    animation: gainFloat 1.5s ease-out forwards;
  }
  .gain.chain .chain-label {
    font-size: calc(var(--tile) * 0.22);
    color: #fbbf24;
    letter-spacing: 0.18em;
    font-weight: 900;
    text-shadow: 0 0 14px rgba(251, 191, 36, 0.9);
    line-height: 1;
  }
  .gain.chain .chain-amount {
    font-size: calc(var(--tile) * 0.42);
    color: #ea580c;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .confetti {
    position: absolute;
    border-radius: 2px;
    pointer-events: none;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 2px 0 4px;
  }

  .ctrl-btn {
    width: 68px;
    height: 56px;
    border-radius: 16px;
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
    transition: transform 0.06s, box-shadow 0.06s, background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    padding: 0;
  }
  .ctrl-btn:hover { background: #f8fafc; }
  .ctrl-btn.active, .ctrl-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 var(--line);
    background: #eef2ff;
    border-color: var(--accent);
    color: var(--accent);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }

  .overlay-card {
    background: #fff;
    border-radius: 20px;
    padding: 26px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.5);
    animation: cardIn .25s cubic-bezier(.2,.8,.3,1.1);
  }
  @keyframes cardIn {
    0% { transform: scale(.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .overlay-title {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 8px;
    color: var(--ink);
  }
  .overlay-msg {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .overlay-score {
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    margin: 8px 0 20px;
    font-variant-numeric: tabular-nums;
  }
  .overlay-btn {
    padding: 12px 24px;
    border-radius: 12px;
    border: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 16px -6px var(--accent);
  }
  .overlay-btn:hover { filter: brightness(1.05); }
  .overlay-btn:active { transform: translateY(1px); }

  @media (max-width: 480px) {
    .app { padding: 8px; gap: 8px; }
    .title { font-size: 19px; }
    .stat-value { font-size: 15px; }
    .stat { padding: 5px 8px; }
    .ctrl-btn { width: 60px; height: 50px; border-radius: 14px; }
  }

  @media (max-height: 600px) {
    .hud-stats { gap: 6px; }
    .stat { padding: 4px 8px; }
    .stat-value { font-size: 15px; }
    .next-tile { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="hud-top">
      <h1 class="title">Fraction Fall</h1>
      <div class="hud-btns">
        <button class="icon-btn" id="btnPause" aria-label="Pause">❚❚</button>
      </div>
    </div>
    <div class="hud-stats">
      <div class="stat">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
      <div class="stat next-stat">
        <div class="stat-label">Next</div>
        <div class="next-tile" id="next"></div>
      </div>
    </div>
  </header>

  <main class="board-wrap">
    <div class="board" id="board">
      <div class="placed-layer" id="placedLayer"></div>
      <div class="ghost" id="ghost"></div>
      <div class="falling" id="falling"></div>
      <div class="effects" id="effects"></div>
    </div>
  </main>

  <footer class="controls">
    <button class="ctrl-btn" id="btnLeft" aria-label="Move left">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctrl-btn" id="btnDown" aria-label="Drop faster">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctrl-btn" id="btnRight" aria-label="Move right">
      <svg viewBox="0 0 24 24" width="30" height="30"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>

  <div class="overlay" id="overlay" hidden></div>
</div>

<script>
(function () {
  'use strict';

  const COLS = 8;
  const ROWS = 10;
  const BASE_FALL = 1.0;
  const FALL_PER_LEVEL = 0.18;
  const LATERAL_SPEED = 6.5;
  const SOFT_DROP_MULT = 8;
  const MATCHES_PER_LEVEL = 10;
  const SPAWN_HOLD = 0.15;

  const SPAWN_MATCH_PROB = 0.6;
  const MAX_UNMATCHED_STREAK = 3;
  const OVERLAP_TOL = 0.20;

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = b; b = a % b; a = t; }
    return a || 1;
  }
  function reduce(n, d) {
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function fracEq(a, b) { return a.n * b.d === b.n * a.d; }
  function fracAdd(a, b) {
    return reduce(a.n * b.d + b.n * a.d, a.d * b.d);
  }
  function fracCmp(a, b) { return a.n * b.d - b.n * a.d; }
  function fracDisplay(f) {
    const r = reduce(f.n, f.d);
    if (r.d === 1) return String(r.n);
    if (r.n < r.d) return r.n + '/' + r.d;
    const w = Math.floor(r.n / r.d);
    const rem = r.n % r.d;
    return w + ' ' + rem + '/' + r.d;
  }

  function buildClasses() {
    const map = new Map();
    for (let d = 2; d <= 12; d++) {
      for (let n = 1; n < d; n++) {
        const r = reduce(n, d);
        const k = r.n + '/' + r.d;
        if (!map.has(k)) map.set(k, []);
        map.get(k).push({ n, d });
      }
    }
    return Array.from(map.values()).filter(a => a.length >= 2);
  }
  const CLASSES = buildClasses();
  const CLASS_BY_KEY = new Map();
  for (const cls of CLASSES) {
    const r = reduce(cls[0].n, cls[0].d);
    CLASS_BY_KEY.set(r.n + '/' + r.d, cls);
  }
  function classOf(f) {
    const r = reduce(f.n, f.d);
    return CLASS_BY_KEY.get(r.n + '/' + r.d) || [f];
  }
  function randomFraction() {
    const cls = CLASSES[Math.floor(Math.random() * CLASSES.length)];
    return cls[Math.floor(Math.random() * cls.length)];
  }

  const boardEl     = document.getElementById('board');
  const placedEl    = document.getElementById('placedLayer');
  const ghostEl     = document.getElementById('ghost');
  const fallingEl   = document.getElementById('falling');
  const effectsEl   = document.getElementById('effects');

  const placedEls = new Map();
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  let impactTimer = 0;
  let lastImpactAt = 0;

  const scoreEl     = document.getElementById('score');
  const bestEl      = document.getElementById('best');
  const levelEl     = document.getElementById('level');
  const nextEl      = document.getElementById('next');
  const overlayEl   = document.getElementById('overlay');
  const pauseBtn    = document.getElementById('btnPause');
  const btnLeft     = document.getElementById('btnLeft');
  const btnRight    = document.getElementById('btnRight');
  const btnDown     = document.getElementById('btnDown');

  const state = {
    board: [],
    heights: [],
    falling: null,
    next: null,
    score: { n: 0, d: 1 },
    matches: 0,
    level: 1,
    best: { n: 0, d: 1 },
    paused: false,
    over: false,
    keys: { left: false, right: false, down: false },
    lastT: 0,
    tileSize: 56,
    started: false,
    unmatchedStreak: 0,
    nextTileId: 1,
  };

  let audioCtx = null;
  let soundOn = true;
  try { soundOn = localStorage.getItem('fractionFall.sound') !== '0'; } catch (e) {}

  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }
  function beep(freq, dur, type) {
    if (!soundOn) return;
    const ctx = getCtx();
    if (!ctx) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function playMatchSound(chain) {
    if (chain <= 1) {
      beep(523.25, 0.14);
      setTimeout(function () { beep(659.25, 0.14); }, 70);
      setTimeout(function () { beep(783.99, 0.24); }, 140);
    } else if (chain === 2) {
      beep(1046.5, 0.1);
      setTimeout(function () { beep(1318.5, 0.1); }, 60);
      setTimeout(function () { beep(1567.98, 0.1); }, 120);
      setTimeout(function () { beep(2093.0, 0.3); }, 180);
    } else {
      beep(1318.5, 0.1);
      setTimeout(function () { beep(1567.98, 0.1); }, 50);
      setTimeout(function () { beep(2093.0, 0.1); }, 100);
      setTimeout(function () { beep(2637.0, 0.4); }, 150);
    }
  }
  function playLand() { beep(180, 0.07, 'triangle'); }
  function playImpact(dropRows) {
    if (!soundOn || reduceMotion) return;
    const now = performance.now();
    if (now - lastImpactAt < 90) return;
    lastImpactAt = now;
    const freq = Math.max(90, 165 - dropRows * 10);
    beep(freq, 0.06, 'triangle');
  }
  function playLevelUp() {
    beep(659.25, 0.1);
    setTimeout(function () { beep(783.99, 0.1); }, 80);
    setTimeout(function () { beep(1046.5, 0.2); }, 160);
  }

  function tileInner(f) {
    const wrap = document.createElement('div');
    wrap.className = 'tile-inner';
    const frac = document.createElement('div');
    frac.className = 'frac';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(f.n);
    const bar = document.createElement('span');
    bar.className = 'bar';
    const den = document.createElement('span');
    den.className = 'den';
    den.textContent = String(f.d);
    frac.appendChild(num);
    frac.appendChild(bar);
    frac.appendChild(den);
    wrap.appendChild(frac);
    return wrap;
  }
  function makeTileEl(f) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.appendChild(tileInner(f));
    return t;
  }

  function computeTileSize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const padX = 24;
    const reservedY = 250;
    const availW = Math.min(vw - padX * 2, 640);
    const availH = vh - reservedY;
    const tw = (availW - 8) / COLS;
    const th = (availH - 8) / ROWS;
    return Math.max(28, Math.min(Math.floor(Math.min(tw, th)), 66));
  }

  function layout() {
    state.tileSize = computeTileSize();
    const T = state.tileSize;
    boardEl.style.width = (T * COLS) + 'px';
    boardEl.style.height = (T * ROWS) + 'px';
    boardEl.style.setProperty('--tile', T + 'px');
    document.documentElement.style.setProperty('--tile', T + 'px');
    renderPlaced();
    positionFalling();
  }

  /* Seed the initial row so that no two adjacent tiles are equivalent.
     Previously the row was random, and with ~11 equivalence classes
     spread over 7 adjacent pairs, the starting board very often
     contained a matching pair. Those pairs would lie dormant until the
     player's first cascade triggered getHorizontalCells(), at which
     point they'd vanish "unexpectedly". Avoiding them at seed time
     means every horizontal match the player sees is one they caused. */
  function initBoard() {
    state.board = [];
    state.heights = [];
    for (let c = 0; c < COLS; c++) {
      state.board.push(new Array(ROWS).fill(null));
      state.heights.push(0);
    }
    for (let c = 0; c < COLS; c++) {
      let f;
      for (let attempt = 0; attempt < 100; attempt++) {
        f = randomFraction();
        if (c === 0) break;
        if (!fracEq(state.board[c - 1][ROWS - 1], f)) break;
      }
      state.board[c][ROWS - 1] = { id: state.nextTileId++, n: f.n, d: f.d };
      state.heights[c] = 1;
    }
  }

  function renderPlaced(animateDrops) {
    const T = state.tileSize;
    const live = new Set();
    let maxDropRows = 0;
    let maxDropDur = 0;

    if (!animateDrops) {
      clearTimeout(impactTimer);
      impactTimer = 0;
      placedEl.classList.remove('impact');
      placedEls.forEach(function (t) {
        if (t._dropAnim) { try { t._dropAnim.cancel(); } catch (e) {} t._dropAnim = null; }
        if (t._landTimer) { clearTimeout(t._landTimer); t._landTimer = 0; }
        t.classList.remove('dropping');
      });
    }

    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const f = state.board[c][r];
        if (!f) continue;
        live.add(f.id);

        const left = c * T;
        const top = r * T;
        let t = placedEls.get(f.id);

        if (!t) {
          t = makeTileEl(f);
          t.style.left = left + 'px';
          t.style.top = top + 'px';
          placedEl.appendChild(t);
          placedEls.set(f.id, t);
          continue;
        }

        const oldLeft = parseFloat(t.style.left) || 0;
        const oldTop = parseFloat(t.style.top) || 0;
        if (oldLeft === left && oldTop === top) continue;

        if (t._dropAnim) { try { t._dropAnim.cancel(); } catch (e) {} t._dropAnim = null; }
        if (t._landTimer) { clearTimeout(t._landTimer); t._landTimer = 0; }
        if (t._landedTimer) { clearTimeout(t._landedTimer); t._landedTimer = 0; }
        t.classList.remove('dropping');
        t.classList.remove('landed');

        const dropPx = Math.max(0, top - oldTop);
        const dropRows = dropPx / T;

        t.style.left = left + 'px';
        t.style.top = top + 'px';

        if (!animateDrops || reduceMotion || dropPx < 1) continue;

        const dur = dropDuration(dropRows);
        t.style.setProperty('--drop-dur', dur + 'ms');
        t.classList.add('dropping');

        const anim = t.animate([
          { transform: 'translateY(' + (-dropPx) + 'px)' },
          { transform: 'translateY(0)' }
        ], {
          duration: dur,
          easing: 'cubic-bezier(.4, .02, .7, 1)',
          fill: 'both'
        });
        t._dropAnim = anim;

        const finalCol = c;
        const finalRow = r;
        const land = function () { landTile(t, finalCol, finalRow, dropRows); };
        t._landTimer = setTimeout(land, dur + 60);
        anim.onfinish = function () {
          if (t._dropAnim !== anim) return;
          t._dropAnim = null;
          land();
        };

        if (dropRows > maxDropRows) {
          maxDropRows = dropRows;
          maxDropDur = dur;
        }
      }
    }

    placedEls.forEach(function (t, id) {
      if (live.has(id)) return;
      if (t._dropAnim) { try { t._dropAnim.cancel(); } catch (e) {} }
      if (t._landTimer) clearTimeout(t._landTimer);
      if (t._landedTimer) clearTimeout(t._landedTimer);
      t.remove();
      placedEls.delete(id);
    });

    if (animateDrops && !reduceMotion && maxDropRows >= 2) {
      clearTimeout(impactTimer);
      impactTimer = setTimeout(function () {
        impactTimer = 0;
        placedEl.classList.remove('impact');
        void placedEl.offsetWidth;
        placedEl.classList.add('impact');
        setTimeout(function () { placedEl.classList.remove('impact'); }, 300);
      }, maxDropDur);
    }

    updateDangerState();
  }

  function dropDuration(dropRows) {
    return Math.round(150 + Math.sqrt(Math.max(1, dropRows)) * 95);
  }

  function landTile(t, c, r, dropRows) {
    if (!t.parentNode) return;
    if (t._landTimer) { clearTimeout(t._landTimer); t._landTimer = 0; }
    if (t._dropAnim) {
      try { t._dropAnim.cancel(); } catch (e) {}
      t._dropAnim = null;
    }
    t.classList.remove('dropping');
    t.classList.remove('landed');
    void t.offsetWidth;
    t.classList.add('landed');
    if (t._landedTimer) clearTimeout(t._landedTimer);
    t._landedTimer = setTimeout(function () { t.classList.remove('landed'); }, 420);

    const T = state.tileSize;
    dustPuff(c * T + T / 2, r * T + T - 3, dropRows);
    playImpact(dropRows);
  }

  function dustPuff(cx, cy, strength) {
    if (reduceMotion) return;

    const ring = document.createElement('div');
    ring.className = 'impact-ring';
    ring.style.left = cx + 'px';
    ring.style.top = cy + 'px';
    effectsEl.appendChild(ring);
    const ringAnim = ring.animate([
      { opacity: .8, transform: 'translate(-50%, -50%) scale(.3)' },
      { opacity: 0, transform: 'translate(-50%, -50%) scale(2.2)' }
    ], { duration: 520, easing: 'ease-out', fill: 'forwards' });
    ringAnim.onfinish = function () { ring.remove(); };
    setTimeout(function () { ring.remove(); }, 800);

    const count = Math.min(9, 3 + Math.round(strength * 2));
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'dust';
      const size = 2 + Math.random() * 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      effectsEl.appendChild(p);

      const angle = Math.PI + Math.random() * Math.PI;
      const dist = 8 + Math.random() * 20;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      const dustAnim = p.animate([
        { opacity: .62, transform: 'translate(-50%, -50%) scale(1)' },
        { opacity: 0, transform: 'translate(-50%, -50%) translate(' + dx + 'px,' + dy + 'px) scale(.2)' }
      ], {
        duration: 380 + Math.random() * 260,
        easing: 'cubic-bezier(.2, .6, .3, 1)',
        fill: 'forwards'
      });
      dustAnim.onfinish = function () { p.remove(); };
    }
  }

  function updateDangerState() {
    const danger = state.heights.some(function (h) { return h >= ROWS - 1; });
    boardEl.classList.toggle('danger', danger);
  }

  function colAt(x) {
    const T = state.tileSize;
    return Math.max(0, Math.min(COLS - 1, Math.floor((x + T / 2) / T)));
  }

  function overlapWith(x, j) {
    const T = state.tileSize;
    const jL = j * T;
    const jR = (j + 1) * T;
    return Math.max(0, Math.min(x + T, jR) - Math.max(x, jL));
  }

  function canMoveTo(newX) {
    const f = state.falling;
    if (!f) return true;
    const T = state.tileSize;
    const tol = T * OVERLAP_TOL;
    for (let j = 0; j < COLS; j++) {
      if (state.heights[j] === 0) continue;
      const stackTop = (ROWS - state.heights[j]) * T;
      if (f.y + T <= stackTop) continue;
      const newO = overlapWith(newX, j);
      if (newO <= tol) continue;
      const curO = overlapWith(f.x, j);
      if (newO > curO + 0.001) return false;
    }
    return true;
  }

  function computeLandingCol(x) {
    const T = state.tileSize;
    const tol = T * OVERLAP_TOL;
    const cx = x + T / 2;
    let bestCol = colAt(x);
    let bestH = state.heights[bestCol];
    let bestDist = Math.abs((bestCol + 0.5) * T - cx);
    for (let j = 0; j < COLS; j++) {
      if (overlapWith(x, j) <= tol) continue;
      const h = state.heights[j];
      const dist = Math.abs((j + 0.5) * T - cx);
      if (h > bestH || (h === bestH && dist < bestDist)) {
        bestH = h;
        bestCol = j;
        bestDist = dist;
      }
    }
    return bestCol;
  }

  function computeLandingY(x) {
    const T = state.tileSize;
    const col = computeLandingCol(x);
    return (ROWS - state.heights[col] - 1) * T;
  }

  function topFractions() {
    const out = [];
    for (let c = 0; c < COLS; c++) {
      const h = state.heights[c];
      if (h > 0) {
        const f = state.board[c][ROWS - h];
        if (f) out.push(f);
      }
    }
    return out;
  }

  function generateNextFraction() {
    const tops = topFractions();
    const forceMatch = state.unmatchedStreak >= MAX_UNMATCHED_STREAK;
    const wantMatch = forceMatch || Math.random() < SPAWN_MATCH_PROB;

    let f;
    if (wantMatch && tops.length > 0) {
      const matching = [];
      const nonIdentical = [];
      for (const t of tops) {
        for (const cand of classOf(t)) {
          matching.push(cand);
          if (cand.n !== t.n || cand.d !== t.d) nonIdentical.push(cand);
        }
      }
      const pool = nonIdentical.length > 0 ? nonIdentical : matching;
      f = pool[Math.floor(Math.random() * pool.length)];
    } else {
      const nonMatching = [];
      for (const cls of CLASSES) {
        for (const cand of cls) {
          let matches = false;
          for (const t of tops) {
            if (fracEq(t, cand)) { matches = true; break; }
          }
          if (!matches) nonMatching.push(cand);
        }
      }
      f = nonMatching.length > 0
        ? nonMatching[Math.floor(Math.random() * nonMatching.length)]
        : randomFraction();
    }

    let hits = false;
    for (const t of tops) {
      if (fracEq(t, f)) { hits = true; break; }
    }
    if (hits) state.unmatchedStreak = 0;
    else state.unmatchedStreak++;

    return f;
  }

  function shortestColumn() {
    let best = 0;
    let minH = Infinity;
    for (let c = 0; c < COLS; c++) {
      if (state.heights[c] < minH) { minH = state.heights[c]; best = c; }
    }
    return best;
  }

  function spawnTile() {
    const T = state.tileSize;
    const f = state.next || generateNextFraction();
    state.next = generateNextFraction();

    const col = shortestColumn();
    if (state.heights[col] >= ROWS) { gameOver(); return; }

    state.falling = {
      n: f.n,
      d: f.d,
      x: col * T,
      y: 0,
      col: col,
      hold: SPAWN_HOLD,
    };

    setFallingContent(f);
    positionFalling();
    renderHUD();
  }

  function setFallingContent(f) {
    fallingEl.innerHTML = '';
    fallingEl.appendChild(tileInner(f));
  }

  function positionFalling() {
    const f = state.falling;
    const T = state.tileSize;
    if (!f) {
      fallingEl.style.display = 'none';
      ghostEl.style.display = 'none';
      return;
    }
    fallingEl.style.display = '';
    fallingEl.style.transform = 'translate(' + f.x + 'px,' + f.y + 'px)';

    const ghostCol = computeLandingCol(f.x);
    const ghostRow = ROWS - state.heights[ghostCol] - 1;
    if (ghostRow < 0) {
      ghostEl.style.display = 'none';
    } else {
      ghostEl.style.display = '';
      ghostEl.style.transform = 'translate(' + (ghostCol * T) + 'px,' + (ghostRow * T) + 'px)';
      if (ghostEl.dataset.frac !== f.n + '/' + f.d) {
        ghostEl.dataset.frac = f.n + '/' + f.d;
        ghostEl.innerHTML = '';
        ghostEl.appendChild(tileInner(f));
      }
    }
  }

  function getFallSpeed() {
    return BASE_FALL + (state.level - 1) * FALL_PER_LEVEL;
  }

  function update(dt) {
    if (!state.falling) { spawnTile(); return; }
    const f = state.falling;
    const T = state.tileSize;

    let dx = 0;
    if (state.keys.left)  dx -= LATERAL_SPEED * T * dt;
    if (state.keys.right) dx += LATERAL_SPEED * T * dt;
    if (dx !== 0) {
      const newX = Math.max(0, Math.min((COLS - 1) * T, f.x + dx));
      if (canMoveTo(newX)) {
        f.x = newX;
        f.col = colAt(f.x);
      }
    }

    if (f.hold > 0) {
      f.hold -= dt;
    } else {
      const speed = getFallSpeed() * T * dt * (state.keys.down ? SOFT_DROP_MULT : 1);
      f.y += speed;
    }

    const targetY = computeLandingY(f.x);
    if (f.y >= targetY) {
      f.y = targetY;
      f.x = computeLandingCol(f.x) * T;
      f.col = colAt(f.x);
      placeTile();
      return;
    }
    positionFalling();
  }

  let rafId = 0;
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!state.started) { state.lastT = now; return; }
    const dt = Math.min((now - state.lastT) / 1000, 0.05);
    state.lastT = now;
    if (state.paused || state.over) return;
    update(dt);
  }

  function getPlacementMatches(col, row) {
    const cells = new Set();
    const f = state.board[col][row];
    if (!f) return cells;

    if (row + 1 < ROWS) {
      const below = state.board[col][row + 1];
      if (below && fracEq(below, f)) {
        cells.add(col + ',' + row);
        cells.add(col + ',' + (row + 1));
      }
    }
    if (col > 0) {
      const left = state.board[col - 1][row];
      if (left && fracEq(left, f)) {
        cells.add(col + ',' + row);
        cells.add((col - 1) + ',' + row);
      }
    }
    if (col + 1 < COLS) {
      const right = state.board[col + 1][row];
      if (right && fracEq(right, f)) {
        cells.add(col + ',' + row);
        cells.add((col + 1) + ',' + row);
      }
    }
    return cells;
  }

  function getHorizontalCells() {
    const cells = new Set();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS - 1; c++) {
        const a = state.board[c][r];
        const b = state.board[c + 1][r];
        if (a && b && fracEq(a, b)) {
          cells.add(c + ',' + r);
          cells.add((c + 1) + ',' + r);
        }
      }
    }
    return cells;
  }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      const stack = [];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (state.board[c][r]) stack.push(state.board[c][r]);
      }
      for (let r = 0; r < ROWS; r++) state.board[c][r] = null;
      for (let i = 0; i < stack.length; i++) {
        state.board[c][ROWS - 1 - i] = stack[i];
      }
      state.heights[c] = stack.length;
    }
  }

  function processVanish(cells, chain) {
    let totalGain = { n: 0, d: 1 };
    const cellArr = [];

    cells.forEach(function (key) {
      const parts = key.split(',');
      const c = parseInt(parts[0], 10);
      const r = parseInt(parts[1], 10);
      const f = state.board[c][r];
      if (!f) return;
      cellArr.push({ c: c, r: r, f: f });
      totalGain = fracAdd(totalGain, f);
      popTileAt(c, r, f, chain);
    });

    if (cellArr.length === 0) return;

    const multipliedGain = { n: totalGain.n * chain, d: totalGain.d };
    state.score = fracAdd(state.score, multipliedGain);

    cells.forEach(function (key) {
      const parts = key.split(',');
      const c = parseInt(parts[0], 10);
      const r = parseInt(parts[1], 10);
      state.board[c][r] = null;
    });

    const T = state.tileSize;
    let sumC = 0, sumR = 0;
    cellArr.forEach(function (o) { sumC += o.c + 0.5; sumR += o.r + 0.5; });
    const cx = (sumC / cellArr.length) * T;
    const cy = (sumR / cellArr.length) * T;

    showGainAt(cx, cy, multipliedGain, chain);
    burstConfetti(cx, cy, chain > 1 ? 20 + 15 * chain : 20, chain > 1);
    playMatchSound(chain);

    if (chain > 1) {
      boardEl.classList.remove('chain-shake');
      void boardEl.offsetWidth;
      boardEl.classList.add('chain-shake');
      setTimeout(function () { boardEl.classList.remove('chain-shake'); }, 600);
    }

    state.matches++;
    const targetLevel = 1 + Math.floor(state.matches / MATCHES_PER_LEVEL);
    if (targetLevel > state.level) {
      state.level = targetLevel;
      playLevelUp();
      levelEl.classList.remove('flash');
      void levelEl.offsetWidth;
      levelEl.classList.add('flash');
    }

    if (fracCmp(state.score, state.best) > 0) {
      state.best = { n: state.score.n, d: state.score.d };
      saveBest(state.best);
    }
    scoreEl.classList.remove('flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('flash');
  }

  function popTileAt(c, r, f, chain) {
    const T = state.tileSize;
    const t = makeTileEl(f);
    t.classList.add('popping');
    t.style.left = (c * T) + 'px';
    t.style.top = (r * T) + 'px';
    if (chain > 1) {
      t.style.animationDelay = ((chain - 1) * 90) + 'ms';
    }
    effectsEl.appendChild(t);
    setTimeout(function () { t.remove(); }, 600 + (chain - 1) * 90);
  }

  function showGainAt(cx, cy, gain, chain) {
    const el = document.createElement('div');
    if (chain > 1) {
      el.className = 'gain chain';
      const label = document.createElement('span');
      label.className = 'chain-label';
      label.textContent = 'CHAIN \u00D7' + chain;
      const amount = document.createElement('span');
      amount.className = 'chain-amount';
      amount.textContent = '+' + fracDisplay(gain);
      el.appendChild(label);
      el.appendChild(amount);
      el.style.animationDelay = ((chain - 1) * 90) + 'ms';
    } else {
      el.className = 'gain';
      el.textContent = '+' + fracDisplay(gain);
    }
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    effectsEl.appendChild(el);
    setTimeout(function () { el.remove(); }, chain > 1 ? 2200 : 1200);
  }

  function burstConfetti(cx, cy, count, big) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colours = big
      ? ['#fbbf24', '#f59e0b', '#fb923c', '#f97316', '#fde047', '#fef08a']
      : ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#fb7185'];
    const COUNT = count || 20;
    const speed = big ? 1.4 : 1.0;
    for (let i = 0; i < COUNT; i++) {
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.background = colours[i % colours.length];
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      const w = (4 + Math.random() * 6) * speed;
      const h = (6 + Math.random() * 8) * speed;
      p.style.width = w + 'px';
      p.style.height = h + 'px';
      if (Math.random() < 0.4) p.style.borderRadius = '50%';
      effectsEl.appendChild(p);

      const angle = (Math.PI * 2 * i) / COUNT + Math.random() * 0.5;
      const dist = (40 + Math.random() * 90) * speed;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      const rot = (Math.random() - 0.5) * 720;

      const anim = p.animate([
        { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
        { transform: 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg) scale(1)', opacity: 0 }
      ], {
        duration: 700 + Math.random() * 400,
        delay: Math.random() * 80,
        easing: 'cubic-bezier(.15,.7,.3,1)',
        fill: 'forwards'
      });
      anim.onfinish = function () { p.remove(); };
    }
  }

  function placeTile() {
    const f = state.falling;
    if (!f) return;
    const T = state.tileSize;
    const col = computeLandingCol(f.x);
    const h = state.heights[col];

    if (h >= ROWS) { gameOver(); return; }

    const row = ROWS - h - 1;
    state.board[col][row] = { id: state.nextTileId++, n: f.n, d: f.d };
    state.heights[col] = h + 1;
    state.falling = null;
    fallingEl.style.display = 'none';
    ghostEl.style.display = 'none';

    let chain = 0;
    let pending = getPlacementMatches(col, row);
    while (pending.size > 0) {
      chain++;
      processVanish(pending, chain);
      applyGravity();
      pending = getHorizontalCells();
    }

    /* Always re-render the placed layer, whether or not a cascade
       happened. Previously this was only called inside the loop, so a
       non-matching placement added the tile to state.board but never
       drew it — visually the tile "disappeared" the moment it landed.
       Passing true lets surviving tiles animate from their previous
       cells to their new ones when gravity compacts a column. */
    renderPlaced(true);

    if (chain === 0) playLand();

    renderHUD();
    spawnTile();
  }

  function renderHUD() {
    scoreEl.textContent = fracDisplay(state.score);
    bestEl.textContent = fracDisplay(state.best);
    levelEl.textContent = String(state.level);
    nextEl.innerHTML = '';
    if (state.next) nextEl.appendChild(tileInner(state.next));
  }

  function loadBest() {
    try {
      const raw = localStorage.getItem('fractionFall.best');
      if (!raw) return { n: 0, d: 1 };
      const o = JSON.parse(raw);
      if (o && typeof o.n === 'number' && typeof o.d === 'number' && o.d > 0) {
        return reduce(o.n, o.d);
      }
    } catch (e) {}
    return { n: 0, d: 1 };
  }
  function saveBest(b) {
    try { localStorage.setItem('fractionFall.best', JSON.stringify(b)); } catch (e) {}
  }

  function showOverlay(title, msg, scoreText, btnLabel, onClick) {
    overlayEl.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'overlay-card';

    const h = document.createElement('h2');
    h.className = 'overlay-title';
    h.textContent = title;
    card.appendChild(h);

    if (msg) {
      const p = document.createElement('p');
      p.className = 'overlay-msg';
      p.textContent = msg;
      card.appendChild(p);
    }
    if (scoreText) {
      const s = document.createElement('div');
      s.className = 'overlay-score';
      s.textContent = scoreText;
      card.appendChild(s);
    }
    if (btnLabel) {
      const b = document.createElement('button');
      b.className = 'overlay-btn';
      b.textContent = btnLabel;
      b.addEventListener('click', onClick);
      card.appendChild(b);
    }
    overlayEl.appendChild(card);
    overlayEl.hidden = false;
  }
  function hideOverlay() {
    overlayEl.hidden = true;
    overlayEl.innerHTML = '';
  }

  function gameOver() {
    state.over = true;
    state.falling = null;
    fallingEl.style.display = 'none';
    ghostEl.style.display = 'none';
    showOverlay(
      'Game Over',
      'The stack reached the top. Try to find the equivalent fractions faster next time.',
      fracDisplay(state.score),
      'Play again',
      restartGame
    );
  }

  function togglePause() {
    if (state.over || !state.started) return;
    state.paused = !state.paused;
    if (state.paused) {
      showOverlay('Paused', 'Take a breath \u2014 the game is on hold.', null, 'Resume', function () {
        state.paused = false;
        hideOverlay();
        state.lastT = performance.now();
      });
    } else {
      hideOverlay();
      state.lastT = performance.now();
    }
  }

  function bindHold(btn, key) {
    function set(v) {
      state.keys[key] = v;
      btn.classList.toggle('active', v);
    }
    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      set(true);
    });
    btn.addEventListener('pointerup', function (e) {
      e.preventDefault();
      try { btn.releasePointerCapture(e.pointerId); } catch (err) {}
      set(false);
    });
    btn.addEventListener('pointercancel', function () { set(false); });
    btn.addEventListener('lostpointercapture', function () { set(false); });
  }
  bindHold(btnLeft, 'left');
  bindHold(btnRight, 'right');
  bindHold(btnDown, 'down');

  pauseBtn.addEventListener('click', togglePause);

  document.addEventListener('keydown', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { state.keys.left = true; e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { state.keys.right = true; e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { state.keys.down = true; e.preventDefault(); }
    else if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); }
  });
  document.addEventListener('keyup', function (e) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') state.keys.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') state.keys.right = false;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') state.keys.down = false;
  });

  function resetState() {
    state.board = [];
    state.heights = [];
    state.falling = null;
    state.next = null;
    state.score = { n: 0, d: 1 };
    state.matches = 0;
    state.level = 1;
    state.best = loadBest();
    state.paused = false;
    state.over = false;
    state.keys = { left: false, right: false, down: false };
    state.unmatchedStreak = 0;
    state.nextTileId = 1;
    clearTimeout(impactTimer);
    impactTimer = 0;
    placedEl.classList.remove('impact');
    placedEls.forEach(function (t) {
      if (t._dropAnim) { try { t._dropAnim.cancel(); } catch (e) {} }
      if (t._landTimer) clearTimeout(t._landTimer);
      if (t._landedTimer) clearTimeout(t._landedTimer);
      t.remove();
    });
    placedEls.clear();
    placedEl.innerHTML = '';
    btnLeft.classList.remove('active');
    btnRight.classList.remove('active');
    btnDown.classList.remove('active');
    boardEl.classList.remove('chain-shake');
  }

  function restartGame() {
    hideOverlay();
    resetState();
    initBoard();
    state.tileSize = computeTileSize();
    layout();
    spawnTile();
    renderHUD();
    state.started = true;
    state.lastT = performance.now();
  }

  window.addEventListener('resize', function () {
    if (!state.started) return;
    state.tileSize = computeTileSize();
    layout();
    renderPlaced();
    positionFalling();
  });

  boardEl.addEventListener('touchstart', function (e) {
    if (e.target === boardEl) e.preventDefault();
  }, { passive: false });

  resetState();
  initBoard();
  state.tileSize = computeTileSize();
  layout();
  spawnTile();
  renderHUD();
  state.started = true;
  state.lastT = performance.now();
  rafId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
