<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Standard Form — Practice</title>
<link rel="stylesheet" href="core/drill.css">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root{
    --q-min:480px; --lhs-size:36px; --eq-size:32px; --opt-size:22px;
    --slot-min-w:170px; --slot-min-h:82px; --slot-font:28px; --diagram-min-h:120px;
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="katex/katex.min.js"></script>
<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* ============================================================
     STANDARD FORM HELPERS
     ============================================================ */
  function coefDisplay(digits, dpPos) {
    if (dpPos < 0) {
      return '0.' + '0'.repeat(-dpPos - 1) + digits;
    }
    if (dpPos >= digits.length - 1) {
      return digits + '0'.repeat(dpPos - digits.length + 1);
    }
    return digits.slice(0, dpPos + 1) + '.' + digits.slice(dpPos + 1);
  }

  function toStandardForm(digits, dpPos) {
    let d = digits;
    while (d.length > 1 && d.endsWith('0')) d = d.slice(0, -1);
    const A = d.length === 1 ? d : (d[0] + '.' + d.slice(1));
    return { A, n: dpPos };
  }

  function sfLatex(A, n) {
    return A + ' \\times 10^{' + n + '}';
  }

  /* ============================================================
     DISTRACTOR POOL
     ============================================================ */
  function sfPool(sourceCoef, sourceExp, correctA, correctN) {
    const correct = sfLatex(correctA, correctN);
    const seen = new Set([correct]);
    const pool = [];
    const add = (c, e) => {
      const l = sfLatex(c, e);
      if (seen.has(l)) return;
      seen.add(l);
      pool.push({ latex: l });
    };
    add(sourceCoef, sourceExp);
    add(correctA, sourceExp);
    add(sourceCoef, correctN);
    add(correctA, correctN + 1);
    add(correctA, correctN - 1);
    add(correctA, -correctN);
    return pool;
  }

  function finaliseOptions(correctA, correctN, pool) {
    if (pool.length < 3) return null;
    return shuffle([
      { latex: sfLatex(correctA, correctN), ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);
  }

  function randomExp(maxAbs) {
    const v = ri(1, maxAbs);
    return rng() < 0.5 ? v : -v;
  }

  /* ============================================================
     QUESTION GENERATORS
     Each returns { sig, shift, prompt, lhs, eq, options } or null.

     "shift" is the number of places the decimal point must move to
     convert the source coefficient into a single-digit coefficient.
     ============================================================ */

  /* Type A — decimal coefficient between 10 and 100.  Shift 1. */
  function genA() {
    const a = ri(1, 9);
    const b = ri(0, 9);
    const c = ri(1, 9);
    const digits = String(a) + String(b) + String(c);
    const coefDp = 1;
    const exp = randomExp(5);
    const sourceCoef = coefDisplay(digits, coefDp);
    const correct = toStandardForm(digits, coefDp + exp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, exp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'A|' + digits + '|' + exp,
      shift: 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(sourceCoef + ' \\times 10^{' + exp + '}'),
      eq: '=',
      options
    };
  }

  /* Type B — decimal coefficient with one or more leading zeros.
     Shift is k + 1, where k is the number of zeros after the point. */
  function genB() {
    const k = ri(1, 4);
    const d = ri(1, 9);
    const digits = String(d);
    const coefDp = -(k + 1);
    const exp = randomExp(5);
    const sourceCoef = coefDisplay(digits, coefDp);
    const correct = toStandardForm(digits, coefDp + exp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, exp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'B|' + k + '|' + d + '|' + exp,
      shift: k + 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(sourceCoef + ' \\times 10^{' + exp + '}'),
      eq: '=',
      options
    };
  }

  /* Type C — integer coefficient with 2 or 3 digits. */
  function genC() {
    const len = pick([2, 3]);
    let digits = String(ri(1, 9));
    for (let i = 1; i < len; i++) digits += String(ri(0, 9));
    let d = digits;
    while (d.length > 1 && d.endsWith('0')) d = d.slice(0, -1);
    if (d.length < 2) return null;
    const coefDp = digits.length - 1;
    const exp = randomExp(5);
    const sourceCoef = digits;
    const correct = toStandardForm(digits, coefDp + exp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, exp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'C|' + digits + '|' + exp,
      shift: digits.length - 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(sourceCoef + ' \\times 10^{' + exp + '}'),
      eq: '=',
      options
    };
  }

  /* Type D — product of two single-digit integers × 10ⁿ.
     Both factors are 1 significant figure so the multiplication is
     always a standard times-table fact. */
  function genD() {
    const a = ri(2, 9);
    const b = ri(2, 9);
    const product = a * b;
    const digits = String(product);
    let d = digits;
    while (d.length > 1 && d.endsWith('0')) d = d.slice(0, -1);
    if (d.length < 2) return null;
    const coefDp = digits.length - 1;
    const exp = randomExp(5);
    const sourceCoef = digits;
    const correct = toStandardForm(digits, coefDp + exp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, exp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'D|' + a + '|' + b + '|' + exp,
      shift: digits.length - 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(a + ' \\times ' + b + ' \\times 10^{' + exp + '}'),
      eq: '=',
      options
    };
  }

  /* Type E — a number given in words. */
  const WORD_LIST = [
    { word: 'thousand', exp: 3 },
    { word: 'thousand', exp: 3 },
    { word: 'million',  exp: 6 },
    { word: 'million',  exp: 6 },
    { word: 'billion',  exp: 9 },
    { word: 'hundred',  exp: 2 }
  ];
  function genE() {
    const n = ri(10, 99);
    const w = pick(WORD_LIST);
    const digits = String(n);
    const coefDp = digits.length - 1;
    const sourceExp = w.exp;
    const sourceCoef = digits;
    const correct = toStandardForm(digits, coefDp + sourceExp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, sourceExp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'E|' + n + '|' + w.word,
      shift: digits.length - 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(n + '\\text{ ' + w.word + '}'),
      eq: '=',
      options
    };
  }

  /* Type F — two terms with separate powers.
     Both integer factors are single-digit (2–9) so the
     multiplication can be done mentally. */
  function genF() {
    const a = ri(2, 9);
    const b = ri(2, 9);
    const p = randomExp(4);
    const q = randomExp(4);
    const sourceExp = p + q;
    const product = a * b;
    const digits = String(product);
    let d = digits;
    while (d.length > 1 && d.endsWith('0')) d = d.slice(0, -1);
    if (d.length < 2) return null;
    const coefDp = digits.length - 1;
    const sourceCoef = digits;
    const correct = toStandardForm(digits, coefDp + sourceExp);
    if (correct.n === 0) return null;
    const pool = sfPool(sourceCoef, sourceExp, correct.A, correct.n);
    const options = finaliseOptions(correct.A, correct.n, pool);
    if (!options) return null;
    return {
      sig: 'F|' + a + '|' + b + '|' + p + '|' + q,
      shift: digits.length - 1,
      prompt: 'Write this number in standard form.',
      lhs: tex(a + ' \\times 10^{' + p + '} \\times ' +
               b + ' \\times 10^{' + q + '}'),
      eq: '=',
      options
    };
  }

  /* ============================================================
     REGISTRY + DIFFICULTY MODEL
     ============================================================ */
  const GENERATORS = {
    A: genA,
    B: genB,
    C: genC,
    D: genD,
    E: genE,
    F: genF
  };

  const TYPE_DIFFICULTY = {
    B: 1,
    A: 1.5,
    E: 2,
    C: 2.5,
    D: 3,
    F: 4
  };

  const ALL_TYPES = ['A', 'B', 'C', 'D', 'E', 'F'];

  const TOPIC_TYPES = {
    mixed: ALL_TYPES,
    A: ['A'],
    B: ['B'],
    C: ['C'],
    D: ['D'],
    E: ['E'],
    F: ['F']
  };

  function chooseType(pos, types) {
    const target = 1 + pos * 3;
    const sigma = 1.0;
    const weights = types.map(t => {
      const d = TYPE_DIFFICULTY[t];
      const z = (d - target) / sigma;
      return Math.exp(-0.5 * z * z);
    });
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < types.length; i++) {
      r -= weights[i];
      if (r <= 0) return types[i];
    }
    return types[types.length - 1];
  }

  /* Maximum shift permitted at position pos.
     At pos = 0, maxShift = 1 (×/÷ 10 only).
     At pos = 1, maxShift = 5 (×/÷ 100 000). */
  function computeMaxShift(pos) {
    return Math.max(1, Math.round(1 + pos * 3.5));
  }

  function buildQuestions(n, types) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    /* If the chosen types can't make a shift this small (type B always
       shifts by 2 or more), allow one more step after 200 misses in a row,
       instead of spinning through thousands of attempts. */
    let relax = 0, misses = 0;
    while (out.length < n && guard < 12000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const maxShift = computeMaxShift(pos) + relax;
      const type = chooseType(pos, types);
      let q = null;
      try {
        q = GENERATORS[type]();
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      if (q.shift > maxShift) {
        if (++misses >= 200) { relax++; misses = 0; }
        continue;
      }
      seen.add(q.sig);
      out.push(q);
      relax = 0; misses = 0;
    }
    /* Safety net — relax the shift constraint rather than render
       fewer questions than requested. */
    let g2 = 0;
    while (out.length < n && g2 < 800) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const maxShift = computeMaxShift(pos);
      const type = chooseType(pos, types);
      const q = GENERATORS[type]();
      if (q && q.shift <= maxShift) out.push(q);
    }
    /* Second safety net — accept anything at all. */
    let g3 = 0;
    while (out.length < n && g3 < 400) {
      g3++;
      const type = pick(types);
      const q = GENERATORS[type]();
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'standard-form-2',
    title: 'Standard Form',
    toolbarTitle: '🔢 Standard Form',
    counts: [4, 6, 8, 10, 12],
    defaultCount: 10,
    instructions: 'Standard form is ' + tex('A \\times 10^{n}') + ' where ' + tex('1 \\le A < 10') + '.',
    settings: [
      { key: 'topic', label: 'Topic', type: 'select', default: 'mixed', options: [
        { value: 'mixed', label: 'Mixed' },
        { value: 'A', label: '56.7 × 10² (big decimal)' },
        { value: 'B', label: '0.06 × 10⁴ (small decimal)' },
        { value: 'C', label: '158 × 10⁴ (integer)' },
        { value: 'D', label: '3 × 4 × 10⁵ (product × 10ⁿ)' },
        { value: 'E', label: '41 million (in words)' },
        { value: 'F', label: '15 × 10² × 3 × 10⁻¹ (two powers)' }
      ] }
    ],
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n, TOPIC_TYPES[s.topic] || ALL_TYPES);
    },
    renderOption: o => tex(o.latex)
  });
})();
</script>
</body>
</html>
