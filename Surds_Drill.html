<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surds — Practice</title>
<link rel="stylesheet" href="core/drill.css">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root{
    --q-min:420px; --lhs-size:22px; --eq-size:22px; --opt-size:20px;
    --slot-min-w:110px; --slot-min-h:60px; --slot-font:20px; --diagram-min-h:96px;
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="katex/katex.min.js"></script>
<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* ---- rendering helpers for surd expressions ---- */

  /* Render "√n" for an integer n. */
  function sqrtL(n) { return '\\sqrt{' + n + '}'; }
  function cbrtL(n) { return '\\sqrt[3]{' + n + '}'; }

  /* Render "k√n" for integers k and n, handling k = ±1. */
  function coefSurd(k, n) {
    if (k === 1)  return sqrtL(n);
    if (k === -1) return '-' + sqrtL(n);
    return k + sqrtL(n);
  }

  /* Render "p + q√n" or "q√n - |p|" or just "p"/"q√n", depending.
     Handles p = 0, q = 0, and |q| = 1 cleanly.  When p < 0 and q > 0,
     the surd is placed first for a more natural reading. */
  function linSurd(p, q, n) {
    if (q === 0) return String(p);
    if (p === 0) return coefSurd(q, n);
    if (p < 0 && q > 0) {
      return coefSurd(q, n) + ' - ' + Math.abs(p);
    }
    const sign = q > 0 ? ' + ' : ' - ';
    return p + sign + coefSurd(Math.abs(q), n);
  }

  /* ============================================================
     QUESTION GENERATORS
     Each returns { sig, prompt, lhs, eq, options, diff }
     or null if a valid question could not be constructed in the
     allocated number of tries.  All maths is exact integer
     arithmetic; no floating point appears in any answer.
     ============================================================ */

  /* Common square-free radicands. */
  const NS = [2, 3, 5, 6, 7];

  /* --- 1. Simplify √N = k√m --- */
  function genSimplifySurd() {
    const m = pick(NS);
    const k = ri(2, 7);
    const N = k * k * m;
    const correct = coefSurd(k, m);
    const sig = 'SS|' + N;
    const lhs = tex(sqrtL(N));

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(coefSurd(k + 1, m));
    add(coefSurd(k - 1, m));
    add(coefSurd(k, m + 1));
    add(coefSurd(m, k));          /* transposed */
    if (m > 2) add(coefSurd(k, m - 1));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Write in the form ' + tex('k\\sqrt{m}') + ' where ' + tex('m') + ' has no square factors.',
      lhs, eq: '=', options: opts, diff: 1
    };
  }

  /* --- 2. Collect like surds: a√n ± b√n --- */
  function genCollectLikeSurds() {
    const n = pick(NS);
    const isAdd = rng() < 0.5;
    let a, b;
    if (isAdd) {
      a = ri(1, 12); b = ri(1, 12);
    } else {
      a = ri(3, 12); b = ri(1, a - 1);
    }
    const result = isAdd ? a + b : a - b;
    if (result === 0) return null;

    const lhsLatex = coefSurd(a, n) + (isAdd ? ' + ' : ' - ') + coefSurd(b, n);
    const lhs = tex(lhsLatex);
    const correct = coefSurd(result, n);
    const sig = 'CL|' + a + '|' + b + '|' + n + '|' + (isAdd ? '+' : '-');

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(coefSurd(a * b, n));                        /* multiplied coefficients */
    add(coefSurd(isAdd ? Math.abs(a - b) : a + b, n)); /* opposite operation */
    add(coefSurd(result + 1, n));
    if (result > 1) add(coefSurd(result - 1, n));
    add(coefSurd(result, n * 2));                   /* wrong radicand */
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Simplify.',
      lhs, eq: '=', options: opts, diff: 1
    };
  }

  /* --- 3. Coefficient into surd: a√b = √(a²b) --- */
  function genIntoSurdForm() {
    const n = pick(NS);
    const a = ri(2, 8);
    const N = a * a * n;
    const lhs = tex(coefSurd(a, n));
    const correct = sqrtL(N);
    const sig = 'IS|' + a + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(sqrtL(a * n));                       /* forgot to square */
    add(sqrtL(a * a * n * n));               /* squared both */
    add(sqrtL((a + 1) * (a + 1) * n));
    add(sqrtL((a - 1) * (a - 1) * n));
    add(sqrtL(a * a + n));                   /* added instead of multiplied */
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Write in the form ' + tex('\\sqrt{N}') + ' where ' + tex('N') + ' is an integer.',
      lhs, eq: '=', options: opts, diff: 1
    };
  }

  /* --- 4. Sum of two surds as a single surd --- */
  function genSumOfSurds() {
    const m = pick([2, 3, 5]);
    let k1 = ri(1, 5);
    let k2 = ri(1, 5);
    if (k1 === k2) k2 = k1 + 1;
    const A = k1 * k1 * m;
    const B = k2 * k2 * m;
    const sum = k1 + k2;
    const correct = sqrtL(sum * sum * m);
    const sig = 'SO|' + k1 + '|' + k2 + '|' + m;
    const lhs = tex(sqrtL(A) + ' + ' + sqrtL(B));

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(sqrtL(A + B));                       /* naive: √A + √B = √(A+B) */
    add(sqrtL(sum * m));                     /* forgot to square the sum */
    add(sqrtL(sum * sum * 2 * m));           /* doubled radicand */
    add(sqrtL((sum + 1) * (sum + 1) * m));
    add(sqrtL((sum - 1) * (sum - 1) * m));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Write in the form ' + tex('\\sqrt{k}') + ' where ' + tex('k') + ' is an integer.',
      lhs, eq: '=', options: opts, diff: 2
    };
  }

  /* --- 5. Expand (a + b√n)(c + d√n) --- */
  function genExpandSurdBracket() {
    const n = pick(NS);
    const a = ri(1, 4), c = ri(1, 4);
    const b = pick([1, -1]) * ri(1, 3);
    const d = pick([1, -1]) * ri(1, 3);

    const P = a * c + b * d * n;
    const Q = a * d + b * c;
    if (Q === 0) return null;

    const br = (x, y) =>
      '(' + x + (y > 0 ? ' + ' : ' - ') + coefSurd(Math.abs(y), n) + ')';
    const lhs = tex(br(a, b) + '\\,' + br(c, d));
    const correct = linSurd(P, Q, n);
    const sig = 'EB|' + a + '|' + b + '|' + c + '|' + d + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(a * c + b * d, Q, n));   /* forgot to multiply bd by n */
    add(linSurd(P, -Q, n));              /* sign flip on surd part */
    add(linSurd(-P, Q, n));              /* sign flip on rational part */
    add(linSurd(P, Q + 1, n));
    if (Q > 1) add(linSurd(P, Q - 1, n));
    add(linSurd(P + 1, Q, n));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Expand and simplify, giving your answer in the form ' + tex('p + q\\sqrt{n}') + '.',
      lhs, eq: '=', options: opts, diff: 2
    };
  }

  /* --- 6. Square a binomial (a ± b√n)² --- */
  function genSquareSurdBinomial() {
    const n = pick(NS);
    const a = ri(1, 4);
    const b = ri(1, 3);
    const sign = pick([1, -1]);
    const bS = sign * b;

    const P = a * a + b * b * n;
    const Q = 2 * a * bS;

    const inner = a + (bS > 0 ? ' + ' : ' - ') + coefSurd(b, n);
    const lhs = tex('\\left(' + inner + '\\right)^{2}');
    const correct = linSurd(P, Q, n);
    const sig = 'SB|' + a + '|' + bS + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(P, 0, n));                    /* forgot the cross term */
    add(linSurd(a * a - b * b * n, Q, n));    /* sign flip on rational part */
    add(linSurd(P, -Q, n));                   /* sign flip on surd part */
    add(linSurd(P, Q / 2, n));                /* halved coefficient */
    add(linSurd(P, Q + 1, n));
    if (Q > 1) add(linSurd(P, Q - 1, n));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Expand, giving your answer in the form ' + tex('p + q\\sqrt{n}') + '.',
      lhs, eq: '=', options: opts, diff: 2
    };
  }

  /* --- 7. p(a + b√n) − q(c + d√n) --- */
  function genDistributeAndCollect() {
    const n = pick([2, 3, 5]);
    const p = ri(2, 5), q = ri(2, 5);
    const a = ri(1, 5), c = ri(1, 5);
    const b = pick([1, -1]) * ri(1, 2);
    const d = pick([1, -1]) * ri(1, 2);

    const P = p * a - q * c;
    const Q = p * b - q * d;
    if (Q === 0 && P === 0) return null;

    const br = (outer, inner, surd) =>
      outer + '(' + inner + (surd > 0 ? ' + ' : ' - ') + coefSurd(Math.abs(surd), n) + ')';
    const lhs = tex(br(p, a, b) + ' - ' + br(q, c, d));
    const correct = linSurd(P, Q, n);
    const sig = 'DC|' + p + '|' + a + '|' + b + '|' + q + '|' + c + '|' + d + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(P, -Q, n));
    add(linSurd(-P, Q, n));
    add(linSurd(p * a + q * c, p * b + q * d, n));  /* added instead of subtracting */
    add(linSurd(P, Q + 1, n));
    add(linSurd(P, Q - 1, n));
    add(linSurd(P + 1, Q, n));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Expand and simplify, giving your answer in the form ' + tex('p + q\\sqrt{n}') + '.',
      lhs, eq: '=', options: opts, diff: 2
    };
  }

  /* --- 8. Rationalise the denominator of a/√n --- */
  function genRationaliseSimple() {
    const n = pick(NS);
    const k = ri(2, 8);
    const a = k * n;

    const lhs = tex('\\frac{' + a + '}{' + sqrtL(n) + '}');
    const correct = coefSurd(k, n);
    const sig = 'RS|' + a + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(coefSurd(a, n));                       /* forgot to divide */
    add(String(k));                            /* removed the surd */
    add(sqrtL(n));                             /* dropped the coefficient */
    add(coefSurd(k + 1, n));
    if (k > 2) add(coefSurd(k - 1, n));
    add('\\frac{' + sqrtL(n) + '}{' + k + '}'); /* divided instead of multiplied */
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Rationalise the denominator, giving your answer in its simplest form.',
      lhs, eq: '=', options: opts, diff: 2
    };
  }

  /* --- 9. Rationalise the denominator of a/(b + c√n) --- */
  function genRationaliseConjugate() {
    /* Curated combos where b² − c²n is a small non-zero integer. */
    const combos = [
      { b: 2, c: 1, n: 3 },   /* D = 1   */
      { b: 1, c: 1, n: 2 },   /* D = −1  */
      { b: 3, c: 2, n: 2 },   /* D = 1   */
      { b: 2, c: 1, n: 2 },   /* D = 2   */
      { b: 3, c: 1, n: 5 },   /* D = 4   */
      { b: 1, c: 2, n: 2 },   /* D = −7  */
      { b: 3, c: 1, n: 2 },   /* D = 7   */
      { b: 4, c: 1, n: 3 },   /* D = 13  */
      { b: 5, c: 1, n: 2 },   /* D = 23  */
      { b: 2, c: 3, n: 2 },   /* D = −14 */
      { b: 4, c: 1, n: 5 },   /* D = 11  */
      { b: 5, c: 1, n: 3 },   /* D = 22  */
    ];
    const { b, c, n } = pick(combos);
    const D = b * b - c * c * n;
    if (D === 0) return null;

    const k = pick([1, 1, 2]);
    const a = k * Math.abs(D);

    /* a/(b + c√n) = a(b − c√n)/D = k(b − c√n)·sign(D) */
    let P, Q;
    if (D > 0) { P =  k * b; Q = -k * c; }
    else       { P = -k * b; Q =  k * c; }

    const lhs = tex('\\frac{' + a + '}{' + b + ' + ' + c + sqrtL(n) + '}');
    const correct = linSurd(P, Q, n);
    const sig = 'RC|' + a + '|' + b + '|' + c + '|' + n;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(P, -Q, n));                    /* sign flip on surd part */
    add(linSurd(-P, Q, n));                    /* sign flip on rational part */
    add(linSurd(-P, -Q, n));                   /* negated */
    add(linSurd(P + 1, Q, n));
    add(linSurd(P, Q + 1, n));
    if (Q > 1) add(linSurd(P, Q - 1, n));
    add(linSurd(b, -c, n));                    /* forgot the k factor */
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Rationalise the denominator, giving your answer in its simplest form.',
      lhs, eq: '=', options: opts, diff: 3
    };
  }

  /* --- 10. (p√a − q√b)² in the form P + Q√n --- */
  function genSurdSquareMixed() {
    /* Curated pairs where ab is not a perfect square but has a
       non-trivial square-free part. */
    const pairs = [
      { a: 15, b: 5 }, { a: 6, b: 3 }, { a: 10, b: 5 },
      { a: 12, b: 2 }, { a: 12, b: 6 }, { a: 8, b: 6 },
      { a: 6, b: 2 }, { a: 15, b: 10 }, { a: 7, b: 14 },
    ];
    const { a, b } = pick(pairs);
    const p = pick([1, 1, 1, 2]);
    const q = pick([1, 1, 1, 2]);

    /* ab = k² m with m square-free */
    const ab = a * b;
    let k = 1, m = ab;
    for (let kk = Math.floor(Math.sqrt(ab)); kk >= 2; kk--) {
      if (ab % (kk * kk) === 0) { k = kk; m = ab / (kk * kk); break; }
    }
    if (m === 1) return null;

    /* (p√a − q√b)² = p²a + q²b − 2pq·k√m */
    const P = p * p * a + q * q * b;
    const Q = -2 * p * q * k;

    const inner = coefSurd(p, a) + ' - ' + coefSurd(q, b);
    const lhs = tex('\\left(' + inner + '\\right)^{2}');
    const correct = linSurd(P, Q, m);
    const sig = 'SM|' + p + '|' + a + '|' + q + '|' + b;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(P, -Q, m));                 /* sign flip on surd part */
    add(linSurd(P, 0, m));                  /* forgot the cross term */
    add(linSurd(p * p * a - q * q * b, Q, m)); /* sign flip on rational part */
    add(linSurd(P, -2 * p * q, m));         /* forgot the k factor */
    add(linSurd(P, Math.round(Q / 2), m));  /* halved */
    add(linSurd(P, Q + 1, m));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Write in the form ' + tex('p + q\\sqrt{n}') + ' where ' + tex('n') + ' is a square-free integer.',
      lhs, eq: '=', options: opts, diff: 3
    };
  }

    /* --- 11. Rectangle with surd dimensions, find area (Q12a) --- */
  function genRectangleArea() {
    /* Length a + b√2, width b − a√2.
       Area = (a + b√2)(b − a√2) = −ab + (b² − a²)√2. */
    const a = pick([1, 2]);
    const bCands = a === 1 ? [3, 4, 5, 6] : [4, 5, 6, 7];
    const b = pick(bCands);
    const P = -a * b;
    const Q = b * b - a * a;
    if (Q === 0) return null;

    const lhs = tex('(' + a + ' + ' + b + '\\sqrt{2})(' + b + ' - ' + a + '\\sqrt{2})');
    const correct = linSurd(P, Q, 2);
    const sig = 'RA|' + a + '|' + b;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(-P, Q, 2));            /* sign error on ab */
    add(linSurd(P, -Q, 2));            /* sign error on b² */
    add(linSurd(-P, -Q, 2));           /* both signs wrong */
    add(linSurd(P, b * b + a * a, 2)); /* b² + a² instead of b² − a² */
    add(linSurd(P, Q + 1, 2));
    if (Q > 1) add(linSurd(P, Q - 1, 2));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'A rectangle has length ' + tex(a + ' + ' + b + '\\sqrt{2}') +
              ' and width ' + tex(b + ' - ' + a + '\\sqrt{2}') +
              '. Find its area in the form ' + tex('m + n\\sqrt{2}') + '.',
      lhs, eq: '=', options: opts, diff: 3
    };
  }

  /* --- 12. Compare two surd differences (Q13b) --- */
  function genCompareSurds() {
    /* Set up √A − √B  vs  √C − √D  where A, D share radicand m and B, C share radicand n.
       Then (√A − √B) − (√C − √D) has the same sign as (p+s)√m − (q+r)√n
       where A = p²m, D = s²m, B = q²n, C = r²n.
       So compare S = (p+s)²m with T = (q+r)²n. */
    const ms = [2, 3, 5, 6, 7];
    for (let attempt = 0; attempt < 300; attempt++) {
      const m = pick(ms);
      const n = pick(ms.filter(x => x !== m));
      const p = ri(1, 4), s = ri(1, 4);
      const q = ri(1, 4), r = ri(1, 4);
      const A = p * p * m, D = s * s * m;
      const B = q * q * n, C = r * r * n;
      if (A > 200 || B > 200 || C > 200 || D > 200) continue;
      const S = (p + s) * (p + s) * m;
      const T = (q + r) * (q + r) * n;
      if (S === T) continue;
      if (Math.abs(S - T) > 40) continue;   /* not too easy */
      if (S < 15 || T < 15) continue;       /* not trivially small */

      const leftLatex  = sqrtL(A) + ' - ' + sqrtL(B);
      const rightLatex = sqrtL(C) + ' - ' + sqrtL(D);
      const lhs = tex(leftLatex + '\\quad\\text{vs}\\quad' + rightLatex);

      const leftIsLarger = S > T;
      const sig = 'CS|' + A + '|' + B + '|' + C + '|' + D;

      const opts = shuffle([
        { latex: leftLatex,  ok: leftIsLarger },
        { latex: rightLatex, ok: !leftIsLarger },
        { latex: '\\text{They are equal}', ok: false },
        { latex: '\\text{Cannot be determined}', ok: false }
      ]);

      return {
        sig,
        prompt: 'Without using decimal approximations, decide which of the two expressions is larger.',
        lhs, eq: tex('\\Rightarrow \\text{larger:}'), options: opts, diff: 3
      };
    }
    return null;
  }

  /* --- 13. (1 ± √2)^n in the form a + b√2 (Q14b-style) --- */
  function genPowerOfSurd() {
    /* Precomputed values for (1 + √2)^n and (1 − √2)^n. */
    const table = {
      2: { a:  3, b:  2 },
      3: { a:  7, b:  5 },
      4: { a: 17, b: 12 }
    };
    const plus = rng() < 0.5;
    const n = pick([2, 3, 4]);
    const { a, b } = table[n];
    const P = a;
    const Q = plus ? b : -b;

    const inner = '1 ' + (plus ? '+' : '-') + ' \\sqrt{2}';
    const lhs = tex('\\left(' + inner + '\\right)^{' + n + '}');
    const correct = linSurd(P, Q, 2);
    const sig = 'PO|' + n + '|' + (plus ? '+' : '-');

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(linSurd(P, -Q, 2));        /* sign flip on surd part */
    add(linSurd(-P, Q, 2));        /* sign flip on constant */
    add(linSurd(-P, -Q, 2));       /* negated */
    add(linSurd(P, Q + 1, 2));
    if (Q > 1) add(linSurd(P, Q - 1, 2));
    add(linSurd(P + 1, Q, 2));
    if (P > 1) add(linSurd(P - 1, Q, 2));
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Expand and simplify, giving your answer in the form ' + tex('a + b\\sqrt{2}') + '.',
      lhs, eq: '=', options: opts, diff: 3
    };
  }

  /* --- 14. Rationalise 1/(∛a − ∛b) using the difference of cubes (Q15b) --- */
  function genRationaliseCubeRoot() {
    /* Use the identity a³ − b³ = (a − b)(a² + ab + b²), applied to cube roots:
       1/(∛a − ∛b) = (∛a² + ∛ab + ∛b²) / (a − b).
       Choose pairs with a − b = 1 for a clean denominator. */
    const pairs = [[2, 1], [3, 2], [5, 4]];
    const [a, b] = pick(pairs);
    const A2 = a * a, AB = a * b, B2 = b * b;

    const lhs = tex('\\frac{1}{' + cbrtL(a) + ' - ' + cbrtL(b) + '}');
    const correct = cbrtL(A2) + ' + ' + cbrtL(AB) + ' + ' + cbrtL(B2);
    const sig = 'CR|' + a + '|' + b;

    const pool = [];
    const seen = new Set([correct]);
    const add = (latex) => {
      if (seen.has(latex)) return;
      seen.add(latex);
      pool.push({ latex });
    };
    add(cbrtL(A2) + ' - ' + cbrtL(AB) + ' + ' + cbrtL(B2));   /* middle sign error */
    add(cbrtL(A2) + ' + ' + cbrtL(AB) + ' - ' + cbrtL(B2));   /* last sign error */
    add(cbrtL(A2) + ' - ' + cbrtL(AB) + ' - ' + cbrtL(B2));   /* both sign errors */
    add(cbrtL(A2) + ' + ' + cbrtL(B2));                        /* missed the middle term */
    add('\\frac{' + cbrtL(A2) + ' + ' + cbrtL(AB) + ' + ' + cbrtL(B2) + '}{' + (a + b) + '}'); /* wrong denominator */
    if (pool.length < 3) return null;

    const opts = shuffle([
      { latex: correct, ok: true },
      ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
    ]);

    return {
      sig,
      prompt: 'Rationalise the denominator. ' +
              '(Hint: ' + tex('a^{3} - b^{3} = (a - b)(a^{2} + ab + b^{2})') +
              ', taking ' + tex('a = \\sqrt[3]{' + a + '}') + ' and ' +
              tex('b = \\sqrt[3]{' + b + '}') + '.)',
      lhs, eq: '=', options: opts, diff: 3
    };
  }

  /* ============================================================
     REGISTRY + TOPIC GROUPS
     ============================================================ */
    const GENERATORS = {
    simplifySurd:      { fn: genSimplifySurd,          diff: 1 },
    collectLike:       { fn: genCollectLikeSurds,      diff: 1 },
    intoSurd:          { fn: genIntoSurdForm,          diff: 1 },
    sumSurds:          { fn: genSumOfSurds,            diff: 2 },
    expandBracket:     { fn: genExpandSurdBracket,     diff: 2 },
    squareBinom:       { fn: genSquareSurdBinomial,    diff: 2 },
    distribute:        { fn: genDistributeAndCollect,  diff: 2 },
    rationaliseSimple: { fn: genRationaliseSimple,     diff: 2 },
    rationaliseConj:   { fn: genRationaliseConjugate,  diff: 3 },
    surdSquareMixed:   { fn: genSurdSquareMixed,       diff: 3 },
    rectangleArea:     { fn: genRectangleArea,         diff: 3 },
    compareSurds:      { fn: genCompareSurds,          diff: 3 },
    powerOfSurd:       { fn: genPowerOfSurd,           diff: 3 },
    rationaliseCube:   { fn: genRationaliseCubeRoot,   diff: 3 },
  };

  const ALL_TYPES = Object.keys(GENERATORS);

  const TOPIC_TYPES = {
    mixed:       Object.keys(GENERATORS),
    simplify:    ['simplifySurd', 'intoSurd'],
    combine:     ['collectLike', 'sumSurds', 'compareSurds'],
    expand:      ['expandBracket', 'squareBinom', 'distribute', 'powerOfSurd', 'rectangleArea'],
    rationalise: ['rationaliseSimple', 'rationaliseConj', 'rationaliseCube'],
  };

  /* ============================================================
     BUILD QUESTIONS — with position-based difficulty gradient
     ============================================================ */
  function buildQuestions(n, types) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const target = 1 + 2.5 * pos;

      /* Weight each type by proximity of its difficulty to the target. */
      const weights = types.map(t => {
        const d = GENERATORS[t].diff;
        return Math.exp(-0.5 * (d - target) * (d - target));
      });
      const total = weights.reduce((a, b) => a + b, 0);
      let r = rng() * total;
      let idx = 0;
      while (idx < types.length - 1 && r > weights[idx]) {
        r -= weights[idx];
        idx++;
      }

      let q = null;
      try {
        q = GENERATORS[types[idx]].fn();
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow repeats rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const t = pick(types);
      const q = GENERATORS[t].fn();
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'surds',
    title: 'Surds',
    toolbarTitle: '√ Surds Worksheet',
    counts: [4, 8, 10, 12],
    defaultCount: 8,
    instructions: 'A <b>surd</b> is an expression containing the square root of a non-square number. ' +
                  'Simplify by extracting square factors, collecting like surds, and rationalising denominators.',
    settings: [
      { key: 'topic', label: 'Topic', type: 'select', default: 'mixed', options: [
        { value: 'mixed', label: 'Mixed' },
        { value: 'simplify', label: 'Simplify surds' },
        { value: 'combine', label: 'Combine &amp; compare surds' },
        { value: 'expand', label: 'Expand brackets' },
        { value: 'rationalise', label: 'Rationalise denominators' }
      ] }
    ],
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n, TOPIC_TYPES[s.topic] || ALL_TYPES);
    },
    renderOption: o => tex(o.latex)
  });
})();
</script>
