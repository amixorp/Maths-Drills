<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Term-to-Term Rules — Practice</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#cbd5e1;
    --line-soft:#e2e8f0;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#dbeafe;
    --page:#eef2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--page);
    font-size:17px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* toolbar */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:14px 22px;
    background:#0f172a; color:#f9fafb;
    box-shadow:0 2px 10px rgba(15,23,42,.25);
    font-size:15px;
  }
  .tb-title{font-weight:800; margin-right:auto; letter-spacing:.3px; font-size:16px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e2e8f0}
  .toolbar input[type=number]{
    width:140px; padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:9px 16px; border-radius:9px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit; font-weight:700; cursor:pointer;
  }
  .toolbar button:hover{background:#334155}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:var(--accent-dark)}
  .chk{cursor:pointer}
  .score-chip{
    padding:8px 14px; border-radius:999px;
    background:#1e293b; border:1px solid #334155;
    font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;
  }

  /* sheet */
  .sheet{
    background:#fff;
    max-width:1180px;
    margin:26px auto 60px;
    padding:34px 38px 46px;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
  }
  .sheet-head h1{margin:0; font-size:30px; letter-spacing:.4px; font-weight:800}
  .meta{margin-left:auto; display:flex; gap:20px; font-size:14px; color:#334155}
  .meta .line{display:inline-block; width:120px; border-bottom:1px solid #94a3b8}
  .meta .line.short{width:90px}
  .meta .line.tiny{width:55px}
  .instructions{margin:16px 0 20px; font-size:15.5px; color:var(--muted); line-height:1.5}

  /* questions */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(500px, 1fr));
    gap:18px;
  }
  @media (max-width:920px){ .questions{grid-template-columns:1fr} }

  .q{
    border:2px solid var(--line-soft);
    border-radius:14px;
    padding:14px 18px 16px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px}
  .q-num{
    flex:none;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{
    font-size:16px; line-height:1.3; font-weight:700; color:#1e293b;
    padding-top:5px;
  }

  /* sequence display */
  .sequence-wrap{
    text-align:center;
    padding:10px 0 8px;
  }
  .sequence{
    display:inline-block;
    font-size: clamp(22px, 3.4vw, 32px);
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--ink);
    white-space: nowrap;
    line-height:1.2;
  }

  /* rule row */
  .rule-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px;
    margin:6px 0 14px;
  }
  .rule-label{
    font-size:17px; font-weight:800; color:var(--muted);
    letter-spacing:.2px;
  }

  /* drop slot */
  .drop-zone{border-radius:14px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:var(--accent-soft); transform:scale(1.03)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:260px; min-height:60px;
    padding:8px 18px;
    border:3px dashed #94a3b8;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; color:#94a3b8;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  /* options — single column for long phrases */
  .options{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--line-soft);
  }

  .option{
    display:flex; align-items:center; gap:12px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:2px solid var(--line-soft);
    border-radius:12px;
    background:#f8fafc;
    padding:10px 14px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .option:hover{background:#f1f5f9}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 3px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 3px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    60%{transform:translateX(6px)}
    80%{transform:translateX(-4px)}
  }
  .opt-letter{
    flex:none;
    width:28px; height:28px; border-radius:50%;
    background:#e2e8f0; color:#475569;
    font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    display:flex; align-items:center;
    justify-content:flex-start;
    min-height:32px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
    white-space:nowrap;
  }

  /* drag ghost */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 18px;
    border-radius:12px;
    background:#fff; border:2px solid var(--line-soft);
    box-shadow:0 12px 26px rgba(15,23,42,.30);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.06);
    font-size:20px; font-weight:700;
    white-space:nowrap;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }

  /* feedback */
  .q-feedback{
    margin-top:10px; min-height:20px; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* answer key */
  .key{
    margin-top:30px;
    border-top:3px solid var(--ink);
    padding-top:14px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 12px; font-size:18px; letter-spacing:.5px; font-weight:800}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:8px 12px;
    font-size:15px;
    color:#334155;
  }
  .key-grid b{color:var(--ink); font-size:17px}

  /* print */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff; font-size:14px}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#94a3b8}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .sequence{font-size:24px}
    .qmark{min-width:220px; min-height:52px; font-size:17px}
    .opt-visual{font-size:17px}
    .opt-letter{width:24px; height:24px; font-size:12px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🔢 Term-to-Term Rules</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LEVEL CONFIGURATION
     Each level specifies the number ranges and how many leading
     positions are hidden from the pupil (startPos > 1 means some
     terms are hidden before the first shown number).
     ============================================================ */
  const LEVELS = {
    1: { dMin: 2, dMax: 4,  aMin: 1,  aMax: 12, startPos: 1, numShown: 5, allowSubtract: false },
    2: { dMin: 2, dMax: 6,  aMin: 8,  aMax: 25, startPos: 1, numShown: 5, allowSubtract: true  },
    3: { dMin: 2, dMax: 5,  aMin: 1,  aMax: 18, startPos: 2, numShown: 4, allowSubtract: true  },
    4: { dMin: 3, dMax: 5,  aMin: 1,  aMax: 15, startPos: 3, numShown: 4, allowSubtract: true  },
    5: { dMin: 3, dMax: 6,  aMin: 1,  aMax: 12, startPos: 4, numShown: 4, allowSubtract: true  }
  };

  /* Pick a level based on the position on the worksheet.
     pos = 0 → mostly level 1; pos = 1 → mostly level 5. */
  function pickLevel(pos) {
    const target = 1 + pos * 4;
    const sigma = 1.0;
    const weights = [1, 2, 3, 4, 5].map(L =>
      Math.exp(-0.5 * Math.pow((L - target) / sigma, 2))
    );
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < 5; i++) {
      r -= weights[i];
      if (r <= 0) return i + 1;
    }
    return 5;
  }

  /* ============================================================
     TYPE G — two terms visible, separated by two hidden terms.

     The sequence is displayed as:
         …, v1, …, …, v2, …
     where v1 is at position 2 and v2 at position 5, giving three
     steps between them. The pupil has to:
         1. count the gap (three steps)
         2. work out the common difference d = (v2 - v1) / 3
         3. work backwards from v1 by one step to find the start s

     This forces the pupil to reason about the structure of the
     sequence rather than just reading off the difference between
     two consecutive visible terms.
     ============================================================ */
  function generateTypeG() {
    for (let attempt = 0; attempt < 60; attempt++) {
      const d = ri(2, 8);
      const sign = rng() < 0.5 ? 1 : -1;
      const signedD = sign * d;

      /* Fixed pattern: v1 at position 2, v2 at position 5.
         That means two hidden terms between v1 and v2 (three steps). */
      const p1 = 2, p2 = 5;

      /* Choose the starting value s so all shown terms stay >= 1. */
      let sLo = 1, sHi = 12;
      if (signedD < 0) {
        /* v2 = s + (p2-1)*signedD must be >= 1, so
           s >= (p2-1)*d + 1 = 4d + 1. */
        sLo = Math.max(sLo, (p2 - 1) * d + 1);
        sHi = sLo + 10;
      }
      if (sLo > sHi) continue;
      const s = ri(sLo, sHi);

      const v1 = s + (p1 - 1) * signedD;
      const v2 = s + (p2 - 1) * signedD;

      /* Sanity check: keep everything modest in size. */
      if (v1 < 1 || v2 < 1 || v2 > 200) continue;

      const display = '…, ' + v1 + ', …, …, ' + v2 + ', …';

      const verb = signedD > 0 ? 'add' : 'subtract';
      const correctText = 'Start with ' + s + ', then ' + verb + ' ' + d;

      /* ---- distractor pool ---- */
      const pool = [];
      const seen = new Set([correctText]);
      const addRule = (S, V, M) => {
        if (S < 1 || M < 1) return;
        if (S > 80 || M > 20) return;
        const txt = 'Start with ' + S + ', then ' + V + ' ' + M;
        if (seen.has(txt)) return;
        seen.add(txt);
        pool.push(txt);
      };

      /* 1. Thought the first shown term was the start. */
      addRule(v1, verb, d);

      /* 2. Off by one on the start. */
      addRule(s + 1, verb, d);
      if (s > 1) addRule(s - 1, verb, d);

      /* 3. Off by one on the difference. */
      addRule(s, verb, d + 1);
      if (d > 2) addRule(s, verb, d - 1);

      /* 4. Wrong direction. */
      addRule(s, signedD > 0 ? 'subtract' : 'add', d);

      /* 5. Wrong gap size — dividing by the wrong number of steps.
         Only add these if the division is exact. */
      const totalSteps = v2 - v1;
      if (totalSteps !== 0) {
        const dWrong2 = totalSteps / 2;
        if (Number.isInteger(dWrong2) && dWrong2 > 0) {
          /* If they thought only two steps: d = (v2-v1)/2, still
             work back from v1 by one step of dWrong2. */
          const sWrong2 = v1 - dWrong2;
          addRule(sWrong2, verb, Math.abs(dWrong2));
        }
        const dWrong4 = totalSteps / 4;
        if (Number.isInteger(dWrong4) && dWrong4 > 0) {
          const sWrong4 = v1 - dWrong4;
          addRule(sWrong4, verb, Math.abs(dWrong4));
        }
      }

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);
      const opts = shuffle([
        { text: correctText, ok: true },
        ...distractors.map(t => ({ text: t, ok: false }))
      ]);

      const sig = 'G|' + s + '|' + signedD;

      return { sig, sequenceStr: display, options: opts };
    }
    return null;
  }

  /* ============================================================
     STANDARD QUESTION GENERATOR (levels 1–5)
     ============================================================ */
  function generateStandard(pos) {
    for (let attempt = 0; attempt < 120; attempt++) {
      const level = pickLevel(pos);
      const cfg = LEVELS[level];

      const d = ri(cfg.dMin, cfg.dMax);
      const sign = (cfg.allowSubtract && rng() < 0.5) ? -1 : 1;
      const signedD = sign * d;

      const maxPos = cfg.startPos + cfg.numShown - 1;

      let aLo = cfg.aMin, aHi = cfg.aMax;
      if (signedD < 0) {
        const required = (maxPos - 1) * d + 1;
        aLo = Math.max(aLo, required);
        if (aLo > aHi) aHi = aLo + 12;
      }
      if (aLo > aHi) continue;
      const a = ri(aLo, aHi);

      const tokens = [];
      for (let i = 1; i < cfg.startPos; i++) tokens.push('…');
      for (let i = 0; i < cfg.numShown; i++) {
        const p = cfg.startPos + i;
        tokens.push(String(a + (p - 1) * signedD));
      }
      tokens.push('…');
      const sequenceStr = tokens.join(', ');

      const verb = signedD > 0 ? 'add' : 'subtract';
      const otherVerb = signedD > 0 ? 'subtract' : 'add';
      const mag = Math.abs(signedD);
      const correctText = 'Start with ' + a + ', then ' + verb + ' ' + mag;

      const pool = [];
      const seen = new Set([correctText]);
      const addRule = (startVal, v, m) => {
        if (startVal < 1) return;
        if (m < 1) return;
        if (startVal > 60 || m > 15) return;
        const s = 'Start with ' + startVal + ', then ' + v + ' ' + m;
        if (seen.has(s)) return;
        seen.add(s);
        pool.push(s);
      };

      const firstShown = a + (cfg.startPos - 1) * signedD;
      if (firstShown > 0 && firstShown !== a) {
        addRule(firstShown, verb, mag);
      }
      addRule(a, otherVerb, mag);
      addRule(a, verb, mag + 1);
      if (mag > 1) addRule(a, verb, mag - 1);
      addRule(a + 1, verb, mag);
      if (a > 1) addRule(a - 1, verb, mag);
      if (mag !== a) addRule(mag, verb, a);

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);
      const opts = shuffle([
        { text: correctText, ok: true },
        ...distractors.map(t => ({ text: t, ok: false }))
      ]);

      const sig = 'T|' + a + '|' + signedD + '|' + cfg.startPos + '|' + cfg.numShown;

      return { sig, sequenceStr, options: opts };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS
     On the last two questions, there is a 50% chance that the
     question is a Type G. Otherwise the normal gradient applies.
     ============================================================ */
  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const isLastTwo = (out.length >= n - 2);

      let q = null;
      try {
        if (isLastTwo && rng() < 0.5) {
          q = generateTypeG();
          /* If Type G failed to generate, fall through to standard. */
          if (!q) q = generateStandard(pos);
        } else {
          q = generateStandard(pos);
        }
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow duplicates rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 400) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = generateStandard(pos);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + o.text + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">What is the term-to-term rule of this sequence?</span>' +
      '</div>' +
      '<div class="sequence-wrap"><span class="sequence">' + q.sequenceStr + '</span></div>' +
      '<div class="rule-row">' +
        '<span class="rule-label">Rule:</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);

    questions = buildQuestions(n);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Term-to-Term Rules</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Each sequence follows a simple rule. ' +
        'Work out the <b>starting number</b> and the <b>step</b> between terms. ' +
        'Drag the correct rule into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.textContent = src ? src.textContent : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;
    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;
    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');
    if (cancelled) return;
    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;
    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;
    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;
    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
    const state = qState[qi];
    if (state) state.attempts++;
    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;
    if (slot) {
      slot.textContent = q.options[idx].text;
      slot.classList.add('filled');
    }
    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  function randomSeed() {
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % 1000000000;
    }
    return Math.floor(
      ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0
    ) % 1000000000;
  }

  function getSeedFromURL() {
    const m = /[?&]seed=(\d+)/.exec(window.location.search);
    if (m) return parseInt(m[1], 10) >>> 0;
    return null;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = randomSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : randomSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
