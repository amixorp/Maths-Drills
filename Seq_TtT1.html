<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Term-to-Term Rules — Practice</title>
<link rel="stylesheet" href="core/drill.css">
<style>
  :root{
    --q-min:500px; --opt-size:20px;
    --slot-min-w:260px; --slot-min-h:60px; --slot-font:20px;
  }
  /* The rules are long, so answers sit one per row. */
  .options{grid-template-columns:1fr}

  .sequence-wrap{text-align:center; padding:10px 0 8px; overflow-x:auto}
  .sequence{
    display:inline-block;
    font-size:clamp(18px, 5.5vw, 32px);
    font-weight:800; letter-spacing:1px; line-height:1.2;
    color:var(--ink); white-space:nowrap;
  }
  .rule-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px; margin:6px 0 14px;
  }
  .rule-label{font-size:17px; font-weight:800; color:var(--muted); letter-spacing:.2px}
  @media print{ .sequence{font-size:24px} }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LEVEL CONFIGURATION
     Each level specifies the number ranges and how many leading
     positions are hidden from the pupil (startPos > 1 means some
     terms are hidden before the first shown number).
     ============================================================ */
  const LEVELS = {
    1: { dMin: 2, dMax: 4,  aMin: 1,  aMax: 12, startPos: 1, numShown: 5, allowSubtract: false },
    2: { dMin: 2, dMax: 6,  aMin: 8,  aMax: 25, startPos: 1, numShown: 5, allowSubtract: true  },
    3: { dMin: 2, dMax: 5,  aMin: 1,  aMax: 18, startPos: 2, numShown: 4, allowSubtract: true  },
    4: { dMin: 3, dMax: 5,  aMin: 1,  aMax: 15, startPos: 3, numShown: 4, allowSubtract: true  },
    5: { dMin: 3, dMax: 6,  aMin: 1,  aMax: 12, startPos: 4, numShown: 4, allowSubtract: true  }
  };

  /* Pick a level based on the position on the worksheet.
     pos = 0 → mostly level 1; pos = 1 → mostly level 5. */
  function pickLevel(pos) {
    const target = 1 + pos * 4;
    const sigma = 1.0;
    const weights = [1, 2, 3, 4, 5].map(L =>
      Math.exp(-0.5 * Math.pow((L - target) / sigma, 2))
    );
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rng() * total;
    for (let i = 0; i < 5; i++) {
      r -= weights[i];
      if (r <= 0) return i + 1;
    }
    return 5;
  }

  /* ============================================================
     TYPE G — two terms visible, separated by two hidden terms.

     The sequence is displayed as:
         …, v1, …, …, v2, …
     where v1 is at position 2 and v2 at position 5, giving three
     steps between them. The pupil has to:
         1. count the gap (three steps)
         2. work out the common difference d = (v2 - v1) / 3
         3. work backwards from v1 by one step to find the start s

     This forces the pupil to reason about the structure of the
     sequence rather than just reading off the difference between
     two consecutive visible terms.
     ============================================================ */
  function generateTypeG() {
    for (let attempt = 0; attempt < 60; attempt++) {
      const d = ri(2, 8);
      const sign = rng() < 0.5 ? 1 : -1;
      const signedD = sign * d;

      /* Fixed pattern: v1 at position 2, v2 at position 5.
         That means two hidden terms between v1 and v2 (three steps). */
      const p1 = 2, p2 = 5;

      /* Choose the starting value s so all shown terms stay >= 1. */
      let sLo = 1, sHi = 12;
      if (signedD < 0) {
        /* v2 = s + (p2-1)*signedD must be >= 1, so
           s >= (p2-1)*d + 1 = 4d + 1. */
        sLo = Math.max(sLo, (p2 - 1) * d + 1);
        sHi = sLo + 10;
      }
      if (sLo > sHi) continue;
      const s = ri(sLo, sHi);

      const v1 = s + (p1 - 1) * signedD;
      const v2 = s + (p2 - 1) * signedD;

      /* Sanity check: keep everything modest in size. */
      if (v1 < 1 || v2 < 1 || v2 > 200) continue;

      const display = '…, ' + v1 + ', …, …, ' + v2 + ', …';

      const verb = signedD > 0 ? 'add' : 'subtract';
      const correctText = 'Start with ' + s + ', then ' + verb + ' ' + d;

      /* ---- distractor pool ---- */
      const pool = [];
      const seen = new Set([correctText]);
      const addRule = (S, V, M) => {
        if (S < 1 || M < 1) return;
        if (S > 80 || M > 20) return;
        const txt = 'Start with ' + S + ', then ' + V + ' ' + M;
        if (seen.has(txt)) return;
        seen.add(txt);
        pool.push(txt);
      };

      /* 1. Thought the first shown term was the start. */
      addRule(v1, verb, d);

      /* 2. Off by one on the start. */
      addRule(s + 1, verb, d);
      if (s > 1) addRule(s - 1, verb, d);

      /* 3. Off by one on the difference. */
      addRule(s, verb, d + 1);
      if (d > 2) addRule(s, verb, d - 1);

      /* 4. Wrong direction. */
      addRule(s, signedD > 0 ? 'subtract' : 'add', d);

      /* 5. Wrong gap size — dividing by the wrong number of steps.
         Only add these if the division is exact. */
      const totalSteps = v2 - v1;
      if (totalSteps !== 0) {
        const dWrong2 = totalSteps / 2;
        if (Number.isInteger(dWrong2) && dWrong2 > 0) {
          /* If they thought only two steps: d = (v2-v1)/2, still
             work back from v1 by one step of dWrong2. */
          const sWrong2 = v1 - dWrong2;
          addRule(sWrong2, verb, Math.abs(dWrong2));
        }
        const dWrong4 = totalSteps / 4;
        if (Number.isInteger(dWrong4) && dWrong4 > 0) {
          const sWrong4 = v1 - dWrong4;
          addRule(sWrong4, verb, Math.abs(dWrong4));
        }
      }

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);
      const opts = shuffle([
        { text: correctText, ok: true },
        ...distractors.map(t => ({ text: t, ok: false }))
      ]);

      const sig = 'G|' + s + '|' + signedD;

      return { sig, sequenceStr: display, options: opts };
    }
    return null;
  }

  /* ============================================================
     STANDARD QUESTION GENERATOR (levels 1–5)
     ============================================================ */
  function generateStandard(pos) {
    for (let attempt = 0; attempt < 120; attempt++) {
      const level = pickLevel(pos);
      const cfg = LEVELS[level];

      const d = ri(cfg.dMin, cfg.dMax);
      const sign = (cfg.allowSubtract && rng() < 0.5) ? -1 : 1;
      const signedD = sign * d;

      const maxPos = cfg.startPos + cfg.numShown - 1;

      let aLo = cfg.aMin, aHi = cfg.aMax;
      if (signedD < 0) {
        const required = (maxPos - 1) * d + 1;
        aLo = Math.max(aLo, required);
        if (aLo > aHi) aHi = aLo + 12;
      }
      if (aLo > aHi) continue;
      const a = ri(aLo, aHi);

      const tokens = [];
      for (let i = 1; i < cfg.startPos; i++) tokens.push('…');
      for (let i = 0; i < cfg.numShown; i++) {
        const p = cfg.startPos + i;
        tokens.push(String(a + (p - 1) * signedD));
      }
      tokens.push('…');
      const sequenceStr = tokens.join(', ');

      const verb = signedD > 0 ? 'add' : 'subtract';
      const otherVerb = signedD > 0 ? 'subtract' : 'add';
      const mag = Math.abs(signedD);
      const correctText = 'Start with ' + a + ', then ' + verb + ' ' + mag;

      const pool = [];
      const seen = new Set([correctText]);
      const addRule = (startVal, v, m) => {
        if (startVal < 1) return;
        if (m < 1) return;
        if (startVal > 60 || m > 15) return;
        const s = 'Start with ' + startVal + ', then ' + v + ' ' + m;
        if (seen.has(s)) return;
        seen.add(s);
        pool.push(s);
      };

      const firstShown = a + (cfg.startPos - 1) * signedD;
      if (firstShown > 0 && firstShown !== a) {
        addRule(firstShown, verb, mag);
      }
      addRule(a, otherVerb, mag);
      addRule(a, verb, mag + 1);
      if (mag > 1) addRule(a, verb, mag - 1);
      addRule(a + 1, verb, mag);
      if (a > 1) addRule(a - 1, verb, mag);
      if (mag !== a) addRule(mag, verb, a);

      if (pool.length < 3) continue;

      const distractors = shuffle(pool).slice(0, 3);
      const opts = shuffle([
        { text: correctText, ok: true },
        ...distractors.map(t => ({ text: t, ok: false }))
      ]);

      const sig = 'T|' + a + '|' + signedD + '|' + cfg.startPos + '|' + cfg.numShown;

      return { sig, sequenceStr, options: opts };
    }
    return null;
  }

  /* ============================================================
     BUILD QUESTIONS
     On the last two questions, there is a 50% chance that the
     question is a Type G. Otherwise the normal gradient applies.
     ============================================================ */
  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const isLastTwo = (out.length >= n - 2);

      let q = null;
      try {
        if (isLastTwo && rng() < 0.5) {
          q = generateTypeG();
          /* If Type G failed to generate, fall through to standard. */
          if (!q) q = generateStandard(pos);
        } else {
          q = generateStandard(pos);
        }
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow duplicates rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 400) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = generateStandard(pos);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'term-to-term-rules',
    title: 'Term-to-Term Rules',
    toolbarTitle: '🔢 Term-to-Term Rules',
    counts: [4, 6, 8, 10],
    defaultCount: 10,
    instructions: 'Each sequence follows a simple rule. ' +
                  'Work out the <b>starting number</b> and the <b>step</b> between terms.',
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n);
    },
    renderPrompt: () => 'What is the term-to-term rule of this sequence?',
    renderBody: q =>
      '<div class="sequence-wrap"><span class="sequence">' + q.sequenceStr + '</span></div>' +
      '<div class="rule-row">' +
        '<span class="rule-label">Rule:</span>' +
        Drill.slot() +
      '</div>'
  });
})();
</script>
</body>
</html>
