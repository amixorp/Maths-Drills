<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expanding Brackets — Practice</title>
<style>
  :root{
    --ink:#0f172a;
    --muted:#64748b;
    --line:#cbd5e1;
    --line-soft:#e2e8f0;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#dbeafe;
    --page:#eef2f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:var(--page);
    font-size:17px;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* toolbar */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:14px 22px;
    background:#0f172a; color:#f9fafb;
    box-shadow:0 2px 10px rgba(15,23,42,.25);
    font-size:15px;
  }
  .tb-title{font-weight:800; margin-right:auto; letter-spacing:.3px; font-size:16px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e2e8f0}
  .toolbar input[type=number]{
    width:140px; padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:8px 10px; border-radius:8px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:9px 16px; border-radius:9px; border:1px solid #334155;
    background:#1e293b; color:#f9fafb; font:inherit; font-weight:700; cursor:pointer;
  }
  .toolbar button:hover{background:#334155}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:var(--accent-dark)}
  .chk{cursor:pointer}
  .score-chip{
    padding:8px 14px; border-radius:999px;
    background:#1e293b; border:1px solid #334155;
    font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap;
  }

  /* sheet */
  .sheet{
    background:#fff;
    max-width:1180px;
    margin:26px auto 60px;
    padding:34px 38px 46px;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:12px;
  }
  .sheet-head h1{margin:0; font-size:30px; letter-spacing:.4px; font-weight:800}
  .meta{margin-left:auto; display:flex; gap:20px; font-size:14px; color:#334155}
  .meta .line{display:inline-block; width:120px; border-bottom:1px solid #94a3b8}
  .meta .line.short{width:90px}
  .meta .line.tiny{width:55px}
  .instructions{margin:16px 0 20px; font-size:15.5px; color:var(--muted); line-height:1.5}

  /* questions */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(500px, 1fr));
    gap:18px;
  }
  @media (max-width:920px){ .questions{grid-template-columns:1fr} }

  .q{
    border:2px solid var(--line-soft);
    border-radius:14px;
    padding:14px 18px 16px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px}
  .q-num{
    flex:none;
    width:30px; height:30px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:15px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{
    font-size:16px; line-height:1.3; font-weight:700; color:#1e293b;
    padding-top:5px;
  }

  /* expression display */
  .sequence-wrap{
    text-align:center;
    padding:10px 0 8px;
  }
  .sequence{
    display:inline-block;
    font-size: clamp(22px, 3.4vw, 32px);
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--ink);
    white-space: nowrap;
    line-height:1.2;
  }
  /* maths typography: variables italic, numbers upright */
  .sequence i,
  .opt-visual i,
  .qmark i,
  .drag-ghost i{
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
    padding-right: 1px;
  }

  /* answer row */
  .rule-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:12px;
    margin:6px 0 14px;
  }
  .rule-label{
    font-size:17px; font-weight:800; color:var(--muted);
    letter-spacing:.2px;
  }

  /* drop slot */
  .drop-zone{border-radius:14px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:var(--accent-soft); transform:scale(1.03)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:260px; min-height:60px;
    padding:8px 18px;
    border:3px dashed #94a3b8;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; color:#94a3b8;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  /* options — auto-fitting tiles instead of one full-width column */
  .options{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
    gap:8px;
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--line-soft);
  }

  .option{
    display:flex; align-items:center; gap:12px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:2px solid var(--line-soft);
    border-radius:12px;
    background:#f8fafc;
    padding:10px 14px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .option:hover{background:#f1f5f9}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 3px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 3px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    60%{transform:translateX(6px)}
    80%{transform:translateX(-4px)}
  }
  .opt-letter{
    flex:none;
    width:28px; height:28px; border-radius:50%;
    background:#e2e8f0; color:#475569;
    font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    display:flex; align-items:center;
    justify-content:flex-start;
    min-height:32px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
    white-space:nowrap;
  }

  /* drag ghost */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 18px;
    border-radius:12px;
    background:#fff; border:2px solid var(--line-soft);
    box-shadow:0 12px 26px rgba(15,23,42,.30);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.06);
    font-size:20px; font-weight:700;
    white-space:nowrap;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }

  /* feedback */
  .q-feedback{
    margin-top:10px; min-height:20px; text-align:center;
    font-size:15px; font-weight:800; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* answer key */
  .key{
    margin-top:30px;
    border-top:3px solid var(--ink);
    padding-top:14px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 12px; font-size:18px; letter-spacing:.5px; font-weight:800}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(80px,1fr));
    gap:8px 12px;
    font-size:15px;
    color:#334155;
  }
  .key-grid b{color:var(--ink); font-size:17px}

  /* print */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff; font-size:14px}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#94a3b8}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
    .sequence{font-size:24px}
    .qmark{min-width:220px; min-height:52px; font-size:17px}
    .opt-visual{font-size:17px}
    .opt-letter{width:24px; height:24px; font-size:12px}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🧮 Expanding Brackets</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option>6</option>
      <option>8</option>
      <option selected>10</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <button id="shareBtn">🔗 Copy link to this sheet</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 10 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LETTERS & ALGEBRA FORMATTING
     ------------------------------------------------------------
     A "term" is {c: coefficient, l: letter-string}.  A constant
     has l === ''.  A product of two letters is stored as a
     two-character string sorted alphabetically (x·y -> 'xy').

     All generators are careful never to multiply a letter by
     itself, so no squared / cubed terms are ever produced.

     Letters are wrapped in <i> so they render in italics (numbers
     stay upright), following standard mathematical typography.
     ============================================================ */
  const LETTER_POOL = ['a','b','c','d','e','f','g','h','i','j','k',
                       'm','n','p','q','r','s','t','u','v','w','x','y','z'];
  const MINUS = '\u2212';                       // proper minus sign

  const pickLetters = k => shuffle(LETTER_POOL).slice(0, k);
  const T = (c, l) => ({ c: c, l: l || '' });
  const sortLetters = s => s.split('').sort().join('');

  function termToString(t) {
    const a = Math.abs(t.c);
    if (!t.l) return String(a);
    return (a === 1 ? '' : String(a)) + '<i>' + t.l + '</i>';
  }

  function exprToString(terms) {
    let s = '';
    for (let i = 0; i < terms.length; i++) {
      const t = terms[i];
      const body = termToString(t);
      if (i === 0) s += (t.c < 0 ? MINUS : '') + body;
      else         s += (t.c < 0 ? ' ' + MINUS + ' ' : ' + ') + body;
    }
    return s;
  }

  /* multiply every term in the bracket by the multiplier */
  function expand(srcTerms, mult) {
    return srcTerms.map(t => {
      if (mult.kind === 'num') return T(t.c * mult.v, t.l);
      if (!t.l) return T(t.c, mult.l);                     // 3 · x  ->  3x
      return T(t.c, sortLetters(mult.l + t.l));            // x · y  ->  xy
    });
  }

  function bracketString(srcTerms, mult) {
    const m = (mult.kind === 'num') ? String(mult.v) : '<i>' + mult.l + '</i>';
    return m + '(' + exprToString(srcTerms) + ')';
  }

  /* ============================================================
     SHAPES — one per difficulty level (1 = easiest, 10 = hardest)
     ------------------------------------------------------------
     Levels 1–4 are deliberately kept to small times tables so that
     Foundation pupils can build confidence before the numbers grow.

     1  a(x + b)              a∈2..4,  b∈2..4     (2s, 3s, 4s only)
     2  a(x + b)              a∈2..5,  b∈2..5     (adds 5s)
     3  a(x + b)              a∈2..6,  b∈2..6     (adds 6s)
     4  a(x + b)              a∈2..7,  b∈2..7     (adds 7s)
     5  a(x − b) / a(b − x)   a∈2..5,  b∈2..5     (subtraction, small)
     6  a(bx + c)             a∈2..5,  b∈2..4, c∈2..6   (coeff inside)
     7  a(bx − c) / a(c − bx) a∈2..6,  b∈2..5, c∈2..8   (coeff + subtract)
     8  a(bx + cy ± d)  or  a(d − bx + cy)          (three terms)
     9  m(bx ± c)             m letter, b∈2..6, c∈2..8   (letter outside)
    10  m(bx + cy ± d)        m letter, b,c∈2..5, d∈2..8 (letter + 3 terms)

     Within the subtraction levels, roughly 30% of questions put a
     number first inside the bracket, e.g. 3(5 − x), 2(3 − 2m),
     5(6 − 2b + 3c).
     ============================================================ */
  function makeShape(level) {
    if (level === 1) {
      const a = ri(2, 4), b = ri(2, 4);
      const [L] = pickLetters(1);
      return { mult: { kind: 'num', v: a }, terms: [T(1, L), T(b, '')] };
    }

    if (level === 2) {
      const a = ri(2, 5), b = ri(2, 5);
      const [L] = pickLetters(1);
      return { mult: { kind: 'num', v: a }, terms: [T(1, L), T(b, '')] };
    }

    if (level === 3) {
      const a = ri(2, 6), b = ri(2, 6);
      const [L] = pickLetters(1);
      return { mult: { kind: 'num', v: a }, terms: [T(1, L), T(b, '')] };
    }

    if (level === 4) {
      const a = ri(2, 7), b = ri(2, 7);
      const [L] = pickLetters(1);
      return { mult: { kind: 'num', v: a }, terms: [T(1, L), T(b, '')] };
    }

    if (level === 5) {
      const a = ri(2, 5), b = ri(2, 5);
      const [L] = pickLetters(1);
      /* ~30% number first:  3(5 − x)   →   a(b − L)
         rest letter first:  3(x − 5)   →   a(L − b)  */
      return rng() < 0.3
        ? { mult: { kind: 'num', v: a }, terms: [T(b, ''), T(-1, L)] }   // a(b − L)
        : { mult: { kind: 'num', v: a }, terms: [T(1, L), T(-b, '')] };  // a(L − b)
    }

    if (level === 6) {
      const a = ri(2, 5), b = ri(2, 4), c = ri(2, 6);
      const [L] = pickLetters(1);
      return { mult: { kind: 'num', v: a }, terms: [T(b, L), T(c, '')] };
    }

    if (level === 7) {
      const a = ri(2, 6), b = ri(2, 5), c = ri(2, 8);
      const [L] = pickLetters(1);
      /* ~30% number first:  2(3 − 2m)  →   a(c − bL)
         rest letter first:  2(2m − 3)  →   a(bL − c)  */
      return rng() < 0.3
        ? { mult: { kind: 'num', v: a }, terms: [T(c, ''), T(-b, L)] }    // a(c − bL)
        : { mult: { kind: 'num', v: a }, terms: [T(b, L), T(-c, '')] };   // a(bL − c)
    }

    if (level === 8) {
      const a = ri(2, 5), b = ri(2, 4), c = ri(2, 4), d = ri(2, 6);
      const [L1, L2] = pickLetters(2);
      const r = rng();
      /* ~30% number first:  5(6 − 2b + 3c)  →   a(d − bL1 + cL2)  */
      if (r < 0.3) {
        return { mult: { kind: 'num', v: a },
                 terms: [T(d, ''), T(-b, L1), T(c, L2)] };
      }
      /* ~35% subtraction on the middle term */
      if (r < 0.65) {
        return { mult: { kind: 'num', v: a },
                 terms: [T(b, L1), T(-c, L2), T(d, '')] };
      }
      /* ~35% all positive */
      return { mult: { kind: 'num', v: a },
               terms: [T(b, L1), T(c, L2), T(d, '')] };
    }

    if (level === 9) {
      const [M, L] = pickLetters(2);
      const b = ri(2, 6), c = ri(2, 8);
      return rng() < 0.5
        ? { mult: { kind: 'var', l: M }, terms: [T(b, L), T(c, '')] }
        : { mult: { kind: 'var', l: M }, terms: [T(b, L), T(-c, '')] };
    }

    /* level 10 */
    const [M, L1, L2] = pickLetters(3);
    const b = ri(2, 5), c = ri(2, 5), d = ri(2, 8);
    return rng() < 0.5
      ? { mult: { kind: 'var', l: M }, terms: [T(b, L1), T(c, L2), T(d, '')] }
      : { mult: { kind: 'var', l: M }, terms: [T(b, L1), T(-c, L2), T(d, '')] };
  }

  /* ============================================================
     DISTRACTORS
     ------------------------------------------------------------
     Built from the classic expansion mistakes, so every wrong
     option is a believable slip rather than a random expression.
     ============================================================ */
  function buildOptions(srcTerms, mult) {
    const correct = expand(srcTerms, mult);
    const correctStr = exprToString(correct);

    const seen = new Set([correctStr]);
    const primary = [];
    const fallback = [];

    const push = (bucket, terms) => {
      if (!terms || !terms.length) return;
      if (terms.some(t => !t || t.c === 0)) return;
      const s = exprToString(terms);
      if (seen.has(s)) return;
      seen.add(s);
      bucket.push(s);
    };

    const flip = i => {
      if (i < 0 || i >= correct.length) return null;
      const t = correct.slice();
      t[i] = T(-t[i].c, t[i].l);
      return t;
    };

    /* swap a term back to its un-multiplied form */
    const unmult = i => {
      if (i < 0 || i >= srcTerms.length) return null;
      const t = correct.slice();
      t[i] = T(srcTerms[i].c, srcTerms[i].l);
      if (t[i].c === correct[i].c && t[i].l === correct[i].l) return null;
      return t;
    };

    const last = correct.length - 1;

    /* --- believable mistakes --- */
    push(primary, unmult(last));                 // forgot to multiply the last term
    push(primary, flip(last));                   // sign slip on the last term
    push(primary, unmult(0));                    // forgot to multiply the first term
    if (correct.length > 2) push(primary, flip(1));   // sign slip on the middle term

    if (mult.kind === 'num' && mult.v > 2) {     // wrong multiplier throughout
      push(primary, expand(srcTerms, { kind: 'num', v: mult.v + 1 }));
      push(primary, expand(srcTerms, { kind: 'num', v: mult.v - 1 }));
    }

    /* added the multiplier to the constant instead of multiplying */
    if (mult.kind === 'num' && srcTerms[last].l === '' && srcTerms[last].c > 0) {
      const t = correct.slice();
      t[last] = T(srcTerms[last].c + mult.v, '');
      push(primary, t);
    }

    /* --- last resort: nudge one coefficient --- */
    if (primary.length < 3) {
      for (let i = 0; i < correct.length; i++) {
        for (const delta of [1, -1, 2, -2]) {
          const t = correct.slice();
          const nc = t[i].c + delta;
          if (nc === 0) continue;
          t[i] = T(nc, t[i].l);
          push(fallback, t);
        }
      }
    }

    let pool = shuffle(primary);
    if (pool.length < 3) pool = pool.concat(shuffle(fallback));
    if (pool.length < 3) return null;

    const chosen = pool.slice(0, 3);
    const options = shuffle([
      { text: correctStr, ok: true },
      ...chosen.map(s => ({ text: s, ok: false }))
    ]);
    return { correctStr, options };
  }

  /* ============================================================
     QUESTION BUILDING
     ============================================================ */
  function makeQuestion(level) {
    for (let att = 0; att < 60; att++) {
      const shape = makeShape(level);
      if (!shape) continue;
      const built = buildOptions(shape.terms, shape.mult);
      if (!built) continue;
      const seq = bracketString(shape.terms, shape.mult);
      return { sig: seq, sequenceStr: seq, options: built.options };
    }
    return null;
  }

  /* Spread the 10 levels evenly across the sheet.  With the default
     10 questions this gives one of each level; with fewer questions
     it still starts very easy and ends harder. */
  function levelForPosition(i, n) {
    if (n <= 1) return 5;
    const lv = 1 + Math.floor(i * 10 / n);
    return Math.max(1, Math.min(10, lv));
  }

  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 4000) {
      guard++;
      const level = levelForPosition(out.length, n);
      let q = null;
      try { q = makeQuestion(level); }
      catch (err) { if (typeof console !== 'undefined') console.warn(err); continue; }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* safety net — allow repeats rather than render too few questions */
    let g2 = 0;
    while (out.length < n && g2 < 400) {
      g2++;
      const q = makeQuestion(levelForPosition(out.length, n));
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + o.text + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">Expand the brackets.</span>' +
      '</div>' +
      '<div class="sequence-wrap"><span class="sequence">' + q.sequenceStr + '</span></div>' +
      '<div class="rule-row">' +
        '<span class="rule-label">Expansion:</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);

    questions = buildQuestions(n);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Expanding Brackets</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Multiply <b>every</b> term inside the bracket by the number (or letter) outside. ' +
        'The questions start with small times tables and get gradually harder. ' +
        'Drag the correct expansion into the box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;
    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;
    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');
    if (cancelled) return;
    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;
    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;
    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;
    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
    const state = qState[qi];
    if (state) state.attempts++;
    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;
    if (slot) {
      slot.innerHTML = q.options[idx].text;
      slot.classList.add('filled');
    }
    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  document.getElementById('shareBtn').addEventListener('click', () => {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seedInput.value);
    navigator.clipboard.writeText(url.toString()).then(
      () => {
        const b = document.getElementById('shareBtn');
        b.textContent = '✅ Link copied';
        setTimeout(() => { b.textContent = '🔗 Copy link to this sheet'; }, 1500);
      },
      () => window.prompt('Copy this link:', url.toString())
    );
  });

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  /* Remove ?seed=... once used, so a reload gives a brand-new sheet. */
  function clearSeedFromURL() {
    const url = new URL(window.location.href);
    if (!url.searchParams.has('seed')) return;
    url.searchParams.delete('seed');
    window.history.replaceState({}, '', url);
  }

  function randomSeed() {
    if (window.crypto && typeof window.crypto.getRandomValues === 'function') {
      const buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % 1000000000;
    }
    return Math.floor(
      ((Date.now() & 0x7fffffff) ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0
    ) % 1000000000;
  }

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = randomSeed();
    applySeed();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => { applySeed(); render(); });
  countSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : randomSeed();
    clearSeedFromURL();
    applySeed();
    render();
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
</html>
