<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Improper Fractions → Mixed Numbers</title>
<link rel="stylesheet" href="core/drill.css">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root{
    --q-min:400px; --lhs-size:40px; --eq-size:22px; --opt-size:22px;
    --slot-min-w:150px; --slot-min-h:84px; --slot-font:26px; --diagram-min-h:96px;
  }
</style>
</head>
<body>
<main class="sheet" id="sheet"><noscript>This worksheet needs JavaScript turned on.</noscript></main>

<script src="katex/katex.min.js"></script>
<script src="core/drill.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  const pick = a => a[Math.floor(rng() * a.length)];
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }

  /* Position-weighted pick: items are equally likely when pos = 0.5,
     biased toward early items when pos < 0.5, and toward late items
     when pos > 0.5. */
  function weightedPick(items, weightFn) {
    const weights = items.map(weightFn);
    let total = 0;
    for (const w of weights) total += w;
    let r = rng() * total;
    for (let i = 0; i < items.length; i++) {
      r -= weights[i];
      if (r <= 0) return items[i];
    }
    return items[items.length - 1];
  }

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* ============================================================
     GENERATOR: improper fraction -> mixed number
     ============================================================ */
  function genImproperToMixed(pos) {
    const denominators = [2, 3, 4, 5, 6, 7, 8, 9, 10];

    for (let t = 0; t < 400; t++) {
      /* Position-weighted denominator:
         at pos = 0, weight = 1/d  (small d favoured)
         at pos = 1, weight = d    (large d favoured) */
      const d = weightedPick(denominators, x => Math.pow(x, 2 * pos - 1));

      /* Numerators > d with gcd(n, d) = 1. Cap at 9d to keep the
         whole part manageable (roughly at most 8). */
      const maxN = Math.min(9 * d, 99);
      const validNs = [];
      for (let n = d + 1; n <= maxN; n++) {
        if (gcd(n, d) === 1) validNs.push(n);
      }
      if (validNs.length === 0) continue;

      const n = pick(validNs);
      const q = Math.floor(n / d);
      const r = n % d;
      if (r === 0) continue;   /* cannot happen given gcd=1, but safe */

      const sig = 'IM|' + n + '|' + d;
      const lhs = tex('\\dfrac{' + n + '}{' + d + '}');
      const correctLatex = q + '\\,\\dfrac{' + r + '}{' + d + '}';

      /* Build the distractor pool. */
      const pool = [];
      const seen = new Set([correctLatex]);

      const addCand = (qq, rr) => {
        if (rr <= 0 || rr >= d) return;
        if (gcd(rr, d) !== 1) return;                 /* must be in lowest terms */
        const latex = qq + '\\,\\dfrac{' + rr + '}{' + d + '}';
        if (seen.has(latex)) return;
        seen.add(latex);
        pool.push({ latex });
      };

      /* Whole part only (the classic "10/3 = 3" error). */
      if (!seen.has(String(q))) {
        seen.add(String(q));
        pool.push({ latex: String(q) });
      }

      /* Fraction part only (forgot to write the whole number). */
      const fracOnly = '\\dfrac{' + r + '}{' + d + '}';
      if (!seen.has(fracOnly)) {
        seen.add(fracOnly);
        pool.push({ latex: fracOnly });
      }

      /* Off-by-one on the remainder. */
      addCand(q, r + 1);
      addCand(q, r - 1);

      /* Off-by-one on the whole part. */
      addCand(q + 1, r);
      if (q > 1) addCand(q - 1, r);

      if (pool.length < 3) continue;

      const opts = shuffle([
        { latex: correctLatex, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);

      return {
        sig,
        prompt: 'Write this improper fraction as a mixed number.',
        lhs,
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     REGISTRY
     ============================================================ */
  const GENERATORS = {
    improperToMixed: genImproperToMixed
  };

  const TYPES = ['improperToMixed'];

  /* ============================================================
     BUILD QUESTIONS — passing position into the generator
     ============================================================ */
  function buildQuestions(n) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      let q = null;
      try {
        q = GENERATORS[pick(TYPES)](pos);
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    /* Safety net — allow duplicates rather than render fewer questions. */
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const pos = n > 1 ? out.length / (n - 1) : 0.5;
      const q = GENERATORS[pick(TYPES)](pos);
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  Drill.define({
    id: 'improper-to-mixed',
    title: 'Improper Fractions → Mixed Numbers',
    toolbarTitle: '🔢 Improper Fractions → Mixed Numbers',
    counts: [4, 8, 10, 12],
    defaultCount: 8,
    instructions: 'An <b>improper fraction</b> has a numerator larger than its denominator. ' +
                  'A <b>mixed number</b> is a whole number combined with a proper fraction, like ' +
                  tex('3\,\dfrac{1}{3}') + '.',
    build: function (r, s) {
      rng = r;
      return buildQuestions(s.n);
    },
    renderOption: o => tex(o.latex)
  });
})();
</script>
</body>
</html>
