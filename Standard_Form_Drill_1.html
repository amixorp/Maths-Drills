<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standard Form — Practice</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script><style>
  :root{
    --ink:#111827;
    --muted:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--ink);
    background:#eef1f5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* KaTeX sizing: let the parent font-size control rendering */
  .katex{ font-size: 1em !important; }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:0; z-index:50;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:12px 20px;
    background:#111827; color:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    font-size:14px;
  }
  .tb-title{font-weight:700; margin-right:auto; letter-spacing:.3px}
  .toolbar label{display:flex; align-items:center; gap:6px; color:#e5e7eb}
  .toolbar input[type=number]{
    width:110px; padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar select{
    padding:6px 8px; border-radius:6px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit;
  }
  .toolbar button{
    padding:8px 14px; border-radius:8px; border:1px solid #374151;
    background:#1f2937; color:#f9fafb; font:inherit; font-weight:600; cursor:pointer;
  }
  .toolbar button:hover{background:#374151}
  .toolbar button.primary{background:var(--accent); border-color:var(--accent)}
  .toolbar button.primary:hover{background:#1d4ed8}
  .chk{cursor:pointer}
  .score-chip{
    padding:6px 12px; border-radius:999px;
    background:#1f2937; border:1px solid #374151;
    font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;
  }

  /* ---------- sheet ---------- */
  .sheet{
    background:#fff;
    max-width:1100px;
    margin:22px auto 60px;
    padding:30px 34px 42px;
    border-radius:10px;
    box-shadow:0 6px 24px rgba(15,23,42,.10);
  }
  .sheet-head{
    display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .sheet-head h1{margin:0; font-size:26px; letter-spacing:.5px}
  .meta{margin-left:auto; display:flex; gap:18px; font-size:13px; color:#374151}
  .meta .line{display:inline-block; width:110px; border-bottom:1px solid #9ca3af}
  .meta .line.short{width:80px}
  .meta .line.tiny{width:48px}
  .instructions{margin:14px 0 18px; font-size:14px; color:var(--muted); line-height:1.55}

  /* ---------- questions ---------- */
  .questions{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(400px, 1fr));
    gap:14px;
  }
  @media (max-width:880px){ .questions{grid-template-columns:1fr} }

  .q{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 12px 12px;
    background:#fff;
    break-inside:avoid;
    page-break-inside:avoid;
    display:flex; flex-direction:column;
  }
  .q-head{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px}
  .q-num{
    flex:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--ink); color:#fff;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:1px;
  }
  .q-prompt{font-size:13.5px; line-height:1.35; font-weight:600}

  /* ---------- diagram ---------- */
  .diagram{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;
    min-height:96px;
    margin:2px 0 12px;
    padding:6px 2px;
  }
  .lhs{ font-size: 24px; }
  .eq{ font-size: 22px; font-weight: 700; color: var(--muted); white-space: nowrap; }

  /* ---------- drop slot ---------- */
  .drop-zone{border-radius:12px; transition:transform .15s ease, background .15s ease}
  .drop-zone.over{background:#dbeafe; transform:scale(1.05)}
  .drop-zone.over .qmark{
    border-color:var(--accent); color:var(--accent); background:#eff6ff;
  }
  .qmark{
    min-width:120px; min-height:60px;
    padding:8px 14px;
    border:2.5px dashed #9ca3af;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; color:#9ca3af;
    white-space:nowrap;
    transition:border-color .15s, background .15s, color .15s;
  }
  .qmark.filled{border-style:solid; border-color:var(--ink); color:var(--ink)}

  /* ---------- options ---------- */
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed #e5e7eb;
  }
  @media (max-width:520px){ .options{grid-template-columns:1fr} }

  .option{
    display:flex; align-items:center; gap:8px;
    cursor:grab; touch-action:none;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fafafa;
    padding:8px 10px;
    transition:background .12s ease, box-shadow .12s ease, border-color .12s ease;
    min-width:0;
  }
  .option:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px}
  .option:hover{background:#f3f4f6}
  .option:active{cursor:grabbing}
  .option.dragging{opacity:.3}
  .option.correct{background:#dcfce7; border-color:#16a34a; box-shadow:0 0 0 2px #16a34a}
  .option.wrong{background:#fee2e2; border-color:#dc2626; box-shadow:0 0 0 2px #dc2626; animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    80%{transform:translateX(-3px)}
  }
  .opt-letter{
    flex:none;
    width:20px; height:20px; border-radius:50%;
    background:#e5e7eb; color:#374151;
    font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .opt-visual{
    flex:1;
    font-size:17px;
    display:flex; align-items:center; justify-content:center;
    min-height:32px;
    overflow-x:auto;
    overflow-y:hidden;
    min-width:0;
  }

  /* ---------- drag ghost ---------- */
  .drag-ghost{
    position:fixed; left:0; top:0; z-index:9999; pointer-events:none;
    padding:10px 16px;
    border-radius:10px;
    background:#fff; border:1.5px solid var(--line);
    box-shadow:0 10px 22px rgba(15,23,42,.28);
    display:flex; align-items:center; justify-content:center;
    transform:translate(-50%,-50%) scale(1.05);
    font-size:17px;
  }

  body.dragging-active{user-select:none; -webkit-user-select:none}
  body.dragging-active .drop-zone .qmark{
    border-color:var(--accent); color:var(--accent);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.06)}
  }

  /* ---------- per-question feedback ---------- */
  .q-feedback{
    margin-top:8px; min-height:15px; text-align:center;
    font-size:12.5px; font-weight:700; letter-spacing:.2px;
  }
  .q-feedback.ok{color:#15803d}
  .q-feedback.no{color:#b91c1c}

  /* ---------- answer key ---------- */
  .key{
    margin-top:26px;
    border-top:3px solid var(--ink);
    padding-top:12px;
    break-inside:avoid;
  }
  .key h2{margin:0 0 10px; font-size:16px; letter-spacing:.5px}
  .key-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px,1fr));
    gap:6px 10px;
    font-size:13px;
    color:#374151;
  }
  .key-grid b{color:var(--ink)}

  /* ---------- print ---------- */
  @page{ size:A4; margin:12mm; }
  @media print{
    body{background:#fff}
    .no-print{display:none !important}
    .sheet{margin:0; padding:0; max-width:none; box-shadow:none; border-radius:0}
    .q{border-color:#9ca3af}
    .q-feedback{display:none !important}
    body.dragging-active .drop-zone .qmark{animation:none}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="tb-title">🔢 Standard Form Worksheet</div>
  <label>Seed <input id="seedInput" type="number" min="0" step="1" value=""></label>
  <label>Questions
    <select id="countSelect">
      <option>4</option>
      <option selected>8</option>
      <option>10</option>
      <option>12</option>
    </select>
  </label>
  <label>Topic
    <select id="topicSelect">
      <option value="mixed" selected>Mixed</option>
      <option value="toStd">Number → Standard form</option>
      <option value="fromStd">Standard form → Number</option>
    </select>
  </label>
  <button id="regenBtn" class="primary">🎲 Generate New</button>
  <button id="resetBtn">↺ Reset answers</button>
  <button id="printBtn">🖨️ Print</button>
  <label class="chk"><input type="checkbox" id="answersChk"> Show answers</label>
  <span class="score-chip" id="scoreTag">0 / 8 correct</span>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function () {
  'use strict';

  /* ============================================================
     SEEDED RANDOM
     ============================================================ */
  let rng = Math.random;
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = a => a[Math.floor(rng() * a.length)];
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ============================================================
     LaTeX / KaTeX  RENDERING
     ============================================================ */
  function tex(latex) {
    if (typeof katex === 'undefined') {
      return '<code>' + String(latex).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</code>';
    }
    try {
      return katex.renderToString(latex, { throwOnError: false, displayMode: false });
    } catch (e) {
      return '<code>' + latex + '</code>';
    }
  }

  /* ============================================================
     STANDARD FORM HELPERS
     ============================================================ */

  /* Given a digit string (e.g. "546") and an exponent (e.g. 4),
     return the ordinary number as a string ("54600").
     The value represented is: (digits[0].digits[1..]) x 10^exp. */
  function ordinaryStr(digits, exp) {
    const L = digits.length;
    const shift = exp - (L - 1);
    if (shift >= 0) {
      return digits + '0'.repeat(shift);
    }
    const power = -shift;
    if (power >= L) {
      return '0.' + '0'.repeat(power - L) + digits;
    }
    return digits.slice(0, L - power) + '.' + digits.slice(L - power);
  }

  /* Digit string to coefficient string: "546" -> "5.46", "83" -> "8.3", "7" -> "7". */
  function coefStr(digits) {
    if (digits.length === 1) return digits;
    return digits[0] + '.' + digits.slice(1);
  }

  /* Move the decimal point. dir = +1 moves right (x10), -1 moves left (/10). */
  function moveDecimal(s, dir) {
    const parts = s.split('.');
    const int = parts[0];
    const frac = parts[1] || '';
    if (dir > 0) {
      if (frac.length === 0) return int + '0';
      return int + frac[0] + (frac.length > 1 ? '.' + frac.slice(1) : '');
    }
    if (int.length === 1) return '0.' + int + frac;
    return int.slice(0, int.length - 1) + '.' + int.slice(-1) + frac;
  }

  /* Standard form as LaTeX: "5.46 \times 10^{4}". */
  function stdFormLatex(coef, exp) {
    return coef + ' \\times 10^{' + exp + '}';
  }

  /* Insert thin-space grouping into an ordinary-number string.
     "54600"     -> "54\,600"
     "1234567"   -> "1\,234\,567"
     "0.000083"  -> "0.000\,083"
     "0.00546"   -> "0.005\,46"
     Groups in threes from the decimal point outwards, using a thin
     space (\,) so the digits stay close together. */
  function groupLatex(s) {
    const parts = s.split('.');
    let intPart = parts[0];
    const fracPart = parts.length > 1 ? parts[1] : '';

    /* Integer part: group from the right in threes. */
    if (intPart.length > 3) {
      let grouped = '';
      for (let i = 0; i < intPart.length; i++) {
        const posFromRight = intPart.length - i;
        if (i > 0 && posFromRight % 3 === 0) grouped += '\\,';
        grouped += intPart[i];
      }
      intPart = grouped;
    }

    /* Fractional part: group from the left in threes. */
    let fracGrouped = '';
    if (fracPart.length > 3) {
      for (let i = 0; i < fracPart.length; i++) {
        if (i > 0 && i % 3 === 0) fracGrouped += '\\,';
        fracGrouped += fracPart[i];
      }
    } else {
      fracGrouped = fracPart;
    }

    return fracGrouped ? intPart + '.' + fracGrouped : intPart;
  }

  /* ============================================================
     QUESTION GENERATORS
     ============================================================ */

  /* Shared: pick 1-3 significant figures. */
  function pickDigits() {
    const sf = pick([1, 2, 3]);
    let k;
    if (sf === 1) k = ri(1, 9);
    else if (sf === 2) k = ri(10, 99);
    else k = ri(100, 999);
    const digits = String(k);
    /* Avoid a trailing zero — that would give a coefficient like "5.0". */
    if (digits.length > 1 && digits.endsWith('0')) return null;
    return digits;
  }

  /* Type 1: ordinary number shown, standard form is the answer. */
  function genToStdForm() {
    for (let t = 0; t < 400; t++) {
      const digits = pickDigits();
      if (!digits) continue;

      let exp = ri(-6, 6);
      if (exp === 0) continue;

      const ordinary = ordinaryStr(digits, exp);
      if (ordinary.length > 12) continue;

      const coef = coefStr(digits);
      const sig = 'TS|' + digits + '|' + exp;
      const lhs = tex(groupLatex(ordinary));
      const correctLatex = stdFormLatex(coef, exp);

      const cands = [
        { latex: stdFormLatex(coef, exp + 1) },
        { latex: stdFormLatex(coef, exp - 1) },
        { latex: stdFormLatex(coef, -exp) },
        { latex: stdFormLatex(moveDecimal(coef, +1), exp - 1) },
        { latex: stdFormLatex(moveDecimal(coef, -1), exp + 1) }
      ];

     const seen = new Set([correctOrdinary]);
      const pool = [];
      for (const s of [d1, d2, d3]) {
        if (seen.has(s)) continue;
        seen.add(s);
        pool.push({ latex: groupLatex(s) });
      }
      if (pool.length < 3) continue;

      const opts = shuffle([
        { latex: groupLatex(correctOrdinary), ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);
      return {
        sig,
        prompt: 'Write this number in standard form.',
        lhs,
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* Type 2: standard form shown, ordinary number is the answer. */
  function genFromStdForm() {
    for (let t = 0; t < 400; t++) {
      const digits = pickDigits();
      if (!digits) continue;

      let exp = ri(-6, 6);
      if (exp === 0) continue;

      const coef = coefStr(digits);
      const correctOrdinary = ordinaryStr(digits, exp);
      if (correctOrdinary.length > 12) continue;

      const sig = 'FS|' + digits + '|' + exp;
      const lhs = tex(stdFormLatex(coef, exp));

      const d1 = ordinaryStr(digits, exp + 1);
      const d2 = ordinaryStr(digits, exp - 1);
      const d3 = ordinaryStr(digits, -exp);

      const seen = new Set([correctOrdinary]);
      const pool = [];
      for (const s of [d1, d2, d3]) {
        if (seen.has(s)) continue;
        seen.add(s);
        pool.push({ latex: s });
      }
      if (pool.length < 3) continue;

      const opts = shuffle([
        { latex: correctOrdinary, ok: true },
        ...shuffle(pool).slice(0, 3).map(p => ({ latex: p.latex, ok: false }))
      ]);

      return {
        sig,
        prompt: 'Write this number as an ordinary number.',
        lhs,
        eq: '=',
        options: opts
      };
    }
    return null;
  }

  /* ============================================================
     REGISTRY + MIX
     ============================================================ */
  const GENERATORS = {
    toStd:   genToStdForm,
    fromStd: genFromStdForm
  };

  const MIX = ['toStd', 'fromStd'];

  const TOPIC_TYPES = {
    mixed:   MIX,
    toStd:   ['toStd'],
    fromStd: ['fromStd']
  };

  function buildQuestions(n, types) {
    const out = [];
    const seen = new Set();
    let guard = 0;
    while (out.length < n && guard < 5000) {
      guard++;
      let q = null;
      try {
        q = GENERATORS[pick(types)]();
      } catch (err) {
        if (typeof console !== 'undefined') console.warn('Generator threw:', err);
        continue;
      }
      if (!q || seen.has(q.sig)) continue;
      seen.add(q.sig);
      out.push(q);
    }
    let g2 = 0;
    while (out.length < n && g2 < 500) {
      g2++;
      const q = GENERATORS[pick(types)]();
      if (q) out.push(q);
    }
    return out.slice(0, n);
  }

  /* ============================================================
     RENDER
     ============================================================ */
  const LETTERS = 'ABCD';
  let questions = [];
  let qState = [];

  function renderQuestion(q, i) {
    const optsHTML = q.options.map((o, j) =>
      '<div class="option" data-opt="' + j + '" role="button" tabindex="0" ' +
           'aria-label="Answer ' + LETTERS[j] + '">' +
        '<span class="opt-letter">' + LETTERS[j] + '</span>' +
        '<span class="opt-visual">' + tex(o.latex) + '</span>' +
      '</div>'
    ).join('');

    return '<article class="q" data-q="' + i + '">' +
      '<div class="q-head">' +
        '<span class="q-num">' + (i + 1) + '</span>' +
        '<span class="q-prompt">' + q.prompt + '</span>' +
      '</div>' +
      '<div class="diagram">' +
        '<span class="lhs">' + q.lhs + '</span>' +
        '<span class="eq">' + q.eq + '</span>' +
        '<div class="drop-zone"><div class="qmark">?</div></div>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      '<div class="q-feedback" aria-live="polite"></div>' +
    '</article>';
  }

  function render() {
    const sheet = document.getElementById('sheet');
    const n = parseInt(document.getElementById('countSelect').value, 10);
    const topic = document.getElementById('topicSelect').value;
    const types = TOPIC_TYPES[topic] || MIX;

    questions = buildQuestions(n, types);
    qState = questions.map(() => ({ solved: false, attempts: 0 }));

    const keyGrid = questions
      .map((q, i) => {
        const idx = q.options.findIndex(o => o.ok);
        return '<span>' + (i + 1) + '. <b>' + LETTERS[idx] + '</b></span>';
      })
      .join('');

    sheet.innerHTML =
      '<header class="sheet-head">' +
        '<h1>Standard Form</h1>' +
        '<div class="meta">' +
          '<span>Name: <span class="line"></span></span>' +
          '<span>Date: <span class="line short"></span></span>' +
          '<span>Score: <span class="line tiny"></span></span>' +
        '</div>' +
      '</header>' +
      '<p class="instructions">' +
        'Standard form is ' + tex('A \\times 10^{n}') + ' where ' + tex('1 \\le A < 10') + '. ' +
        'Drag the correct answer into the <b>?</b> box \u2014 or simply tap/click an answer. ' +
        'You\'ll be told straight away whether you\'re right. (Seed: <span id="seedTag"></span>)' +
      '</p>' +
      '<div class="questions">' + questions.map(renderQuestion).join('') + '</div>' +
      '<section class="key" id="keySection">' +
        '<h2>Answer Key</h2>' +
        '<div class="key-grid">' + keyGrid + '</div>' +
      '</section>';

    const seedTag = document.getElementById('seedTag');
    if (seedTag) seedTag.textContent = document.getElementById('seedInput').value;

    toggleKey();
    updateScore();
  }

  function toggleKey() {
    const show = document.getElementById('answersChk').checked;
    const key = document.getElementById('keySection');
    if (key) key.style.display = show ? '' : 'none';
  }

  /* ============================================================
     INTERACTION
     ============================================================ */
  const PRAISE = ['Correct! \uD83C\uDF89', 'Yes! Well done.', "That's right! \u2B50", 'Great job! \uD83D\uDC4F', 'Perfect! \u2705'];

  let drag = null;

  function zoneAt(qEl, x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const z = el.closest('.drop-zone');
    return (z && qEl.contains(z)) ? z : null;
  }

  function startGhost() {
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const src = drag.opt.querySelector('.opt-visual');
    g.innerHTML = src ? src.innerHTML : '';
    g.style.left = drag.startX + 'px';
    g.style.top  = drag.startY + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.opt.classList.add('dragging');
  }

  function moveGhost(x, y) {
    if (!drag.ghost) return;
    drag.ghost.style.left = x + 'px';
    drag.ghost.style.top  = y + 'px';
  }

  function highlight(x, y) {
    const z = zoneAt(drag.qEl, x, y);
    if (drag.zone && drag.zone !== z) drag.zone.classList.remove('over');
    if (z) z.classList.add('over');
    drag.zone = z;
  }

  function onPointerDown(e) {
    if (drag) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    const qEl = opt.closest('.q');
    if (!qEl || qEl.dataset.locked === '1') return;

    drag = {
      opt: opt, qEl: qEl, id: e.pointerId,
      startX: e.clientX, startY: e.clientY,
      moved: false, ghost: null, zone: null
    };
    try { opt.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }

  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      const dx = e.clientX - drag.startX;
      const dy = e.clientY - drag.startY;
      if (Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      startGhost();
      document.body.classList.add('dragging-active');
    }
    moveGhost(e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  }

  function endDrag(e, cancelled) {
    if (!drag || !e || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;

    const target = (!cancelled && d.moved) ? zoneAt(d.qEl, e.clientX, e.clientY) : null;

    if (d.ghost) d.ghost.remove();
    if (d.zone)  d.zone.classList.remove('over');
    d.opt.classList.remove('dragging');
    document.body.classList.remove('dragging-active');

    if (cancelled) return;

    const idx = parseInt(d.opt.dataset.opt, 10);
    if (!d.moved || target) choose(d.qEl, idx);
  }

  function choose(qEl, idx) {
    if (qEl.dataset.locked === '1') return;

    const qi = parseInt(qEl.dataset.q, 10);
    const q  = questions[qi];
    if (!q) return;

    const opt = qEl.querySelector('.option[data-opt="' + idx + '"]');
    if (!opt) return;

    qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));

    const state = qState[qi];
    if (state) state.attempts++;

    const slot = qEl.querySelector('.drop-zone .qmark');
    const ok = !!q.options[idx].ok;

    if (slot) {
      slot.innerHTML = tex(q.options[idx].latex);
      slot.classList.add('filled');
    }

    if (ok) {
      if (state) state.solved = true;
      qEl.dataset.locked = '1';
      opt.classList.add('correct');
      setFeedback(qEl, 'ok', PRAISE[Math.floor(Math.random() * PRAISE.length)]);
    } else {
      opt.classList.add('wrong');
      setFeedback(qEl, 'no', 'Not quite \u2014 try again!');
    }
    updateScore();
  }

  function setFeedback(qEl, cls, msg) {
    const fb = qEl.querySelector('.q-feedback');
    if (!fb) return;
    fb.className = 'q-feedback' + (cls ? ' ' + cls : '');
    fb.textContent = msg || '';
  }

  function updateScore() {
    const el = document.getElementById('scoreTag');
    if (!el) return;
    const solved = qState.filter(s => s.solved).length;
    el.textContent = solved + ' / ' + qState.length + ' correct';
  }

  function resetAnswers() {
    document.querySelectorAll('.q').forEach(qEl => {
      delete qEl.dataset.locked;
      qEl.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));
      const slot = qEl.querySelector('.drop-zone .qmark');
      if (slot) { slot.textContent = '?'; slot.classList.remove('filled'); }
      setFeedback(qEl, '', '');
    });
    qState = qState.map(() => ({ solved: false, attempts: 0 }));
    updateScore();
  }

  document.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup',     e => endDrag(e, false));
  window.addEventListener('pointercancel', e => endDrag(e, true));

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const opt = e.target && e.target.closest ? e.target.closest('.option') : null;
    if (!opt) return;
    e.preventDefault();
    const qEl = opt.closest('.q');
    if (qEl) choose(qEl, parseInt(opt.dataset.opt, 10));
  });

  /* ============================================================
     UI WIRING
     ============================================================ */
  const seedInput  = document.getElementById('seedInput');
  const countSel   = document.getElementById('countSelect');
  const topicSel   = document.getElementById('topicSelect');
  const answersChk = document.getElementById('answersChk');

  function applySeed() {
    const s = parseInt(seedInput.value, 10);
    rng = mulberry32(isNaN(s) ? 1 : (s >>> 0));
  }

  /* --- seed handling --- */

  function getSeedFromURL() {
    const params = new URLSearchParams(window.location.search);
    const s = params.get('seed');
    if (s === null) return null;
    const n = parseInt(s, 10);
    return isNaN(n) ? null : n;
  }

  function setSeedInURL(seed) {
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    window.history.replaceState({}, '', url);
  }

  function dateSeed() {
    const d = new Date();
    return parseInt(
      d.getFullYear() +
      String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') +
      String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') +
      String(d.getSeconds()).padStart(2, '0'),
      10
    );
  }

  /* --- event wiring --- */

  document.getElementById('regenBtn').addEventListener('click', () => {
    seedInput.value = dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  document.getElementById('resetBtn').addEventListener('click', resetAnswers);

  seedInput.addEventListener('change', () => {
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  });

  countSel.addEventListener('change', () => { applySeed(); render(); });
  topicSel.addEventListener('change', () => { applySeed(); render(); });
  answersChk.addEventListener('change', toggleKey);
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  /* --- boot --- */

  function boot() {
    const urlSeed = getSeedFromURL();
    seedInput.value = (urlSeed !== null) ? urlSeed : dateSeed();
    applySeed();
    render();
    setSeedInURL(seedInput.value);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot, { once: true });
})();
</script>
</body>
